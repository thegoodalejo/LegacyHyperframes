<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  (function () {
    window.__timelines = window.__timelines || {};

    var DURATION = 15.073;
    var C = { x: 960, y: 470 };
    var RX = 420;
    var RY = 230;

    var camera = document.getElementById("mh11-camera");
    var hub = document.getElementById("mh11-hub");
    var hubGlow = document.getElementById("mh11-hub-glow");
    var hubLabel = document.getElementById("mh11-hub-label");
    var ring = document.getElementById("mh11-ring");

    var nodeEls = [
      document.getElementById("mh11-node-0"),
      document.getElementById("mh11-node-1"),
      document.getElementById("mh11-node-2"),
      document.getElementById("mh11-node-3"),
    ];
    var lineEls = [
      document.getElementById("mh11-line-0"),
      document.getElementById("mh11-line-1"),
      document.getElementById("mh11-line-2"),
      document.getElementById("mh11-line-3"),
    ];
    var chipEls = [
      document.getElementById("mh11-chip-0"),
      document.getElementById("mh11-chip-1"),
      document.getElementById("mh11-chip-2"),
    ];

    // Fixed orbital start angles: top, right, bottom, left.
    var ANGLES = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
    var NODE_OFFSETS = [
      { x: 0, y: -RY },
      { x: RX, y: 0 },
      { x: 0, y: RY },
      { x: -RX, y: 0 },
    ];
    var LINE_LEN = [RY, RX, RY, RX];

    // --- Scene 2 (0.7-3.5s): sede nodes spring-pop, staggered, then connectors draw. ---
    var NODE_POP_AT = [0.7, 1.15, 1.6, 2.05];
    var POP_DUR = 0.55;
    var LINE_AT = [1.05, 1.5, 1.95, 2.4];
    var LINE_DUR = 0.5;

    var tl = gsap.timeline({ paused: true });

    // --- Setup: measured/known geometry for the connector lines and ring. ---
    ring.style.strokeDasharray = String(ring.getTotalLength());
    ring.style.strokeDashoffset = String(ring.getTotalLength());

    lineEls.forEach(function (line, i) {
      line.style.strokeDasharray = String(LINE_LEN[i]);
      line.style.strokeDashoffset = String(LINE_LEN[i]);
    });

    // --- Scene 1 (0.0-1.5s): hub establishes — spring-pop, elastic overshoot. ---
    tl.fromTo(
      hubGlow,
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 0.22, duration: 0.6, ease: "back.out(1.15)" },
      0,
    );
    tl.fromTo(
      hub,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.15)" },
      0,
    );
    tl.to(ring, { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, 0.4);
    tl.fromTo(hubLabel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.6);

    // --- Scene 2 (0.7-3.5s, overlapping): sede nodes spring-pop onto the ring, ---
    // --- staggered, then thin accent connector lines draw hub -> node. ---
    nodeEls.forEach(function (el, i) {
      var off = NODE_OFFSETS[i];
      tl.fromTo(
        el,
        { x: off.x, y: off.y, scale: 0, opacity: 0 },
        { x: off.x, y: off.y, scale: 1, opacity: 1, duration: POP_DUR, ease: "back.out(1.15)" },
        NODE_POP_AT[i],
      );
      tl.to(
        lineEls[i],
        { strokeDashoffset: 0, duration: LINE_DUR, ease: "power2.out" },
        LINE_AT[i],
      );
    });

    // --- Scene 3 (3.5-9.5s, the resolve): sede nodes revolve slowly clockwise ---
    // --- around the hub, staying upright, under a continuous slow camera ---
    // --- zoom-out (ecosystem reveal); extended hold vs. v1 since the frame is ---
    // --- now much longer. Orbit continues at a much slower idle creep through ---
    // --- Scene 4 so the chips (not the orbit) read as the new focal beat. ---
    var ORBIT_AT = 3.5;
    var ORBIT_DUR_A = 6.0; // Scene 3 window: 3.5-9.5s
    var ORBIT_DELTA_A = Math.PI * 2 * 0.3; // slow clockwise creep, not a full lap
    var ORBIT_DUR_B = DURATION - (ORBIT_AT + ORBIT_DUR_A); // Scene 4 tail: 9.5-15.073s
    var ORBIT_DELTA_B = Math.PI * 2 * 0.05; // idle background creep once chips take focus

    var orbitState = { d: 0 };
    function applyOrbit() {
      for (var i = 0; i < nodeEls.length; i++) {
        var a = ANGLES[i] + orbitState.d;
        var x = Math.cos(a) * RX;
        var y = Math.sin(a) * RY;
        gsap.set(nodeEls[i], { x: x, y: y });
        lineEls[i].setAttribute("x2", String(C.x + x));
        lineEls[i].setAttribute("y2", String(C.y + y));
      }
    }
    tl.to(
      orbitState,
      { d: ORBIT_DELTA_A, duration: ORBIT_DUR_A, ease: "none", onUpdate: applyOrbit },
      ORBIT_AT,
    );
    tl.to(
      orbitState,
      {
        d: ORBIT_DELTA_A + ORBIT_DELTA_B,
        duration: ORBIT_DUR_B,
        ease: "none",
        onUpdate: applyOrbit,
      },
      ORBIT_AT + ORBIT_DUR_A,
    );

    // Ambient pulse on the hub glow once the hub has settled — same pace as v1,
    // cycle count scaled to the new, longer duration.
    var pulse = { p: 0 };
    tl.to(
      pulse,
      {
        p: Math.PI * 2 * 7,
        duration: DURATION - 0.65,
        ease: "none",
        onUpdate: function () {
          var s = 1 + Math.sin(pulse.p) * 0.06;
          var o = 0.22 + Math.sin(pulse.p) * 0.1;
          gsap.set(hubGlow, { scale: s, opacity: o });
        },
      },
      0.65,
    );

    // Multi-phase camera: gentle establish -> neutral focus -> slow zoom-out
    // that resolves by ~9s (end of Scene 3's hold), then HOLDS through Scene 4
    // so the chip cascade reads without the camera competing for attention.
    var phase = { scale: 1.03 };
    tl.to(phase, { scale: 1.0, duration: 1.0, ease: "power2.out" }, 1.8);
    tl.to(phase, { scale: 0.9, duration: 5.5, ease: "power2.out" }, 3.5);

    var drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 3.37,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 5;
          var dy = Math.sin(drift.p * 1.3) * 3;
          gsap.set(camera, { scale: phase.scale, x: dx, y: dy });
        },
      },
      0,
    );

    // --- Scene 4 (9.5-15.073s): "Totalmente Parametrizable" — 3 chips cascade ---
    // --- into view around the hub, one per phrase of the VO's closing line ---
    // --- ("roles, redes y permisos... sin escribir una sola línea de código"), ---
    // --- then hold to the end (final scene of the frame — no exit). ---
    var CHIP_AT = [9.8, 10.3, 13.0];
    var CHIP_DUR = 0.5;
    chipEls.forEach(function (el, i) {
      tl.fromTo(
        el,
        { scale: 0, opacity: 0, y: 14 },
        { scale: 1, opacity: 1, y: 0, duration: CHIP_DUR, ease: "back.out(1.15)" },
        CHIP_AT[i],
      );
    });

    window.__timelines["11-multisede"] = tl;
  })();
</script>
