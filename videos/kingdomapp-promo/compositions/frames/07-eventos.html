  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var TOTAL = 12.852;
      var S3_START = 9.0;

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("m07-card");
      var avatar = document.getElementById("m07-avatar");
      var eyebrow = document.getElementById("m07-eyebrow");
      var rows = document.querySelectorAll(".m07-row");
      var chips = document.querySelectorAll(".m07-chip");
      var lines = document.querySelectorAll(".m07-line");
      var camera = document.getElementById("m07-camera");
      var sweep = document.getElementById("m07-sweep");
      var sweepGlow = document.getElementById("m07-sweep-glow");
      var sweepIcon = document.getElementById("m07-sweep-icon");

      // ---- Scene 1 (0 - 2.2s): the central "Eventos" card establishes ----
      // VO: "Organiza cada evento de principio a fin:"
      tl.fromTo(
        card,
        { xPercent: -50, yPercent: -50, x: 0, y: 26, scale: 0.86, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        0.1
      );
      tl.fromTo(
        avatar,
        { xPercent: 0, yPercent: 0, scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" },
        0.3
      );
      tl.fromTo(
        eyebrow,
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.62
      );
      rows.forEach(function (row, i) {
        tl.fromTo(
          row,
          { x: -14, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
          0.85 + i * 0.1
        );
      });

      // ---- Scene 2 (2.2 - 9.0s): four capability chips cascade into a 2x2 grid ----
      // Cue points follow the VO phrase order: "calendario visual" / "asistencia por QR" /
      // "credenciales impresas en lote" / "...confirmación tipo semáforo".
      var chipAt = [2.35, 4.05, 5.85, 7.65];
      chips.forEach(function (chip, i) {
        var tx = Number(chip.dataset.targetX);
        var ty = Number(chip.dataset.targetY);
        var icon = chip.querySelector(".m07-chip-icon");
        var label = chip.querySelector(".m07-chip-label");
        var at = chipAt[i];

        tl.fromTo(
          chip,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          at
        );
        tl.fromTo(
          icon,
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" },
          at
        );
        tl.fromTo(
          label,
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          at + 0.08
        );
        if (lines[i]) {
          tl.fromTo(lines[i], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, at);
        }
      });

      // ---- Scene 3 (9.0 - 12.852s): grid resolved, quiet hold with slow push-in ----
      // + a single confirmation glow sweep across the tiles (echoes the VO's closing
      // "confirmación tipo semáforo" beat) and a gentle continuous camera drift.
      var phase = { scale: 1 };
      tl.to(phase, { scale: 1.045, duration: TOTAL - S3_START, ease: "power2.out" }, S3_START);

      var drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 2.2,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            var dx = Math.sin(drift.p) * 4;
            var dy = Math.sin(drift.p * 1.3) * 2.5;
            camera.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px, " + dy + "px)";
          },
        },
        0
      );

      tl.fromTo(sweep, { x: -760 }, { x: 760, duration: 1.3, ease: "none" }, 9.3);

      tl.to(sweepIcon, { opacity: 0, duration: 0.5, ease: "power1.in" }, 10.1);
