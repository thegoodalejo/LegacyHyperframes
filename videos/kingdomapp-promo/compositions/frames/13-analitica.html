  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const TOTAL_DURATION = 11.337;

    /* ---- synchronous SVG measurement setup ---- */
    const ringFill = document.getElementById('analitica-ringfill');
    const RING_LEN = ringFill.getTotalLength();
    ringFill.style.strokeDasharray = RING_LEN;
    ringFill.style.strokeDashoffset = RING_LEN;

    const checkPath = document.getElementById('analitica-check-path');
    const CHECK_LEN = checkPath.getTotalLength();
    checkPath.style.strokeDasharray = CHECK_LEN;
    checkPath.style.strokeDashoffset = CHECK_LEN;

    ['analitica-icon-line', 'analitica-icon-chevron', 'analitica-icon-tray'].forEach((id) => {
      const el = document.getElementById(id);
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    });

    /* bar fills start collapsed — set via GSAP, not static CSS transform */
    const barFills = [0, 1, 2, 3, 4].map((i) => document.getElementById('analitica-bar-' + i));
    gsap.set(barFills, { scaleY: 0 });

    /* ---- camera state (one writer at the bottom composes scale + pan + drift) ---- */
    const camera = document.getElementById('analitica-camera');
    const camPhase = { scale: 1 };
    const camPan = { x: 0, y: 0 };

    /* =========================================================
       Scene 1 (0.0 – 3.0s): dashboard genérico con barras +
       ring sweep + count-up "0% -> 100%", label "En vivo",
       slow continuous camera zoom-in underneath.
       ========================================================= */
    tl.fromTo(
      '#analitica-cardA',
      { scale: 0.85, opacity: 0, y: 14 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' },
      0.0,
    );
    tl.fromTo('#analitica-tagA', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.15);
    tl.fromTo(
      '#analitica-labelA',
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
      0.2,
    );

    const countState = { value: 0 };
    const COUNT_START = 0.3;
    const COUNT_DUR = 1.1;
    tl.to(
      countState,
      {
        value: 100,
        duration: COUNT_DUR,
        ease: 'power2.out',
        onUpdate: () => {
          document.getElementById('analitica-count').textContent = Math.round(countState.value) + '%';
        },
      },
      COUNT_START,
    );
    tl.fromTo('#analitica-count', { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: 'power2.out' }, COUNT_START);
    tl.to(ringFill, { strokeDashoffset: 0, duration: COUNT_DUR, ease: 'power2.out' }, COUNT_START);

    /* dashboard bars self-grow, staggered, forming the "generic dashboard" chrome */
    const BARS_START = 0.55;
    const BARS_STAGGER = 0.15;
    barFills.forEach((el, i) => {
      tl.to(el, { scaleY: 1, duration: 0.5, ease: 'power2.out' }, BARS_START + i * BARS_STAGGER);
    });

    /* subtle idle float once the panel has landed, clears before the push-through */
    tl.to('#analitica-cardA', { y: -4, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.9);

    /* slow continuous camera zoom-in under Scene 1 */
    tl.to(camPhase, { scale: 1.05, duration: 2.9, ease: 'sine.inOut' }, 0.0);

    /* =========================================================
       Scene 2 seam -> body (3.0 – 7.0s): z-depth push-THROUGH
       the dashboard's center into a mini-mapa de territorio con
       un pin (cut-catalog Zoom-Through: exit accelerates + blurs,
       hard cut at peak, incoming decelerates into focus) — the
       blueprint's signature move, same as Frame 9's push-through
       applied here to analytics instead of finance.
       ========================================================= */
    const PUSH_START = 3.0;
    const PUSH_EXIT_DUR = 0.4;
    const PUSH_CUT = PUSH_START + PUSH_EXIT_DUR; // 3.4
    const PUSH_ENTRY_DUR = 0.5;

    // Phase 1 — CardA (dashboard instrument) accelerates toward the viewer and dissolves
    tl.to('#analitica-cardA', { scale: 1.2, filter: 'blur(18px)', duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);
    tl.to('#analitica-cardA', { opacity: 0.15, duration: PUSH_EXIT_DUR, ease: 'none' }, PUSH_START);
    // Camera compounds the push at the same velocity
    tl.to(camPhase, { scale: 2.5, duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);

    // Phase 2 — hard cut at peak blur/velocity
    tl.set('#analitica-cardA', { opacity: 0 }, PUSH_CUT);
    tl.set('#analitica-cardB', { opacity: 0.15, scale: 0.75, filter: 'blur(18px)' }, PUSH_CUT);

    // Phase 3 — CardB (mapa) arrives from behind the camera, resolving into focus
    tl.to(
      '#analitica-cardB',
      { scale: 1, filter: 'blur(0px)', opacity: 1, duration: PUSH_ENTRY_DUR, ease: 'expo.out' },
      PUSH_CUT,
    );
    tl.to(camPhase, { scale: 1.0, duration: PUSH_ENTRY_DUR, ease: 'expo.out' }, PUSH_CUT);
    tl.fromTo('#analitica-tagB', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, PUSH_CUT + 0.1);

    /* pin drops onto the territorio once the map has landed */
    const PIN_AT = PUSH_CUT + PUSH_ENTRY_DUR + 0.1; // 4.0
    tl.fromTo(
      '#analitica-pin',
      { scale: 0, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.7)' },
      PIN_AT,
    );

    /* secondary location dots pop in, reinforcing "territorio" as plural coverage */
    tl.fromTo('#analitica-dot1', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.6)' }, PIN_AT + 0.4);
    tl.fromTo('#analitica-dot2', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.6)' }, PIN_AT + 0.6);

    /* pulse rings radiate from the pin's base, two staggered loops */
    tl.fromTo(
      '#analitica-pulse1',
      { scale: 0.6, opacity: 0.55 },
      { scale: 1.8, opacity: 0, duration: 1.0, ease: 'power1.out', repeat: 2 },
      4.3,
    );
    tl.fromTo(
      '#analitica-pulse2',
      { scale: 0.6, opacity: 0.55 },
      { scale: 1.8, opacity: 0, duration: 1.0, ease: 'power1.out', repeat: 2 },
      4.6,
    );

    /* subtle idle float while the map holds, clears before the pan begins */
    tl.to('#analitica-cardB', { y: -4, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 5.0);

    /* =========================================================
       Scene 3 (7.0 – 11.337s): camera PANS to the third card
       "Reporte" — export icon self-draws, a click-pulse on the
       "Exportar" pill resolves into "Exportado" with a spring-pop
       checkmark, a soft accent glow blooms behind it, and the
       shot settles centered, holding to the end.
       ========================================================= */
    const PAN_START = 7.0;
    const PAN_DUR = 1.0;
    const PAN_DISTANCE = 840;

    tl.to('#analitica-cardB', { opacity: 0, scale: 0.94, duration: 0.5, ease: 'power2.in' }, PAN_START);
    tl.to(camPan, { x: -PAN_DISTANCE, duration: PAN_DUR, ease: 'power2.inOut' }, PAN_START);
    tl.fromTo(
      '#analitica-cardC',
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' },
      PAN_START + 0.2,
    );
    tl.fromTo('#analitica-tagC', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, PAN_START + 0.3);

    /* gentle push-in climax as the shot settles on the final card, holding to the end */
    tl.to(camPhase, { scale: 1.05, duration: TOTAL_DURATION - (PAN_START + PAN_DUR), ease: 'power2.out' }, PAN_START + PAN_DUR);

    /* export icon self-draws: tray, then the arrow feeding into it */
    const ICON_START = 8.1;
    tl.to(document.getElementById('analitica-icon-tray'), { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' }, ICON_START);
    tl.to(document.getElementById('analitica-icon-line'), { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, ICON_START + 0.15);
    tl.to(document.getElementById('analitica-icon-chevron'), { strokeDashoffset: 0, duration: 0.25, ease: 'power2.out' }, ICON_START + 0.4);

    /* "Exportar" pill fades in beside the icon (pill-b "Exportado" starts hidden, cross-fades in later) */
    tl.fromTo('#analitica-pill-a', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 8.5);

    /* click-pulse sells "un clic" -> cross-fades into "Exportado" + spring-pop check.
       A continuous opacity cross-fade (not a textContent swap) keeps this seek-safe:
       any direct seek to a time past the swap still renders the correct label. */
    const CLICK_AT = 9.0;
    tl.to('#analitica-cta-wrap', { scale: 0.92, duration: 0.12, ease: 'power1.in' }, CLICK_AT);
    tl.to('#analitica-cta-wrap', { scale: 1, duration: 0.18, ease: 'back.out(2)' }, CLICK_AT + 0.12);
    tl.to('#analitica-pill-a', { opacity: 0, duration: 0.16, ease: 'power1.out' }, CLICK_AT + 0.15);
    tl.to('#analitica-pill-b', { opacity: 1, duration: 0.16, ease: 'power1.out' }, CLICK_AT + 0.15);
    tl.fromTo(
      '#analitica-check',
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' },
      CLICK_AT + 0.2,
    );
    tl.to(checkPath, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, CLICK_AT + 0.35);

    /* soft accent glow blooms in behind the settled hero card */
    const BLOOM_START = 8.3;
    const BLOOM_DUR = 1.0;
    const glow = document.getElementById('analitica-glow');
    const GLOW_PEAK_OPACITY = 0.3;
    tl.fromTo(
      '#analitica-glow',
      { opacity: 0, scale: 0.85 },
      { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: 'power2.out' },
      BLOOM_START,
    );
    const breathePhase = { p: 0 };
    tl.to(
      breathePhase,
      {
        p: Math.PI * 2 * 0.75,
        duration: TOTAL_DURATION - (BLOOM_START + BLOOM_DUR),
        ease: 'none',
        onUpdate: () => {
          const s = Math.sin(breathePhase.p);
          glow.style.opacity = String(GLOW_PEAK_OPACITY + s * 0.04);
          glow.style.transform = `scale(${1 + s * 0.025})`;
        },
      },
      BLOOM_START + BLOOM_DUR,
    );

    /* subtle idle float on the final card through the hold */
    tl.to('#analitica-cardC', { y: -4, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 9.5);

    /* ---- single writer: composes phase scale + pan + organic drift onto the camera ---- */
    const drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 2,
        duration: TOTAL_DURATION,
        ease: 'none',
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 5;
          const dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = `scale(${camPhase.scale}) translate(${camPan.x + dx}px, ${camPan.y + dy}px)`;
        },
      },
      0,
    );

    window.__timelines['13-analitica'] = tl;
  </script>
</template>
