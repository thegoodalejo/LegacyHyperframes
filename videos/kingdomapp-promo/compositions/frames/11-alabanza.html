  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var TOTAL = 10.423;
      var S3_START = 7.5;

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("m11-card");
      var avatar = document.getElementById("m11-avatar");
      var eyebrow = document.getElementById("m11-eyebrow");
      var rows = document.querySelectorAll(".m11-row");
      var chips = document.querySelectorAll(".m11-chip");
      var lines = document.querySelectorAll(".m11-line");
      var camera = document.getElementById("m11-camera");
      var sweep = document.getElementById("m11-sweep");
      var sweepGlow = document.getElementById("m11-sweep-glow");
      var sweepIcon = document.getElementById("m11-sweep-icon");

      // ---- Scene 1 (0 - 2.0s): the central "Partitura" card establishes ----
      // VO opens: "Tu biblioteca de partituras..."
      tl.fromTo(
        card,
        { xPercent: -50, yPercent: -50, x: 0, y: 26, scale: 0.86, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" },
        0.1
      );
      tl.fromTo(
        avatar,
        { xPercent: 0, yPercent: 0, scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" },
        0.3
      );
      tl.fromTo(
        eyebrow,
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.62
      );
      rows.forEach(function (row, i) {
        tl.fromTo(
          row,
          { x: -14, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
          0.85 + i * 0.1
        );
      });

      // ---- Scene 2 (2.0 - 7.5s): four capability chips cascade into a 2x2 grid ----
      // Cue points follow the VO phrase order: "biblioteca de partituras" / "transposición
      // de tono en un clic" / "repertorios por servicio" / "marketplace... con otras iglesias".
      var chipAt = [2.1, 3.6, 5.1, 6.6];
      chips.forEach(function (chip, i) {
        var tx = Number(chip.dataset.targetX);
        var ty = Number(chip.dataset.targetY);
        var icon = chip.querySelector(".m11-chip-icon");
        var label = chip.querySelector(".m11-chip-label");
        var at = chipAt[i];

        tl.fromTo(
          chip,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          at
        );
        tl.fromTo(
          icon,
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" },
          at
        );
        tl.fromTo(
          label,
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
          at + 0.08
        );
        if (lines[i]) {
          tl.fromTo(lines[i], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, at);
        }
      });

      // ---- Scene 3 (7.5 - 10.423s): grid resolved, quiet hold with slow push-in ----
