    /* --- Card 2: formulario inteligente (arbol de 2 ramas) --- */

    .pd12-qr-finder-inner {

    }
    .pd12-qr-finder {
      opacity: 0;

      transform-origin: 50% 50%;
    }
    .pd12-qr-module {
      fill: var(--pd12-primary);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 50%;

    .pd12-qr-badge {

    }
    .pd12-qr-check {
      fill: none;
      stroke: #ffffff;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <div id="root" data-composition-id="12-presencia-digital" data-width="1920" data-height="1080" data-duration="10.662">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    var DURATION = 10.162;

    /* ---- synchronous SVG measurement setup ---- */
    var line0 = document.getElementById('pd12-tree-line-0');
    var LEN0 = line0.getTotalLength();
    line0.style.strokeDasharray = LEN0;
    line0.style.strokeDashoffset = LEN0;

    var line1 = document.getElementById('pd12-tree-line-1');
    var LEN1 = line1.getTotalLength();
    line1.style.strokeDasharray = LEN1;
    line1.style.strokeDashoffset = LEN1;

    var checkPath = document.getElementById('pd12-qr-check-path');
    var CHECK_LEN = checkPath.getTotalLength();
    checkPath.style.strokeDasharray = CHECK_LEN;
    checkPath.style.strokeDashoffset = CHECK_LEN;

    var camera = document.getElementById('pd12-camera');
    var glow = document.getElementById('pd12-glow');
    var device = document.getElementById('pd12-device');
    var sweep = document.getElementById('pd12-sweep');

    var tl = gsap.timeline({ paused: true });

    /* =========================================================
       Scene 1 (0.0 - 2.0s): the "micrositio" frame establishes —
       a bare device silhouette (no real browser/phone chrome),
       hero visible well before 0.5s, with a thin top accent bar.
       ========================================================= */
    tl.fromTo(
      device,
      { opacity: 0, scale: 0.9, y: 16 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'back.out(1.15)' },
      0,
    );
    tl.fromTo(
      '#pd12-topbar',
      { opacity: 0, scaleX: 0 },
      { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power2.out' },
      0.25,
    );
    tl.fromTo(glow, { opacity: 0, scale: 0.85 }, { opacity: 0.12, scale: 1, duration: 0.8, ease: 'power2.out' }, 0.3);

    /* =========================================================
       Scene 2 (2.0 - 7.0s): 3 sections cascade inside the frame,
       one per voiceover phrase — visual / formulario / QR.
       ========================================================= */

    /* --- 2a @2.0s: "un micrositio para tu iglesia" — visual card --- */
    var CARD1_AT = 2.0;
    tl.fromTo(
      '#pd12-card1',
      { opacity: 0, y: 22, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.2)' },
      CARD1_AT,
    );
    var TILE_IDS = ['#pd12-tile-0', '#pd12-tile-1', '#pd12-tile-2', '#pd12-tile-3'];
    TILE_IDS.forEach(function (id, i) {
      tl.fromTo(
        id,
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.3)' },
        CARD1_AT + 0.25 + i * 0.08,
      );
    });
    var DOT_IDS = ['#pd12-dot-0', '#pd12-dot-1', '#pd12-dot-2'];
    DOT_IDS.forEach(function (id, i) {
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, CARD1_AT + 0.65 + i * 0.06);
    });

    /* --- 2b @4.0s: "formularios inteligentes que se adaptan" — branching tree --- */
    var CARD2_AT = 4.0;
    tl.fromTo(
      '#pd12-card2',
      { opacity: 0, y: 22, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.2)' },
      CARD2_AT,
    );
    tl.fromTo(
      '#pd12-tree-root',
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.4)' },
      CARD2_AT + 0.25,
    );
    tl.to(line0, { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, CARD2_AT + 0.55);
    tl.to(line1, { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, CARD2_AT + 0.65);
    tl.fromTo(
      '#pd12-tree-leaf-0',
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.5)' },
      CARD2_AT + 0.85,
    );
    tl.fromTo(
      '#pd12-tree-leaf-1',
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.5)' },
      CARD2_AT + 0.95,
    );

    /* --- 2c @6.0s: "auto-registro por codigo QR" — QR self-assembles --- */
    var CARD3_AT = 6.0;
    tl.fromTo(
      '#pd12-card3',
      { opacity: 0, y: 22, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.2)' },
      CARD3_AT,
    );
    var FINDER_IDS = ['#pd12-qr-finder-0', '#pd12-qr-finder-1', '#pd12-qr-finder-2'];
    FINDER_IDS.forEach(function (id, i) {
      tl.fromTo(
        id,
        { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.3)' },
        CARD3_AT + 0.25 + i * 0.08,
      );
    });
    var moduleEls = document.querySelectorAll('.pd12-qr-module');
    moduleEls.forEach(function (el, i) {
      tl.fromTo(
        el,
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' },
        CARD3_AT + 0.55 + i * 0.035,
      );
    });
    var badgeAt = CARD3_AT + 0.95;
    tl.fromTo(
      '#pd12-qr-badge',
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' },
      badgeAt,
    );
    tl.to(checkPath, { strokeDashoffset: 0, duration: 0.25, ease: 'power2.out' }, badgeAt + 0.15);

    /* =========================================================
       Scene 3 (7.0 - 10.162s): hold, soft glow — a gentle bloom
       intensifies behind the assembled micrositio and a single
       soft light sweep travels down the frame, then breathes to
       the end (final scene — no exit).
       ========================================================= */
    tl.to(glow, { opacity: 0.28, scale: 1.05, duration: 0.8, ease: 'power2.out' }, 7.0);

    tl.set(sweep, { y: 0, opacity: 0 }, 7.2);
    tl.to(sweep, { opacity: 0.5, duration: 0.2, ease: 'power1.out' }, 7.2);
    tl.to(sweep, { y: 980, duration: 1.0, ease: 'power1.inOut' }, 7.2);
    tl.to(sweep, { opacity: 0, duration: 0.3, ease: 'power1.in' }, 7.9);

    var breathePhase = { p: 0 };
    tl.to(
      breathePhase,
      {
        p: Math.PI * 2 * 0.7,
        duration: DURATION - 7.8,
        ease: 'none',
        onUpdate: function () {
          var s = Math.sin(breathePhase.p);
          glow.style.opacity = String(0.28 + s * 0.05);
          glow.style.transform = 'scale(' + (1.05 + s * 0.02) + ')';
        },
      },
      7.8,
    );

    /* subtle idle float on the whole device through the hold */
    tl.to(device, { y: -6, duration: 1.08, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 8.0);

    /* =========================================================
       Camera: near-static establish, gentle push-in that deepens
       through the hold, plus a faint organic drift throughout.
       ========================================================= */
    var camPhase = { scale: 1 };
    tl.to(camPhase, { scale: 1.015, duration: 7.0, ease: 'sine.inOut' }, 0);
    tl.to(camPhase, { scale: 1.04, duration: DURATION - 7.0, ease: 'power2.out' }, 7.0);

    var drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 1.6,
        duration: DURATION,
        ease: 'none',
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 4;
          var dy = Math.sin(drift.p * 1.3) * 3;
          gsap.set(camera, { scale: camPhase.scale, x: dx, y: dy });
        },
      },
      0,
    );

    window.__timelines['12-presencia-digital'] = tl;
  </script>
