  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var TOTAL = 14.263;

      // ---- Virtual camera: single wrapper, single source of truth ----
      // screen = cam.scale * world + cam.{x,y}  (transform-origin 0 0 on #d06-world)
      // State A (Scene 1): scale 4.6 punched on the root card's center (960,330) —
      // window = 1920/4.6 x 1080/4.6 = 417 x 235, just under the 420x250 card:
      // an edge-to-edge, no-chrome extreme close-up with the mentor safely out of frame.
      var world = document.getElementById("d06-world");
      var cam = { scale: 4.6, x: -3456, y: -978 };
      function applyCam() {
        world.style.transform = "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }
      applyCam(); // seed frame 0 — punched-in on "Discípulo", no chrome visible

      var root = document.getElementById("d06-root");
      var badge = document.getElementById("d06-badge");
      var lineMentor = document.getElementById("d06-line-mentor");
      var counters = document.getElementById("d06-counters");
      var countDirectos = document.getElementById("d06-count-directos");
      var countTotal = document.getElementById("d06-count-total");

      // svg-path-draw setup — measure once, bake the dash pattern
      var lineLen = lineMentor.getTotalLength();
      lineMentor.style.strokeDasharray = String(lineLen);
      lineMentor.style.strokeDashoffset = String(lineLen);

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0 – 3.2s): extreme close-up, "Discípulo" fills the frame ----
      tl.fromTo(
        root,
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        badge,
        { opacity: 0, y: 10, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power2.out" },
        0.55
      );
      // finite pulse — "reporte pendiente" — settles well before Scene 2
      tl.to(
        badge,
        { scale: 1.08, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 },
        1.0
      );

      // ---- Scene 2 (3.2 – 4.9s): pre-reveal dwell — camera glides to reveal the
      // mentor (a gentle ~13% scale-out folded into the same pan, per the
      // blueprint's sub-shape-B allowance), then the connector draws between them.
      // Mentor itself is static in world space — the pan is what makes it "slide in".
      tl.to(
        cam,
        { scale: 4.0, x: -2880, y: -220, duration: 0.9, ease: "power2.inOut", onUpdate: applyCam },
        3.2
      );
      tl.to(lineMentor, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 4.15);

      // ---- Scene 3 (4.9 – 5.7s): THE REVEAL — one decelerating zoom-out, then LOCK ----
      tl.to(
        cam,
        { scale: 1, x: 0, y: 0, duration: 0.8, ease: "power4.out", onUpdate: applyCam },
        4.9
      );

      // ---- Scene 4 (5.7 – 14.263s): locked wide — counters count up and settle, extended hold ----
      tl.fromTo(
        counters,
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        5.8
      );

      var directosState = { v: 0 };
      var totalState = { v: 0 };
      tl.to(
        directosState,
        {
          v: 3,
          duration: 1.2,
          ease: "power2.out",
          onUpdate: function () {
            countDirectos.textContent = Math.round(directosState.v).toString();
          },
        },
        6.0
      );
      tl.to(
        totalState,
        {
          v: 9,
          duration: 1.2,
          ease: "power2.out",
          onUpdate: function () {
            countTotal.textContent = Math.round(totalState.v).toString();
          },
        },
        6.0
      );

      // subtle, finite settle jitter on the root card
      tl.to(
        root,
        { scale: 1.025, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 },
        7.2
      );

      // extended hold (frame now runs to 14.263s, was 10.475s): a second, calmer
      // emphasis pulse on the settled counters mid-hold, then a static read to the end —
      // avoids ~3.8s of dead air without adding a new exit/attention grab.
      tl.to(
        counters,
        { scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 },
        10.6
      );

      window.__timelines["06-discipulado"] = tl;
