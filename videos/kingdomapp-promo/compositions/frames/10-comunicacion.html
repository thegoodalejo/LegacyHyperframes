  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---- setup: measure pending-arc circles + checkmark paths (real geometry, not guessed) ----
    const com10ArcLens = {};
    ["com10-arc-1", "com10-arc-2", "com10-arc-3", "com10-arc-4"].forEach((id) => {
      const el = document.getElementById(id);
      const len = el.getTotalLength();
      com10ArcLens[id] = len;
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len); // fully hidden until drawn
    });
    ["com10-check-1", "com10-check-2", "com10-check-3"].forEach((id) => {
      const el = document.getElementById(id);
      const len = el.getTotalLength();
      el.style.strokeDasharray = String(len);
      el.style.strokeDashoffset = String(len);
    });

    // =========================================================
    // SCENE 1 (0.00 - 1.50s) — trigger: tag attaches, no click
    // =========================================================
    tl.fromTo(
      "#com10-member-card",
      { scale: 0.94, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0,
    );

    tl.fromTo(
      "#com10-tag-chip",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.35,
    );

    // small accent spinner beside the chip — svg-icon-enrichment rotation, the only cue "something fired"
    (function () {
      const arc = document.getElementById("com10-chip-spin-arc");
      const state = { deg: 0 };
      tl.to(
        state,
        {
          deg: 360 * 1.3,
          duration: 0.8,
          ease: "none",
          onUpdate: () => arc.setAttribute("transform", `rotate(${state.deg} 12 12)`),
        },
        0.55,
      );
    })();
    tl.to("#com10-chip-spin", { opacity: 0, duration: 0.12, ease: "power1.out" }, 1.35);

    // =========================================================
    // SCENE 2 (1.50 - 4.00s) — the working state: machine performs, names its own line
    // =========================================================
    tl.fromTo(
      "#com10-loader-inner",
      { y: 14, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.5,
    );

    (function () {
      const arc = document.getElementById("com10-loader-spin-arc");
      const state = { deg: 0 };
      tl.to(
        state,
        {
          deg: 360 * 3.5,
          duration: 2.35,
          ease: "none",
          onUpdate: () => arc.setAttribute("transform", `rotate(${state.deg} 18 18)`),
        },
        1.5,
      );
    })();

    // typed-on loader label — discrete text states, names "línea propia" explicitly
    (function () {
      const textEl = document.getElementById("com10-loader-text");
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.1, text: "En" },
        { t: 0.22, text: "Enviando" },
        { t: 0.42, text: "Enviando What" },
        { t: 0.58, text: "Enviando WhatsApp" },
        { t: 0.75, text: "Enviando WhatsApp (" },
        { t: 0.95, text: "Enviando WhatsApp (línea" },
        { t: 1.15, text: "Enviando WhatsApp (línea propia)" },
        { t: 1.35, text: "Enviando WhatsApp (línea propia)…" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 1.35,
          duration: 1.35,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(driver.t);
          },
        },
        1.6,
      );

      // caret blink, sin-driven, only while typing
      const caretEl = document.getElementById("com10-loader-caret");
      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 4,
          duration: 1.35,
          ease: "none",
          onUpdate: () => {
            caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        1.6,
      );
      tl.to("#com10-loader-caret", { opacity: 0, duration: 0.12, ease: "power1.out" }, 2.95);
    })();

    // the pulse dies the instant the result lands — loader fades right as the receipt pops in
    tl.to("#com10-loader-inner", { opacity: 0, duration: 0.18, ease: "power2.in" }, 3.85);

    // =========================================================
    // SCENE 3 (4.00 - 11.546s) — "Comunicación" receipt cascades in + mutates, 4 rows
    // =========================================================
    tl.fromTo(
      "#com10-receipt-card",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      4.0,
    );
    tl.fromTo(
      "#com10-receipt-status",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
      4.15,
    );

    // slow continuous push into the card once it has landed (header drifts off the top as it grows)
    tl.to(
      "#com10-receipt-zoom",
      { scale: 1.07, duration: 6.9, ease: "power1.inOut" },
      4.5,
    );

    // rows stagger in — slide-up + fade, one per beat
    tl.fromTo("#com10-row-1", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 4.5);
    tl.fromTo("#com10-row-2", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 4.82);
    tl.fromTo("#com10-row-3", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.14);
    tl.fromTo("#com10-row-4", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.46);

    // pending arcs draw partially as each row lands (still "in progress")
    tl.to("#com10-arc-1", { strokeDashoffset: com10ArcLens["com10-arc-1"] * 0.34, duration: 0.3, ease: "power2.out" }, 4.5);
    tl.to("#com10-arc-2", { strokeDashoffset: com10ArcLens["com10-arc-2"] * 0.4, duration: 0.3, ease: "power2.out" }, 4.82);
    tl.to("#com10-arc-3", { strokeDashoffset: com10ArcLens["com10-arc-3"] * 0.46, duration: 0.3, ease: "power2.out" }, 5.14);
    tl.to("#com10-arc-4", { strokeDashoffset: com10ArcLens["com10-arc-4"] * 0.42, duration: 0.3, ease: "power2.out" }, 5.46);
    // row 4 keeps visibly working for the rest of the shot — never completes
    tl.to("#com10-arc-4", { strokeDashoffset: com10ArcLens["com10-arc-4"] * 0.2, duration: 5.6, ease: "none" }, 5.76);

    // badge 1 flips: outline -> solid check, scale-swap-transition (bouncy only on the incoming)
    tl.to("#com10-row-1 .com10-badge-outline", { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" }, 6.6);
    tl.fromTo("#com10-row-1 .com10-badge-check", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 6.75);
    tl.to("#com10-check-1", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 6.75);
    tl.to("#com10-meta-1", { opacity: 0.65, duration: 0.3, ease: "power1.out" }, 6.75);

    // badge 2 flips: outline -> solid check
    tl.to("#com10-row-2 .com10-badge-outline", { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.0);
    tl.fromTo("#com10-row-2 .com10-badge-check", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 8.15);
    tl.to("#com10-check-2", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 8.15);
    tl.to("#com10-meta-2", { opacity: 0.65, duration: 0.3, ease: "power1.out" }, 8.15);

    // badge 3 flips: outline -> solid check ("tu propia línea" lands here)
    tl.to("#com10-row-3 .com10-badge-outline", { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" }, 9.7);
    tl.fromTo("#com10-row-3 .com10-badge-check", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 9.85);
    tl.to("#com10-check-3", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 9.85);
    tl.to("#com10-meta-3", { opacity: 0.65, duration: 0.3, ease: "power1.out" }, 9.85);

    // row 4 stays pending — "Verificando…" pulses, the machine still visibly capable of more
    (function () {
      const metaEl = document.getElementById("com10-meta-4");
      const pulse = { p: 0 };
      tl.to(
        pulse,
        {
          p: Math.PI * 2 * 4,
          duration: 5.6,
          ease: "none",
          onUpdate: () => {
            metaEl.style.opacity = String(0.62 + Math.sin(pulse.p) * 0.32);
          },
        },
        5.76,
      );
    })();

    window.__timelines["10-comunicacion"] = tl;
  </script>
</template>
