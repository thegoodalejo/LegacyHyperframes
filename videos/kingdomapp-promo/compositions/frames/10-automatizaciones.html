    // typed-on loader label — discrete text states, fast keystroke clusters
    (function () {
      const textEl = document.getElementById("f10-loader-text");
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.08, text: "En" },
        { t: 0.16, text: "Envi" },
        { t: 0.24, text: "Enviando" },
        { t: 0.4, text: "Enviando What" },
        { t: 0.55, text: "Enviando WhatsApp" },
        { t: 0.7, text: "Enviando WhatsApp…" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 0.7,
          duration: 0.7,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = textAt(driver.t);
          },
        },
        2.0,
      );

      // caret blink, sin-driven, only while typing
      const caretEl = document.getElementById("f10-loader-caret");
      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 3,
          duration: 0.7,
          ease: "none",
          onUpdate: () => {
            caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        2.0,
      );
      tl.to("#f10-loader-caret", { opacity: 0, duration: 0.1, ease: "power1.out" }, 2.7);
    })();

    // the pulse dies the instant the result lands — loader fades right as the receipt pops in

      "#f10-receipt-zoom",
      { scale: 1.065, duration: 3.407, ease: "power1.inOut" },

    tl.fromTo("#f10-row-2", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 6.05);
    tl.fromTo("#f10-row-3", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 6.35);

    // pending arcs draw partially as each row lands (still "in progress")
    tl.to("#f10-arc-1", { strokeDashoffset: 55, duration: 0.3, ease: "power2.out" }, 5.75);
    tl.to("#f10-arc-2", { strokeDashoffset: 60, duration: 0.3, ease: "power2.out" }, 6.05);
    tl.to("#f10-arc-3", { strokeDashoffset: 68, duration: 0.3, ease: "power2.out" }, 6.35);
    // row 3 keeps visibly working for the rest of the shot — never completes
    tl.to("#f10-arc-3", { strokeDashoffset: 34, duration: 2.4, ease: "none" }, 6.65);

    // badge 1 flips: outline -> solid check, with a scale bounce
    tl.to("#f10-row-1 .f10-badge-outline", { scale: 0.7, opacity: 0, duration: 0.35, ease: "power2.in" }, 6.9);
    tl.fromTo("#f10-row-1 .f10-badge-check", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 7.1);
    tl.to("#f10-check-1", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 7.1);
    tl.to("#f10-meta-1", { opacity: 0.65, duration: 0.3, ease: "power1.out" }, 7.1);

    // badge 2 flips: outline -> solid check, with a scale bounce
