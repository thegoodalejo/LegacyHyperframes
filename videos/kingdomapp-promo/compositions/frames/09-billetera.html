  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const TOTAL_DURATION = 11.572;

    /* ---- synchronous SVG measurement setup ---- */
    const ringFill = document.getElementById('billetera-ringfill');
    const RING_LEN = ringFill.getTotalLength();
    ringFill.style.strokeDasharray = RING_LEN;
    ringFill.style.strokeDashoffset = RING_LEN;

    const checkPath = document.getElementById('billetera-check-path');
    const CHECK_LEN = checkPath.getTotalLength();
    checkPath.style.strokeDasharray = CHECK_LEN;
    checkPath.style.strokeDashoffset = CHECK_LEN;

    ['billetera-ledger-l1', 'billetera-ledger-l2', 'billetera-ledger-l3', 'billetera-ledger-check'].forEach(
      (id) => {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      },
    );

    /* ---- camera state (one writer at the bottom composes scale + pan + drift) ---- */
    const camera = document.getElementById('billetera-camera');
    const camPhase = { scale: 1 };
    const camPan = { x: 0, y: 0 };

    /* =========================================================
       Scene 1 (0.0 – 3.306s): ring sweeps + "0 -> 1 donación"
       count-up as one beat, label "Trazable" beneath, slow
       continuous camera zoom-in underneath.
       ========================================================= */
    tl.fromTo(
      '#billetera-cardA',
      { scale: 0.85, opacity: 0, y: 14 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' },
      0.0,
    );
    tl.fromTo(
      '#billetera-labelA',
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
      0.15,
    );

    const countState = { value: 0 };
    const COUNT_START = 0.25;
    const COUNT_DUR = 1.0;
    tl.to(
      countState,
      {
        value: 1,
        duration: COUNT_DUR,
        ease: 'power2.out',
        onUpdate: () => {
          document.getElementById('billetera-count').textContent = Math.round(countState.value).toLocaleString();
        },
      },
      COUNT_START,
    );
    tl.fromTo(
      '#billetera-count',
      { scale: 0.55 },
      { scale: 1, duration: COUNT_DUR, ease: 'power2.out' },
      COUNT_START,
    );
    tl.to(ringFill, { strokeDashoffset: 0, duration: COUNT_DUR, ease: 'power2.out' }, COUNT_START);
    tl.fromTo(
      '#billetera-count-unit',
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power1.out' },
      COUNT_START + 0.1,
    );

    /* subtle idle float once the ring has landed, clears well before the push-through */
    tl.to('#billetera-cardA', { y: -4, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.9);

    /* slow continuous camera zoom-in under Scene 1 */
    tl.to(camPhase, { scale: 1.05, duration: 2.9, ease: 'sine.inOut' }, 0.0);

    /* =========================================================
       Scene 2 seam -> body (3.0 – 7.3s): z-depth push-THROUGH
       the ring's center into "Ingreso — Aprobado ✓" (cut-catalog
       Zoom-Through: exit accelerates + blurs, hard cut at peak,
       incoming decelerates into focus), camera scale compounds
       the same push. This is the blueprint's signature move.
       ========================================================= */
    const PUSH_START = 3.0;
    const PUSH_EXIT_DUR = 0.4;
    const PUSH_CUT = PUSH_START + PUSH_EXIT_DUR; // 3.4
    const PUSH_ENTRY_DUR = 0.5;

    // Phase 1 — CardA (ring instrument) accelerates toward the viewer and dissolves
    tl.to('#billetera-cardA', { scale: 1.2, filter: 'blur(18px)', duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);
    tl.to('#billetera-cardA', { opacity: 0.15, duration: PUSH_EXIT_DUR, ease: 'none' }, PUSH_START);
    // Camera compounds the push at the same velocity
    tl.to(camPhase, { scale: 2.5, duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);

    // Phase 2 — hard cut at peak blur/velocity
    tl.set('#billetera-cardA', { opacity: 0 }, PUSH_CUT);
    tl.set('#billetera-cardB', { opacity: 0.15, scale: 0.75, filter: 'blur(18px)' }, PUSH_CUT);

    // Phase 3 — CardB (Ingreso) arrives from behind the camera, resolving into focus
    tl.to(
      '#billetera-cardB',
      { scale: 1, filter: 'blur(0px)', opacity: 1, duration: PUSH_ENTRY_DUR, ease: 'expo.out' },
      PUSH_CUT,
    );
    tl.to(camPhase, { scale: 1.0, duration: PUSH_ENTRY_DUR, ease: 'expo.out' }, PUSH_CUT);

    /* checkmark badge spring-pops in once the card has landed */
    const BADGE_AT = PUSH_CUT + PUSH_ENTRY_DUR + 0.1; // 4.0
    tl.fromTo(
      '#billetera-check',
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' },
      BADGE_AT,
    );
    tl.to(checkPath, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, BADGE_AT + 0.15);

    /* subtle idle float while "Aprobado" holds, clears before the pan begins */
    tl.to('#billetera-cardB', { y: -4, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 4.3);

    /* =========================================================
       Scene 3 (7.3 – 11.572s): camera PANS to the third card
       "Auditoría"; a small ledger-line icon self-draws; the
       shot settles centered as a soft accent glow blooms
       behind it and holds to the end.
       ========================================================= */
    const PAN_START = 7.3;
    const PAN_DUR = 1.0;
    const PAN_DISTANCE = 780;

    tl.to('#billetera-cardB', { opacity: 0, scale: 0.94, duration: 0.5, ease: 'power2.in' }, PAN_START);
    tl.to(camPan, { x: -PAN_DISTANCE, duration: PAN_DUR, ease: 'power2.inOut' }, PAN_START);
    tl.fromTo(
      '#billetera-cardC',
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' },
      PAN_START + 0.2,
    );

    /* gentle push-in climax as the shot settles on the final card, holding to the end */
    tl.to(camPhase, { scale: 1.05, duration: TOTAL_DURATION - (PAN_START + PAN_DUR), ease: 'power2.out' }, PAN_START + PAN_DUR);

    /* ledger lines self-draw left-to-right, staggered as one continuous trace */
    const LEDGER_START = 8.4;
    tl.to('#billetera-ledger-l1', { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, LEDGER_START);
    tl.to('#billetera-ledger-l2', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, LEDGER_START + 0.25);
    tl.to('#billetera-ledger-l3', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, LEDGER_START + 0.45);
    tl.to(
      document.getElementById('billetera-ledger-check'),
      { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' },
      LEDGER_START + 0.65,
    );

    /* soft accent glow blooms in behind the settled hero card */
    const BLOOM_START = 8.5;
    const BLOOM_DUR = 1.0;
    const glow = document.getElementById('billetera-glow');
    const GLOW_PEAK_OPACITY = 0.3;
    tl.fromTo(
      '#billetera-glow',
      { opacity: 0, scale: 0.85 },
      { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: 'power2.out' },
      BLOOM_START,
    );
    const breathePhase = { p: 0 };
    tl.to(
      breathePhase,
      {
        p: Math.PI * 2 * 0.75,
        duration: TOTAL_DURATION - (BLOOM_START + BLOOM_DUR),
        ease: 'none',
        onUpdate: () => {
          const s = Math.sin(breathePhase.p);
          glow.style.opacity = String(GLOW_PEAK_OPACITY + s * 0.04);
          glow.style.transform = `scale(${1 + s * 0.025})`;
        },
      },
      BLOOM_START + BLOOM_DUR,
    );

    /* subtle idle float on the final card through the hold */
    tl.to('#billetera-cardC', { y: -4, duration: 1.08, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 9.4);

    /* ---- single writer: composes phase scale + pan + organic drift onto the camera ---- */
    const drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 2,
        duration: TOTAL_DURATION,
        ease: 'none',
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 5;
          const dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = `scale(${camPhase.scale}) translate(${camPan.x + dx}px, ${camPan.y + dy}px)`;
        },
      },
      0,
    );

    window.__timelines['09-billetera'] = tl;
  </script>
