    var SCENE4_START = 4.0 * K; // ~4.762

      { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0

    // -----------------------------------------------------------------

    // mirrored book-open rotateY tilts. Left (Eventos) leads, right (Kids)

    // -----------------------------------------------------------------

    var TILT_OVERSHOOT = 8;
    var LEFT_AT = SCENE2_START; // 0.476
    var RIGHT_AT = LEFT_AT + 0.24; // 0.716
    var ENTRY_DUR = 0.85;

    tl.fromTo(
      "#ek-card-left",
      { x: -340, rotateY: TILT + TILT_OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
      LEFT_AT

      "#ek-card-right",
      { x: 340, rotateY: -TILT - TILT_OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: -TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },

      "#ek-glow-left",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.3, scale: 1, duration: ENTRY_DUR, ease: "power2.out" },
      LEFT_AT
    );
    tl.fromTo(
      "#ek-glow-right",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.3, scale: 1, duration: ENTRY_DUR, ease: "power2.out" },
      RIGHT_AT
