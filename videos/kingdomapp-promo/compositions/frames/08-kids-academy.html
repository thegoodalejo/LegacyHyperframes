    // -----------------------------------------------------------------
    // Scene 1 (0.0 - ~0.8s): centered title "Kids + Academy" slides DOWN
    // into place — forms a T-shape against the cards, which arrive next.
    // -----------------------------------------------------------------
    tl.fromTo(
      "#ka-title-row",
      { y: -40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0

    // -----------------------------------------------------------------
    // Scene 2 (~0.4 - 3.0s, overlapping the title tail): the signature

    // behind toward "...y forma a tus líderes con Kingdom Academy".
    // -----------------------------------------------------------------
    var TILT = 14;
    var TILT_OVERSHOOT = 8;
    var LEFT_AT = 0.4;
    var RIGHT_AT = LEFT_AT + 0.24; // 0.64
    var ENTRY_DUR = 0.85;

    tl.fromTo(
      "#ka-card-left",
      { x: -340, rotateY: TILT + TILT_OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
      LEFT_AT
    );
    tl.fromTo(
      "#ka-card-right",
      { x: 340, rotateY: -TILT - TILT_OVERSHOOT, opacity: 0 },
      { x: 0, rotateY: -TILT, opacity: 1, duration: ENTRY_DUR, ease: "power3.out" },
      RIGHT_AT
    );

    // Dual side-glow ambient — un-triggered bloom landing on each card's
    // settle as one beat (glow + hero resolve together).
    tl.fromTo(
      "#ka-glow-left",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.3, scale: 1, duration: ENTRY_DUR, ease: "power2.out" },
      LEFT_AT
    );
    tl.fromTo(
      "#ka-glow-right",
      { opacity: 0, scale: 0.85 },
      { opacity: 0.3, scale: 1, duration: ENTRY_DUR, ease: "power2.out" },
      RIGHT_AT
    );

    // Icon + label + accent-line fade up during each card's settle tail.
    tl.fromTo(
      ".ka-copy-left",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 },
      LEFT_AT + 0.37
    );
    tl.fromTo(
      ".ka-copy-right",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 },
      RIGHT_AT + 0.38
    );

    tl.fromTo("#ka-bullet-left-1", bulletFrom, Object.assign({}, bulletTo), 3.0);
    tl.fromTo("#ka-bullet-left-2", bulletFrom, Object.assign({}, bulletTo), 3.7);
    tl.fromTo("#ka-bullet-left-3", bulletFrom, Object.assign({}, bulletTo), 4.4);

    tl.fromTo("#ka-bullet-right-1", bulletFrom, Object.assign({}, bulletTo), 5.4);
    tl.fromTo("#ka-bullet-right-2", bulletFrom, Object.assign({}, bulletTo), 6.1);
    tl.fromTo("#ka-bullet-right-3", bulletFrom, Object.assign({}, bulletTo), 6.8);

    // -----------------------------------------------------------------
    // Scene 4 (8.0 - 10.71s): a pill badge lands at each card's inner
    // corner — left "Confianza" then right "Formación" ~0.36s apart.
    // The lone overshoot in the shot; it earns the punctuation.
    // -----------------------------------------------------------------
    var BADGE_LEFT_AT = 8.0;
    var BADGE_RIGHT_AT = BADGE_LEFT_AT + 0.36;

    tl.fromTo(
      "#ka-badge-left",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
      BADGE_LEFT_AT
    );
    tl.fromTo(
      "#ka-badge-right",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" },
      BADGE_RIGHT_AT
    );

    // Hold with a gentle phase-opposed idle float (left/right never

    tl.to(

      { y: -6, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 1 },

    );
    tl.to(

    var glowLeftEl = document.getElementById("ka-glow-left");
    var glowRightEl = document.getElementById("ka-glow-right");
