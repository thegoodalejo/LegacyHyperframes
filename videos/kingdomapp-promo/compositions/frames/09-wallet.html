      <div class="wallet-scene">
        <div class="wallet-camera" id="wallet-camera">
          <div class="wallet-stage">
            <!-- Scene 1 (0.0-3.0s): ring + count-up "donación" -> "Trazable" -->
            <div class="wallet-cardA" id="wallet-cardA">

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const TOTAL_DURATION = 12.304;

    /* ---- synchronous SVG measurement setup ---- */
    const ringFill = document.getElementById('wallet-ringfill');
    const RING_LEN = ringFill.getTotalLength();
    ringFill.style.strokeDasharray = RING_LEN;
    ringFill.style.strokeDashoffset = RING_LEN;

    const checkPath = document.getElementById('wallet-check-path');
    const CHECK_LEN = checkPath.getTotalLength();
    checkPath.style.strokeDasharray = CHECK_LEN;
    checkPath.style.strokeDashoffset = CHECK_LEN;

    const folderPath = document.getElementById('wallet-folder-path');
    const FOLDER_LEN = folderPath.getTotalLength();
    folderPath.style.strokeDasharray = FOLDER_LEN;
    folderPath.style.strokeDashoffset = FOLDER_LEN;

    ['wallet-ledger-l1', 'wallet-ledger-l2', 'wallet-ledger-l3', 'wallet-ledger-check'].forEach((id) => {
      const el = document.getElementById(id);
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    });

    /* ---- camera state (one writer at the bottom composes scale + pan + drift) ---- */
    const camera = document.getElementById('wallet-camera');
    const camPhase = { scale: 1 };
    const camPan = { x: 0, y: 0 };

    /* =========================================================
       Scene 1 (0.0 - 3.0s): ring sweeps + "0 -> 1 donación"
       count-up as one beat, label "Trazable" beneath, slow
       continuous camera zoom-in underneath.
       ========================================================= */
    tl.fromTo(
      '#wallet-cardA',
      { scale: 0.85, opacity: 0, y: 14 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' },
      0.0,
    );
    tl.fromTo('#wallet-labelA', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.15);

    const countState = { value: 0 };
    const COUNT_START = 0.25;
    const COUNT_DUR = 1.0;
    tl.to(
      countState,
      {
        value: 1,
        duration: COUNT_DUR,
        ease: 'power2.out',
        onUpdate: () => {
          document.getElementById('wallet-count').textContent = Math.round(countState.value).toLocaleString();
        },
      },
      COUNT_START,
    );
    tl.fromTo('#wallet-count', { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: 'power2.out' }, COUNT_START);
    tl.to(ringFill, { strokeDashoffset: 0, duration: COUNT_DUR, ease: 'power2.out' }, COUNT_START);
    tl.fromTo(
      '#wallet-count-unit',
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power1.out' },
      COUNT_START + 0.1,
    );

    /* subtle idle float once the ring has landed, clears well before the push-through */
    tl.to('#wallet-cardA', { y: -4, duration: 1.0, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.9);

    /* slow continuous camera zoom-in under Scene 1, landing exactly at the push-through */
    tl.to(camPhase, { scale: 1.05, duration: 3.0, ease: 'sine.inOut' }, 0.0);

    /* =========================================================
       Scene 2 seam (3.0 - 3.9s): z-depth push-THROUGH the ring's
       center into "Ingreso - Aprobado check" (cut-catalog
       Zoom-Through: exit accelerates + blurs, hard cut at peak,
       incoming decelerates into focus), camera scale compounds
       the same push. This is the blueprint's signature move.
       ========================================================= */
    const PUSH_START = 3.0;
    const PUSH_EXIT_DUR = 0.4;
    const PUSH_CUT = PUSH_START + PUSH_EXIT_DUR; // 3.4
    const PUSH_ENTRY_DUR = 0.5; // resolves at 3.9

    tl.to('#wallet-cardA', { scale: 1.2, filter: 'blur(18px)', duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);
    tl.to('#wallet-cardA', { opacity: 0.15, duration: PUSH_EXIT_DUR, ease: 'none' }, PUSH_START);
    tl.to(camPhase, { scale: 2.6, duration: PUSH_EXIT_DUR, ease: 'power3.in' }, PUSH_START);

    tl.set('#wallet-cardA', { opacity: 0 }, PUSH_CUT);
    tl.set('#wallet-cardB', { opacity: 0.15, scale: 0.75, filter: 'blur(18px)' }, PUSH_CUT);

    tl.to('#wallet-cardB', { scale: 1, filter: 'blur(0px)', opacity: 1, duration: PUSH_ENTRY_DUR, ease: 'expo.out' }, PUSH_CUT);
    tl.to(camPhase, { scale: 1.0, duration: PUSH_ENTRY_DUR, ease: 'expo.out' }, PUSH_CUT);

    /* checkmark badge spring-pops in once the card has landed */
    const BADGE_AT = PUSH_CUT + PUSH_ENTRY_DUR + 0.1; // 4.0
    tl.fromTo('#wallet-check', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' }, BADGE_AT);
    tl.to(checkPath, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, BADGE_AT + 0.15);

    /* subtle idle float while "Aprobado" holds, clears exactly before the pan+push begins */
    tl.to('#wallet-cardB', { y: -4, duration: 0.85, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 4.3);

    /* =========================================================
       Scene 3 (6.0 - 9.0s): camera PANS+PUSHES laterally to the
       new "Centros de costo" instrument - a folder icon self-draws
       and a budget progress bar fills as the voiceover says
       "Centros de costo, presupuesto".
       ========================================================= */
    const PAN1_START = 6.0;
    const PAN1_DUR = 1.0;
    const PAN1_DISTANCE = 780;

    tl.to('#wallet-cardB', { opacity: 0, scale: 0.94, duration: 0.5, ease: 'power2.in' }, PAN1_START);
    tl.to(camPan, { x: -PAN1_DISTANCE, duration: PAN1_DUR, ease: 'power2.inOut' }, PAN1_START);
    /* "push" pulse riding on the pan, matching the packet's "pan/push" cue */
    tl.to(camPhase, { scale: 1.07, duration: 0.5, ease: 'power2.out' }, PAN1_START);
    tl.to(camPhase, { scale: 1.0, duration: 0.5, ease: 'power2.in' }, PAN1_START + 0.5);

    tl.fromTo('#wallet-cardD', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, PAN1_START + 0.2);

    /* folder icon self-draws once the card has landed */
    const FOLDER_DRAW_AT = 6.9;
    tl.to(folderPath, { strokeDashoffset: 0, duration: 0.55, ease: 'power2.out' }, FOLDER_DRAW_AT);

    /* budget bar fills right after, paired with the "Presupuesto" sub-label */
    const BAR_FILL_AT = 7.3;
    const BUDGET_PCT = 0.72;
    tl.to('#wallet-bar-fill', { scaleX: BUDGET_PCT, duration: 1.0, ease: 'power2.out' }, BAR_FILL_AT);
    tl.fromTo('#wallet-cardD-sub', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power1.out' }, BAR_FILL_AT + 0.1);

    /* subtle idle float on Centros de costo before the next pan begins */
    tl.to('#wallet-cardD', { y: -4, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 8.2);

    /* =========================================================
       Scene 4 (9.0 - 12.304s): camera PANS to the final card
       "Auditoría"; a small ledger-line icon self-draws; the
       shot settles centered as a soft accent glow blooms
       behind it and holds to the end.
       ========================================================= */
    const PAN2_START = 9.0;
    const PAN2_DUR = 1.0;
    const PAN2_DISTANCE = 780;

    tl.to('#wallet-cardD', { opacity: 0, scale: 0.94, duration: 0.5, ease: 'power2.in' }, PAN2_START);
    tl.to(camPan, { x: -(PAN1_DISTANCE + PAN2_DISTANCE), duration: PAN2_DUR, ease: 'power2.inOut' }, PAN2_START);
    tl.fromTo('#wallet-cardC', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'power2.out' }, PAN2_START + 0.2);

    /* gentle push-in climax as the shot settles on the final card, holding to the end */
    tl.to(camPhase, { scale: 1.05, duration: TOTAL_DURATION - (PAN2_START + PAN2_DUR), ease: 'power2.out' }, PAN2_START + PAN2_DUR);

    /* ledger lines self-draw left-to-right, staggered as one continuous trace */
    const LEDGER_START = 10.1;
    tl.to('#wallet-ledger-l1', { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, LEDGER_START);
    tl.to('#wallet-ledger-l2', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, LEDGER_START + 0.25);
    tl.to('#wallet-ledger-l3', { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, LEDGER_START + 0.45);
    tl.to(document.getElementById('wallet-ledger-check'), { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, LEDGER_START + 0.65);

    /* soft accent glow blooms in behind the settled hero card, then breathes to the end */
    const BLOOM_START = 10.2;
    const BLOOM_DUR = 1.0;
    const glow = document.getElementById('wallet-glow');
    const GLOW_PEAK_OPACITY = 0.3;
    tl.fromTo('#wallet-glow', { opacity: 0, scale: 0.85 }, { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: 'power2.out' }, BLOOM_START);
    const breathePhase = { p: 0 };
    tl.to(
      breathePhase,
      {
        p: Math.PI * 2 * 0.6,
        duration: TOTAL_DURATION - (BLOOM_START + BLOOM_DUR),
        ease: 'none',
        onUpdate: () => {
          const s = Math.sin(breathePhase.p);
          glow.style.opacity = String(GLOW_PEAK_OPACITY + s * 0.04);
          glow.style.transform = `scale(${1 + s * 0.025})`;
        },
      },
      BLOOM_START + BLOOM_DUR,
    );

    /* subtle idle float on the final card through the hold */
    tl.to('#wallet-cardC', { y: -4, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 11.1);

    /* ---- single writer: composes phase scale + pan + organic drift onto the camera ---- */
    const drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2 * 2,
        duration: TOTAL_DURATION,
        ease: 'none',
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 5;
          const dy = Math.sin(drift.p * 1.3) * 3;
          camera.style.transform = `scale(${camPhase.scale}) translate(${camPan.x + dx}px, ${camPan.y + dy}px)`;
        },
      },
      0,
    );

    window.__timelines['09-wallet'] = tl;
  </script>
