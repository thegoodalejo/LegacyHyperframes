<script>
  window.__timelines = window.__timelines || {};

  (async function () {
    // Measurement is async (fonts must settle before rects are trustworthy) —
    // build + register the timeline inside this same setup so the baked
    // camera targets are ready before window.__timelines is published.
    await document.fonts.ready;

    var W = 1920,
      H = 1080;
    var rootEl = document.getElementById("root");
    var worldEl = document.getElementById("mis-world");
    var iconCircleEl = document.getElementById("mis-icon-circle");
    var travelAnchorEl = document.getElementById("mis-travel-anchor");
    var pinAnchorEl = document.getElementById("mis-pin-anchor");
    var labelTextEl = document.getElementById("mis-label-text");
    var connectorPathEl = document.getElementById("mis-connector-path");
    var blurNode = document.getElementById("mis-streak-blur");

    function measureCenterOffset(el) {
      var r = el.getBoundingClientRect();
      var rr = rootEl.getBoundingClientRect();
      return {
        x: r.left - rr.left + r.width / 2 - W / 2,
        y: r.top - rr.top + r.height / 2 - H / 2,
      };
    }

    // ---- camera targets, measured once at setup and baked ----
    var S1_SCALE = 1.75; // leg 1 — dive tight onto the Registro icon
    var S3_SCALE = 1.5; // leg 3 — travel framing wide enough to hold both ends of the connector
    var S4_SCALE = 2.3; // leg 4 — rest tight on the map pin

    var offA = measureCenterOffset(iconCircleEl);
    var T1x = -offA.x * S1_SCALE,
      T1y = -offA.y * S1_SCALE;

    var offTravel = measureCenterOffset(travelAnchorEl);
    var T3x = -offTravel.x * S3_SCALE,
      T3y = -offTravel.y * S3_SCALE;

    var offPin = measureCenterOffset(pinAnchorEl);
    var T4x = -offPin.x * S4_SCALE,
      T4y = -offPin.y * S4_SCALE;

    // ---- connector path draw geometry ----
    var pathLen = connectorPathEl.getTotalLength();
    connectorPathEl.style.strokeDasharray = String(pathLen);
    connectorPathEl.style.strokeDashoffset = String(pathLen);

    // ---- single camera writer: phase state + continuous drift compose here ONLY ----
    var cam = { scale: 1, x: 0, y: 0 };
    var drift = { p: 0 };
    var DRIFT_AMP_X = 5,
      DRIFT_AMP_Y = 3,
      DRIFT_FREQ_RATIO = 1.3;

    function renderCamera() {
      var dx = Math.sin(drift.p) * DRIFT_AMP_X;
      var dy = Math.sin(drift.p * DRIFT_FREQ_RATIO) * DRIFT_AMP_Y;
      worldEl.style.transform =
        "translate(" + (cam.x + dx) + "px, " + (cam.y + dy) + "px) scale(" + cam.scale + ")";
    }
    renderCamera(); // seed frame 0

    function writeBlurBB(v) {
      blurNode.setAttribute("stdDeviation", v + " " + v);
    }
    function writeBlurX(v) {
      blurNode.setAttribute("stdDeviation", v + " 0");
    }

    var tl = gsap.timeline({ paused: true });

    // -----------------------------------------------------------------
    // Packet's rough Scene windows were authored against a ~7.0s estimate;
    // this frame's real synced duration is 9.874s, so every window is
    // stretched by K, proportionally, never front-loaded.
    // -----------------------------------------------------------------
    var TOTAL = 9.874;
    var K = TOTAL / 7.0; // ~1.4404
    var S1_END = 1.5 * K; // ~2.161 — "...registra"
    var S2_END = 3.5 * K; // ~5.042 — "cuenta, recoge testimonios"
    var S3_END = 5.5 * K; // ~7.922 — "y conecta a cada nueva alma"
    // Scene 4 runs S3_END -> TOTAL — "con la iglesia local mas cercana"

    // ===================================================================
    // Scene 1 (0 - ~2.16s): LEG 1 — the camera dives FAST and TIGHT onto
    // the Registro icon station as it pops in — commitment, not a polite
    // zoom. Motion-blur streak rides the world wrapper (camera-travel
    // carve-out), symmetric B-B axis for a depth/push move.
    // ===================================================================
    var DIVE_AT = 0,
      DIVE_DUR = 1.9;

    var blurProxy1 = { v: 18 };
    writeBlurBB(blurProxy1.v); // entrance shape: seed at PEAK, t=0 shows the streaked start

    tl.to(
      cam,
      { scale: S1_SCALE, x: T1x, y: T1y, duration: DIVE_DUR, ease: "power4.out", onUpdate: renderCamera },
      DIVE_AT
    );
    tl.to(
      blurProxy1,
      { v: 0, duration: DIVE_DUR, ease: "power4.out", onUpdate: function () { writeBlurBB(blurProxy1.v); } },
      DIVE_AT
    );

    // Continuous sine drift spans the whole shot so no hold ever goes dead.
    tl.to(
      drift,
      { p: Math.PI * 2 * 2.4, duration: TOTAL, ease: "none", onUpdate: renderCamera },
      0
    );

    // The hero station pops in with the dive — visible well inside t<=0.5s.
    tl.fromTo(
      "#mis-icon-circle",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0
    );
    tl.fromTo(
      "#mis-label-pill",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.08
    );

    // ===================================================================
    // Scene 2 (~2.16 - ~5.04s): LEG 2 — the camera holds/drifts while the
    // icon self-acts: Registro flips to a checkmark (scale-swap-transition),
    // a tally counter draws in, a testimony card pops in beside it — no
    // cursor anywhere. VO: "cuenta, recoge testimonios".
    // ===================================================================
    var CHECK_TRIGGER = S1_END + 0.19;
    var CHECK_EXIT_DUR = 0.4,
      CHECK_ENTER_DUR = 0.55,
      CHECK_OVERLAP = 0.15;
    var CHECK_ENTER_AT = CHECK_TRIGGER + CHECK_EXIT_DUR - CHECK_OVERLAP;

    tl.to(
      "#mis-icon-registro",
      { scale: 0.7, opacity: 0, duration: CHECK_EXIT_DUR, ease: "power2.in" },
      CHECK_TRIGGER
    );
    tl.fromTo(
      "#mis-icon-check",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: CHECK_ENTER_DUR, ease: "back.out(1.6)" },
      CHECK_ENTER_AT
    );

    // Label swap rides the same beat as the incoming checkmark.
    tl.to("#mis-label-pill", { opacity: 0.15, duration: 0.12, ease: "power1.in" }, CHECK_ENTER_AT - 0.12);
    tl.call(function () { labelTextEl.textContent = "Conteo"; }, [], CHECK_ENTER_AT);
    tl.to("#mis-label-pill", { opacity: 1, duration: 0.18, ease: "power1.out" }, CHECK_ENTER_AT);

    // Tally strokes draw in one at a time — a literal tally, no invented figure.
    var COUNTER_AT = CHECK_ENTER_AT + CHECK_ENTER_DUR + 0.15;
    tl.fromTo(
      "#mis-counter-chip",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      COUNTER_AT
    );
    ["mis-tally-1", "mis-tally-2", "mis-tally-3", "mis-tally-4"].forEach(function (id, i) {
      var lineEl = document.getElementById(id);
      var len = lineEl.getTotalLength();
      lineEl.style.strokeDasharray = String(len);
      lineEl.style.strokeDashoffset = String(len);
      tl.to(
        lineEl,
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        COUNTER_AT + 0.2 + i * 0.18
      );
    });

    // Testimony card pops in beside the station.
    var TESTIMONY_AT = COUNTER_AT + 1.0;
    tl.fromTo(
      "#mis-testimony-card",
      { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      TESTIMONY_AT
    );

    // ===================================================================
    // Scene 3 (~5.04 - ~7.92s): LEG 3 — travel/pan to the map region while
    // a connecting line draws from the testimony card to the pin. Blur
    // envelope splits at the leg's velocity peak (inOut repositioning leg),
    // lateral X-axis smear. VO: "y conecta a cada nueva alma".
    // ===================================================================
    var PAN_START = S2_END;
    var PAN_DUR = 2.1;
    var PAN_HALF = PAN_DUR / 2;

    tl.to(
      cam,
      { scale: S3_SCALE, x: T3x, y: T3y, duration: PAN_DUR, ease: "power2.inOut", onUpdate: renderCamera },
      PAN_START
    );

    var blurProxy3 = { v: 0 };
    tl.to(
      blurProxy3,
      { v: 13, duration: PAN_HALF, ease: "power2.in", onUpdate: function () { writeBlurX(blurProxy3.v); } },
      PAN_START
    );
    tl.to(
      blurProxy3,
      { v: 0, duration: PAN_HALF, ease: "power2.out", onUpdate: function () { writeBlurX(blurProxy3.v); } },
      PAN_START + PAN_HALF
    );

    var CONNECTOR_START = PAN_START + 0.25;
    tl.to(
      "#mis-connector-path",
      { strokeDashoffset: 0, duration: 1.7, ease: "power2.out" },
      CONNECTOR_START
    );

    var MAP_REVEAL_AT = PAN_START + 1.25;
    tl.fromTo(
      "#mis-map-panel",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      MAP_REVEAL_AT
    );
