      ESTE ARCHIVO LO GENERA _gen/gen.py desde _gen/index.tpl.html (tramos, stills, marcas y sonidos en tablas); se puede editar a mano, pero el
      próximo `python _gen/gen.py` lo reescribe.
      Estructura:
        · compositions/fondo.html          la noche del sitio (el halo se asienta en 0 · 180 · 720 · 960 · 1320 · 1560 · 2040 · 2280)
        · compositions/frase-1..11.html    las once frases (una a la vez) y compositions/ceja.html («MI IGLESIA», con sus dos lugares)
        · #escena (aquí, en la raíz)       una tira horizontal con las dos ventanas a la app REAL: el celular (#ventana-cel, .k-ventana-16x9,
                                            x 1104) y el escritorio (#ventana-esc, .k-ventana-escritorio, x 2160 = 240 + 1920). #escena en x 0 muestra
                                            el celular; en x −1920, el escritorio (látigos 1310–1320, 1550–1560, 2030–2040 y 2270–2280)
            - #mK (0–840): el clip, tal cual (assets/grabaciones/clip/grabacion.mp4): #camT1 (el still debajo del iris del 180), #cam > #m1 >
              #m1in con sus tramos, el iris #iris1 y sus marcas, y #camT2 (la marca del 180)
            - #mC1 (841–1320): Gabriela en Comunidades (celular.mp4): #camC1 e #irisC1 > #camC1b (el iris del 960)
            - #mC2 (1550–2040): Gabriela acompañada y su objetivo (#camC2) · #mC3 (2270–2760): la bienvenida de Lucía (#camC3)
            - #ventana-esc: #mE1 (1310–1560, Contactos, #camE1) y #mE2 (2030–2280, el tablero y quién reaccionó, #camE2), de escritorio.mp4
            - cada tramo de video es un <video> con su data-media-start, todos a 1×; los cortes caen en esperas, esqueletos, cargadores y saltos
              de la grabación, y cada toque real cae en su pulso (tabla en REVIEW.md). Las marcas de toque (.toque/.onda) van en las coordenadas
              reales del toque (pasos.json → toques[], px del video × el factor de la ventana)

    <script>
      // ── Un solo lugar para el formato (SPEC §1.4) ──────────────────────────────────────────────────────────────────────

        fps: 30,
        cel: { w: 720, h: 900, hVis: 900 }, // --f-k = 720/1170; --f-grab-alto = 1558.15px
        esc: { w: 1440, h: 760, hVis: 760 }, // K = 1440/1920 = 0,75; alto de la grabación ajustada = 810
        grabCel: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // celular 390×844 a 3×
        grabEsc: { w: 1920, h: 1080, cssW: 1280 }, // escritorio 1280×720 a 1,5×
        latigoH: 1920, // la tira horizontal entre escenarios
        cambio: { escala: 0.92, x: 24, origen: '100% 50%' }, // la ventana del celular se hace a un lado (2524–2538)
        barraApp: 150, // la barra de abajo de la app en px de la ventana a G (75 px CSS × 2,003): «Datos de ejemplo» sube encima mientras se toca
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos

        // Una ventana: W (ancho), HV (alto visible), K (px del video → px de la ventana), PPC (px de la ventana por px CSS de la app) y VH (alto
        // de la grabación ajustada). enc(s, cx, cy): la caja con centro (cx, cy) en px CSS de la app, centrada en lo visible con la escala s, sin
        // salirse de la grabación.
        function ventana(v, g) {
          const W = v.w, HV = v.hVis, K = W / g.w, PPC = W / g.cssW, VH = g.h * K;
          const enc = (s, cx, cy) => {
            let x = W / 2 - s * cx * PPC, y = HV / 2 - s * cy * PPC;
            x = Math.min(0, Math.max(W - s * W, x));
            y = Math.min(0, Math.max(HV - s * VH, y));
            return { scale: s, x, y };
          };
          const enVentana = (e, vx, vy) => ({ x: e.x + e.scale * vx * K, y: e.y + e.scale * vy * K });
          return { W, HV, K, PPC, VH, enc, enVentana };
        }
        const CEL = ventana(KD.cel, KD.grabCel);
        const ESC = ventana(KD.esc, KD.grabEsc);
        const enc = CEL.enc, encE = ESC.enc;
        // La app saltó d px CSS (positivo = el contenido baja): la cámara lo deshace en el mismo cuadro y nada se mueve en pantalla.
        const comp = (e, d) => ({ scale: e.scale, x: e.x, y: e.y - e.scale * CEL.PPC * d });

        // Los encuadres, medidos sobre los cuadros reales (px CSS: 390×844 el celular, 1280×720 el escritorio). Niveles de SPEC §1.5; REVIEW §4.
        // G = 1,085 deja ver 359 × 449 px CSS; D = 1,8 deja ver 711 × 375.
        const E = {
          // ── Parte 1: los del clip con s' = max(s, 1,085) y los centros subidos donde hay compensación (SPEC §2.1) ──
          inicio: enc(1.085, 195, 224.5),
          reacciones: enc(1.085, 195, 500),
          tarjeta: enc(1.4, 150, 540),
          evento: enc(1.085, 195, 229.4),
          datos: enc(1.12, 186, 428),
          inscripcion: enc(1.12, 195, 550),
          quienes: enc(1.18, 193, 561),
          form: enc(1.085, 195, 540),
          botonesForm: enc(1.18, 193, 561),
          resultado: enc(1.085, 195, 543),
          verBoleta: enc(1.085, 195, 543),
          boleta: enc(1.085, 195, 354.6),
          qr: enc(1.3, 195, 456),
          grande: enc(1.085, 195, 400),
          cerrarK: enc(1.085, 195, 508), // G, CSS 284–733: el QR de abajo, «Gabriela Hinestroza Perea», «FM75UZ», «Congreso de Jóvenes» y «Cerrar» (647–687) por encima de «Datos de ejemplo»
          // ── Parte 2, celular ──
          boletas: enc(1.085, 195, 620), // G, CSS 395–844: el QR de abajo, «Código FM75UZ», «Descargar la boleta» y la barra con «Comunidades»
          vacio: enc(1.085, 195, 345), // G, CSS 121–570: «Grupos de tu iglesia…», las pestañas, «Todavía no estás en una comunidad» y «Explorar comunidades» encima de la píldora; después del 903, Explorar con Matrimonios
          jovenesCard: enc(1.085, 195, 441), // G, CSS 217–666: la tarjeta de Jóvenes entera (la portada, el texto, «Miembros: 22» y «Unirme»)
          comunidad: enc(1.085, 195, 360), // G, CSS 136–585: la portada, «Jóvenes», «Miembros: 22», el texto y «Unirme» encima de la píldora
          lideres: enc(1.085, 195, 620), // G, CSS 395–844: «Unirme», «Conectar con un líder» y «Líderes» con Andrés y David; después del 1082, sin «Unirme»
          dialogo: enc(1.085, 195, 441), // G, CSS 217–666: el diálogo entero (245–597) y, después del 1263, «Pediste conectar con un líder» con el confeti
          acompana: enc(1.085, 195, 470), // G, CSS 246–695: «Jóvenes», «Miembros: 23», la tarjeta «… te acompañará» y «Líderes» con Andrés
          acompanaM: enc(1.3, 186, 515), // ×1,3, CSS 36–336 × 328–702: el contenido de la tarjeta (471–559; el avatar y el texto van de x 44 a 326), «Andrés Felipe Restrepo Gómez te acompañará» a 34 px (en M = 1,4 no cabe)
          barraC2: enc(1.085, 195, 620), // G, CSS 395–844: la tarjeta, «Líderes» y la barra con «Objetivos»
          objetivos: enc(1.085, 195, 300), // G, CSS 76–525: «Mis objetivos» y la tarjeta del devocional con «Paso 13 de 14 · 86 %», «Hoy · Servir», «Lo hice»
          objetivo: enc(1.085, 195, 330), // G, CSS 106–555: el anillo, «Paso 13 de 14 · 86 %», «Hoy · Servir · Marcos 10:45…», «Lo hice»
          anillo: enc(1.2, 180, 230), // ×1,2, CSS 18–343 × 27–433: el anillo (19–99), «Un devocional cada mañana» (hasta el x 341), «Paso 14 de 14 · 93 %» y «¡Listo! Marcamos «Servir» como hecho.» a 31 px
          pasos: enc(1.085, 195, 490), // G, CSS 266–715: «Todos los pasos» con Perdón, La palabra, Gozo, Servir «Hoy» y Esperanza «Mañana»
          portada: enc(1.085, 195, 425), // G, CSS 201–650: el logo (227–284), «Hola, Lucía», «Hoy empieza algo hermoso», el texto y el botón (552–607); «5 pasos cortos» (622–627) queda a medias bajo la píldora
          camino: enc(1.085, 195, 300), // G, CSS 76–525: «Tus primeros pasos» (84–105), su texto y los tres primeros pasos con el comienzo del cuarto
        };
        const EE = {
          // ── Parte 2, escritorio (D = 1,8; D⁺ = 2,0) ──
          fila: encE(1.8, 560, 540), // D, CSS 205–916 × 345–720: las filas de Isabella, María José y Gabriela, con «hace 1 min» y su mensaje a la derecha de la píldora
          tomar: encE(1.8, 770, 540), // D, CSS 415–1126 × 345–720: su mensaje y «Tomar»
          detalle: encE(1.8, 690, 361), // D, CSS 335–1046 × 174–549: el detalle entero (360–920 × 200–522)
          detalleCerca: encE(2.0, 650, 361), // D⁺, CSS 330–970 × 192–530: el detalle, «Lo tomó Andrés Felipe Restrepo Gómez», su mensaje y los botones
          cifras: encE(1.8, 500, 460), // D, CSS 145–856 × 273–648: 21 bienvenidas, 41 objetivos, 66 %, 90 en comunidades, 33 % y 730 inscritos
          tabla: encE(1.8, 512, 350), // D, CSS 157–868 × 163–538: «Las 21 más recientes» con «Inscripciones abiertas» primera y su alcance (1.324)
          quien: encE(1.8, 505, 540), // D, CSS 150–861 × 345–720: «Quién reaccionó», «Todas · 57», 👍 42, 8, 2, 🙌 5
          gabrielaLista: encE(1.9, 500, 620), // ×1,9, CSS 163–837 × 364–720: los botones y «Gabriela Hinestroza Perea 🙌» primera
        };

        const CAM = { ease: 'power2.inOut', d: F(14) };
        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, n, d) => tl.to(sel, { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        // ── Parte 1: la cámara del clip (un movimiento por compás, ninguno mientras la app se desplaza) ──
        tl.set('#cam', E.inicio, 0);
        mover('#cam', E.reacciones, 90);
        mover('#cam', E.tarjeta, 150);
        tl.set(['#camT1', '#camT2'], E.tarjeta, 0); // las capas del iris, con el encuadre fijo de la tarjeta
        tl.set('#cam', E.evento, F(180)); // el iris descubre el evento ya encuadrado
        mover('#cam', E.datos, 240);
        mover('#cam', E.inscripcion, 330);
        tl.set('#cam', comp(E.inscripcion, -200), F(389)); // la app subió 200 px (grab. 701–704): compensado
        mover('#cam', E.quienes, 390);
        tl.set('#cam', comp(E.quienes, -136), F(464)); // la app subió 136 px (grab. 814): compensado
        mover('#cam', E.form, 465);
        mover('#cam', E.botonesForm, 570);
        mover('#cam', E.resultado, 600);
        tl.set('#cam', comp(E.resultado, -84), F(645)); // la app subió 84 px (grab. 1257): compensado
        mover('#cam', E.verBoleta, 646, F(13));
        tl.set('#cam', E.boleta, F(662)); // el corte sobre el toque: «Mis boletas» llega encuadrada
        mover('#cam', E.qr, 690, F(9)); // el punch
        mover('#cam', E.grande, 720);
        mover('#cam', E.cerrarK, 780); // compás 14: entra «Cerrar»

        // El corte del 662: «Mis boletas» entra 1,03 → 1,00 desde el centro de lo visible (el aterrizaje del clip).
        const o = { x: (CEL.W / 2 - E.boleta.x) / E.boleta.scale, y: (CEL.HV / 2 - E.boleta.y) / E.boleta.scale };
        tl.fromTo('#m1in', { scale: 1.03, transformOrigin: `${o.x.toFixed(1)}px ${o.y.toFixed(1)}px` },
          { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(662));

        // Iris del 180 desde «Inscribirme» de la tarjeta: el círculo vive en las coordenadas de la cámara del evento.
        const ix = ((E.tarjeta.x + E.tarjeta.scale * 325 * CEL.K - E.evento.x) / E.evento.scale).toFixed(1);
        const iy = ((E.tarjeta.y + E.tarjeta.scale * 1531 * CEL.K - E.evento.y) / E.evento.scale).toFixed(1);
        const circ = (r) => `circle(${r}px at ${ix}px ${iy}px)`;
        tl.set('#iris1', { clipPath: circ(0) }, 0);
        tl.fromTo('#iris1', { clipPath: circ(0) }, { clipPath: circ(1900), duration: F(5), ease: 'power2.out', immediateRender: false }, F(180));
        tl.set('#iris1', { clipPath: 'none' }, F(186));

        // ── Parte 2: las cámaras (cada `set` cae en un corte o en un salto de la app; cada `mover`, en un pulso) ──
        tl.set('#camC1', E.boletas, 0);
        tl.set('#camC1', E.vacio, F(873)); // el corte a Comunidades
        tl.set('#camC1', E.jovenesCard, F(930)); // la app saltó a Jóvenes (rec 412): el encuadre cambia con ella, en el mismo cuadro
        tl.set('#camC1b', E.comunidad, 0);
        mover('#camC1b', E.lideres, 1020); // «Unirme», «Conectar» y Andrés en «Líderes»; quieta en el toque (1080) y el confeti
        tl.set('#camC1b', E.dialogo, F(1143)); // el diálogo (corte con causa); quieta mientras se escribe (1171–1251)
        tl.set('#camC2', E.acompana, 0);
        mover('#camC2', E.acompanaM, 1575, F(9)); // el punch sobre «… te acompañará»
        mover('#camC2', E.barraC2, 1620);
        tl.set('#camC2', E.objetivos, F(1683)); // el corte a «Mis objetivos»
        tl.set('#camC2', E.objetivo, F(1743)); // el corte al objetivo
        mover('#camC2', E.anillo, 1860); // el anillo y «93 %»
        tl.set('#camC2', E.pasos, F(1920)); // la app saltó a «Todos los pasos» (rec 2085): el encuadre cambia con ella
        tl.set('#camC3', E.portada, 0);
        tl.set('#camC3', E.camino, F(2403)); // el corte al camino; quieta hasta el cierre
        tl.set('#camE1', EE.fila, 0);
        mover('#camE1', EE.tomar, 1350);
        tl.set('#camE1', EE.detalle, F(1383)); // el corte al detalle
        mover('#camE1', EE.detalleCerca, 1440);
        tl.set('#camE2', EE.cifras, 0);
        tl.set('#camE2', EE.tabla, F(2100)); // la app saltó a la tabla (rec 1248): el encuadre cambia con ella
        tl.set('#camE2', EE.quien, F(2163)); // el corte a «Quién reaccionó»
        mover('#camE2', EE.gabrielaLista, 2235); // su nombre, primero de la lista

        // «Datos de ejemplo» sube encima de la barra de la app mientras se toca «Comunidades» (841–872; los dos cambios caen en cortes)
        tl.set('#datos-cel', { y: -KD.barraApp }, F(841));
        tl.set('#datos-cel', { y: 0 }, F(873));

        // ── Aterrizajes de los látigos: la ventana que llega se asienta 1,04 → 1,00 desde su centro ──
        const centroCel = `${CEL.W / 2}px ${CEL.HV / 2}px`;
        const centroEsc = `${ESC.W / 2}px ${ESC.HV / 2}px`;
        const aterriza = (sel, origen, n) =>
          tl.fromTo(sel, { scale: 1.04, transformOrigin: origen }, { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(n));
        aterriza('#mE1in', centroEsc, 1320);
        aterriza('#mC2in', centroCel, 1560);
        aterriza('#mE2in', centroEsc, 2040);
        aterriza('#mC3in', centroCel, 2280);

        // ── El iris del 960: nace en la ventana donde está la portada tocada, con el encuadre viejo; dentro, la comunidad ya encuadrada ──
        const iris = (sel, e, vx, vy, n) => {
          const p = CEL.enVentana(e, vx, vy);
          const c = (r) => `circle(${r}px at ${p.x.toFixed(1)}px ${p.y.toFixed(1)}px)`;
          tl.set(sel, { clipPath: c(0) }, 0);
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(1900), duration: F(5), ease: 'power2.out', immediateRender: false }, F(n));
          tl.set(sel, { clipPath: 'none' }, F(n + 6));
        };
        iris('#irisC1', E.jovenesCard, 585, 990, 960);

        // ── Látigos horizontales (#escena, 1920 px, 10 cuadros): a la izquierda = al escritorio, a la derecha = de vuelta ──
        tl.fromTo('#escena', { x: 0 }, { x: -KD.latigoH, duration: F(10), ease: 'power3.inOut', immediateRender: false }, F(1310));
        tl.to('#escena', { x: 0, duration: F(10), ease: 'power3.inOut' }, F(1550));
        tl.to('#escena', { x: -KD.latigoH, duration: F(10), ease: 'power3.inOut' }, F(2030));
        tl.to('#escena', { x: 0, duration: F(10), ease: 'power3.inOut' }, F(2270));

        // ── Marcas de toque: aparecen 4 cuadros antes (la del 180 en el 165 y espera quieta), se hunden en el cuadro; la onda nace en el cuadro.
        // Todas se van con su corte (toque → cuadro del corte), porque la pantalla cambia antes de que la marca se vaya sola.
        const CORTE = {
          180: 181, 375: 377, 450: 452, 600: 602, 660: 662, 720: 722, 840: 841,
          870: 873, 900: 903, 960: 961, 1080: 1082, 1140: 1143, 1260: 1263, 1380: 1383,
          1680: 1683, 1740: 1743, 1800: 1803, 2160: 2163, 2220: 2223, 2400: 2403,
        };
        [...@@KTOQUES@@, 180, ...@@TOQUES@@].forEach((n) => {
          const t = F(n);
          const antes = n === 180 ? 15 : 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });

        // ── El final: la ventana del celular se hace a un lado (2524–2538), el dip (2757–2759) y el corte al cierre (2760) ──
        tl.to('#ventana-cel', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(2524));
        tl.set('#dip', { opacity: 0.4 }, F(2757));
        tl.set('#escena', { autoAlpha: 0 }, F(2760));
        tl.set({}, {}, 97);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
