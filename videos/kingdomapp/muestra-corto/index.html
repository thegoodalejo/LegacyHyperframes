<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Muestra del kit de identidad de Kingdom (9:16)</title>
    <!-- Prueba del kit v1 en vertical: una escena de Corto con los componentes de kit.css → cierre de marca del Corto.
         No es un video para publicar. Antes: npm run kit (monta ../_identidad en identidad/ con el sonido de marca). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />
    <link rel="stylesheet" href="identidad/kit.css" />
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #060d1f; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #060d1f; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-start="0" data-width="1080" data-height="1920" data-duration="5.5">
      <div id="gancho" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="3" data-track-index="0" data-width="1080" data-height="1920"></div>

      <div id="cierre-corto" data-composition-id="cierre-corto" data-composition-src="identidad/cierre-corto.html"
        data-variable-values='{"llamado":"prueba","fondo":"azul","idioma":"es"}'
        data-start="3" data-duration="2.5" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Sonido de marca: inicio del cierre + 0,38 s (identidad/kit.json). -->
      <audio id="marca-corto" src="identidad/audio/sonido-marca.wav" data-start="3.38" data-duration="2.1" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 5.5);
      window.__timelines['root'] = tl;
    </script>
  </body>
</html>
