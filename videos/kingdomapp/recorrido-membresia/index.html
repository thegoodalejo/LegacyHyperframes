      GENERADO por _gen/gen.py desde _gen/index.tpl.html (los tramos, las marcas, los sonidos y los textos están en gen.py).
      Estructura:
        · compositions/fondo.html                 la noche del sitio (el halo se asienta en cada mundo)
        · compositions/frase-1..9, ceja-1..5      los textos, cada uno en su lugar (celular: a la izquierda; escritorio: arriba)
        · #ventana                                UNA .k-ventana que cambia de forma: celular 720×900 en (1104, 90) ↔ escritorio 1440×760 en
                                                  (240, 260) (morph en 1074–1086, 1554–1566 y 2274–2286). Dentro, cuatro mundos centrados:
            #w-cel1  acto 1 (0–1079), el del clip tal cual (G1 y G2): #cam, la tira del látigo 176–186, los iris 120, 375 y 780
            #w-r1    C1 Coordinar (1080–1559), escritorio, coordinar.mp4 a 2 px por px CSS (D) en #cam-r1
            #w-cel2  C2 Semáforo (1560–1919) y C3 Discipulado (1920–2279), celular: #tira2 con dos ranuras y el látigo vertical 1914–1924
            #w-r4    C4 Tableros (2280–2759), escritorio: la página sin desplazar (capa A) y la desplazada 453 px CSS (capa B, encima, sin su
                     barra fija): la cámara recorre una sola página
        · identidad/cierre-comercial.html         el cierre del kit (92,0–97,0); campanas en el 92,38
      La cámara es scale + x/y sobre un envoltorio; el <video> nunca se transforma ni se busca. Los encuadres (enc*) centran cajas de
      pasos*.json y líneas medidas en las grabaciones (REVIEW.md §3).
    -->

        position: absolute;
        left: 0;
        top: calc(var(--f-ventana-hvis) - var(--f-grab-alto));

        height: var(--f-grab-alto);
      }

        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: calc(3984px * var(--f-k));
      }
      #iris3 {
        height: 100%;

        position: absolute;
        left: 0;
        width: 100%;
        height: var(--f-grab-alto);
      }
      #m3pre,
      #m3abierta {
        top: 0;
      }
      #m3post {
        top: calc(1452px * var(--f-k));
      }
      #m3abierta {
        clip-path: inset(0 0 calc(var(--f-grab-alto) - 2300px * var(--f-k)) 0);
      }
      .mundo video,
      .mundo img,
      .capa video,
      .iris {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;

      .iris,
      .capa {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--f-grab-alto);

        height: 1900px;

    <script>
      window.KD = {
        fps: 30,
        cel: { l: 1104, t: 90, w: 720, h: 900, r: 28 }, // .k-ventana-16x9
        esc: { l: 240, t: 260, w: 1440, h: 760, r: 20 }, // .k-ventana-escritorio
        grabacion: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // el celular grabado a 3×
        latigo: 1000, // --f-latigo
        G16: 1.083333, // el plano de reposo del celular: 360 px CSS de ancho visible (2,0 px por px CSS; SPEC §1.4)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps;
        const W = KD.cel.w, HV = KD.cel.h;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular al ajustar al ancho (1,846)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)
        const OFF2 = HV - VH; // #m2in top
        const g = (sc) => Math.max(KD.G16, sc); // del clip al recorrido: el ancho visible se conserva, con piso G16
        const clamp01 = (v) => Math.min(1, Math.max(0, v));

        // ── Encuadres ─────────────────────────────────────────────────────────────────────────────────────────────────
        // Acto 1 (como el clip): la caja (centro en px CSS del celular) en el centro de la ventana, sin salirse de la grabación.
        function enc(sc, cx, cy, off) {
          const s = g(sc);
          const rx = cx * PPC, ry = cy * PPC + off;
          let x = W / 2 - s * rx, y = HV / 2 - s * ry;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(-s * off, Math.max(HV - s * (VH + off), y));
          return { scale: s, x, y };
        }
        const D3 = 484; // la ficha desplazada (px CSS)
        const VH3 = (D3 + KD.grabacion.cssH) * PPC;
        function enc3(sc, cx, cy) {
          const e = enc(sc, cx, cy, 0);
          e.y = Math.min(0, Math.max(HV - e.scale * VH3, HV / 2 - e.scale * cy * PPC));
          return e;
        }
        // Celular de C2 y C3 (cada ranura con su cámara): escala sobre el ajuste al ancho; G16 1,0833 · F16 1,1504 · M16 1,3978 · C16 1,7972.
        const NIV = { G: 1.083333, F: 1.1504, M: 1.3978, C: 1.7972 };
        function encC(nv, cx, cy) {
          const s = typeof nv === 'number' ? nv : NIV[nv];
          let x = W / 2 - s * PPC * cx, y = HV / 2 - s * PPC * cy;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(0, Math.max(HV - s * VH, y));
          return { scale: s, x, y };
        }
        // Escritorio (C1 y C4): p = px de la ventana por px CSS; D = 2 (escala 1 del video de 2560), D⁺ = 2,25 (1,125). Nunca la pantalla entera.
        const WE = KD.esc.w, HE = KD.esc.h;
        function encE(nv, cx, cy, altoDoc) {
          const p = nv === 'D+' ? 2.25 : 2;
          let x = WE / 2 - p * cx, y = HE / 2 - p * cy;
          x = Math.min(0, Math.max(WE - p * 1280, x));
          y = Math.min(0, Math.max(HE - p * (altoDoc || 720), y));
          return { scale: p / 2, x, y };
        }

        const E1 = {
          arriba: enc(1, 195, 219, 0),
          apellidos: enc(1, 195, 419.4, 0),
          registrar: enc(1, 195, 530.6, 0),
        };
        const E2 = {
          tarjeta: enc(1, 195, 844, OFF2),
          tarjetaM: enc(1.4, 195, 530, OFF2),
          despues: enc(1.8, 126, 592, OFF2),
          pregunta: enc(1.4, 175, 320, OFF2),
          observaciones: enc(1.4, 185, 558, OFF2),
          botones: enc(1.3, 205, 673, OFF2),
          resultado: enc(1.35, 211, 480, OFF2),
          ahora: enc(1.5, 195, 372, OFF2),
        };
        const E3 = {
          fila: enc(1.15, 195, 642.75, 0),
          paso: enc3(1.15, 195, D3 + 350.75),
          objetivos: enc3(1.08, 195, D3 + 414),
          avance: enc3(1.1504, 195, D3 + 351), // F16: de «Avance» a la primera entrada del historial (CSS desplazado 139–563)
          historial: enc3(1.1504, 195, D3 + 565), // F16: «Historial de pasos» y sus cuatro entradas (485–674) con «Objetivos» arriba
        };
        // C1 · Coordinar (px CSS de coordinar.mp4: viewport 1280×720)
        const ER1 = {
          resumen: encE('D', 502, 238), // las pestañas y la primera fila de indicadores, «Nuevos sin Acompañante» a la derecha
          repartir: encE('D', 864, 330), // «Repartir» y las cuatro primeras filas (lado derecho: «Asignar»)
          dialogo: encE('D+', 640, 360), // el diálogo «Repartir» (CSS 400–880 × 250–470)
          resultado: encE('D+', 484, 300), // «Todos los nuevos tienen quién los acompañe.» y «Se repartieron 257 personas.»
          acomp3: encE('D', 528, 435), // las tres primeras filas de «Quienes acompañan»
          acomp2: encE('D+', 504, 385), // las dos primeras: «Acompaña a 11 de 12 · Red Timoteo» y su barra
          acomp4: encE('D', 528, 490), // las cuatro primeras filas: cada uno con «Acompaña a N de 12» y su carga
        };
        // C2 · Semáforo (px CSS de semaforo.mp4: 390×844)
        const ER2 = {
          lista: encC('G', 195, 375), // «Agregar filtro», «1.324 de 1.324» y seis filas con su punto de color
          tipos: encC('F', 195, 330), // la hoja «Agregar filtro»: «Semáforo de actividad» en el centro
          colores: encC('F', 195, 715), // el editor: los cuatro colores con sus días, «Cancelar» y «Aplicar»
          filtrada: encC('G', 195, 420), // el chip «Semáforo de actividad: Rojo», «62 de 1.324» y cinco filas rojas
          chip: encC(1.7, 152, 392), // «Actividad: Rojo · hace 31 días» a 44 px (texto CSS 44–256: C16 cortaría «días»)
          acciones: encC('M', 165, 440), // el chip, «Llamar» y «WhatsApp»
        };
        // C3 · Discipulado (px CSS de discipulado.mp4)
        const ER3 = {
          cabezas: encC('G', 195, 345), // «Discipulado» activo, «Quienes encabezan la pirámide (1)» y la cabeza entera (CSS 421–523)
          cabeza: encC('M', 165, 405), // «Quienes encabezan la pirámide (1)» y la cabeza: «Pr Andrés … y Pr Carolina …», «24 directos · 725 en total» (debajo, la página vacía de la app)
          raiz: encC('F', 185, 484), // la raíz abierta (CSS 382–586; el texto va de x 24 a 330: F16, M16 lo cortaría)
          directos: encC('M', 175, 670), // «24 directos · 725», «Sus discípulos directos (12)» y el primero que discipula (toque en 690)
          nivel: encC('G', 195, 520), // un nivel más abajo: las migas, la raíz «12 directos · 162 en total» y «Sus discípulos directos (7)»
          migas: encC('F', 180, 372), // las migas enteras (CSS 24–336 × 345–400): F16, no C16 (C16 las cortaría)
        };
        // C4 · Tableros (px CSS de la página: la capa B empieza 453 px más abajo; altoDoc 1173 desde el 2520)
        const ER4 = {
          cifras: encE('D', 470, 265), // «Tableros», las vistas, «Toda la iglesia» y las cifras: Membresía 1.324 (+49,8 %) … En rojo en la ruta
          semaforo: encE('D', 470, 530), // «Semáforo de actividad»: la explicación, la barra y «Verde · Amarillo · Rojo · Sin actividad»
          rojo: encE('D+', 900, 551), // el otro lado de las mismas filas: la barra y 954 · 165 · 62 · 143 con su %
          descarga: encE('D', 860, 300), // «Últimos 180 días», la descarga y las cifras
          crecimiento: encE('D', 540, 815, 1173), // «Crecimiento (membresía)» (doc 710–917)
          final: encE('D+', 900, 820, 1173), // el tramo final de la curva y «30 de oct de 2026»
          abre: encE('D', 696, 800, 1173), // la gráfica abierta: el título, «2.000», la curva y las fechas
        };

        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, n, d) => tl.to(sel, { ...e, duration: F(d || 14), ease: 'power2.inOut' }, F(n));

        // ── Estado inicial ─────────────────────────────────────────────────────────────────────────────────────────────
        ['#w-cel1', '#w-r1', '#w-cel2', '#w-r4'].forEach((sel, i) => {
          tl.set(sel, { xPercent: -50, yPercent: -50, x: 0, scale: 1, opacity: i === 0 ? 1 : 0 }, 0);
        });
        tl.set('#cam', E1.arriba, 0);
        tl.set('#cam-r1', ER1.resumen, 0);
        tl.set('#cam-r2', ER2.lista, 0);
        tl.set('#cam-r3', ER3.cabezas, 0);
        tl.set('#cam-r4', ER4.cifras, 0);

        // ── Acto 1 (cuadros del clip; SPEC §2.1) ───────────────────────────────────────────────────────────────────────
        mover('#cam', E1.apellidos, 46);
        mover('#cam', E1.registrar, 108, 12);
        mover('#cam', E1.arriba, 150);
        mover('#cam', E2.tarjetaM, 240);
        mover('#cam', E2.despues, 300);
        mover('#cam', E2.tarjeta, 345);
        mover('#cam', E2.pregunta, 390);
        mover('#cam', E2.observaciones, 480);
        mover('#cam', E2.botones, 570);
        mover('#cam', E2.resultado, 600);
        mover('#cam', E2.ahora, 660, 9); // punch
        mover('#cam', E2.tarjeta, 720);
        mover('#cam', E3.fila, 810);
        mover('#cam', E3.paso, 840);
        mover('#cam', E3.objetivos, 900);
        mover('#cam', E3.avance, 960);
        mover('#cam', E3.historial, 1020); // lo nuevo: la ficha cuenta lo que ya pasó con Valeria

        // ── C1 · Coordinar ─────────────────────────────────────────────────────────────────────────────────────────────
        mover('#cam-r1', ER1.repartir, 1170);
        mover('#cam-r1', ER1.dialogo, 1230);
        mover('#cam-r1', ER1.resultado, 1320, 9); // punch con el resultado
        mover('#cam-r1', ER1.acomp3, 1395);
        mover('#cam-r1', ER1.acomp2, 1440);
        mover('#cam-r1', ER1.acomp4, 1500);
        // ── C2 · Semáforo ──────────────────────────────────────────────────────────────────────────────────────────────
        mover('#cam-r2', ER2.tipos, 1635);
        mover('#cam-r2', ER2.colores, 1665); // con el toque: el editor aparece (1668) abajo, fuera del encuadre de la hoja; la cámara baja con él
        mover('#cam-r2', ER2.filtrada, 1755);
        mover('#cam-r2', ER2.chip, 1860, 9); // punch
        mover('#cam-r2', ER2.acciones, 1890);
        // ── C3 · Discipulado ───────────────────────────────────────────────────────────────────────────────────────────
        mover('#cam-r3', ER3.cabeza, 1980);
        mover('#cam-r3', ER3.raiz, 2055);
        mover('#cam-r3', ER3.directos, 2100);
        mover('#cam-r3', ER3.nivel, 2175);
        mover('#cam-r3', ER3.migas, 2220);
        // ── C4 · Tableros ──────────────────────────────────────────────────────────────────────────────────────────────
        mover('#cam-r4', ER4.semaforo, 2340);
        mover('#cam-r4', ER4.rojo, 2400, 9); // punch
        mover('#cam-r4', ER4.descarga, 2460);
        mover('#cam-r4', ER4.crecimiento, 2520); // el desplazamiento de la app (capa B) queda dentro de este movimiento
        mover('#cam-r4', ER4.final, 2580);
        mover('#cam-r4', ER4.abre, 2700);

        // ── Iris desde el toque: el círculo nace en el punto tocado (px locales del contenedor) ────────────────────────────
        const iris = (sel, x, y, n) => {
          const c = (r) => `circle(${r}px at ${x.toFixed(1)}px ${y.toFixed(1)}px)`;
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(2600), duration: F(5), ease: 'power2.out' }, F(n));
          tl.set(sel, { clipPath: 'none' }, F(n + 6));
        };
        iris('#iris1', 931 * K, 2184 * K, 120);
        iris('#iris2', 671 * K, 2136 * K, 375);
        iris('#iris3', 510 * K, (1476 + OFF2 / K) * K, 780);
        iris('#r1-iris', 1149 * 2, 237 * 2, 1200);
        iris('#r2-iris', 585 * K, 1251 * K, 1800);
        iris('#r3-iris1', 519 * K, 1416 * K, 2040);
        iris('#r3-iris2', 519 * K, (2049 + 21) * K, 2160);

        // ── Látigos: una tira que sube ─────────────────────────────────────────────────────────────────────────────────
        tl.fromTo('#tira', { y: 0 }, { y: -KD.latigo, duration: F(10), ease: 'power3.inOut' }, F(176));
        tl.fromTo('#m2in', { scale: 1.04, transformOrigin: `${W / 2}px ${HV / 2 - OFF2}px` }, { scale: 1, duration: F(10), ease: 'power3.out' }, F(180));
        tl.set('#m2', { overflow: 'visible' }, F(186));
        tl.fromTo('#tira2', { y: 0 }, { y: -KD.latigo, duration: F(10), ease: 'power3.inOut' }, F(1914));
        tl.fromTo('#ranura-r3', { scale: 1.04, transformOrigin: '50% 50%' }, { scale: 1, duration: F(10), ease: 'power3.out' }, F(1920));

        // ── Morph: la ventana cambia de aparato (SPEC §1.5). Valores calculados por cuadro y unidos en línea recta (seek-safe y con
        //    desenfoque de movimiento entre cuadros). El mundo que se va y el que llega se escalan desde el centro lo justo para
        //    cubrir la ventana en cada cuadro (más su corrimiento de ±160 px): nunca se ve el fondo de la ventana. ──────────────
        const io3 = gsap.parseEase('power3.inOut'), in3 = gsap.parseEase('power3.in'), out3 = gsap.parseEase('power3.out');
        const caja = (A, B, p) => ({ left: A.l + (B.l - A.l) * p, top: A.t + (B.t - A.t) * p, width: A.w + (B.w - A.w) * p,
          height: A.h + (B.h - A.h) * p, borderRadius: A.r + (B.r - A.r) * p });
        function morph(golpe, A, B, sale, entra) {
          const est = (f) => caja(A, B, io3(clamp01((f - (golpe - 6)) / 12)));
          for (let f = golpe - 6; f < golpe + 6; f++) {
            tl.fromTo('#ventana', est(f), { ...est(f + 1), duration: F(1), ease: 'none', immediateRender: false }, F(f));
          }
          const nat = (sel) => (sel === '#w-r1' || sel === '#w-r4' ? KD.esc : KD.cel);
          const sal = (f) => {
            const v = est(f), n = nat(sale), dx = -160 * in3(clamp01((f - (golpe - 6)) / 6));
            return { x: dx, scale: Math.max(1, (v.width / 2 + Math.abs(dx)) / (n.w / 2), v.height / n.h) };
          };
          for (let f = golpe - 6; f < golpe; f++) {
            tl.fromTo(sale, sal(f), { ...sal(f + 1), duration: F(1), ease: 'none', immediateRender: false }, F(f));
          }
          tl.set(sale, { opacity: 0 }, F(golpe)); // corte duro de contenido en el cuadro más rápido del morph
          tl.set(entra, { opacity: 1 }, F(golpe));
          const ent = (f) => {
            const v = est(f), n = nat(entra), q = out3(clamp01((f - golpe) / 10)), dx = 160 * (1 - q), e = 1.04 - 0.04 * q;
            return { x: dx, scale: e * Math.max((v.width / 2 + dx) / (n.w / 2), v.height / n.h) };
          };
          for (let f = golpe; f < golpe + 10; f++) {
            tl.fromTo(entra, ent(f), { ...ent(f + 1), duration: F(1), ease: 'none', immediateRender: false }, F(f));
          }
        }
        morph(1080, KD.cel, KD.esc, '#w-cel1', '#w-r1');
        morph(1560, KD.esc, KD.cel, '#w-r1', '#w-cel2');
        morph(2280, KD.cel, KD.esc, '#w-cel2', '#w-r4');

        // ── Marcas de toque: 4 cuadros antes aparece, en el cuadro se hunde, 6 después se va; la onda nace en el cuadro (450 ms) ──
        [60, 90, 105, 120, 150, 375, 450, 495, 600, 780, 840, 1140, 1200, 1290, 1380, 1620, 1665, 1710, 1740, 1800, 2040, 2160, 2490].forEach((n) => {
          const t = F(n);
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out' }, t - F(4));
          tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
          tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
          tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
        });

        // ── Dip (2757–2759) y corte al cierre (2760) ──────────────────────────────────────────────────────────────────
        tl.set('#dip', { opacity: 0.4 }, F(2757));
        tl.set('#ventana', { opacity: 0 }, F(2760));
        tl.set({}, {}, 97);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
</html>
