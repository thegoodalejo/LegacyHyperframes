<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- P1 · Frase 1: «¿Quién cubre / el domingo?» (host 0–122). Una landing por pulso: «¿Quién» 0 · «cubre» 15 · «el» 30 · «domingo?» 45 (entrada-palabra: blur 6 → 0 + opacidad, 4 cuadros, power4.out, sin desplazarse). Sale entera 117–121. Posición y tamaño: --f-* del host (SPEC §1.4). -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: var(--f-ancho, 1080px);
          height: var(--f-alto, 1350px);
          overflow: hidden;
        }
        .f-frase {
          position: absolute;
          left: var(--f-margen-x, 96px);
          top: var(--f-frase-y, 124px);
          width: var(--f-frase-ancho, 888px);
          font-size: var(--f-frase-px, 80px);
          color: var(--k-noche-tinta);
          text-wrap: initial;
        }
        .linea {
          display: block;
          white-space: nowrap;
        }
        .palabra {
          display: inline-block;
        }
      </style>
      <div data-hf-id="hf-3ni2" id="root" data-composition-id="frase-1" data-width="1080" data-height="1350" data-duration="4.066667">
        <div data-hf-id="hf-juan" class="k-feed-frase f-frase" id="f1">
          <span data-hf-id="hf-wqic" class="linea"><span data-hf-id="hf-sck1" class="palabra" id="f1-w1">¿Quién</span> <span data-hf-id="hf-hg86" class="palabra" id="f1-w2">cubre</span></span>
          <span data-hf-id="hf-w2fg" class="linea"><span data-hf-id="hf-8uur" class="palabra" id="f1-w3">el</span> <span data-hf-id="hf-3ixf" class="palabra" id="f1-w4">domingo?</span></span>
        </div>
      </div>
      <script>
        (function () {
          const F = (n) => n / 30;
          const tl = gsap.timeline({ paused: true });
          // «¿Quién» ya está en el cuadro 0 (la miniatura). Cada landing arranca un cuadro antes de su pulso (15 · 30 · 45): en el pulso la
          // palabra ya está al 68 % (power4.out), así el primer cuadro visible es el pulso.
          [['#f1-w2', 15], ['#f1-w3', 30], ['#f1-w4', 45]].forEach(([sel, n]) => {
            tl.fromTo(sel, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: F(4), ease: 'power4.out' }, F(n - 1));
          });
          tl.to('#f1', { opacity: 0, filter: 'blur(8px)', duration: F(4), ease: 'power3.in' }, F(117)); // 117–121, con el toque del 120
          tl.set({}, {}, F(122));
          window.__timelines['frase-1'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
