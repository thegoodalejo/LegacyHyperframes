    <!--
      Clip del sitio de Kingdom, módulo Equipos, 1080×1350 (4:5), 30,5 s a 30 fps. Contrato: SPEC.md; desvíos y sincronía en REVIEW.md.
      Estructura:
        · compositions/fondo.html      la noche del sitio (el halo se asienta en 0, 180 y 720; los puntos no se mueven)
        · compositions/frase-1..4.html las cuatro frases (una a la vez) y compositions/ceja.html («EQUIPOS», 195–723)
        · #ventana (aquí, en la raíz)  la app REAL grabada en celular (assets/grabaciones/grabacion.mp4, 1170×2532) dentro de .k-ventana:
                                        - #tira es el látigo: dos mundos apilados, #m1 (el celular del líder, Jorge, cuenta 103) arriba y #m2
                                          (el de Gabriela, cuenta 105) 1100 px más abajo. 356–366 la tira sube; 656–666 baja (SPEC §1.6)
                                        - cada mundo tiene dos cámaras: la de antes del iris (#cam1, #cam2) y la de dentro del iris (#cam1b,
                                          #cam2b). El iris (#iris1, #iris2) es un recorte en px de la ventana que nace donde se tocó en el
                                          encuadre viejo, y la cámara nueva ya está en el encuadre nuevo («salta dentro del iris»)
                                        - #m1in y #m2in son los envoltorios de los aterrizajes (el match cut del 78 y los dos látigos)
                                        - cada tramo de video es un <video> con su data-media-start, todos a 1×; los cortes caen en esperas,
                                          esqueletos, fundidos y ondas de la grabación, y cada toque real cae en su pulso (tabla en REVIEW.md)
                                        - la app salta en un cuadro (grab. 1270 y 1392, «baja a las instrucciones» y «vuelve arriba»): se dejan
                                          ver en sus pulsos (450 y 540) con la cámara quieta
                                        - las marcas de toque (.toque/.onda) van en las coordenadas reales del toque (pasos.json → toques[])
        · identidad/cierre-clip.html   la firma (kit v1.1), 28,0–30,5; el sonido de marca en 28,38
      Para llevarlo a 9:16: cambiar KD (abajo), las variables --f-* de este <style>, la firma por cierre-corto y data-width/height de los
      hosts; los tramos de video, los sonidos y los tiempos no cambian (la cámara se recalcula sola con enc()).
      Los tramos, las marcas y los sonidos de este archivo salen de una tabla (gen.py en el scratchpad del agente); se pueden editar a mano.
    -->

        background: #060d1f;

        height: var(--f-alto);
        overflow: hidden;
        background: #060d1f;
      }

      }

      }
      #cierre-clip {

      #ventana {
        left: var(--f-ventana-x);
        top: var(--f-ventana-y);
        width: var(--f-ventana-w);
        height: var(--f-ventana-h);
        z-index: 3;
      }

        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      /* Cada mundo ocupa la ventana entera y recorta su propia cámara: en el látigo los dos se ven a la vez, uno debajo del otro. */
      .mundo {
        position: absolute;
        left: 0;
        width: 100%;
        height: var(--f-ventana-h);
        overflow: hidden;
      }
      #m1 {
        top: 0;
      }
      #m2 {
        top: var(--f-latigo);
      }
      .mundo-in,
      .iris {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      .k-ventana-camara {
        height: var(--f-grab-alto);
      }
      .k-ventana-camara video,
      .k-ventana-camara img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;
      }
      .marcas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--f-grab-alto);
        pointer-events: none;
      }
      /* Marca del toque (la grabación no trae círculo): 20 px CSS del celular y su onda de 36 → 58 px (SPEC §1.6). */
      .toque {
        position: absolute;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(27, 27, 31, 0.28);
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7);
        opacity: 0;
      }
      .onda {
        position: absolute;
        width: 81px;
        height: 81px;
        margin: -40.5px 0 0 -40.5px;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(1, 91, 190, 0.9);
        opacity: 0;
      }
      #datos {
        position: absolute;
        /* Abajo a la izquierda de la ventana (pedido del dueño, 2026-10-30): ahí queda la barra inferior de la app. La ventana sangra 60 px por
           abajo del cuadro, así que se sube esa diferencia para que la etiqueta se vea entera. */
        left: 24px;
        bottom: calc(var(--f-ventana-h) - var(--f-ventana-hvis) + 24px);
        z-index: 4;
        /* 31 px en vez de los 28 del kit: con la ventana a 0,92 (724–839) sigue en ≥ 28 px, el piso de lectura en un celular. */
        height: 56px;
        font-size: 31px;
      }
      #dip {
        position: absolute;
        inset: 0;
        background: #060d1f;
        opacity: 0;
        z-index: 5;
        pointer-events: none;
      }

    <script>
      // ── Un solo lugar para el formato (la versión 9:16 cambia esto y las variables --f-* del <style>) ──────────────────────
      window.KD = {
        fps: 30,
        ventana: { w: 880, h: 1050, hVis: 990 }, // lo mismo que --f-ventana-*
        grabacion: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // el celular grabado a 3×
        latigo: 1100, // --f-latigo
        cambio: { escala: 0.92, x: 48, origen: '50% 100%' }, // la ventana se hace a un lado (SPEC §1.4, 724–738)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos
        const W = KD.ventana.w, HV = KD.ventana.hVis;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular (G = 2,256 en 4:5)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)

        // Encuadre: la caja (centro en px CSS del celular) centrada en lo visible de la ventana con la escala s, sin salirse de la grabación.
        function enc(s, cx, cy) {
          const rx = cx * PPC, ry = cy * PPC;
          let x = W / 2 - s * rx, y = HV / 2 - s * ry;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(0, Math.max(HV - s * VH, y));
          return { scale: s, x, y };
        }
        // Un punto del video (px de la grabación) en px de la ventana, con el encuadre e.
        const enVentana = (e, vx, vy) => ({ x: e.x + e.scale * vx * K, y: e.y + e.scale * vy * K });

        // Los objetivos, medidos sobre los cuadros reales de la grabación (px CSS del celular, 390×844). Niveles de SPEC §1.5; ver REVIEW §4.
        // El texto de la app arranca en x 16 (margen de la app) y llega a x 374: en M (×1,4, 279 px CSS de ancho) no cabe una fila entera; por
        // eso varios encuadres van entre ×1,08 y ×1,25. Ninguno deja una cifra o un chip que importe debajo de «Datos de ejemplo».
        const E = {
          // Mundo 1, antes del iris (#cam1)
          semana: enc(1.4, 155.5, 490), // M (la miniatura), CSS 16–295 × 334–646: «Dom, 1 de nov», la fila «9:00 a. m. · Servicio General · 4 de 5 · 1 por cubrir» (chip a 35 px) y el domingo 8; el chevrón queda fuera
          porCubrir: enc(1.8, 125, 450), // C, CSS 17–233 × 328–572 (debajo del aviso verde de arriba): la fila del domingo, «4 de 5» y «1 por cubrir» a 45 px; el toque del 75 (195, 422) adentro
          turnoCabeza: enc(1.15, 176, 245), // ×1,15 (con margen para el aterrizaje 1,03), CSS 6–346 × 54–436: «Seguridad», «Domingo, 1 de noviembre», «Servicio General», «9:00 a. m.», «4 de 5», los dos botones, «Parqueadero»
          parqueadero1: enc(1.08, 195, 440), // G⁺, CSS 14–376 × 237–643: «Parqueadero 1 de 2 · Asignar» (el botón llega a x 374), Rut «Confirmado», «Vacante», Entrada
          // Mundo 1, dentro del iris (#cam1b)
          sugerencias: enc(1.15, 195, 270), // ×1,15, CSS 25–365 × 79–461: «Asignar · Parqueadero», la ayuda, el buscador, Gabriela «✓ Habilidad · 0 en 60 días», Gilberto «Sin app»
          pie: enc(1, 195, 565), // G, CSS 345–784: «Cancelar · Asignar (1)» y, después del 183, Parqueadero «2 de 2», Gabriela «Sin avisar» y la barra
          avisar: enc(1.25, 172, 604), // ×1,25, CSS 16–328 × 429–780 (sin la barra inferior de la app): Gabriela «Sin avisar» y la barra «1 asignación sin avisar · Avisar a 1 persona» (por encima de la píldora)
          avisados: enc(1.08, 195, 422), // G⁺, CSS 14–376 × 219–625: el diálogo «Avisados» entero (323–522) con «Entendido»
          parqueadero2: enc(1.4, 155.5, 440), // M, CSS 16–295 × 284–597: «Parqueadero 2 de 2», Rut «Confirmado», Gabriela «Por confirmar» → «Confirmado» (chips a 35 px)
          cierre: enc(1.2, 176, 362), // ×1,2, CSS 14–339 × 179–545: «9:00 a. m.», «5 de 5», los botones, Parqueadero con Rut y Gabriela «Confirmado» (la píldora debajo, en Entrada)
          // Mundo 2, antes del iris (#cam2)
          tarjeta: enc(1, 195, 275), // G (con margen para el aterrizaje 1,04 del látigo), CSS 56–495: «Buenas tardes, Gabriela», «Iglesia Kingdom Demo 1» y la tarjeta «Tu próximo servicio» entera
          // Mundo 2, dentro del iris (#cam2b)
          servicioCabeza: enc(1.4, 160, 261.5), // M, CSS 21–300 × 105–418 (debajo de «Mis servicios»): «Domingo, 1 de noviembre», «Parqueadero», «Llega a las 7:45 a. m.», «Empieza…», la dirección, «Por confirmar»
          llegada: enc(1.8, 130, 225), // C, CSS 22–238 × 103–347: «Llega a las 7:45 a. m.» a 57 px, con «Parqueadero» arriba y «Empieza a las 9:00 a. m.» abajo
          servicio: enc(1, 195, 275), // G, CSS 56–495; después del 450: «Instrucciones», «Oficina de la entrada principal», «Uniforme del equipo · Chaleco reflectivo…», «Colores»
          paleta: enc(1.04, 195, 468), // ×1,04 (no M: la vestimenta y el cronograma van de x 15 a 372 y a ×1,08 ya rozaban el borde), CSS 8–383 × 257–679: vestimenta, Negro · Azul oscuro · Gris y los tres pasos
          botones: enc(1.08, 195, 372), // G⁺ (los dos botones ocupan de x 16 a 374), CSS 14–376 × 169–575: «Llega a las…», la dirección, el chip, «Aceptar · No puedo»; después del 602, «Confirmado», «¡Gracias por servir!…», «Ya no puedo»
        };
        const CAM = { ease: 'power2.inOut', d: F(14) };
        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, n, d) => tl.to(sel, { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        // Cámaras: a lo sumo un movimiento por compás (SPEC §2.1), ninguno mientras la app se desplaza (450 y 540).
        tl.set('#cam1', E.semana, 0);
        mover('#cam1', E.porCubrir, 46); // compás 1
        tl.set('#cam1', E.turnoCabeza, F(78)); // el match cut cambia de encuadre (corte con causa)
        mover('#cam1', E.parqueadero1, 90); // compás 2
        tl.set('#cam1b', E.sugerencias, 0); // ya en su encuadre cuando el iris del 120 lo abre
        mover('#cam1b', E.pie, 165); // compás 3
        mover('#cam1b', E.avisar, 210); // compás 4
        mover('#cam1b', E.avisados, 240); // compás 5
        mover('#cam1b', E.parqueadero2, 300); // compás 6; el mundo 1 se queda aquí hasta la vuelta del 656
        mover('#cam1b', E.cierre, 690, F(9)); // el retroceso (punch hacia afuera): aparece «5 de 5»
        tl.set('#cam2', E.tarjeta, 0);
        tl.set('#cam2b', E.servicioCabeza, 0); // ya en su encuadre cuando el iris del 375 lo abre
        mover('#cam2b', E.llegada, 390); // compás 7
        mover('#cam2b', E.servicio, 420); // compás 8; quieta cuando la app baja en el 450
        mover('#cam2b', E.paleta, 480); // compás 9; quieta cuando la app vuelve arriba en el 540
        mover('#cam2b', E.botones, 570); // compás 10; quieta en «Aceptar» (600)

        // El match cut del 78: el turno entra 1,03 → 1,00 desde el centro de lo visible de la ventana.
        const centro = `${W / 2}px ${HV / 2}px`;
        tl.fromTo('#m1in', { scale: 1.03, transformOrigin: centro }, { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(78));

        // Iris (120–125 y 375–380): el círculo nace en la ventana donde está el botón tocado en el encuadre viejo; dentro, la cámara nueva.
        const iris = (sel, e, vx, vy, n) => {
          const p = enVentana(e, vx, vy);
          const c = (r) => `circle(${r}px at ${p.x.toFixed(1)}px ${p.y.toFixed(1)}px)`;
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(1900), duration: F(5), ease: 'power2.out', immediateRender: false }, F(n));
          tl.set(sel, { clipPath: 'none' }, F(n + 6));
        };
        iris('#iris1', E.parqueadero1, 972, 1095, 120); // «Asignar»
        iris('#iris2', E.tarjeta, 585, 768, 375); // la tarjeta «Tu próximo servicio»

        // Látigos: una sola tira, 10 cuadros, power3.inOut. Ida 356–366 (sube un mundo), vuelta 656–666 (baja un mundo). El mundo que llega
        // aterriza 1,04 → 1,00 en su envoltorio.
        tl.fromTo('#tira', { y: 0 }, { y: -KD.latigo, duration: F(10), ease: 'power3.inOut', immediateRender: false }, F(356));
        tl.fromTo('#m2in', { scale: 1.04, transformOrigin: centro }, { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(360));
        tl.to('#tira', { y: 0, duration: F(10), ease: 'power3.inOut' }, F(656));
        tl.fromTo('#m1in', { scale: 1.04, transformOrigin: centro }, { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(660));

        // Marcas de toque: aparecen 4 cuadros antes (la del 120 en el 105 y espera quieta), se hunden en el cuadro y se van 6 después; la onda
        // nace en el cuadro (450 ms). Cuando la pantalla cambia antes de que la marca se vaya, la marca se va con el corte (toque → cuadro del corte).
        const CORTE = { 75: 78, 120: 121, 180: 181, 240: 242, 300: 301, 375: 376, 600: 602 };
        [75, 120, 150, 180, 240, 300, 375, 600].forEach((n) => {
          const t = F(n);
          const antes = n === 120 ? 15 : 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });

        // La ventana se hace a un lado (724–738), 4 cuadros después de la frase 4.
        tl.to('#ventana', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(724));
        // Dip de tres cuadros (837–839) y corte a la firma en el 840.
        tl.set('#dip', { opacity: 0.4 }, F(837));
        tl.set('#ventana', { autoAlpha: 0 }, F(840));
        tl.set({}, {}, 30.5);
        window.__timelines['main'] = tl;
      })();
    </script>
