        · compositions/frase-1..4.html las cuatro frases (una a la vez) y compositions/ceja.html («EVENTOS», 195–723)
        · #ventana (aquí, en la raíz)  la app REAL grabada en celular (assets/grabaciones/grabacion.mp4, 1170×2532) dentro de .k-ventana:
                                        - #cam es la cámara (scale + x/y; el <video> nunca se transforma ni se busca)
                                        - un solo mundo (#m1, el celular de Jorge); #m1in es el envoltorio del aterrizaje del 78
                                        - cada tramo de video es un <video> con su data-media-start y su data-playback-rate (0,467×–1,5×);
                                          los cortes caen en pausas o esperas de la grabación (la K del cargador y «Cargando…» quedan
                                          fuera) y cada toque real cae en su pulso (tabla en REVIEW.md)
                                        - la app salta (desplazamiento instantáneo) en la grabación 919, 1090 y 1257: la cámara lo compensa
                                          en el mismo cuadro del corte (525, 615 y 645), así que no se ve; el salto de la 291 sí se ve
                                          (es «la app baja al final de la lista», 150)
                                        - el iris del 180: un still del cuadro 179 debajo y los tramos siguientes recortados por un círculo; otro still (grab. 1027)
                                          sostiene la barra al 15 % en 602–609 mientras la cámara sube al formulario
                                        - las marcas de toque (.toque/.onda) van en las coordenadas reales del toque (pasos.json → toques[])
        · identidad/cierre-clip.html   la firma (kit v1.1), 28,0–30,5; el sonido de marca en 28,38
      Para llevarlo a 9:16: cambiar KD (abajo), las variables --f-* de este <style>, la firma por cierre-corto y data-width/height de los
      hosts; los tramos de video, los sonidos y los tiempos no cambian (la cámara se recalcula sola con enc()).
      Los tramos, las marcas y los sonidos de este archivo salen de una tabla (gen.py en el scratchpad del agente); se pueden editar a mano.
    -->

    <script>
      // ── Un solo lugar para el formato (la versión 9:16 cambia esto y las variables --f-* del <style>) ──────────────────────
      window.KD = {
        fps: 30,
        ventana: { w: 880, h: 1050, hVis: 990 }, // lo mismo que --f-ventana-*
        grabacion: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // el celular grabado a 3×
        cambio: { escala: 0.92, x: 48, origen: '50% 100%' }, // la ventana se hace a un lado (SPEC §1.4, 724–738)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos
        const W = KD.ventana.w, HV = KD.ventana.hVis;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular (G = 2,256 en 4:5)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)

        // Encuadre: la caja (centro en px CSS del celular) centrada en lo visible de la ventana con la escala s, sin salirse de la grabación.
        function enc(s, cx, cy) {
          const rx = cx * PPC, ry = cy * PPC;
          let x = W / 2 - s * rx, y = HV / 2 - s * ry;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(0, Math.max(HV - s * VH, y));
          return { scale: s, x, y };
        }
        // La app saltó d px CSS (positivo = el contenido baja): la cámara lo deshace en el mismo cuadro y nada se mueve en pantalla.
        const comp = (e, d) => ({ scale: e.scale, x: e.x, y: e.y - e.scale * PPC * d });

        // Los objetivos, medidos sobre los cuadros reales de la grabación (px CSS del celular, 390×844). Niveles de SPEC §1.5; ver REVIEW §4.
        const E = {
          servir: enc(1, 195, 219.5), // G, el tope: «Servir en Iglesia Kingdom Demo 1», «Hola, Jorge…», la tarjeta con sus tres filas
          fila: enc(1.15, 197, 345), // ×1,15 (no M), CSS 28–367 × 154–536: la tarjeta con la fila entera, de «Casa de Paz…» (x 44) a «Reportar» (x 350)
          lista: enc(1, 195, 600), // G, CSS 380–819: «0 marcadas · Igual que la última vez», «Buscar a alguien más» y cuatro casillas
          hojaAlta: enc(1.4, 155, 545), // M, CSS 388–702: «Persona nueva», Nombres, Apellidos, Teléfono, «Género»
          telefono: enc(1.8, 185, 650), // C, CSS 528–772: Teléfono y «Mujer / Hombre» (los números a 57 px)
          hoja: enc(1, 195, 614.5), // G, CSS 395–834: la hoja entera, de «Persona nueva» a «Agregar»
          nuevaFila: enc(1.4, 150, 609), // M, CSS 10–289 × 452–766: «Ximena Hoyos Vélez · Nueva», «Persona nueva», «Visitantes», «Total»
          total: enc(1.8, 115, 640), // C, CSS 518–762: el contador de visitantes y «Total: 10 personas» a 57 px
          // ×1,3 (no 1,4), CSS 10–310 × 438–776, después del salto de la 919: «Total», «No hubo reunión» y «Guardar asistencia» por encima de
          // «Datos de ejemplo» (la píldora queda sobre la barra inferior de la app, no sobre el botón que se toca en el 600)
          botones: enc(1.3, 160, 607),
          formulario: enc(1, 195, 374.5), // G, CSS 155–594: los pasos con la barra, «Reporte de la casa de paz», la pregunta, los radios, el tema
          enviar: enc(1, 195, 530.5), // G, CSS 311–750: el tema escrito, los campos y «Enviar reporte»
          listo: enc(1, 195, 438), // G, CSS 218–658: «Reportada», los atajos, los tres pasos, la barra y la tarjeta «¡Listo!» entera
          tarjeta: enc(1.13, 195, 568), // ×1,13, CSS 374–762: la barra y la tarjeta con la frase entera (327 px CSS: a 1,4 se cortaría) y «10 personas.»
          cierre: enc(1.12, 195, 410), // ×1,12, CSS 215–605: de «Reportada» a «Volver a la lista», con la ventana a 0,92 (texto ≥ 32 px)
        };
        const CAM = { ease: 'power2.inOut', d: F(14) };
        const mover = (e, n, d) => tl.to('#cam', { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        const tl = gsap.timeline({ paused: true });

        // Cámara: un movimiento por compás (SPEC §2.1), ninguno mientras la app escribe o se desplaza.
        tl.set('#cam', E.servir, 0);
        mover(E.fila, 46); // compás 1: a la fila de la casa
        mover(E.lista, 90); // compás 2: abre a la lista
        mover(E.hojaAlta, 180); // compás 4: con el iris, a la mitad alta de la hoja
        mover(E.telefono, 300); // compás 6: el dedo toca «Teléfono»; se escribe 315–341 con la cámara quieta
        mover(E.hoja, 345); // vuelta a la hoja entera con «Agregar»
        mover(E.nuevaFila, 390); // compás 7
        mover(E.total, 510); // compás 9
        tl.set('#cam', comp(E.total, -62), F(525)); // la app sube 62 px (grab. 919): compensado
        mover(E.botones, 540); // compás 10
        mover(E.formulario, 600, F(9)); // compás 11, con la segunda subida: llega en el 609, antes de que crezca la barra (610–614)
        tl.set('#cam', comp(E.formulario, 66), F(615)); // la app baja 66 px (grab. 1090): compensado
        tl.set('#cam', E.formulario, F(645)); // la app vuelve a subir 66 px (grab. 1257): compensado
        mover(E.enviar, 646, F(13)); // a «Enviar reporte»
        mover(E.listo, 660); // compás 12, con el golpe
        mover(E.tarjeta, 690, F(9)); // el punch
        mover(E.cierre, 720); // compás 13

        // El match cut del 78: la pantalla nueva (el reporte) entra 1,03 → 1,00 desde el centro de lo visible de la ventana.
        const o = { x: (W / 2 - E.fila.x) / E.fila.scale, y: (HV / 2 - E.fila.y) / E.fila.scale };
        tl.fromTo('#m1in', { scale: 1.03, transformOrigin: `${o.x.toFixed(1)}px ${o.y.toFixed(1)}px` },
          { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(78));

        // Iris desde el toque en «Persona nueva» (180–185): el círculo nace en el centro del botón, en px de la grabación ajustada.
        const ix = (301 * K).toFixed(1), iy = (1410 * K).toFixed(1);
        const circ = (r) => `circle(${r}px at ${ix}px ${iy}px)`;
        tl.fromTo('#iris1', { clipPath: circ(0) }, { clipPath: circ(1900), duration: F(5), ease: 'power2.out', immediateRender: false }, F(180));
        tl.set('#iris1', { clipPath: 'none' }, F(186));

        // Marcas de toque: aparecen 4 cuadros antes (la del 120 en el 105 y espera quieta), se hunden en el cuadro y se van 6 después;
        // la onda nace en el cuadro (450 ms).
        // Cuando la pantalla cambia antes de que la marca se vaya, la marca se va con el corte: si no, quedaría sobre otra cosa
        // (la del 180 caería sobre «Nombres»). toque → cuadro del corte.
        const CORTE = { 75: 78, 180: 181, 375: 377, 600: 602, 660: 662 };
        [75, 120, 180, 240, 270, 300, 345, 375, 450, 480, 600, 615, 630, 660].forEach((n) => {
          const t = F(n);
          const antes = n === 120 ? 15 : 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });
        // La marca de «Muy bien» aparece en 611–614, antes del salto compensado del 615: hasta entonces va 66 px CSS más arriba (donde el
        // botón está en la pantalla de esos cuadros), así no se mueve en pantalla.
        tl.set('#tq-615', { y: -66 * 3 * K }, 0);
        tl.set('#tq-615', { y: 0 }, F(615));

        // La ventana se hace a un lado (724–738), 4 cuadros después de la frase 4.
        tl.to('#ventana', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(724));
        // Dip de tres cuadros (837–839) y corte a la firma en el 840.
        tl.set('#dip', { opacity: 0.4 }, F(837));
        tl.set('#ventana', { autoAlpha: 0 }, F(840));
        tl.set({}, {}, 30.5);
        window.__timelines['main'] = tl;
