<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- P1 · Frase 1: «La clase / ya empezó.» (host 0–122). «La» ya está en el cuadro 0 (la miniatura); «clase» cae en el 15, «ya» en el 30
         y «empezó.» en el 45 (entrada-palabra: blur 6 → 0 + opacidad, 4 cuadros, power4.out, sin desplazarse; arranca un cuadro antes).
         Sale entera 117–121 (salida-texto: blur 0 → 8, power3.in), antes del látigo. Posición y tamaño: variables --f-* del host. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: var(--f-ancho, 1080px);
          height: var(--f-alto, 1350px);
          overflow: hidden;
        }
        .f-frase {
          position: absolute;
          left: var(--f-margen-x, 96px);
          top: var(--f-frase-y, 124px);
          width: var(--f-frase-ancho, 888px);
          font-size: var(--f-frase-px, 80px);
          color: var(--k-noche-tinta);
          text-wrap: initial;
        }
        .linea {
          display: block;
          white-space: nowrap;
        }
        .palabra {
          display: inline-block;
        }
      </style>
      <div id="root" data-composition-id="frase-1" data-width="1080" data-height="1350" data-duration="4.066667">
        <div class="k-feed-frase f-frase" id="f1">
          <span class="linea"><span class="palabra" id="f1-w1">La</span> <span class="palabra" id="f1-w2">clase</span></span>
          <span class="linea"><span class="palabra" id="f1-w3">ya</span> <span class="palabra" id="f1-w4">empezó.</span></span>
        </div>
      </div>
      <script>
        (function () {
          const F = (n) => n / 30;
          const tl = gsap.timeline({ paused: true });
          [['#f1-w2', 15], ['#f1-w3', 30], ['#f1-w4', 45]].forEach(([sel, n]) => {
            tl.fromTo(sel, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: F(4), ease: 'power4.out' }, F(n - 1));
          });
          tl.to('#f1', { opacity: 0, filter: 'blur(8px)', duration: F(4), ease: 'power3.in' }, F(117));
          tl.set({}, {}, F(122));
          window.__timelines['frase-1'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
