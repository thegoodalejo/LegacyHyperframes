<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- P2–P4 · Frase 2: «Sin listas / de papel.» (host 119–362). Entra la línea entera 120–126 (entrada-linea: blur 8 → 0, 6 cuadros,
         power4.out) con el bajo y el primer número de la alumna; se queda sobre el contador del profesor y sale 357–361 (salida-texto),
         en el látigo a quien coordina. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: var(--f-ancho, 1080px);
          height: var(--f-alto, 1350px);
          overflow: hidden;
        }
        .f-frase {
          position: absolute;
          left: var(--f-margen-x, 96px);
          top: var(--f-frase-y, 124px);
          width: var(--f-frase-ancho, 888px);
          font-size: var(--f-frase-px, 80px);
          color: var(--k-noche-tinta);
          text-wrap: initial;
        }
        .linea {
          display: block;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="frase-2" data-width="1080" data-height="1350" data-duration="8.1">
        <div class="k-feed-frase f-frase" id="f2">
          <span class="linea">Sin listas</span>
          <span class="linea">de papel.</span>
        </div>
      </div>
      <script>
        (function () {
          const F = (n) => n / 30;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo('#f2', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: F(6), ease: 'power4.out' }, 0);
          tl.to('#f2', { opacity: 0, filter: 'blur(8px)', duration: F(4), ease: 'power3.in' }, F(238)); // 357–361
          tl.set({}, {}, F(243));
          window.__timelines['frase-2'] = tl;
        })();
      </script>
    </template>
  </body>
