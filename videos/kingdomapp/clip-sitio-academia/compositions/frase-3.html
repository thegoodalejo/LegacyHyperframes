<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- P5–P6 · Frase 3: «Quien cumple, / se gradúa.» (host 359–602). Palabra a palabra cada 2 cuadros desde el 360 (Quien 360 · cumple, 362 ·
         se 364 · gradúa. 366; completa en el 370), entrada-palabra (blur 6 → 0, 4 cuadros, power4.out). Sale 597–601, antes del toque de
         confirmar. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: var(--f-ancho, 1080px);
          height: var(--f-alto, 1350px);
          overflow: hidden;
        }
        .f-frase {
          position: absolute;
          left: var(--f-margen-x, 96px);
          top: var(--f-frase-y, 124px);
          width: var(--f-frase-ancho, 888px);
          font-size: var(--f-frase-px, 80px);
          color: var(--k-noche-tinta);
          text-wrap: initial;
        }
        .linea {
          display: block;
          white-space: nowrap;
        }
        .palabra {
          display: inline-block;
        }
      </style>
      <div id="root" data-composition-id="frase-3" data-width="1080" data-height="1350" data-duration="8.1">
        <div class="k-feed-frase f-frase" id="f3">
          <span class="linea"><span class="palabra" id="f3-w1">Quien</span> <span class="palabra" id="f3-w2">cumple,</span></span>
          <span class="linea"><span class="palabra" id="f3-w3">se</span> <span class="palabra" id="f3-w4">gradúa.</span></span>
        </div>
      </div>
      <script>
        (function () {
          const F = (n) => n / 30;
          const tl = gsap.timeline({ paused: true });
          for (let i = 1; i <= 4; i++) {
            // El host arranca un cuadro antes del pulso (359): el primer cuadro visible de cada palabra cae en su cuadro.
            tl.fromTo('#f3-w' + i, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: F(4), ease: 'power4.out' }, F(2 * (i - 1)));
          }
          tl.to('#f3', { opacity: 0, filter: 'blur(8px)', duration: F(4), ease: 'power3.in' }, F(238)); // 597–601
          tl.set({}, {}, F(243));
          window.__timelines['frase-3'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
