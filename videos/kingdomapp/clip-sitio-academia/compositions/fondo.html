<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El fondo del cuerpo (0–840): la noche del sitio con el halo y la retícula de puntos del kit (identidad/kit.css, enlazado por el host).
         El halo se asienta al entrar cada mundo (1,08 → 1,00 en 90 cuadros, sine.out) en los cuadros 0, 120, 240, 360 y 720; los puntos no se mueven. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: var(--f-ancho, 1080px);
          height: var(--f-alto, 1350px);
          overflow: hidden;
        }
      </style>
      <div id="root" data-composition-id="fondo" data-width="1080" data-height="1350" data-duration="28">
        <div class="k-noche">
          <div class="k-halo" id="fondo-halo" data-layout-allow-overflow></div>
          <div class="k-puntos"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          [0, 4, 8, 12, 24].forEach((t) => {
            tl.fromTo('#fondo-halo', { scale: 1.08 }, { scale: 1, duration: 3, ease: 'sine.out', immediateRender: t === 0 }, t);
          });
          tl.set({}, {}, 28);
          window.__timelines['fondo'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
