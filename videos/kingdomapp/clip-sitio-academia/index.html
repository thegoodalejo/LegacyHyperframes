    <title>Clip del sitio · Academia · «La clase ya empezó» (4:5)</title>
    <!--
      Clip del sitio de Kingdom, módulo Academia, 1080×1350 (4:5): 30,5 s a 30 fps (cuerpo 0–839 + firma 840–914). Contrato: SPEC.md;
      desvíos y sincronía en REVIEW.md. Plantilla: ../clip-sitio-membresia (mismo sistema).
      Estructura:
        · compositions/fondo.html      la noche del sitio (el halo se asienta en 0, 120, 240, 360 y 720; los puntos no se mueven)
        · compositions/frase-1..4.html las cuatro frases (una a la vez) y compositions/ceja.html («ACADEMIA», 195–723)
        · #ventana (aquí, en la raíz)  la app REAL grabada en celular (grabacion.mp4, 1170×2532, tres cuentas de Kingdom Demo) dentro de .k-ventana:
                                        - #tira es el látigo vertical: dos ranuras apiladas a --f-latigo. Ranura 1 (#m1): el profesor (T1 y,
                                          desde el 200, T3). Ranura 2 (#m2): la alumna (T2) y, desde el 340, quien coordina (T5–T7, #m3land).
                                          110–120 sube (a la alumna), 230–240 baja (de vuelta al profesor), 350–360 sube (a quien coordina)
                                        - cada mundo tiene su cámara (#cam1, #cam2, #cam3: scale + x/y; el <video> nunca se transforma ni se busca)
                                          y su aterrizaje 1,04 → 1,00 (#m1land, #m2land, #m3land)
                                        - cada tramo de video es un <video> a 1× con su data-media-start (+0,01 s: dentro del cuadro buscado);
                                          los cortes caen en pausas o esperas de la grabación (huecos_de_pantalla de pasos.json) y cada
                                          acción real cae en su pulso (tabla en REVIEW.md)
                                        - los iris del 375 y del 660: lo de antes debajo y el video recortado por un círculo encima
                                        - las marcas de toque (.toque/.onda) van en las coordenadas reales del toque (pasos.json → toques[])
        · identidad/cierre-clip.html   la firma (kit v1.1), 28,0–30,5; el sonido de marca en 28,38
      Para llevarlo a 9:16: cambiar KD (abajo) y las variables --f-* de este <style> (SPEC §1.4 y REVIEW de Membresía §8); los tramos de
      video, los sonidos y las escenas no cambian (las escenas solo necesitan su data-width/data-height).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />

    <style>
      :root {
        /* ── Formato 4:5 (SPEC §1.4). Para 9:16: 1080×1920, márgenes 60, ceja y 188 / 34 px, frase y 236 / 960 / 104 px, ventana 60·480·960×850. */
        --f-ancho: 1080px;
        --f-alto: 1350px;
        --f-margen-x: 96px;
        --f-ceja-y: 72px;
        --f-ceja-px: 30px;
        --f-frase-y: 124px;
        --f-frase-ancho: 888px;
        --f-frase-px: 80px;
        --f-ventana-x: 100px;
        --f-ventana-y: 360px;
        --f-ventana-w: 880px;
        --f-ventana-h: 1050px; /* sangra 60 px por abajo del cuadro: las esquinas de abajo nunca se ven */
        --f-ventana-hvis: 990px; /* lo que se ve de la ventana dentro del cuadro */
        /* Grabación 1170×2532 ajustada al ancho de la ventana: factor y alto resultante (880/1170 y 2532·880/1170). */
        --f-k: 0.752137;
        --f-grab-alto: 1904.41px;
        --f-latigo: 1100px; /* distancia entre las dos ranuras de la tira */
      }
      html,
      body {
        margin: 0;
        width: var(--f-ancho);
        height: var(--f-alto);
        overflow: hidden;
        background: #060d1f;
      }
      #root {
        position: relative;
        width: var(--f-ancho);
        height: var(--f-alto);
        overflow: hidden;
        background: #060d1f;
      }
      #root > [data-composition-src] {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #fondo {
        z-index: 0;
      }
      #cierre-clip {
        z-index: 6;
      }
      /* La ventana a la app: .k-ventana del kit (radio 28, anillo, sombra); el tamaño viene del formato. */
      #ventana {
        left: var(--f-ventana-x);
        top: var(--f-ventana-y);
        width: var(--f-ventana-w);
        height: var(--f-ventana-h);
        z-index: 3;
      }
      #tira {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      /* Cada ranura de la tira recorta a su mundo (la cámara de un mundo nunca se asoma al otro) y mide lo mismo que la distancia entre
         ranuras: en el látigo no queda ningún hueco. Debajo de la grabación, el fondo de la app. */
      .mundo {
        position: absolute;
        left: 0;
        width: 100%;
        height: var(--f-latigo);
        overflow: hidden;
        background: var(--k-app-fondo);
      }
      #m1 {
        top: 0;
      }
      #m2 {
        top: var(--f-latigo);
      }
      .aterriza {
        position: absolute;
        inset: 0;
      }
      .cam {
        height: var(--f-grab-alto);
      }
      .cam video,
      .iris {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;
      }
      .iris {
        height: var(--f-grab-alto);
      }
      .marcas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--f-grab-alto);
        pointer-events: none;
      }
      /* Marca del toque (la grabación no trae círculo): 20 px CSS del celular y su onda de 36 → 58 px, como en Membresía. */
      .toque {
        position: absolute;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(27, 27, 31, 0.28);
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7);
        opacity: 0;
      }
      .onda {
        position: absolute;
        width: 81px;
        height: 81px;
        margin: -40.5px 0 0 -40.5px;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(1, 91, 190, 0.9);
        opacity: 0;
      }
      #datos {
        position: absolute;
        /* Abajo a la izquierda de la ventana, a 24 px (pedido del dueño); la ventana sangra 60 px por abajo, así que se sube esa diferencia. */
        left: 24px;
        bottom: calc(var(--f-ventana-h) - var(--f-ventana-hvis) + 24px);
        z-index: 4;
        /* 31 px en vez de los 28 del kit: con la ventana a 0,92 sigue en ≥ 28 px, el piso de lectura en un celular. */
        height: 56px;
        font-size: 31px;
      }
      #dip {
        position: absolute;
        inset: 0;
        background: #060d1f;
        opacity: 0;
        z-index: 5;
        pointer-events: none;
      }
    </style>
  </head>

    <script>
      // ── Un solo lugar para el formato (la versión 9:16 cambia esto y las variables --f-* del <style>) ──────────────────────
      window.KD = {
        fps: 30,
        ventana: { w: 880, h: 1050, hVis: 990 }, // lo mismo que --f-ventana-*
        grabacion: { w: 1170, h: 2532, cssW: 390 }, // el celular grabado a 3×
        latigo: 1100, // --f-latigo
        cambio: { escala: 0.92, x: 48, origen: '50% 100%' }, // la ventana se hace a un lado (SPEC §1.4, 724–738)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos
        const W = KD.ventana.w, HV = KD.ventana.hVis;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular (G = 2,256 en 4:5)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)

        // Encuadre: el punto (cx, cy) en px CSS del celular, centrado en lo visible de la ventana con la escala s, sin salirse de la grabación.
        function enc(s, cx, cy) {
          let x = W / 2 - s * cx * PPC, y = HV / 2 - s * cy * PPC;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(0, Math.max(HV - s * VH, y));
          return { scale: s, x, y };
        }
        // Los objetivos: cajas de pasos.json y líneas medidas en los cuadros reales (px CSS del celular). Niveles de SPEC §1.5:
        // G = 1 (texto de 14 px → 31,6 px), G⁺ = 1,08 (34 px), M = 1,4 (44 px).
        const E1 = {
          codigo: enc(1, 195, 279.5), // G, CSS 60–499: el título, los cuatro números, la barra y la mitad alta del QR
          contador: enc(1, 195, 624.5), // G, CSS 405–844: la mitad baja del QR, «13 de 18 marcaron», el temporizador, los botones, «Faltan (5)»
          catorce: enc(1.08, 195, 383), // G⁺, CSS 180–586 de la toma desplazada: «14 de 18», los botones, «Faltan (4)», Andrea y Camilo
          dieciseis: enc(1.4, 147, 428), // M alineado a la izquierda, CSS 8–286 × 271–585: «16 de 18 marcaron» (384–422) y «Se cierra sola en 13:xx» (446); centrado cortaba el «1»
        };
        const E2 = {
          casillas: enc(1.2, 195, 355), // ×1,2 (38 px), CSS 32–357 × 172–538: la pregunta, las cuatro casillas (325–395), la ayuda (a 1,4 se cortaban los lados)
          listo: enc(1.2, 195, 330), // ×1,2, CSS 147–513: el chequeo (291), «¡Listo! Quedó tu asistencia» (351, x 46–344), «Ir a Mis cursos» (429)
        };
        const E3 = {
          tarjeta: enc(1.08, 195, 265), // G⁺, CSS 62–468: «Cursos», la tarjeta «Por aprobar 9» (185–360) y el buscador
          lista: enc(1.1, 190, 205), // ×1,1 (35 px), CSS 13–367 × 5–404: «Se gradúan 9 · 9 no se gradúan» (86), Andrea entera (115–298) y Antonella (a 1,4 se cortaban «Se gradúa» y «Excluir»)
          barra: enc(1, 195, 624.5), // G, CSS 405–844: Débora, Esteban y la barra «Devolver al profesor | Aprobar (9)» (697–755)
          dialogo: enc(1.15, 190, 421), // ×1,15 (36 px), CSS 230–612 × 21–360: el diálogo entero (a 1,4 se cortan el cuerpo y «Aprobar (9)»)
          // G⁺ con el borde de abajo de la grabación 34 px CSS por encima del borde visible (un margen del fondo de la app): el aviso
          // «¡Listo! 9 graduados…» (790–835) es lo último de la pantalla y, pegado abajo, quedaba debajo de «Datos de ejemplo».
          aviso: { ...enc(1.08, 195, 641), y: HV - 1.08 * (VH + 34 * PPC) },
          certs: enc(1.12, 190, 190), // ×1,12 (35 px), CSS 0–392 × 16–364: Andrea «7YU79-NNB7A · Ver · Descargar · Anular» y dos más
          cert: enc(1, 195, 372), // G, CSS 153–591: la tarjeta del certificado (231–513) y «Descargar certificado»
          nombre: enc(1.35, 195, 405), // ×1,35 (43 px), CSS 242–567 × 50–340: «otorga… · Andrea Perea López · por haber terminado…»
          codigo: enc(1.04, 195, 633), // ×1,04 (×0,92 de la ventana = 30 px), CSS 422–844: «por haber terminado…» hasta «Copiar el enlace»
        };
        const CAM = { ease: 'power2.inOut', d: F(14) };
        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, cuadro, d) => tl.to(sel, { ...e, duration: d || CAM.d, ease: CAM.ease }, F(cuadro));

        // Cámara del profesor: un movimiento por compás.
        tl.set('#cam1', E1.codigo, 0);
        mover('#cam1', E1.contador, 60); // compás 2: «13 de 18 marcaron»
        tl.set('#cam1', E1.catorce, F(200)); // fuera de cuadro: T3 entra ya encuadrado
        mover('#cam1', E1.dieciseis, 330); // compás 6: la prueba, el contador de cerca
        // Cámara de la alumna.
        tl.set('#cam2', E2.casillas, 0);
        mover('#cam2', E2.listo, 180); // compás 4, con el pico
        // Cámara de quien coordina. Nunca se mueve mientras la app salta sola (420 y 615): esos saltos van con la cámara quieta.
        tl.set('#cam3', E3.tarjeta, 0);
        mover('#cam3', E3.lista, 390); // compás 7: la app salta a la lista en el 390 y la cámara la recibe
        mover('#cam3', E3.barra, 465); // compás 8: la barra «Aprobar (9)»
        mover('#cam3', E3.dialogo, 495); // compás 9: el diálogo
        mover('#cam3', E3.aviso, 600); // compás 11: el aviso
        mover('#cam3', E3.certs, 645); // la primera fila con «Ver»
        mover('#cam3', E3.cert, 660, F(10)); // el golpe: con el iris, a la tarjeta del certificado (10 cuadros: el punch llega en el 675)
        mover('#cam3', E3.nombre, 675, F(9)); // el punch, 9 cuadros
        mover('#cam3', E3.codigo, 720); // compás 13: el código de verificación; después, muerta de quieta

        // Iris desde el toque (SPEC §1.6): el círculo nace en el centro del botón tocado, en px de la grabación ajustada.
        const irisDesde = (sel, vx, vy, cuadro) => {
          const p = { x: vx * K, y: vy * K };
          const c = (r) => `circle(${r}px at ${p.x.toFixed(1)}px ${p.y.toFixed(1)}px)`;
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(1900), duration: F(5), ease: 'power2.out' }, F(cuadro));
          tl.set(sel, { clipPath: 'none' }, F(cuadro + 6));
        };
        irisDesde('#iris3a', 585, 900, 375); // la lista de «Por aprobar»
        irisDesde('#iris3b', 401, 484, 660); // «Ver»

        // Látigos: una sola tira (REVIEW de Membresía §4.10), power3.inOut, 10 cuadros. Arriba = al otro celular; abajo = de vuelta.
        const L = KD.latigo;
        const latigo = { duration: F(10), ease: 'power3.inOut' };
        tl.fromTo('#tira', { y: 0 }, { y: -L, ...latigo }, F(110)); // 110–120: sube a la alumna
        tl.to('#tira', { y: 0, ...latigo }, F(230)); // 230–240: baja, de vuelta al profesor
        tl.to('#tira', { y: -L, ...latigo }, F(350)); // 350–360: sube a quien coordina (la ranura 2 ya tiene su mundo)
        // El mundo que llega aterriza 1,04 → 1,00 (power3.out, 10 cuadros), desde el centro de lo visible.
        const origen = `${W / 2}px ${HV / 2}px`;
        tl.fromTo('#m2land', { scale: 1.04, transformOrigin: origen }, { scale: 1, duration: F(10), ease: 'power3.out' }, F(120));
        tl.set('#m1land', { scale: 1.04, transformOrigin: origen }, F(220));
        tl.to('#m1land', { scale: 1, duration: F(10), ease: 'power3.out' }, F(240));
        tl.set('#m3land', { scale: 1.04, transformOrigin: origen }, F(340));
        tl.to('#m3land', { scale: 1, duration: F(10), ease: 'power3.out' }, F(360));

        // Marcas de toque: 4 cuadros antes aparece, en el cuadro se hunde, 6 después se va; la onda nace en el cuadro (450 ms).
        // Donde la app cambia debajo del dedo 3 cuadros después (la fila se va, el diálogo se cierra), la marca se apaga en esos 3 cuadros:
        // si no, la onda queda sobre otro botón.
        const corte = { 270: 3, 300: 3, 600: 3 };
        [270, 300, 375, 480, 600, 660].forEach((n) => {
          const t = F(n), c = corte[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out' }, t - F(4));
          tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
          tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: c ? F(c - 2) : F(6), ease: 'power2.out' }, t + F(2));
          tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: c ? 1.3 : 1.62, duration: c ? F(c) : 0.45, ease: 'power2.out', immediateRender: false }, t);
        });

        // La ventana se hace a un lado (724–738), cuatro cuadros después del golpe y de la frase 4.
        tl.to('#ventana', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(724));
        // Dip de tres cuadros (837–839) y corte a la firma en el 840.
        tl.set('#dip', { opacity: 0.4 }, F(837));
        tl.set('#ventana', { autoAlpha: 0 }, F(840));
        tl.set({}, {}, 30.5);
        window.__timelines['main'] = tl;
      })();
    </script>
