        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('tab-cam'), pag = $('tab-pag'), sobre = $('tab-sobre');
            const bs = H.bloques(T, $('tab-col'), 'tab', ['La acogida se *mide*', 'Tableros → Ruta: el *embudo*', 'Dónde se queda: «*Estancados*»',
              'Por dónde llegan: qué *funciona*', 'Tu lista, con los *filtros*', 'En PDF o Excel, a la *reunión*', null]);
            H.animarBloques(tl, T, bs, T.pulso(f6.inicio - 0.3));
            H.entra(tl, '#tab-ceja', 0.1, { dy: 16 });

            // f0 · entra la ventana con Tableros → Ruta.
            tl.fromTo('#tab-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#tab-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });

            // f1 · «Tableros» y la vista «Ruta»: las barras del embudo crecen paso a paso (iniciaron, cumplieron, días).
            const tT = P(f1, /^tableros/, -0.3);
            A.foco(tl, pag, $('tab-tab'), tT, tT + 0.8, { pad: 2, radio: 8 });
            A.foco(tl, pag, $('tab-c-ruta'), P(f1, /^ruta/, -0.3), P(f1, /^ruta/, 0.6), { pad: 3, radio: 22 });
            const emb = $('tab-embudo');
            const cE = A.caja(emb, cam);
            const sE = -Math.round(cE.y - 56 - 16);
            const tEm = P(f1, /^embudo/, -0.6);
            A.desliz(tl, pag, sE, tEm, 1.0);
            const tramos = [...document.querySelectorAll('#tab-pasos .k-app-tramo')];
            const filasP = [...document.querySelectorAll('#tab-pasos > li')];
            tl.set(tramos, { scaleX: 0 }, 0);
            const tIni = P(f1, /^iniciaron/, -0.3);
            filasP.forEach((li, i) => {
              const [t1, t2] = li.querySelectorAll('.k-app-tramo');
              tl.to([t1, t2], { scaleX: 1, duration: 0.6, ease: 'power2.out', stagger: 0.12 }, tIni + i * 0.45);
            });
            tl.set('#tab-objetivos .k-app-tramo', { scaleX: 0 }, 0);
            tl.to('#tab-objetivos .k-app-tramo', { scaleX: 1, duration: 0.7, ease: 'power2.out', stagger: 0.1 }, T.pulso(f0.inicio) + 0.8);
            const cP = A.caja($('tab-pasos'), cam);
            A.camara(tl, cam, { z: 1.35, cx: cP.cx, cy: cP.y + sE + 130, t: P(f1, /^cumplieron/, -0.4), d: 1.0 });

            // f2 · ahí ves dónde se queda la gente; «Estancados»: quienes llevan su paso vencido (paneo hacia abajo y foco).
            const est = $('tab-estancados');
            const cS = A.caja(est, cam);
            const sS = -Math.round(cS.y - 56 - 140);
            const tEs = P(f2, /^estancados/, -0.7);
            A.camara(tl, cam, { z: 1, t: tEs - 0.4, d: 0.6 });
            A.desliz(tl, pag, sS, tEs, 1.0);
            A.foco(tl, pag, est, tEs + 0.9, T.pulso(f2.fin + 0.3), { pad: 6, radio: 20 });

            // f3 · la vista «Personas»: las nuevas por forma de llegar (así se ve qué funciona).
            const tPe = P(f3, /^personas/, -0.2);
            A.desliz(tl, pag, 0, tPe - 0.5, 0.6);
            A.tocar(tl, pag, $('tab-c-personas'), tPe + 0.1);
            tl.to('#tab-c-ruta', { backgroundColor: 'rgba(0,0,0,0)', color: '#1b1b1f', borderColor: '#c4c6d0', duration: 0.15 }, tPe + 0.2);
            tl.to('#tab-c-personas', { backgroundColor: '#ffdea9', color: '#5e4100', borderColor: 'rgba(0,0,0,0)', duration: 0.15 }, tPe + 0.2);
            tl.to('#tab-v-ruta', { opacity: 0, duration: 0.2 }, tPe + 0.2);
            tl.fromTo('#tab-v-personas', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tPe + 0.35);
            const formasT = [...document.querySelectorAll('#tab-formas-b .k-app-tramo')];
            tl.set(formasT, { scaleX: 0 }, 0);
            tl.to(formasT, { scaleX: 1, duration: 0.6, ease: 'power2.out', stagger: 0.15 }, tPe + 0.6);
            const cF = A.caja($('tab-formas'), cam);
            A.camara(tl, cam, { z: 1.4, cx: cF.cx, cy: cF.cy, t: P(f3, /^llegan/, -0.4), d: 0.9 });
            A.foco(tl, pag, $('tab-formas'), P(f3, /^funciona/, -0.4), T.pulso(f3.fin + 0.4), { pad: 6, radio: 20 });

            // f4 · con los filtros: el celular con la lista filtrada (llegaron desde el 1 de este mes y siguen «Sin red»).
            const tFi = P(f4, /^filtros/, -0.5);
            A.camara(tl, cam, { z: 1, t: tFi - 0.2, d: 0.6 });
            tl.to('#tab-ven', { opacity: 0.35, duration: 0.4 }, tFi);
            tl.fromTo('#tab-cel', { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, tFi);
            tl.fromTo('#tab-f-llegada', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.8)', immediateRender: false }, P(f4, /^llegaron/, -0.2));
            tl.fromTo('#tab-f-red', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.8)', immediateRender: false }, P(f4, /^sin/, -0.3));
            A.foco(tl, $('tab-cpag'), $('tab-fichas'), P(f4, /^sin/, 0), T.pulso(f4.fin + 0.5), { pad: 6, radio: 20 });

            // f5 · se descarga en PDF o Excel para la reunión: vuelve el computador; el dedo en la descarga y su menú.
            const tDe = P(f5, /^descargas/, -0.2);
            tl.to('#tab-cel', { opacity: 0, x: 200, duration: 0.45, ease: 'power2.in' }, tDe - 0.6);
            tl.to('#tab-ven', { opacity: 1, duration: 0.4 }, tDe - 0.5);
            const cD = A.caja($('tab-descargar'), cam);
            Object.assign($('tab-menu').style, { top: `${cD.y + cD.h + 4}px`, right: `${A.medida(cam).w - (cD.x + cD.w)}px` });
            A.camara(tl, cam, { z: 1.5, cx: cD.cx - 160, cy: cD.cy + 50, t: tDe - 0.3, d: 0.8 });
            A.tocar(tl, cam, $('tab-descargar'), tDe + 0.6);
            tl.fromTo('#tab-menu', { opacity: 0, scale: 0.9, transformOrigin: '100% 0%' }, { opacity: 1, scale: 1, duration: 0.22, ease: 'power2.out', immediateRender: false }, tDe + 0.75);
            A.foco(tl, cam, $('tab-menu'), P(f5, /^pdf/, -0.2), T.pulso(f5.fin + 0.3), { pad: 2, radio: 8 });

            // f6 · y pregúntale a los nuevos cómo se sintieron: su opinión vale más que la nuestra (texto cinético y el globo de pregunta).
            const t6 = T.pulso(f6.inicio - 0.3);
            H.sale(tl, ['#tab-ven', '#tab-datos'], t6, { d: 0.4 });
            const centro = H.el('div', 'bloque', $('tab-sobre'), 'tab-f6', { left: '192px', top: '430px', width: '1536px', height: '300px', alignItems: 'center', textAlign: 'center' });
            const frase = H.el('div', 'k-recurso-titular', centro, 'tab-f6-t');
            H.partir('Su opinión vale más que la *nuestra*').forEach((w, j) => {
              const s = H.el('span', `k-recurso-palabra${w.clave ? ' k-recurso-clave' : ''}`, frase, `tab-f6-p-${j}`);
              s.textContent = w.texto;
              const np = f6.palabras.length, k = Math.min(np - 1, 8 + j); // «su opinión vale más que la nuestra» son las palabras 8 a 14
              tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, f6.palabras[k].inicio - 0.08);
            });
            const globo = H.nodo(sobre, 'tab-forum', 960, 330, 'forum', true, 150);
            H.pop(tl, globo, P(f6, /^preguntale/, -0.2));
            const pre = H.ancla(sobre, 'tab-pre', 960, 440, '¿Cómo te sentiste?', 'rot oro');
            H.entra(tl, pre, P(f6, /^sintieron/, -0.3), { dy: 12 });

            H.sale(tl, ['#tab-sobre', '#tab-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['tableros'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
