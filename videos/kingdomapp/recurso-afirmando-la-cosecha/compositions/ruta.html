              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const esc = $('rut-esc'), svg = $('rut-svg'), cam = $('rut-cam'), pag = $('rut-pag'), sobre = $('rut-sobre');
            const bs = H.bloques(T, $('rut-col'), 'rut', ['Acompañar hasta que se *conecta*', 'Su *ruta de crecimiento*', 'Muchos pasos se cumplen *solos*',
              '«Casa de paz, ¿cuál?»: las más *cercanas*', 'Un paso cumplido, un *logro*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#rut-ceja', 0.1, { dy: 16 });

            // f0 · el celular con la tarjeta de Valeria en Mi seguimiento (ya en «Se conecta con una casa de paz»).
            const cItem = A.caja($('rut-item'), cam);
            const scroll = -Math.max(0, Math.round(cItem.y - 56 - 150));
            tl.set(pag, { y: scroll }, 0);
            tl.fromTo('#rut-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            A.foco(tl, pag, $('rut-item'), P(f0, /^conecta/, -0.4), T.pulso(f1.inicio + 0.2), { pad: 4, radio: 18 });

            // f1 · la ruta de crecimiento: la escalera de los pasos de fábrica, cada uno en su palabra.
            const pasos = [['church', 'Llega a la iglesia', /^llega/], ['diversity_3', 'Se conecta con una casa de paz', /^conecta/],
              ['school', 'Inicia clases de la visión', /^clases/], ['volunteer_activism', 'Empieza a servir', /^servir/]];
            const XS = [0, 70, 140, 210], YS = [40, 150, 260, 370];
            const chips = pasos.map(([ic, tx], i) => H.ancla(esc, `rut-p-${i}`, XS[i], YS[i], `<span class="paso-chip">${H.icono(ic, 38)}${tx}</span>`, ''));
            chips.forEach((c) => { c.firstChild.style.transform = 'translate(0, -50%)'; });
            const linea = H.camino(svg, 'rut-linea', `M 30 ${YS[0] + 34} L 30 ${YS[0] + 70} L ${XS[1] + 30} ${YS[0] + 70} L ${XS[1] + 30} ${YS[1] - 34} M ${XS[1] + 30} ${YS[1] + 34} L ${XS[1] + 30} ${YS[1] + 70} L ${XS[2] + 30} ${YS[1] + 70} L ${XS[2] + 30} ${YS[2] - 34} M ${XS[2] + 30} ${YS[2] + 34} L ${XS[2] + 30} ${YS[2] + 70} L ${XS[3] + 30} ${YS[2] + 70} L ${XS[3] + 30} ${YS[3] - 34}`, false);
            pasos.forEach(([ic, tx, re], i) => {
              const f = f1;
              const ws = f.palabras.filter((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, '')));
              const w = (i === 1 ? ws[0] : ws[ws.length - 1]) || { inicio: f.inicio + i };
              const t = T.pulso((i === 0 ? H.palabra(f, /^llega/).inicio : i === 3 ? H.palabra(f, /^servir/).inicio : w.inicio) - 0.3);
              tl.fromTo(chips[i], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, t);
            });
            H.dibujar(tl, linea.p, P(f1, /^llega/, 0.2), 4.4);

            // f2 · muchos pasos se cumplen solos: un rayo y cómo (al asistir, al empezar un curso, al unirse a un equipo).
            const solos = [[0, 'al asistir', /^asiste/], [2, 'al empezar un curso', /^curso/], [3, 'al unirse a un equipo', /^equipo/]];
            const tS = P(f2, /^solos/, -0.3);
            solos.forEach(([k, tx, re], j) => {
              const ancho = chips[k].firstChild.firstChild.offsetWidth || A.medida(chips[k].firstChild.firstChild).w;
              const s = H.ancla(esc, `rut-s-${j}`, XS[k] + ancho + 24, YS[k], `<span class="solo">${H.icono('bolt', 34, true)}${tx}</span>`, '');
              s.firstChild.style.transform = 'translate(0, -50%)';
              H.entra(tl, s, j === 0 ? tS + 0.3 : P(f2, re, -0.4), { dy: 10 });
              tl.to(`#rut-p-${k} .paso-chip`, { boxShadow: 'inset 0 0 0 2px rgba(232, 185, 90, 0.95)', duration: 0.3 }, j === 0 ? tS + 0.3 : P(f2, re, -0.4));
            });

            // f3 · «Casa de paz · ¿cuál?»: foco y el dedo en la tarjeta; el chip late y salen «las más cercanas» (no se recrea la lista).
            const tC = P(f3, /^casa/, -0.2);
            A.camara(tl, cam, { z: 1.4, borde: 'izquierda', cy: A.caja($('rut-cual'), cam).cy + scroll, t: tC - 0.6, d: 0.8 });
            A.foco(tl, pag, $('rut-cual'), tC, T.pulso(f3.fin + 0.3), { pad: 4, radio: 24 });
            A.tocar(tl, pag, $('rut-cual'), P(f3, /^cual/, 0.1));
            H.late(tl, '#rut-cual', P(f3, /^cual/, 0.3), { de: 1.1 });
            const cerca = H.ancla(sobre, 'rut-cerca', 1404, 870, `<span class="rotulo-kit">${H.icono('location_on', 30, true)}Las más cercanas</span>`, '');
            H.entra(tl, cerca, P(f3, /^cercanas/, -0.3), { dy: 14 });
            H.sale(tl, cerca, T.pulso(f4.inicio + 0.6), { d: 0.3 });
            A.camara(tl, cam, { z: 1, t: T.pulso(f4.inicio), d: 0.8 });

            // f4 · un paso cumplido puede dar un logro; cuando cumple sus objetivos, «¡Se conectó con la iglesia!» (la subida del kit cae aquí).
            const tL = P(f4, /^logro/, -0.4);
            H.sale(tl, [...chips, ...solos.map((s, j) => `#rut-s-${j}`), linea.p], tL - 0.2, { d: 0.35, stagger: 0.03 });
            const medalla = H.nodo(esc, 'rut-medalla', 430, 170, 'workspace_premium', true, 170);
            const rMed = H.ancla(esc, 'rut-medalla-r', 430, 290, 'Un logro', 'rot oro');
            H.pop(tl, medalla, tL);
            H.entra(tl, rMed, tL + 0.2, { dy: 12 });
            const tCx = P(f4, /^conecto/, -0.5);
            const celebra = H.ancla(esc, 'rut-celebra', 430, 420, '<span class="celebra">¡Se conectó con <em>la iglesia</em>!</span>', '');
            H.entra(tl, celebra, tCx, { dy: 24, d: 0.6 });
            const golpe = P(f4, /^iglesia/, -0.2);
            const az = H.azar(29);
            for (let i = 0; i < 14; i++) {
              const a = (i / 14) * Math.PI * 2, r = 120 + az() * 40;
              const ch = H.el('span', 'chispa', esc, `rut-ch-${i}`, { left: '430px', top: '170px' });
              tl.fromTo(ch, { opacity: 0, x: 0, y: 0, scale: 0.4 }, { opacity: 1, x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 1, duration: 0.55, ease: 'power3.out' }, golpe);
              tl.to(ch, { opacity: 0, duration: 0.4, ease: 'power1.in' }, golpe + 0.6);
            }
            H.late(tl, medalla, golpe, { de: 1.18 });

            H.sale(tl, ['#rut-tel', '#rut-esc', '#rut-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['ruta'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
