            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).

            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },

            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {

            const Y = 690;
            const XS = [330, 700, 1070, 1440];
            const etapas = [['Te conoce', 'travel_explore', /^conociendo/, f0], ['Decide', 'lightbulb', /^decide/, f1], ['Vive el domingo', 'church', /^vive/, f2], ['Dice sí', 'favorite', /^si/, f3]];
            const base = H.linea(svg, 'cam-base', 250, Y, 1440, Y, false);
            H.dibujar(tl, base, T.pulso(f0.inicio), 1.2);
            const nodos = etapas.map(([tx, ic], i) => H.nodo(esc, `cam-n-${i}`, XS[i], Y, ic, false, 112));
            const rots = etapas.map(([tx], i) => H.ancla(esc, `cam-r-${i}`, XS[i], Y + 100, tx, 'rot'));
            const yo = H.punto(esc, 'cam-yo', XS[0], Y - 92, 'k-oro', 34);
            const halo = H.el('div', 'halo', esc, 'cam-halo', { left: `${XS[0]}px`, top: `${Y - 92}px` });
            etapas.forEach(([tx, ic, re, f], i) => {
              const t = T.pulso(H.palabra(f, re).inicio - 0.3);
              H.pop(tl, nodos[i], i === 0 ? T.pulso(f0.inicio) + 0.2 : t - 0.5);
              H.entra(tl, rots[i], i === 0 ? T.pulso(f0.inicio) + 0.4 : t - 0.35, { dy: 12 });
              if (i === 0) H.pop(tl, yo, t);
              else tl.to(yo, { x: XS[i] - XS[0], duration: 0.8, ease: 'power3.inOut' }, t - 0.3);
              tl.to(`#cam-n-${i}-n`, { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, t + 0.4);
              tl.set(halo, { x: XS[i] - XS[0] }, t + 0.45);
              H.halo(tl, halo, t + 0.5);
            });

            // f4 · el tramo entre «Vive el domingo» y «Dice sí» es tuyo: se ilumina en dorado, con el rótulo «Afirmación».
            const tramo = H.linea(svg, 'cam-tramo', XS[2] + 60, Y, XS[3] - 60, Y, true);
            tramo.style.strokeWidth = '8';
            const tT = T.pulso(H.palabra(f4, /^tuyo/).inicio - 0.4);
            H.dibujar(tl, tramo, tT, 0.7);
            const afir = H.chip(esc, 'cam-afir', (XS[2] + XS[3]) / 2, Y - 110, `${H.icono('diversity_3', 34, true)}Afirmación`, 'oro');
            H.pop(tl, afir, tT + 0.4);

            // f5 · la acogida es un camino y no termina el domingo: la línea sigue, cruza el rótulo «Lunes» y continúa.
            const tC = T.pulso(H.palabra(f5, /^camino/).inicio - 0.3);
            const sigue = H.linea(svg, 'cam-sigue', XS[3] + 60, Y, 1700, Y, false);
            sigue.style.strokeDasharray = sigue.style.strokeDasharray; // se dibuja como las otras
            H.dibujar(tl, sigue, tC, 0.9);
            const lunes = H.chip(esc, 'cam-lunes', (XS[2] + XS[3]) / 2, Y + 190, `${H.icono('calendar_today', 34)}Lunes`, '');
            H.entra(tl, lunes, T.pulso(H.palabra(f5, /^termina/).inicio - 0.3), { dy: 16 });
            const flecha = H.ancla(esc, 'cam-flecha', 1700, Y, H.icono('arrow_forward', 48), 'rot');
            H.pop(tl, flecha, tC + 0.8);

            // f6 · quien decide si la iglesia es acogedora es la persona que llega: un ojo sobre el punto dorado.
            const tLl = T.pulso(H.palabra(f6, /^llega/).inicio - 0.4);
            const ojo = H.ancla(esc, 'cam-ojo', XS[3], Y - 200, H.icono('visibility', 64, true), '');
            H.pop(tl, ojo, tLl);
            H.late(tl, yo, tLl + 0.4, { de: 1.6 });
            tl.set(halo, { x: XS[3] - XS[0] }, tLl + 0.4);
            H.halo(tl, halo, tLl + 0.45);
            const adentro = H.ancla(esc, 'cam-adentro', XS[1], Y - 190, `${H.icono('groups', 40)}`, 'rot');
            tl.fromTo(adentro, { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, T.pulso(H.palabra(f6, /^adentro/).inicio - 0.3));

            H.sale(tl, ['#cam-esc', '#cam-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['camino'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
