                <span class="k-app-nav"><span class="k-app-icono-caja"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/person.svg)"></span></span>Perfil</span>
              </nav>
              <div class="k-app-velo" id="lla-velo"></div>
              <!-- Reporte del paso (formulario de fábrica de los pasos de llamada) -->
              <div class="k-app-dialogo dlg" id="lla-dlg" style="--k-app-fondo-campo: #faf9fd">
                <h2 class="k-app-dialogo-titulo">Reporte del paso</h2>
                <p class="quien"><b>Valeria Cardona Ríos</b> · Llamada de bienvenida</p>
                <div class="preguntas" id="lla-preguntas">
                  <div><p class="pregunta">¿Cómo fue?<i>*</i></p>
                    <div class="radios">
                      <div class="k-app-radio" id="lla-r-contesto"><span class="k-app-radio-circulo"><span id="lla-r-punto"></span></span>Contestó</div>
                      <div class="k-app-radio"><span class="k-app-radio-circulo"><span></span></span>No contestó</div>
                      <div class="k-app-radio"><span class="k-app-radio-circulo"><span></span></span>Lo visité</div>
                    </div></div>
                  <div class="k-app-campo k-app-area" id="lla-peticion"><span class="k-app-campo-etiqueta">Petición de oración</span><span class="k-app-campo-valor"></span><span class="redim"></span></div>
                  <div class="k-app-campo k-app-area" id="lla-obs"><span class="k-app-campo-etiqueta">Observaciones</span><span class="k-app-campo-valor"></span><span class="redim"></span></div>
                </div>
                <div class="acc-reporte">
                  <span class="k-app-boton texto">Cancelar</span>
                  <span class="k-app-boton contorno" id="lla-intento">Solo registrar el intento</span>
                  <span class="k-app-boton" id="lla-dlg-ok">Marcar cumplido</span>
                </div>
              </div>
              <!-- El resultado: el paso cumplido y el siguiente que propone el flujo -->
              <div class="k-app-dialogo dlg" id="lla-res">
                <h2 class="k-app-dialogo-titulo">Reporte del paso</h2>
                <p class="quien"><b>Valeria Cardona Ríos</b> · Llamada de bienvenida</p>
                <div class="resultado">
                  <span class="k-app-icono grande" style="--k-icono: url(identidad/iconos/task_alt.svg)"></span>
                  <p><b>«Llamada de bienvenida» cumplido</b></p>
                  <p id="lla-ahora">Ahora va en: Llega a la iglesia</p>
                </div>
                <div class="k-app-acciones" id="lla-res-acc"><span class="k-app-boton contorno">Elegir otro paso</span><span class="k-app-boton" id="lla-listo">Listo</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('lla-dia'), cam = $('lla-cam'), pag = $('lla-pag');
            const bs = H.bloques(T, $('lla-col'), 'lla', ['Un mensaje *informa*. Una llamada *abraza*.', 'Abre «*Mi seguimiento*»', 'El semáforo: ¿va *a tiempo*?',
              'Llama y toca «*Marcar cumplido*»', '¿No contestó? Registra el *intento*', 'Kingdom propone el *siguiente* paso', 'Tu iglesia arma su *formulario*']);
            // «informa» en gris (lo automático) y «abraza» en dorado (la llamada): el contraste de la primera frase.
            bs[0].spans[2].s.classList.add('gris');
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#lla-ceja', 0.1, { dy: 16 });

            // f0 · el contraste: un mensaje automático (tenue) informa; una llamada a tiempo (dorada) abraza.
            const msj = H.nodo(dia, 'lla-msj', 324, 300, 'chat_bubble', false, 140);
            const rMsj = H.ancla(dia, 'lla-msj-r', 324, 410, 'Informa', 'rot');
            const lla = H.nodo(dia, 'lla-lla', 324, 560, 'call', true, 160);
            const rLla = H.ancla(dia, 'lla-lla-r', 324, 682, 'Abraza', 'rot oro');
            tl.fromTo(msj, { opacity: 0, scale: 0 }, { opacity: 0.55, scale: 1, duration: 0.45, ease: 'back.out(2)' }, P(f0, /^mensaje/, -0.2));
            H.entra(tl, rMsj, P(f0, /^informa/, -0.2), { dy: 12 });
            H.pop(tl, lla, P(f0, /^llamada/, -0.2));
            H.entra(tl, rLla, P(f0, /^abraza/, -0.2), { dy: 12 });
            const halo = H.el('div', 'halo', dia, 'lla-halo', { left: '324px', top: '560px', width: '200px', height: '200px', margin: '-100px 0 0 -100px' });
            H.halo(tl, halo, P(f0, /^abraza/));
            H.sale(tl, [msj, rMsj, lla, rLla], T.pulso(f1.inicio - 0.5), { d: 0.35, stagger: 0.04 });

            // f1 · Mi seguimiento: entra el celular; «Acompañados» y la tarjeta con el paso que le toca.
            tl.fromTo('#lla-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f1.inicio - 0.2));
            const tSeg = P(f1, /^seguimiento/, -0.2);
            A.foco(tl, pag, $('lla-acomp'), tSeg + 0.2, P(f1, /^acompana/, 0.3), { pad: 4, radio: 22 });
            const item = $('lla-item');
            const cItem = A.caja(item, cam);
            A.camara(tl, cam, { z: 1, cy: 406, t: tSeg, d: 0.4 });
            const scroll = -Math.max(0, Math.round(cItem.y - 56 - 120));
            A.desliz(tl, pag, scroll, P(f1, /^paso/, -0.9), 0.8);
            A.camara(tl, cam, { z: 1.35, borde: 'izquierda', cy: cItem.y + scroll + 70, t: P(f1, /^paso/, -0.3), d: 0.9 });
            A.foco(tl, pag, $('lla-paso'), P(f1, /^paso/), P(f1, /^toca/, 0.5), { pad: 4, radio: 8 });

            // f2 · el semáforo: «A tiempo» → «Por vencer» → «Vencido» y vuelve (con su «Hace … · vence …»).
            const est = (de, a, t) => {
              tl.to([`#lla-s-${de}`, `#lla-d-${de}`], { opacity: 0, duration: 0.15 }, t);
              tl.to([`#lla-s-${a}`, `#lla-d-${a}`], { opacity: 1, duration: 0.15 }, t);
            };
            const tAt = P(f2, /^tiempo/, -0.3);
            A.foco(tl, pag, $('lla-sem'), P(f2, /^semaforo/, -0.1), T.pulso(f2.fin + 0.6), { pad: 5, radio: 12 });
            est('amarillo', 'verde', tAt);
            est('verde', 'amarillo', P(f2, /^vencer/, -0.2));
            est('amarillo', 'rojo', P(f2, /^vencio/, -0.2));
            est('rojo', 'amarillo', T.pulso(f2.fin + 0.4));
            H.late(tl, '#lla-sem', tAt, { de: 1.2 });

            // f3 · llama desde la tarjeta (el teléfono, con su onda); al colgar, «Marcar cumplido» y el reporte: cómo fue, petición y observaciones.
            A.tocar(tl, pag, $('lla-llamar'), P(f3, /^llama/, 0.1));
            const tMc = P(f3, /^marcar/, -0.1);
            A.camara(tl, cam, { z: 1, t: tMc - 0.6, d: 0.6 });
            A.tocar(tl, pag, $('lla-cumplido'), tMc);
            A.hoja(tl, $('lla-dlg'), tMc + 0.25, { tipo: 'dialogo', velo: $('lla-velo') });
            const tCf = P(f3, /^como/, -0.2);
            A.camara(tl, cam, { z: 1.3, borde: 'izquierda', cy: 330, t: tCf - 0.5, d: 0.7 });
            A.tocar(tl, $('lla-dlg'), $('lla-r-contesto'), tCf, { dx: -150 });
            tl.to('#lla-r-punto', { opacity: 1, duration: 0.1 }, tCf + 0.05);
            tl.to('#lla-r-contesto .k-app-radio-circulo', { boxShadow: 'inset 0 0 0 2px #015bbe', duration: 0.1 }, tCf + 0.05);
            ['lla-peticion', 'lla-obs'].forEach((id) => A.vaciar(tl, $(id)));
            const tPe = P(f3, /^peticion/, -0.1);
            A.camara(tl, cam, { z: 1.3, borde: 'izquierda', cy: 520, t: tPe - 0.4, d: 0.6 });
            A.escribir(tl, $('lla-peticion'), 'Por su familia', tPe, { cps: 18, espera: 0.3 });
            A.escribir(tl, $('lla-obs'), 'Quiere conocer la casa de paz', P(f3, /^observaciones/, -0.3), { cps: 22, espera: 0.4 });

            // f4 · si no contestó: «Solo registrar el intento» (queda constancia; el paso no se cumple). Foco en el botón.
            const tIn = P(f4, /^intento/, -0.6);
            A.camara(tl, cam, { z: 1.3, borde: 'izquierda', cy: 640, t: T.pulso(f4.inicio), d: 0.8 });
            A.foco(tl, $('lla-dlg'), $('lla-intento'), tIn, T.pulso(f4.fin + 0.2), { pad: 4, radio: 24 });

            // f5 · «Marcar cumplido»: el resultado dice el paso cumplido y el siguiente del flujo; «Listo» lo acepta o «Elegir otro paso».
            const tOk = P(f5, /^siguiente/, -0.6);
            A.tocar(tl, $('lla-dlg'), $('lla-dlg-ok'), tOk);
            A.camara(tl, cam, { z: 1, t: tOk + 0.15, d: 0.6 });
            tl.to('#lla-dlg', { opacity: 0, scale: 0.97, duration: 0.2 }, tOk + 0.25);
            tl.fromTo('#lla-res', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out' }, tOk + 0.35);
            A.foco(tl, $('lla-res'), $('lla-ahora'), P(f5, /^siguiente/, -0.1), P(f5, /^acepta/, -0.2), { pad: 4, radio: 8 });
            A.foco(tl, $('lla-res'), $('lla-res-acc'), P(f5, /^acepta/, -0.1), T.pulso(f5.fin + 0.3), { pad: 4, radio: 26 });

            // f6 · tu iglesia arma su propio formulario para esa llamada: vuelve el reporte y un recuadro dorado con el rótulo del kit.
            const tFo = P(f6, /^formulario/, -0.6);
            tl.to('#lla-res', { opacity: 0, duration: 0.2 }, T.pulso(f6.inicio - 0.2));
            tl.to('#lla-dlg', { opacity: 1, scale: 1, duration: 0.3 }, T.pulso(f6.inicio));
            const pr = $('lla-preguntas');
            const cP = A.caja(pr, $('lla-dlg'));
            const marco = H.el('div', 'marco', $('lla-dlg'), 'lla-marco', { left: `${cP.x - 6}px`, top: `${cP.y - 6}px`, width: `${cP.w + 12}px`, height: `${cP.h + 12}px` });
            tl.fromTo(marco, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power2.out' }, tFo);
            const tuyo = H.ancla(dia, 'lla-tuyo', -460, 700, `<span class="rotulo-kit">${H.icono('edit_note', 30, true)}Tu formulario</span>`, '');
            H.entra(tl, tuyo, tFo + 0.2, { dy: 16 });
            const preg = H.ancla(dia, 'lla-preg', -460, 772, 'Con las preguntas de tu iglesia', 'rot');
            H.entra(tl, preg, P(f6, /^preguntas/, -0.3), { dy: 12 });

            H.sale(tl, ['#lla-tel', '#lla-dia', '#lla-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['llamada'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
