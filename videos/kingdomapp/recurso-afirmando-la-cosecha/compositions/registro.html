              <!-- S1 · el QR de bienvenida en grande (para proyectarlo en el altar) -->

                <span class="k-app-boton-icono cerrar"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/close.svg)"></span></span>

                <div style="position: relative" id="reg-qr-caja">

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          // Un QR ficticio (no codifica nada): los tres patrones de posición y módulos con semilla fija.
          const dibujarQR = () => {
            const N = 25, Q = 4, az = H.azar(241), on = [];
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) on.push(az() < 0.48);
            const finder = (fx, fy) => { for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
              const X = fx + x, Y = fy + y; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
              const borde = x === 0 || x === 6 || y === 0 || y === 6, centro = x >= 2 && x <= 4 && y >= 2 && y <= 4;
              on[Y * N + X] = x >= 0 && x <= 6 && y >= 0 && y <= 6 && (borde || centro); } };
            finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
            for (let i = 8; i < N - 8; i++) { on[6 * N + i] = i % 2 === 0; on[i * N + 6] = i % 2 === 0; }
            let d = '';
            on.forEach((v, i) => { if (v) d += `M${(i % N) + Q} ${Math.floor(i / N) + Q}h1v1h-1z`; });
            document.getElementById('reg-qr-path').setAttribute('d', d);
          };

          const construir = () => {
            dibujarQR();
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('reg-dia'), cam = $('reg-cam'), form = $('reg-form');
            const bs = H.bloques(T, $('reg-col'), 'reg', ['Todo empieza con un *registro*', 'El *QR de bienvenida*', 'O en «*Nueva persona*»',
              'Nombres, teléfono y *cómo llegó*', '¿Quién la *invitó*?', 'Si ya estaba, registras su *llegada*', 'Desde ahí empieza su *ruta*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#reg-ceja-1', 0.1, { dy: 16 });

            // f0 · alguien llegó y no tiene nombre (un punto dorado); en «registro» entra el celular con el QR de bienvenida en grande.
            const sobre = $('reg-sobre');
            const yo = H.punto(sobre, 'reg-yo', 324, 380, 'k-oro', 40);
            const sinNombre = H.chip(dia, 'reg-sin', 324, 470, `${H.icono('person', 34)}Sin nombre`, '');
            H.pop(tl, yo, P(f0, /^alguien/, -0.2));
            H.entra(tl, sinNombre, P(f0, /^alguien/, 0.1), { dy: 14 });
            const tTel = P(f0, /^registro/, -0.7);
            H.sale(tl, sinNombre, tTel - 0.2, { d: 0.3 });
            tl.to(yo, { x: -230, y: 150, scale: 0.8, duration: 0.8, ease: 'power3.inOut' }, tTel - 0.1);
            tl.fromTo('#reg-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, tTel);

            // f1 · el QR de bienvenida: el punto dorado se acerca y lo escanea (la línea dorada recorre el código).
            const tQR = P(f1, /^qr/, -0.2);
            A.foco(tl, $('reg-qr'), $('reg-qr-caja'), tQR, P(f1, /^escanea/, -0.4), { pad: 8, radio: 12 });
            const tEsc = P(f1, /^escanea/, -0.3);
            tl.to(yo, { x: 30, y: 10, scale: 1, duration: 0.7, ease: 'power3.inOut' }, tEsc - 0.6);
            tl.fromTo('#reg-escaner', { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.15 }, tEsc);
            tl.to('#reg-escaner', { y: 300, duration: 1.0, ease: 'power1.inOut' }, tEsc + 0.05);
            tl.to('#reg-escaner', { opacity: 0, duration: 0.2 }, tEsc + 1.0);
            const sola = H.chip(dia, 'reg-sola', -460, 700, `${H.icono('check_circle', 34, true)}Se registra sola`, 'oro');
            H.pop(tl, sola, P(f1, /^sola/, -0.3));
            H.late(tl, '#reg-qr .invita', P(f1, /^sola/, -0.2), { de: 1.08 });

            // f2 · Membresía → Personas: el dedo toca «Nueva persona» y abre el formulario; funciona sin señal (rótulo del kit).
            const tS2 = T.pulso(f2.inicio - 0.4);
            H.sale(tl, [sola, yo], tS2 - 0.2, { d: 0.3 });
            tl.to('#reg-qr', { opacity: 0, duration: 0.35, ease: 'power1.in' }, tS2);
            H.sale(tl, '#reg-ceja-1', tS2, { d: 0.3 });
            tl.fromTo('#reg-ceja-2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tS2 + 0.3);
            const tFab = P(f2, /^nueva/);
            A.tocar(tl, cam, $('reg-fab'), tFab);
            tl.to(['#reg-lista', '#reg-fab'], { opacity: 0, duration: 0.2 }, tFab + 0.18);
            tl.fromTo(form, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out' }, tFab + 0.2);
            const senal = H.ancla(dia, 'reg-senal', -460, 700, `<span class="rotulo-kit">${H.icono('wifi_off', 30, true)}Funciona sin señal</span>`, '');
            H.entra(tl, senal, P(f2, /^sin/, -0.3), { dy: 16 });
            H.sale(tl, senal, T.pulso(f3.inicio + 1.0), { d: 0.3 });

            // f3 · nombres, teléfono y «Cómo llegó»: se escriben; foco y acercamiento al select; se abre y elige «Invitación de alguien».
            ['reg-nombres', 'reg-apellidos', 'reg-telefono', 'reg-forma', 'reg-red', 'reg-invito'].forEach((id) => A.vaciar(tl, $(id)));
            A.camara(tl, cam, { z: 1.45, borde: 'izquierda', cy: 260, t: T.pulso(f2.fin - 0.6), d: 0.9 });
            const fN = A.escribir(tl, $('reg-nombres'), 'Valeria', T.pulso(f2.fin - 0.1), { cps: 16, espera: 0.25 });
            const fA = A.escribir(tl, $('reg-apellidos'), 'Cardona Ríos', H.r3(fN + 0.4), { cps: 18, espera: 0.25 });
            A.escribir(tl, $('reg-telefono'), '5557654321', Math.max(H.r3(fA + 0.4), P(f3, /^telefono/)), { cps: 18, espera: 0.3 });
            const tCL = P(f3, /^como/, -0.2);
            const forma = $('reg-forma');
            const cF = A.caja(forma, cam);
            A.camara(tl, cam, { z: 1.4, borde: 'izquierda', cy: cF.cy + 110, t: tCL - 0.3, d: 0.8 });
            A.foco(tl, form, forma, tCL, tCL + 0.75, { pad: 6, radio: 10 });
            A.tocar(tl, form, forma, tCL + 0.55);
            tl.to(forma, { boxShadow: 'inset 0 0 0 2px #015bbe', duration: 0.12 }, tCL + 0.6);
            tl.to('#reg-forma .k-app-campo-etiqueta', { color: '#015bbe', duration: 0.12 }, tCL + 0.6);
            tl.fromTo('#reg-menu', { opacity: 0, scaleY: 0.85, transformOrigin: '50% 0%' }, { opacity: 1, scaleY: 1, duration: 0.22, ease: 'power2.out' }, tCL + 0.7);
            const tInv = P(f3, /^invitacion/, -0.1);
            A.foco(tl, form, $('reg-op-inv'), tInv - 0.6, tInv + 0.5, { pad: 0, radio: 4 });
            A.tocar(tl, form, $('reg-op-inv'), tInv);
            tl.set('#reg-op-inv', { backgroundColor: '#e3e2e6' }, tInv);
            tl.to('#reg-menu', { opacity: 0, duration: 0.18 }, tInv + 0.25);
            tl.set('#reg-forma-valor', { opacity: 1 }, tInv + 0.3);
            tl.fromTo('#reg-forma .k-app-campo-etiqueta', { y: 28, scale: 4 / 3 }, { y: 0, scale: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, tInv + 0.3);
            tl.to(forma, { boxShadow: 'inset 0 0 0 1px #74777f', duration: 0.15 }, tInv + 0.7);
            tl.to('#reg-forma .k-app-campo-etiqueta', { color: '#44474f', duration: 0.15 }, tInv + 0.7);

            // f4 · quién la invitó: la página baja hasta el campo, foco; se escribe «Marta» y se elige «Marta Gómez».
            const tBaja = T.pulso(f4.inicio - 0.4);
            const scrollY = -300;
            A.camara(tl, cam, { z: 1, t: tBaja - 0.3, d: 0.8 });
            A.desliz(tl, form, scrollY, tBaja, 0.9);
            const inv = $('reg-invito');
            const cI = A.caja(inv, cam);
            A.camara(tl, cam, { z: 1.5, borde: 'izquierda', cy: cI.cy + scrollY + 50, t: tBaja + 0.9, d: 0.8 });
            const tInvito = P(f4, /^invito/, -0.3);
            A.foco(tl, form, inv, tInvito - 0.5, tInvito + 0.2, { pad: 6, radio: 10 });
            A.escribir(tl, inv, 'Marta', tInvito, { cps: 14, desenfocar: false });
            tl.fromTo('#reg-opciones', { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' }, tInvito + 0.45);
            const tMarta = P(f4, /^tambien/, -0.2);
            A.tocar(tl, form, $('reg-op-marta'), tMarta);
            tl.to(['#reg-opciones', inv], { opacity: 0, duration: 0.2 }, tMarta + 0.2);
            tl.to('#reg-elegida', { opacity: 1, duration: 0.25 }, tMarta + 0.25);

            // f5 · si ya estaba registrada: arriba aparece «¿Ya está registrada?»; el dedo toca «Es esta…» y confirma «Registrar llegada».
            const tSube = T.pulso(f5.inicio - 0.3);
            A.camara(tl, cam, { z: 1, t: tSube - 0.2, d: 0.7 });
            A.desliz(tl, form, 0, tSube, 0.8);
            const cand = $('reg-cand');
            const alto = A.medida(cand).h + 12;
            const tReg = P(f5, /^registrada/, -0.4);
            tl.to('#reg-resto', { y: alto, duration: 0.45, ease: 'power3.out' }, tReg);
            tl.fromTo(cand, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, tReg + 0.1);
            const cC = A.caja(cand, cam);
            A.camara(tl, cam, { z: 1.35, borde: 'izquierda', cy: cC.cy, t: tReg + 0.3, d: 0.8 });
            const tAvisa = P(f5, /^kingdom/, -0.3);
            const tEs = P(f5, /^avisa/, -0.2);
            A.foco(tl, form, cand, tAvisa, tEs + 0.1, { pad: 6, radio: 20 });
            A.tocar(tl, form, $('reg-es-esta'), tEs);
            A.camara(tl, cam, { z: 1, t: tEs + 0.15, d: 0.5 });
            A.hoja(tl, $('reg-dlg'), tEs + 0.25, { tipo: 'dialogo', velo: $('reg-velo'), hasta: P(f5, /^llegada/, 0.25) });
            const tOk = P(f5, /^llegada/, -0.15);
            A.tocar(tl, cam, $('reg-dlg-ok'), tOk);
            A.aparecer(tl, $('reg-snack'), tOk + 0.4);
            A.quitar(tl, $('reg-snack'), P(f6, /^momento/));

            // f6 · desde ese momento empieza su ruta: el primer paso, «Llamada de bienvenida» (rótulo del kit junto a la persona).
            const tPaso = P(f6, /^llamada/, -0.5);
            A.camara(tl, cam, { z: 1.3, borde: 'izquierda', cy: cC.cy, t: P(f6, /^empieza/, -0.3), d: 0.9 });
            const paso = H.ancla(dia, 'reg-paso', -460, 730, `<span class="rotulo-kit">${H.icono('call', 30, true)}Llamada de bienvenida</span>`, '');
            const primer = H.ancla(dia, 'reg-primer', -460, 662, 'Primer paso', 'rot oro');
            H.entra(tl, primer, P(f6, /^primer/, -0.3), { dy: 12 });
            tl.fromTo(paso, { opacity: 0, x: 40, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, tPaso);
            H.late(tl, paso, tPaso + 0.8, { de: 1.08 });

            H.sale(tl, ['#reg-tel', '#reg-dia', '#reg-sobre', '#reg-ceja-2'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['registro'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
