          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });

            const el = (tag, cls, padre, id, css) => {

            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.

            const punto = (padre, id, x, y, cls, tam) => {

            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));

              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;

            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);

              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };

            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {

            const contar = (tl, elc, a, b, t, d) => {

            };

            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };

            const tl = gsap.timeline({ paused: true });

            H.entra(tl, '#gan-ceja-1', 0.1, { dy: 16 });

            H.entra(tl, '#gan-altar', T.pulso(f0.inicio), { dy: 20, d: 0.6 });
            const altarRot = H.ancla(dia, 'gan-altar-rot', 324, 392, 'Altar', 'rot oro');
            H.entra(tl, altarRot, T.pulso(f0.inicio) + 0.3, { dy: 10 });
            const pos = [];
            for (let i = 0; i < 12; i++) pos.push({ x: 90 + (i % 6) * 94, y: i < 6 ? 475 : 535 });
            const pts = pos.map((p, i) => H.punto(dia, `gan-p-${i}`, p.x, p.y, 'k-oro', 28));
            const tP = T.pulso(H.palabra(f0, /^personas/).inicio - 0.2);
            tl.fromTo(pts, { opacity: 0, y: 140, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.8)', stagger: 0.06 }, tP);
            const nEl = document.getElementById('gan-n');
            H.entra(tl, nEl, T.pulso(H.palabra(f0, /^doce/).inicio - 0.3), { dy: 20 });
            H.contar(tl, nEl, 0, 12, T.pulso(H.palabra(f0, /^doce/).inicio - 0.2), 1.1);
            H.entra(tl, '#gan-datos', T.pulso(H.palabra(f0, /^doce/).inicio - 0.3), { dy: 12 });

            // f1 · pasaron al altar (la franja late), dejaron sus datos y volvieron a casa (los puntos se alejan un poco).
            const tAl = T.pulso(H.palabra(f1, /^altar/).inicio - 0.2);
            tl.fromTo('#gan-altar', { boxShadow: 'inset 0 0 0 2px rgba(232, 185, 90, 0.45)' }, { boxShadow: 'inset 0 0 0 4px rgba(232, 185, 90, 0.95)', duration: 0.3, yoyo: true, repeat: 1, ease: 'power1.inOut', immediateRender: false }, tAl);
            const tCasa = T.pulso(H.palabra(f1, /^casa/).inicio - 0.4);
            const az = H.azar(7);
            pts.forEach((p, i) => tl.to(p, { x: (az() - 0.5) * 50, y: (i < 6 ? 10 : -6) + az() * 18, duration: 1.1, ease: 'power2.inOut' }, tCasa + (i % 6) * 0.03));

            // f2 · ¿cuántas vuelven? La mayoría se apaga y se va; quedan tres.
            const tV = T.pulso(H.palabra(f2, /^vuelven/).inicio - 0.2);
            const quedan = [2, 7, 9];
            pts.forEach((p, i) => {
              if (quedan.includes(i)) return;
              tl.to(p, { backgroundColor: 'rgba(169, 182, 214, 0.35)', duration: 0.3 }, tV + i * 0.03);
              tl.to(p, { y: 260 + az() * 80, x: (az() - 0.5) * 240, opacity: 0, duration: 1.3, ease: 'power2.in' }, tV + 0.35 + i * 0.04);
            });
            H.sale(tl, ['#gan-n', '#gan-datos'], tV + 0.6, { d: 0.4 });

            // f3 · se pierde el lunes: el calendario con el lunes vacío y un teléfono que no suena.
            const tL = T.pulso(H.palabra(f3, /^lunes/).inicio - 0.4);
            H.entra(tl, '#gan-cal', tL - 0.5, { dy: 30 });
            H.late(tl, '#gan-lun', tL + 0.3, { de: 1.25 });
            const tel = H.ancla(dia, 'gan-tel', 324, 336, H.icono('call', 72), 'rot');
            tl.fromTo(tel, { opacity: 0, y: 20 }, { opacity: 0.38, y: 0, duration: 0.5, ease: 'power2.out' }, T.pulso(H.palabra(f3, /^nadie/).inicio - 0.3));
            const nadie = H.ancla(dia, 'gan-nadie', 324, 392, 'Nadie llama', 'rot');
            tl.fromTo(nadie, { opacity: 0 }, { opacity: 0.7, duration: 0.4 }, T.pulso(H.palabra(f3, /^llama/).inicio - 0.2));

            // f4 · si diriges afirmación: la ceja cambia; los tres que quedan reciben un anillo azul (alguien los acompaña).
            const tA = T.pulso(H.palabra(f4, /^afirmacion/).inicio - 0.3);
            H.sale(tl, '#gan-ceja-1', tA - 0.3, { d: 0.3 });
            tl.fromTo('#gan-ceja-2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tA);
            H.sale(tl, ['#gan-cal', tel, nadie], tA + 0.2, { d: 0.4 });
            const equipo = H.chip(dia, 'gan-equipo', 324, 720, `${H.icono('diversity_3', 34)}Equipo de afirmación`, 'azul');
            H.entra(tl, equipo, tA + 0.5, { dy: 18 });

            // f5 · que se quede, crezca y se multiplique: todos vuelven a encenderse y se unen en un grupo.
            const tQ = T.pulso(H.palabra(f5, /^quede/).inicio - 0.3);
            const cx = 324 - 0, cy = 505;
            pts.forEach((p, i) => {
              const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
              const r = 120;
              const tx = cx + Math.cos(a) * r - pos[i].x, ty = cy + Math.sin(a) * r - pos[i].y;
              tl.to(p, { opacity: 1, backgroundColor: '#e8b95a', x: tx, y: ty, duration: 0.9, ease: 'power3.inOut' }, tQ + i * 0.04);
            });
            const nucleo = H.nodo(dia, 'gan-nucleo', cx, cy, 'diversity_1', true, 132);
            H.pop(tl, nucleo, tQ + 0.7);
            const halo = H.el('div', 'halo', dia, 'gan-halo', { left: `${cx}px`, top: `${cy}px`, width: '300px', height: '300px', margin: '-150px 0 0 -150px' });
            H.halo(tl, halo, tQ + 1.1);
            H.sale(tl, [equipo, '#gan-altar', altarRot], tQ - 0.4, { d: 0.35 });
            const fila = H.ancla(dia, 'gan-verbos', 324, 730, '', 'fila-chips');
            [['Se queda', /^quede/], ['Crece', /^crezca/], ['Se multiplica', /^multiplique/]].forEach(([tx, re], i) => {
              const c = H.el('span', `chip${i === 0 ? ' oro' : ''}`, fila.firstChild, `gan-v-${i}`);
              c.textContent = tx;
              H.entra(tl, c, T.pulso(H.palabra(f5, re).inicio - 0.25), { dy: 16 });
            });

            H.sale(tl, ['#gan-dia', '#gan-ceja-2'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['gancho'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
