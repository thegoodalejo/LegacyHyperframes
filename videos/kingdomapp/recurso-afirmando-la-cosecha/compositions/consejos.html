              ['volunteer_activism', 'Ora, si te lo permite', f1, /^ora$/], ['timer', 'Breve, sin preguntas personales', f2, /^breve/], ['event', 'Invita a algo concreto', f2, /^concreto/]];
            const tarjetas = datos.map(([ic, tx, f, re], i) => {
              const c = H.el('div', 'k-recurso-tarjeta tarjeta', dia, `con-t-${i}`, { top: `${40 + i * 128}px` });
              c.innerHTML = `${H.icono(ic, 52, true)}<span class="txt">${tx}</span>`;
              const t = P(f, re, -0.35);
              tl.fromTo(c, { opacity: 0, x: 60, filter: 'blur(6px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, t);
              tl.fromTo(c, { boxShadow: 'inset 0 0 0 2px rgba(232, 185, 90, 0.9), 0 30px 60px -30px rgba(0, 0, 0, 0.6)' },
                { boxShadow: 'inset 0 0 0 1px rgba(234, 240, 255, 0.12), 0 30px 60px -30px rgba(0, 0, 0, 0.6)', duration: 1.2, ease: 'power1.out', immediateRender: false }, t + 0.5);
              return c;
            });

            // f3 · con Comunicaciones, el mensaje de bienvenida por WhatsApp sale solo, una hora después de que llega.
            const tB = T.pulso(f3.inicio - 0.3);
            H.sale(tl, tarjetas, tB, { d: 0.4, stagger: 0.05 });
            const si = H.ancla(dia, 'con-si', 324, 180, 'Si tu iglesia tiene Comunicaciones', 'rot');
            H.entra(tl, si, P(f3, /^comunicaciones/, -0.3), { dy: 12 });
            tl.fromTo('#con-globo', { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, P(f3, /^bienvenida/, -0.3));
            const hora = H.chip(dia, 'con-hora', 324, 460, `${H.icono('schedule', 34, true)}1 h después`, 'oro');
            H.pop(tl, hora, P(f3, /^hora/, -0.3));
            const llega = H.ancla(dia, 'con-llega', 324, 540, 'de que llega', 'rot');
            H.entra(tl, llega, P(f3, /^llega/, -0.2), { dy: 10 });

            // f4 · la visita, la consejería o la oración aparte: «Actividad extra» en su ficha.
            const tE = T.pulso(f4.inicio - 0.3);
            H.sale(tl, ['#con-globo', si, hora, llega], tE, { d: 0.35 });
            const acts = [['home', 'Visita', /^visita/], ['forum', 'Consejería', /^consejeria/], ['volunteer_activism', 'Oración', /^oracion/]];
            acts.forEach(([ic, tx, re], i) => {
              const n = H.nodo(dia, `con-a-${i}`, 144 + i * 180, 300, ic, false, 120);
              const r = H.ancla(dia, `con-a-${i}-r`, 144 + i * 180, 400, tx, 'rot');
              const t = P(f4, re, -0.3);
              H.pop(tl, n, t);
              H.entra(tl, r, t + 0.1, { dy: 10 });
            });
            const extra = H.chip(dia, 'con-extra', 324, 560, `${H.icono('edit_note', 34, true)}Actividad extra`, 'oro');
            H.pop(tl, extra, P(f4, /^actividad/, -0.3));
            const ficha = H.ancla(dia, 'con-ficha', 324, 640, 'en su ficha', 'rot');
            H.entra(tl, ficha, P(f4, /^ficha/, -0.3), { dy: 10 });

            H.sale(tl, ['#con-dia', '#con-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['consejos'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
