            // «texto con *énfasis*» → [{ texto, clave }]

              const out = [];
              let on = false;

                if (!w) continue;

                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;

            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).

            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },

              vis.forEach((x, k) => {

            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('mul-dia'), svg = $('mul-svg');
            const bs = H.bloques(T, $('mul-col'), 'mul', ['Una iglesia que se *multiplica*', 'Hoy afirmado, mañana *acompaña*', 'A la bolsa, con su *cupo*',
              'Cada uno ve *solo* a los suyos', 'Si se llaman *consolidadores*', 'La *familia* de mañana']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#mul-ceja', 0.1, { dy: 16 });

            // f0–f1 · Valeria (dorada) se vuelve azul (acompaña) y de ella salen dos dorados; el patrón se repite: multiplicación.
            const N = [{ x: 324, y: 110 }, { x: 184, y: 260 }, { x: 464, y: 260 }, { x: 114, y: 410 }, { x: 254, y: 410 }, { x: 394, y: 410 }, { x: 534, y: 410 }];
            const pts = N.map((p, i) => H.punto(dia, `mul-p-${i}`, p.x, p.y, 'k-oro', i === 0 ? 40 : 30));
            const lin = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]].map(([a, b], k) => H.linea(svg, `mul-l-${k}`, N[a].x, N[a].y, N[b].x, N[b].y, false));
            H.pop(tl, pts[0], T.pulso(f0.inicio));
            const tC = P(f0, /^crece/, -0.2);
            H.late(tl, pts[0], tC, { de: 1.35 });
            const tM = P(f0, /^multiplica/, -0.3);
            tl.to(pts[0], { backgroundColor: '#3576da', duration: 0.3 }, tM);
            [0, 1].forEach((k) => H.dibujar(tl, lin[k], tM + 0.1, 0.5));
            H.pop(tl, [pts[1], pts[2]], tM + 0.4, { stagger: 0.1 });
            const tA = P(f1, /^acompanar/, -0.3);
            tl.to([pts[1], pts[2]], { backgroundColor: '#3576da', duration: 0.3 }, tA);
            [2, 3, 4, 5].forEach((k) => H.dibujar(tl, lin[k], tA + 0.1, 0.5));
            H.pop(tl, pts.slice(3), tA + 0.4, { stagger: 0.08 });
            const rAf = H.ancla(dia, 'mul-r-af', 324, 500, `<span style="display: flex; gap: 28px"><span class="rot oro">● afirmados</span><span class="rot" style="color: #6f9ff0">● acompañan</span></span>`, '');
            H.entra(tl, rAf, P(f1, /^afirmado/, -0.3), { dy: 12 });

            // f2 · cuando se une al equipo, va a la bolsa de acompañantes con su cupo: la fila de «Quienes acompañan» (Acompaña a 0 de 3).
            const tB = P(f2, /^bolsa/, -0.5);
            tl.to([...pts, ...lin], { y: '-=70', opacity: 0.18, duration: 0.6, ease: 'power2.inOut' }, tB - 0.4);
            H.sale(tl, rAf, tB - 0.4, { d: 0.3 });
            tl.fromTo('#mul-bolsa', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, tB);
            H.entra(tl, '#mul-datos', tB, { dy: 10 });
            A.foco(tl, $('mul-bolsa').firstElementChild, $('mul-cupo'), P(f2, /^cupo/, -0.3), T.pulso(f2.fin + 0.4), { pad: 4, radio: 6 });

            // f3 · cada acompañante ve solo a quienes acompaña: un candado sobre la ficha de otra persona.
            const tS = P(f3, /^solo/, -0.4);
            const otra = H.chip(dia, 'mul-otra', 300, 720, `${H.icono('person', 34)}Otra persona`, '');
            tl.fromTo(otra, { opacity: 0, y: 20 }, { opacity: 0.5, y: 0, duration: 0.4, ease: 'power2.out' }, tS - 0.3);
            const candado = H.nodo(dia, 'mul-candado', 500, 720, 'lock', true, 96);
            H.pop(tl, candado, tS);
            const cuidada = H.ancla(dia, 'mul-cuidada', 324, 812, 'Su información queda cuidada', 'rot oro');
            H.entra(tl, cuidada, P(f3, /^cuidada/, -0.4), { dy: 12 });

            // f4 · si en tu iglesia se llaman consolidadores: Ajustes → Vocabulario, «Acompañante» se borra y se escribe «Consolidador».
            const tV = T.pulso(f4.inicio - 0.3);
            H.sale(tl, ['#mul-bolsa', otra, candado, cuidada, '#mul-datos'], tV, { d: 0.35 });
            tl.fromTo('#mul-voc', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, tV + 0.2);
            A.escribir(tl, $('mul-campo'), 'Consolidador', P(f4, /^consolidadores/, -0.1), { antes: 'Acompañante', cps: 16, espera: 0.6 });
            const palabra = H.ancla(dia, 'mul-palabra', 324, 770, `<span class="rotulo-kit">${H.icono('edit_note', 30, true)}Kingdom usa esa palabra</span>`, '');
            H.entra(tl, palabra, P(f4, /^usa/, -0.3), { dy: 14 });

            // f5 · la cosecha de un domingo se convierte en la familia de mañana: los puntos se agrupan en una casa.
            const tF = P(f5, /^familia/, -0.8);
            H.sale(tl, ['#mul-voc', palabra], T.pulso(f5.inicio - 0.2), { d: 0.35 });
            tl.to(lin, { opacity: 0, duration: 0.3 }, tF - 0.4);
            // La casa: techo (triángulo) y paredes, con los siete puntos y cinco más.
            const casa = [{ x: 324, y: 200 }, { x: 254, y: 260 }, { x: 394, y: 260 }, { x: 184, y: 320 }, { x: 464, y: 320 }, { x: 204, y: 410 }, { x: 444, y: 410 }];
            const extra = [{ x: 204, y: 500 }, { x: 444, y: 500 }, { x: 204, y: 590 }, { x: 444, y: 590 }, { x: 324, y: 590 }];
            const contorno = H.camino(svg, 'mul-casa', 'M 164 338 L 324 196 L 484 338 M 204 330 L 204 590 L 444 590 L 444 330', true);
            H.dibujar(tl, contorno.p, tF + 0.2, 1.0);
            pts.forEach((p, i) => tl.to(p, { x: casa[i].x - N[i].x, y: casa[i].y - N[i].y, opacity: 1, backgroundColor: i % 2 ? '#e8b95a' : '#3576da', duration: 0.9, ease: 'power3.inOut' }, tF + i * 0.04));
            const mas = extra.map((p, i) => H.punto(dia, `mul-e-${i}`, p.x, p.y, 'k-oro', 30));
            H.pop(tl, mas, tF + 0.5, { stagger: 0.07 });
            const puerta = H.nodo(dia, 'mul-puerta', 324, 460, 'home', true, 110);
            H.pop(tl, puerta, P(f5, /^familia/, -0.1));

            H.sale(tl, ['#mul-dia', '#mul-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['multiplicar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
