      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('rep-cam'), pag = $('rep-pag');
            const bs = H.bloques(T, $('rep-col'), 'rep', ['Que *nadie* se quede solo', 'Membresía → *Coordinar* → Nuevos', 'Toca «*Repartir*»',
              'O «*Asignar*», uno por uno', 'Un aviso a cada *acompañante*', 'La carga y los pendientes en *rojo*', 'Las cifras del *día*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#rep-ceja', 0.1, { dy: 16 });
            const vista = (de, a, t) => { tl.to(de, { opacity: 0, duration: 0.2 }, t); tl.fromTo(a, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, t + 0.15); };
            const chip = (de, a, t) => { tl.to(de, { backgroundColor: 'rgba(0,0,0,0)', color: '#1b1b1f', borderColor: '#c4c6d0', duration: 0.15 }, t); tl.to(a, { backgroundColor: '#ffdea9', color: '#5e4100', borderColor: 'rgba(0,0,0,0)', duration: 0.15 }, t); };

            // f0 · entra la ventana: Membresía → Coordinar → Resumen.
            tl.fromTo('#rep-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#rep-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });

            // f1 · «Coordinar» (foco en la pestaña) y «Nuevos»: quienes no tienen acompañante, con cómo y cuándo llegaron.
            const tCo = P(f1, /^coordinar/, -0.3);
            A.foco(tl, pag, $('rep-tab'), tCo, tCo + 0.9, { pad: 2, radio: 8 });
            const tNu = P(f1, /^nuevos/, -0.1);
            A.tocar(tl, pag, $('rep-c-nuevos'), tNu);
            chip('#rep-c-resumen', '#rep-c-nuevos', tNu + 0.1);
            vista('#rep-v-resumen', '#rep-v-nuevos', tNu + 0.1);
            tl.fromTo('#rep-filas > .k-app-fila', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.05, immediateRender: false }, tNu + 0.3);
            const tCo2 = P(f1, /^como/, -0.3);
            A.camara(tl, cam, { z: 1.5, en: $('rep-llego'), dx: 120, t: tCo2 - 0.4, d: 0.9 });
            A.foco(tl, pag, $('rep-llego'), tCo2, P(f1, /^llegaron/, 0.4), { pad: 4, radio: 6 });

            // f2 · «Repartir»: foco, el dedo, la confirmación de la app y los nuevos que vuelan, parejo, a quienes acompañan (según su cupo).
            const tRe = P(f2, /^repartir/, -0.2);
            A.camara(tl, cam, { z: 1, t: T.pulso(f2.inicio - 0.6), d: 0.8 });
            A.foco(tl, pag, $('rep-repartir'), tRe - 0.3, tRe + 0.4, { pad: 4, radio: 24 });
            A.tocar(tl, pag, $('rep-repartir'), tRe + 0.2);
            const tOk = P(f2, /^reparte/, -0.2);
            A.hoja(tl, $('rep-dlg'), tRe + 0.45, { tipo: 'dialogo', velo: $('rep-velo'), hasta: tOk + 0.3 });
            A.tocar(tl, cam, $('rep-dlg-ok'), tOk);
            const tVuelo = tOk + 0.65;
            const filas = [...document.querySelectorAll('#rep-filas > .k-app-fila')];
            const destinos = [0, 1, 2].map((k) => A.caja($(`rep-a-${k}`), pag));
            tl.fromTo('#rep-v-reparto', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, tVuelo);
            tl.to('#rep-v-nuevos .barra', { opacity: 0, duration: 0.2 }, tVuelo);
            const cuenta = [0, 0, 0];
            filas.forEach((f, i) => {
              const k = i % 3;
              const c = A.caja(f, pag), d = destinos[k];
              const t = tVuelo + 0.1 + i * 0.16;
              tl.to(f, { x: d.cx - c.cx, duration: 0.7, ease: 'power1.inOut' }, t);
              tl.to(f, { y: d.cy - c.cy, duration: 0.7, ease: 'back.in(1.4)' }, t);
              tl.to(f, { scale: 0.25, opacity: 0, duration: 0.7, ease: 'power2.in' }, t);
              cuenta[k]++;
            });
            // 12 en total, 4 a cada uno (los 5 que no se ven en la lista también entran): los contadores y las barras de carga suben.
            [[0, 5], [1, 4], [2, 4]].forEach(([k, cupo]) => {
              H.contar(tl, $(`rep-a-${k}-n`), 0, 4, tVuelo + 0.5, 1.6);
              tl.fromTo(`#rep-a-${k}-b`, { scaleX: 0 }, { scaleX: 4 / cupo, duration: 1.6, ease: 'power2.out', immediateRender: false }, tVuelo + 0.5);
            });
            H.contar(tl, $('rep-n-nuevos'), 12, 0, tVuelo + 0.5, 1.6);
            tl.fromTo('#rep-ok', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, tVuelo + 2.0);
            const tCupo = P(f2, /^cupo/, -0.2);
            A.foco(tl, pag, $('rep-a-0-carga'), tCupo, tCupo + 1.0, { pad: 4, radio: 6 });

            // f3 · o «Asignar», uno por uno: (la otra forma) la lista de nuevos vuelve; foco y el dedo en «Asignar».
            const tAs = P(f3, /^asignar/, -0.3);
            tl.to('#rep-v-reparto', { opacity: 0, duration: 0.25 }, tAs - 0.6);
            tl.set(filas, { x: 0, y: 0, scale: 1 }, tAs - 0.45);
            tl.to(filas, { opacity: 1, duration: 0.3, stagger: 0.03 }, tAs - 0.4);
            tl.to('#rep-v-nuevos .barra', { opacity: 1, duration: 0.2 }, tAs - 0.4);
            tl.set('#rep-n-nuevos', { textContent: '12' }, tAs - 0.4);
            A.camara(tl, cam, { z: 1.45, en: $('rep-asignar'), dx: -160, t: tAs - 0.2, d: 0.8 });
            A.foco(tl, pag, $('rep-asignar'), tAs, tAs + 1.5, { pad: 4, radio: 24 });
            A.tocar(tl, pag, $('rep-asignar'), tAs + 0.6);

            // f4 · cada acompañante recibe el aviso en su celular: entra un celular por la derecha y cae «Tienes a alguien nuevo para acompañar».
            const tCel = T.pulso(f4.inicio - 0.3);
            A.camara(tl, cam, { z: 1, t: tCel - 0.4, d: 0.8 });
            tl.fromTo('#rep-cel', { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, tCel);
            const tAv = P(f4, /^aviso/, -0.2);
            tl.fromTo('#rep-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, tAv);
            H.late(tl, '#rep-notif', P(f4, /^acompanar/, -0.2), { de: 1.05 });
            tl.to('#rep-cel', { opacity: 0, x: 260, duration: 0.5, ease: 'power2.in' }, T.pulso(f5.inicio - 0.4));

            // f5 · «Quienes acompañan»: la carga de cada uno y sus pendientes en rojo.
            const tQa = P(f5, /^quienes/, -0.1);
            A.tocar(tl, pag, $('rep-c-acomp'), tQa);
            chip('#rep-c-nuevos', '#rep-c-acomp', tQa + 0.1);
            tl.set('#rep-n-nuevos', { textContent: '0' }, tQa + 0.1);
            vista('#rep-v-nuevos', '#rep-v-acomp', tQa + 0.1);
            const tRo = P(f5, /^rojo/, -0.5);
            A.camara(tl, cam, { z: 1.45, en: $('rep-pend'), dx: 60, t: P(f5, /^carga/, -0.3), d: 0.9 });
            A.foco(tl, pag, $('rep-pend'), tRo, tRo + 1.2, { pad: 5, radio: 12 });

            // f6 · «Resumen»: las cifras del día; acercamiento a «En rojo» y «Sin llamar a tiempo».
            const tRs = P(f6, /^resumen/, -0.1);
            A.camara(tl, cam, { z: 1, t: tRs - 0.6, d: 0.6 });
            A.tocar(tl, pag, $('rep-c-resumen'), tRs);
            chip('#rep-c-acomp', '#rep-c-resumen', tRs + 0.1);
            vista('#rep-v-acomp', '#rep-v-resumen', tRs + 0.1);
            tl.set('#rep-t-nuevos-n', { textContent: '0' }, tRs);
            tl.set('#rep-t-nuevos', { backgroundColor: '#efedf1', color: '#1b1b1f' }, tRs);
            tl.set('#rep-t-ruta-n', { textContent: '50' }, tRs);
            tl.set('#rep-n-nuevos', { textContent: '0' }, tRs);
            const tR2 = P(f6, /^rojo/, -0.6);
            A.camara(tl, cam, { z: 1.7, en: $('rep-t-rojo'), dx: 70, t: tR2 - 0.3, d: 1.0 });
            A.foco(tl, pag, $('rep-t-rojo'), tR2 + 0.4, T.salida(0.8), { pad: 4, radio: 18 });
            A.foco(tl, pag, $('rep-t-sin'), P(f6, /^tiempo/, -0.6), T.salida(0.8), { pad: 4, radio: 18 });

            H.sale(tl, ['#rep-ven', '#rep-ceja', '#rep-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['repartir'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
