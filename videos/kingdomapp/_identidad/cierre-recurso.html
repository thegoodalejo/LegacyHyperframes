<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"siguiente","type":"string","label":"Sigue con: título del siguiente recurso (vacío: sin tarjeta y el cierre dura 6 s)","default":"","maxLength":56},
    {"id":"llamado","type":"enum","label":"Llamado (solo los aprobados)","default":"acompanamiento","options":[
      {"value":"acompanamiento","label":"Te acompañamos a mejorar los procesos de tu iglesia"},{"value":"compartir","label":"Comparte este video con tu equipo"},{"value":"ninguno","label":"Sin llamado"}]},
    {"id":"contacto","type":"enum","label":"Contacto","default":"whatsapp","options":[
      {"value":"whatsapp","label":"WhatsApp de ventas (el del sitio)"},{"value":"sitio","label":"Sitio público"},{"value":"ninguno","label":"Sin contacto"}]},
    {"id":"idioma","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"},{"value":"pt","label":"Português"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- Cierre del Tipo Recurso (16:9; 9,0 s con «Sigue con», 6,0 s sin él), kit de identidad de Kingdom v1.2 (decisión 239; KingdomApp
         docs/videos/identidad.md → «Cierre del Tipo Recurso»). NO se edita por video: los textos salen de listas cerradas. Es también el
         cuadro final del video. La firma empieza en el 3,0 (0,0 sin «Sigue con»): ahí cae el último golpe de «Product Launch» (82,05 de la
         pista), que se apaga solo debajo de la marca. Sonido de marca en el host a 3,38 (0,38 sin «Sigue con»). -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #060d1f;
          font-family: 'Inter', sans-serif;
          color: #eaf0ff;
        }
        .halo {
          position: absolute;
          inset: -60px;
          background:
            radial-gradient(860px 620px at 86% 18%, rgba(53, 118, 218, 0.45), transparent 70%),
            radial-gradient(640px 500px at 6% 100%, rgba(217, 162, 52, 0.22), transparent 70%);
        }
        .puntos {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(169, 190, 235, 0.35) 2px, transparent 2.2px);
          background-size: 42px 42px;
          -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000);
          mask-image: linear-gradient(90deg, transparent 35%, #000);
        }
        /* «Sigue con»: a la izquierda, como un capítulo que se anuncia. */
        .sigue {
          position: absolute;
          left: 216px;
          top: 0;
          width: 1488px;
          height: 1080px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        }
        .sigue-fila {
          display: flex;
          align-items: center;
          gap: 18px;
          margin-bottom: 28px;
        }
        .sigue-icono {
          display: block;
          width: 44px;
          height: 44px;
          background: #e8b95a;
          -webkit-mask: url(identidad/iconos/arrow_forward.svg) center / contain no-repeat;
          mask: url(identidad/iconos/arrow_forward.svg) center / contain no-repeat;
        }
        .sigue-ceja {
          color: #e8b95a;
          font-size: 28px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          line-height: 1.2;
        }
        .sigue-titulo {
          max-width: 1400px;
          font-family: 'Fraunces', serif;
          font-size: 84px;
          font-weight: 560;
          line-height: 1.04;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .columna {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        .marca {
          display: flex;
          align-items: center;
          gap: 30px;
          margin-bottom: 64px;
        }
        .favicon {
          display: block;
          width: 128px;
          height: 128px;
        }
        .favicon svg {
          display: block;
          width: 128px;
          height: 128px;
          overflow: visible;
        }
        .nombre {
          font-family: 'Fraunces', serif;
          font-size: 92px;
          font-weight: 600;
          line-height: 1;
          letter-spacing: -1.8px;
        }
        .lema {
          max-width: 1400px;
          font-family: 'Fraunces', serif;
          font-size: 72px;
          font-weight: 560;
          line-height: 1.08;
          letter-spacing: -0.02em;
          text-wrap: balance;
          margin-bottom: 52px;
        }
        .lema em {
          color: #e8b95a;
          font-style: italic;
          font-weight: 500;
        }
        .contacto {
          display: inline-flex;
          align-items: center;
          min-height: 72px;
          padding: 0 40px;
          border-radius: 36px;
          box-shadow: inset 0 0 0 2px rgba(232, 185, 90, 0.55);
          color: #eaf0ff;
          font-size: 36px;
          font-weight: 600;
          letter-spacing: 0.01em;
        }
        .oculto {
          display: none;
        }
      </style>

      <div id="root" data-composition-id="cierre-recurso" data-width="1920" data-height="1080" data-duration="9">
        <div class="halo" id="cierre-recurso-halo" data-layout-allow-overflow></div>
        <div class="puntos"></div>
        <div class="sigue" id="cierre-recurso-sigue">
          <div class="sigue-fila">
            <span class="sigue-icono" id="cierre-recurso-sigue-icono"></span>
            <span class="sigue-ceja" id="cierre-recurso-sigue-ceja">Sigue con</span>
          </div>
          <div class="sigue-titulo" id="cierre-recurso-sigue-titulo">El siguiente recurso</div>
        </div>
        <div class="columna">
          <div class="marca">
            <div class="favicon" id="cierre-recurso-favicon">
              <!-- frontend-v2/public/favicon.svg (sha256 2d3dcdff…) en piezas, sin redibujar (ver intro-wiki.html). -->
              <svg viewBox="0 0 300 300" aria-label="Kingdom">
                <defs><clipPath id="cierre-recurso-recorte"><rect x="79" y="34" width="134.58" height="36.1558" /></clipPath></defs>
                <rect id="cierre-recurso-baldosa" width="300" height="300" rx="26" fill="#3576DA" />
                <g id="cierre-recurso-corona" clip-path="url(#cierre-recurso-recorte)" fill="#FFFFFF">
                  <rect x="79" y="34" width="19.2013" height="38" rx="2" />
                  <rect x="97.6006" y="51.1113" width="20.4014" height="20.8887" />
                  <rect x="117.402" y="34" width="19.201" height="38" rx="2" />
                  <rect x="136.003" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="155.39" y="34" width="19.615" height="38" rx="2" />
                  <rect x="174.405" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="193.791" y="34" width="19.616" height="38" rx="2" />
                </g>
                <path id="cierre-recurso-k" fill="#FFFFFF" d="M102.046 171.722L149.25 166.042C164.799 182.891 178.683 197.942 190.9 211.194C203.117 224.446 213.021 235.047 220.61 242.998C220.61 250.192 218.296 255.872 213.669 260.037C209.041 264.012 203.673 266 197.564 266C190.9 266 185.439 264.296 181.182 260.889C176.924 257.481 172.852 253.505 168.964 248.962L102.046 171.722ZM150.361 186.772L96.493 189.328L183.681 89.3698C194.232 89.3698 201.914 91.5469 206.727 95.9011C211.54 100.066 213.946 104.988 213.946 110.668C213.946 115.022 212.836 119.187 210.614 123.162C208.578 126.949 205.154 131.114 200.341 135.657L150.361 186.772ZM79 142.756H121.205V262.876C119.539 263.444 116.855 264.012 113.153 264.58C109.451 265.148 105.656 265.432 101.769 265.432C93.4387 265.432 87.5151 263.918 83.998 260.889C80.666 257.67 79 252.369 79 244.986V142.756ZM121.205 197.279H79V90.5057C80.8511 90.127 83.6278 89.6538 87.33 89.0858C91.2174 88.5179 94.9196 88.2339 98.4367 88.2339C106.582 88.2339 112.413 89.6537 115.93 92.4935C119.447 95.3332 121.205 100.729 121.205 108.68V197.279Z" />
              </svg>
            </div>
            <div class="nombre" id="cierre-recurso-nombre">Kingdom</div>
          </div>
          <div class="lema" id="cierre-recurso-lema">Te acompañamos a <em>mejorar los procesos</em> de tu iglesia</div>
          <div class="contacto" id="cierre-recurso-contacto">WhatsApp +57 300 471 2642</div>
        </div>
        <!-- El sonido de marca lo pone el proyecto (host) en el tiempo que declara identidad/kit.json. -->
      </div>

      <script>
        (function () {
          // Textos de lista cerrada: el llamado lo dio el dueño (decisión 239) y el contacto es el publicado en el sitio
          // (KingdomApp sitio/src/data/sitio.ts → WHATSAPP_VISIBLE). Un texto nuevo es una decisión del dueño y sube la versión del kit.
          const TEXTOS = {
            es: {
              sigue: 'Sigue con',
              acompanamiento: 'Te acompañamos a <em>mejorar los procesos</em> de tu iglesia',
              compartir: 'Comparte este video <em>con tu equipo</em>',
            },
            en: {
              sigue: 'Up next',
              acompanamiento: 'We walk with you to <em>improve the processes</em> of your church',
              compartir: 'Share this video <em>with your team</em>',
            },
            pt: {
              sigue: 'A seguir',
              acompanamiento: 'Acompanhamos você a <em>melhorar os processos</em> da sua igreja',
              compartir: 'Compartilhe este vídeo <em>com sua equipe</em>',
            },
          };
          const CONTACTOS = { whatsapp: 'WhatsApp +57 300 471 2642', sitio: 'kingdom-sitio.web.app' };

          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const idioma = TEXTOS[v.idioma] ? v.idioma : 'es';
          const t = TEXTOS[idioma];
          const siguiente = String(v.siguiente || '').trim();
          const llamado = ['acompanamiento', 'compartir', 'ninguno'].includes(v.llamado) ? v.llamado : 'acompanamiento';
          const contacto = ['whatsapp', 'sitio', 'ninguno'].includes(v.contacto) ? v.contacto : 'whatsapp';
          // Con «Sigue con» la firma empieza en el 3,0; sin él, en el 0 (y el cierre dura 6 s).
          const F = siguiente ? 3 : 0;

          document.getElementById('cierre-recurso-sigue-ceja').textContent = t.sigue;
          if (siguiente) document.getElementById('cierre-recurso-sigue-titulo').textContent = siguiente;
          else document.getElementById('cierre-recurso-sigue').classList.add('oculto');
          const lema = document.getElementById('cierre-recurso-lema');
          if (llamado === 'ninguno') lema.classList.add('oculto');
          else lema.innerHTML = t[llamado];
          const cont = document.getElementById('cierre-recurso-contacto');
          if (contacto === 'ninguno') cont.classList.add('oculto');
          else cont.textContent = CONTACTOS[contacto];

          const corona = (tl, t0) => {
            tl.fromTo('#cierre-recurso-baldosa', { transformOrigin: '50% 50%', scale: 0.85, autoAlpha: 0 },
              { transformOrigin: '50% 50%', scale: 1, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t0);
            tl.fromTo('#cierre-recurso-k', { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t0 + 0.2);
            tl.fromTo('#cierre-recurso-corona rect', { transformOrigin: '50% 100%', scaleY: 0 },
              { transformOrigin: '50% 100%', scaleY: 1, duration: 0.25, ease: 'back.out(2.2)', stagger: 0.05 }, t0 + 0.45);
          };

          const construir = () => {
            const root = document.querySelector('[data-composition-id="cierre-recurso"]');
            const fav = document.getElementById('cierre-recurso-favicon');
            const r = fav.getBoundingClientRect();
            const rr = root.getBoundingClientRect();
            const escala = 240 / 128;
            const dx = rr.left + 960 - (r.left + r.width / 2);
            const dy = rr.top + 540 - (r.top + r.height / 2);

            const tl = gsap.timeline({ paused: true });
            tl.fromTo('#cierre-recurso-halo', { scale: 1.08, autoAlpha: 0.5 }, { scale: 1, autoAlpha: 1, duration: F + 6, ease: 'sine.out' }, 0);
            if (siguiente) {
              tl.fromTo('#cierre-recurso-sigue-icono', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: 'power3.out' }, 0.05);
              tl.fromTo('#cierre-recurso-sigue-ceja', { autoAlpha: 0, letterSpacing: '0.3em' },
                { autoAlpha: 1, letterSpacing: '0.16em', duration: 0.5, ease: 'power3.out' }, 0.1);
              tl.fromTo('#cierre-recurso-sigue-titulo', { y: 30, autoAlpha: 0, filter: 'blur(6px)' },
                { y: 0, autoAlpha: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, 0.35);
              tl.to('#cierre-recurso-sigue', { x: -40, autoAlpha: 0, filter: 'blur(6px)', duration: 0.4, ease: 'power2.in' }, 2.55);
            }
            // La firma: grande en el centro y luego sube junto al nombre (los tiempos de todas las piezas).
            tl.set(fav, { x: dx, y: dy, scale: escala }, 0);
            corona(tl, F);
            tl.to(fav, { x: 0, y: 0, scale: 1, duration: 0.45, ease: 'power3.inOut' }, F + 1.1);
            tl.fromTo('#cierre-recurso-nombre', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, F + 1.45);
            tl.fromTo('#cierre-recurso-lema', { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: 'power3.out' }, F + 1.75);
            tl.fromTo('#cierre-recurso-contacto', { scale: 0.94, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: 'back.out(1.6)' }, F + 2.25);
            tl.set({}, {}, F + 6);
            window.__timelines['cierre-recurso'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
