<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"titulo","type":"string","label":"Título del episodio (máx. ~48 caracteres; *palabras* en itálica dorada)","default":"Lo que tu iglesia *ya puede ver*","maxLength":56},
    {"id":"ceja","type":"string","label":"Ceja (vacía: «Recursos»; o el nombre de la serie)","default":"","maxLength":32},
    {"id":"idioma","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"},{"value":"pt","label":"Português"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- Intro del Tipo Recurso (16:9, 6,0 s), kit de identidad de Kingdom v1.2 (decisión 239; KingdomApp docs/videos/identidad.md →
         «Intro del Tipo Recurso»). NO se edita por video: cada episodio la monta con sus variables. La firma «la corona se levanta» con los
         mismos tiempos de las demás piezas; el sonido de marca lo pone el host en 0,38 s (kit.json → piezas.intro-recurso.sonido).
         Con «Product Launch» desde el 0,05 de la pista, el primer compás cae en el 2,0: ahí entran la ceja y el título. -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #060d1f;
          font-family: 'Inter', sans-serif;
          color: #eaf0ff;
        }
        .halo {
          position: absolute;
          inset: -60px;
          background:
            radial-gradient(860px 620px at 86% 18%, rgba(53, 118, 218, 0.45), transparent 70%),
            radial-gradient(640px 500px at 6% 100%, rgba(217, 162, 52, 0.22), transparent 70%);
        }
        .puntos {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(169, 190, 235, 0.35) 2px, transparent 2.2px);
          background-size: 42px 42px;
          -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000);
          mask-image: linear-gradient(90deg, transparent 35%, #000);
        }
        .bloque {
          position: absolute;
          left: 216px;
          top: 0;
          width: 1488px;
          height: 1080px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: flex-start;
        }
        .marca {
          display: flex;
          align-items: center;
          gap: 24px;
          margin-bottom: 88px;
        }
        .favicon {
          display: block;
          width: 96px;
          height: 96px;
        }
        .favicon svg {
          display: block;
          width: 96px;
          height: 96px;
          overflow: visible;
        }
        .nombre {
          font-family: 'Fraunces', serif;
          font-size: 64px;
          font-weight: 600;
          line-height: 1;
          letter-spacing: -1.2px;
        }
        .ceja-fila {
          display: flex;
          align-items: center;
          gap: 22px;
          margin-bottom: 30px;
        }
        .regla {
          display: block;
          width: 72px;
          height: 3px;
          border-radius: 2px;
          background: #e8b95a;
        }
        .ceja {
          color: #e8b95a;
          font-size: 28px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          line-height: 1.2;
        }
        .titulo {
          max-width: 1400px;
          font-family: 'Fraunces', serif;
          font-size: 96px;
          font-weight: 560;
          line-height: 1.04;
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .titulo em {
          color: #e8b95a;
          font-style: italic;
          font-weight: 500;
        }
        /* Sin espacios de texto entre palabras: el espacio entre dos cajas se perdía al partir la línea (Chrome del render). */
        .palabra {
          display: inline-block;
          margin-right: 0.24em;
        }
        .palabra:last-child {
          margin-right: 0;
        }
      </style>

      <div id="root" data-composition-id="intro-recurso" data-width="1920" data-height="1080" data-duration="6">
        <div class="halo" id="intro-recurso-halo" data-layout-allow-overflow></div>
        <div class="puntos" id="intro-recurso-puntos"></div>
        <div class="bloque" id="intro-recurso-bloque">
          <div class="marca">
            <div class="favicon" id="intro-recurso-favicon">
              <!-- frontend-v2/public/favicon.svg (sha256 2d3dcdff…) en piezas, sin redibujar (ver intro-wiki.html). -->
              <svg viewBox="0 0 300 300" aria-label="Kingdom">
                <defs><clipPath id="intro-recurso-recorte"><rect x="79" y="34" width="134.58" height="36.1558" /></clipPath></defs>
                <rect id="intro-recurso-baldosa" width="300" height="300" rx="26" fill="#3576DA" />
                <g id="intro-recurso-corona" clip-path="url(#intro-recurso-recorte)" fill="#FFFFFF">
                  <rect x="79" y="34" width="19.2013" height="38" rx="2" />
                  <rect x="97.6006" y="51.1113" width="20.4014" height="20.8887" />
                  <rect x="117.402" y="34" width="19.201" height="38" rx="2" />
                  <rect x="136.003" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="155.39" y="34" width="19.615" height="38" rx="2" />
                  <rect x="174.405" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="193.791" y="34" width="19.616" height="38" rx="2" />
                </g>
                <path id="intro-recurso-k" fill="#FFFFFF" d="M102.046 171.722L149.25 166.042C164.799 182.891 178.683 197.942 190.9 211.194C203.117 224.446 213.021 235.047 220.61 242.998C220.61 250.192 218.296 255.872 213.669 260.037C209.041 264.012 203.673 266 197.564 266C190.9 266 185.439 264.296 181.182 260.889C176.924 257.481 172.852 253.505 168.964 248.962L102.046 171.722ZM150.361 186.772L96.493 189.328L183.681 89.3698C194.232 89.3698 201.914 91.5469 206.727 95.9011C211.54 100.066 213.946 104.988 213.946 110.668C213.946 115.022 212.836 119.187 210.614 123.162C208.578 126.949 205.154 131.114 200.341 135.657L150.361 186.772ZM79 142.756H121.205V262.876C119.539 263.444 116.855 264.012 113.153 264.58C109.451 265.148 105.656 265.432 101.769 265.432C93.4387 265.432 87.5151 263.918 83.998 260.889C80.666 257.67 79 252.369 79 244.986V142.756ZM121.205 197.279H79V90.5057C80.8511 90.127 83.6278 89.6538 87.33 89.0858C91.2174 88.5179 94.9196 88.2339 98.4367 88.2339C106.582 88.2339 112.413 89.6537 115.93 92.4935C119.447 95.3332 121.205 100.729 121.205 108.68V197.279Z" />
              </svg>
            </div>
            <div class="nombre" id="intro-recurso-nombre">Kingdom</div>
          </div>
          <div class="ceja-fila" id="intro-recurso-ceja-fila">
            <span class="regla" id="intro-recurso-regla"></span>
            <span class="ceja" id="intro-recurso-ceja">Recursos</span>
          </div>
          <div class="titulo" id="intro-recurso-titulo">Lo que tu iglesia <em>ya puede ver</em></div>
        </div>
        <!-- El sonido de marca lo pone el proyecto (host) en el tiempo que declara identidad/kit.json. -->
      </div>

      <script>
        (function () {
          const CEJAS = { es: 'Recursos', en: 'Resources', pt: 'Recursos' };
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const idioma = CEJAS[v.idioma] ? v.idioma : 'es';
          const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const titulo = String(v.titulo || 'Lo que tu iglesia *ya puede ver*').trim();
          // Cada palabra en su caja (entra una tras otra); *así* va en itálica dorada. Las cajas van al mismo nivel y el espacio es su margen.
          let enfasis = false;
          const html = titulo
            .split(/\s+/)
            .map((w) => {
              if (w.startsWith('*')) enfasis = true;
              const limpio = w.replace(/^\*/, '').replace(/\*(?=[.,;:!?…»"”)]*$)/, '');
              const out = limpio ? `<span class="palabra">${enfasis ? `<em>${esc(limpio)}</em>` : esc(limpio)}</span>` : '';
              if (w.length > 1 && /\*[.,;:!?…»"”)]*$/.test(w)) enfasis = false;
              return out;
            })
            .filter(Boolean)
            .join('');
          document.getElementById('intro-recurso-titulo').innerHTML = html;
          document.getElementById('intro-recurso-ceja').textContent = String(v.ceja || '').trim() || CEJAS[idioma];

          const corona = (tl, t0) => {
            tl.fromTo('#intro-recurso-baldosa', { transformOrigin: '50% 50%', scale: 0.85, autoAlpha: 0 },
              { transformOrigin: '50% 50%', scale: 1, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t0);
            tl.fromTo('#intro-recurso-k', { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t0 + 0.2);
            tl.fromTo('#intro-recurso-corona rect', { transformOrigin: '50% 100%', scaleY: 0 },
              { transformOrigin: '50% 100%', scaleY: 1, duration: 0.25, ease: 'back.out(2.2)', stagger: 0.05 }, t0 + 0.45);
          };

          const construir = () => {
            const root = document.querySelector('[data-composition-id="intro-recurso"]');
            const fav = document.getElementById('intro-recurso-favicon');
            const r = fav.getBoundingClientRect();
            const rr = root.getBoundingClientRect();
            const escala = 240 / 96;
            const dx = rr.left + 960 - (r.left + r.width / 2);
            const dy = rr.top + 540 - (r.top + r.height / 2);
            const palabras = root.querySelectorAll('#intro-recurso-titulo .palabra');

            const tl = gsap.timeline({ paused: true });
            // La noche se enciende despacio: el halo crece hasta el primer compás y respira hasta el final.
            tl.fromTo('#intro-recurso-halo', { scale: 1.12, autoAlpha: 0.2 }, { scale: 1, autoAlpha: 1, duration: 2, ease: 'sine.out' }, 0);
            tl.to('#intro-recurso-halo', { scale: 1.04, x: -24, duration: 4, ease: 'sine.inOut' }, 2);
            tl.fromTo('#intro-recurso-puntos', { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.6, ease: 'sine.out' }, 0.4);
            // La firma en el centro, grande; luego el favicon sube a su lugar junto al nombre.
            tl.set(fav, { x: dx, y: dy, scale: escala }, 0);
            corona(tl, 0);
            tl.to(fav, { x: 0, y: 0, scale: 1, duration: 0.45, ease: 'power3.inOut' }, 1.1);
            tl.fromTo('#intro-recurso-nombre', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 1.45);
            // Primer compás de la música (2,0 s): la regla se dibuja y la ceja entra abriendo su espaciado.
            tl.fromTo('#intro-recurso-regla', { scaleX: 0, transformOrigin: '0% 50%' },
              { scaleX: 1, transformOrigin: '0% 50%', duration: 0.4, ease: 'power3.inOut' }, 2.0);
            tl.fromTo('#intro-recurso-ceja', { autoAlpha: 0, letterSpacing: '0.32em' },
              { autoAlpha: 1, letterSpacing: '0.16em', duration: 0.6, ease: 'power3.out' }, 2.05);
            // El título, palabra por palabra en el pulso siguiente.
            tl.fromTo(palabras, { y: 34, autoAlpha: 0, filter: 'blur(6px)' },
              { y: 0, autoAlpha: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out', stagger: 0.07 }, 2.5);
            // Salida limpia antes del primer cuadro del cuerpo (6,0 s, compás): sube y se desvanece.
            tl.to('#intro-recurso-bloque', { y: -18, autoAlpha: 0, filter: 'blur(6px)', duration: 0.45, ease: 'power2.in' }, 5.45);
            tl.set({}, {}, 6);
            window.__timelines['intro-recurso'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
