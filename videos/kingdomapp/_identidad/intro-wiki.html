<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"titulo","type":"string","label":"Título del tutorial (el del artículo, máx. ~40 caracteres)","default":"Entrar a Kingdom","maxLength":48},
    {"id":"seccion","type":"enum","label":"Sección de la ayuda","default":"empieza","options":[
      {"value":"empieza","label":"Empieza aquí"},{"value":"mi-iglesia","label":"Mi iglesia"},{"value":"membresia","label":"Membresía"},
      {"value":"eventos","label":"Eventos"},{"value":"equipos","label":"Equipos"},{"value":"academia","label":"Academia"},
      {"value":"portal","label":"Portal"},{"value":"comunicaciones","label":"Comunicaciones"},{"value":"archivos","label":"Archivos y Compartir"},
      {"value":"ajustes","label":"Ajustes de la iglesia"},{"value":"soporte","label":"Atender consultas"},{"value":"puesta","label":"Puesta en marcha"}]},
    {"id":"idioma","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- Intro del Tipo Wiki, kit de identidad de Kingdom v1 (KingdomApp docs/videos/identidad.md → «Intro del Tipo Wiki (3,0 s)»). NO se edita
         por video: cada tutorial la monta con sus variables. Rutas relativas al proyecto (el kit se monta en <proyecto>/identidad/). -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #faf9fd;
          font-family: 'Inter', sans-serif;
          color: #1b1b1f;
        }
        .grupo {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .contenido {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 28px;
          max-width: 1500px;
        }
        .marca {
          display: flex;
          align-items: center;
          gap: 32px;
        }
        .favicon {
          display: block;
          width: 144px;
          height: 144px;
        }
        .favicon svg {
          display: block;
          width: 144px;
          height: 144px;
          overflow: visible;
        }
        .textos {
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .nombre {
          font-family: 'Fraunces', serif;
          font-size: 76px;
          font-weight: 600;
          line-height: 1.05;
          letter-spacing: -1.5px;
        }
        .ayuda {
          font-size: 40px;
          font-weight: 500;
          line-height: 1.2;
          color: #44474f;
        }
        .chip {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 12px 24px 12px 18px;
          border-radius: 999px;
          background: color-mix(in srgb, var(--sec-color) 12%, transparent);
          color: var(--sec-color);
          font-size: 32px;
          font-weight: 600;
        }
        .chip-icono {
          display: block;
          width: 40px;
          height: 40px;
          background: var(--sec-color);
          -webkit-mask: var(--sec-icono) center / contain no-repeat;
          mask: var(--sec-icono) center / contain no-repeat;
        }
        .titulo-caja {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 14px;
        }
        .titulo {
          font-size: 64px;
          font-weight: 700;
          line-height: 1.15;
          letter-spacing: -0.5px;
        }
        .subrayado {
          display: block;
          width: 100%;
          height: 8px;
          border-radius: 4px;
          background: var(--sec-color);
        }
      </style>

      <div id="root" data-composition-id="intro-wiki" data-width="1920" data-height="1080" data-duration="3">
        <div class="grupo">
          <div class="contenido">
            <div class="marca">
              <div class="favicon" id="intro-wiki-favicon">
                <!-- frontend-v2/public/favicon.svg (sha256 2d3dcdff…) en piezas, sin redibujar: la baldosa, la K y las 7 barras de la corona con el
                     mismo recorte del original. Las barras bajas van sin redondeo y 0,6 más anchas por lado, debajo de las altas: hacen de la
                     banda que las une en el SVG oficial y evitan la costura de antialias entre barras vecinas. -->
                <svg viewBox="0 0 300 300" aria-label="Kingdom">
                  <defs><clipPath id="intro-wiki-recorte"><rect x="79" y="34" width="134.58" height="36.1558" /></clipPath></defs>
                  <rect id="intro-wiki-baldosa" width="300" height="300" rx="26" fill="#3576DA" />
                  <g id="intro-wiki-corona" clip-path="url(#intro-wiki-recorte)" fill="#FFFFFF">
                    <rect x="79" y="34" width="19.2013" height="38" rx="2" />
                    <rect x="97.6006" y="51.1113" width="20.4014" height="20.8887" />
                    <rect x="117.402" y="34" width="19.201" height="38" rx="2" />
                    <rect x="136.003" y="51.1113" width="20.401" height="20.8887" />
                    <rect x="155.39" y="34" width="19.615" height="38" rx="2" />
                    <rect x="174.405" y="51.1113" width="20.401" height="20.8887" />
                    <rect x="193.791" y="34" width="19.616" height="38" rx="2" />
                  </g>
                  <path id="intro-wiki-k" fill="#FFFFFF" d="M102.046 171.722L149.25 166.042C164.799 182.891 178.683 197.942 190.9 211.194C203.117 224.446 213.021 235.047 220.61 242.998C220.61 250.192 218.296 255.872 213.669 260.037C209.041 264.012 203.673 266 197.564 266C190.9 266 185.439 264.296 181.182 260.889C176.924 257.481 172.852 253.505 168.964 248.962L102.046 171.722ZM150.361 186.772L96.493 189.328L183.681 89.3698C194.232 89.3698 201.914 91.5469 206.727 95.9011C211.54 100.066 213.946 104.988 213.946 110.668C213.946 115.022 212.836 119.187 210.614 123.162C208.578 126.949 205.154 131.114 200.341 135.657L150.361 186.772ZM79 142.756H121.205V262.876C119.539 263.444 116.855 264.012 113.153 264.58C109.451 265.148 105.656 265.432 101.769 265.432C93.4387 265.432 87.5151 263.918 83.998 260.889C80.666 257.67 79 252.369 79 244.986V142.756ZM121.205 197.279H79V90.5057C80.8511 90.127 83.6278 89.6538 87.33 89.0858C91.2174 88.5179 94.9196 88.2339 98.4367 88.2339C106.582 88.2339 112.413 89.6537 115.93 92.4935C119.447 95.3332 121.205 100.729 121.205 108.68V197.279Z" />
                </svg>
              </div>
              <div class="textos" id="intro-wiki-textos">
                <div class="nombre">Kingdom</div>
                <div class="ayuda" id="intro-wiki-ayuda">Ayuda</div>
              </div>
            </div>
            <div class="chip" id="intro-wiki-chip"><span class="chip-icono"></span><span id="intro-wiki-seccion">Empieza aquí</span></div>
            <div class="titulo-caja">
              <div class="titulo" id="intro-wiki-titulo" data-var-text="titulo">Entrar a Kingdom</div>
              <span class="subrayado" id="intro-wiki-subrayado"></span>
            </div>
          </div>
        </div>
        <!-- El sonido de marca lo pone el proyecto (host) en el tiempo que declara identidad/kit.json. -->
      </div>

      <script>
        (function () {
          // Secciones de la ayuda (frontend-v2/src/ayuda/secciones.json) con el tono de su módulo en la app (app-modules.ts, tema claro).
          const SECCIONES = {
            empieza: { color: '#015BBE', icono: 'rocket_launch', es: 'Empieza aquí', en: 'Start here' },
            'mi-iglesia': { color: '#006B5F', icono: 'church', es: 'Mi iglesia', en: 'My church' },
            membresia: { color: '#015BBE', icono: 'groups', es: 'Membresía', en: 'Members' },
            eventos: { color: '#7D5800', icono: 'event', es: 'Eventos', en: 'Events' },
            equipos: { color: '#015BBE', icono: 'diversity_3', es: 'Equipos', en: 'Teams' },
            academia: { color: '#7D5800', icono: 'school', es: 'Academia', en: 'Academy' },
            portal: { color: '#006B5F', icono: 'campaign', es: 'Portal', en: 'Portal' },
            comunicaciones: { color: '#006B5F', icono: 'forum', es: 'Comunicaciones', en: 'Messaging' },
            archivos: { color: '#015BBE', icono: 'cloud', es: 'Archivos y Compartir', en: 'Files and Sharing' },
            ajustes: { color: '#015BBE', icono: 'tune', es: 'Ajustes de la iglesia', en: 'Church settings' },
            soporte: { color: '#015BBE', icono: 'support_agent', es: 'Atender consultas', en: 'Answering requests' },
            puesta: { color: '#015BBE', icono: 'construction', es: 'Puesta en marcha', en: 'Getting your church started' },
          };
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const idioma = v.idioma === 'en' ? 'en' : 'es';
          const sec = SECCIONES[v.seccion] || SECCIONES.empieza;
          const root = document.querySelector('[data-composition-id="intro-wiki"]');
          root.style.setProperty('--sec-color', sec.color);
          root.style.setProperty('--sec-icono', `url(identidad/iconos/${sec.icono}.svg)`);
          document.getElementById('intro-wiki-seccion').textContent = sec[idioma];
          document.getElementById('intro-wiki-ayuda').textContent = idioma === 'en' ? 'Help' : 'Ayuda';

          // «La corona se levanta»: la firma del kit, con las mismas piezas y tiempos en las cuatro composiciones (identidad.md).
          const corona = (tl, t) => {
            tl.fromTo('#intro-wiki-baldosa', { transformOrigin: '50% 50%', scale: 0.85, autoAlpha: 0 },
              { transformOrigin: '50% 50%', scale: 1, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t);
            tl.fromTo('#intro-wiki-k', { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t + 0.2);
            tl.fromTo('#intro-wiki-corona rect', { transformOrigin: '50% 100%', scaleY: 0 },
              { transformOrigin: '50% 100%', scaleY: 1, duration: 0.25, ease: 'back.out(2.2)', stagger: 0.05 }, t + 0.45);
          };

          const construir = () => {
            // El favicon arranca grande en el centro y termina en su lugar junto al nombre (su caja final manda).
            const fav = document.getElementById('intro-wiki-favicon');
            const r = fav.getBoundingClientRect();
            const rr = root.getBoundingClientRect();
            const escala = 240 / 144;
            const dx = rr.left + 960 - (r.left + r.width / 2);
            const dy = rr.top + 540 - (r.top + r.height / 2);

            const tl = gsap.timeline({ paused: true });
            tl.set(fav, { x: dx, y: dy, scale: escala }, 0);
            corona(tl, 0);
            // El nombre entra cuando el favicon ya casi llegó, para que no pase por encima de las letras.
            tl.to(fav, { x: 0, y: 0, scale: 1, duration: 0.45, ease: 'power3.inOut' }, 1.1);
            tl.fromTo('#intro-wiki-textos', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 1.45);
            tl.fromTo('#intro-wiki-chip', { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 1.75);
            tl.fromTo('#intro-wiki-titulo', { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 1.85);
            tl.fromTo('#intro-wiki-subrayado', { scaleX: 0, transformOrigin: '0% 50%' },
              { scaleX: 1, transformOrigin: '0% 50%', duration: 0.4, ease: 'power2.inOut' }, 1.95);
            tl.set({}, {}, 3);
            window.__timelines['intro-wiki'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
