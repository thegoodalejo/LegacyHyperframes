<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"siguiente","type":"string","label":"Título del artículo recomendado (vacío = sin «Sigue con»)","default":""},
    {"id":"seccion","type":"enum","label":"Sección de la ayuda","default":"empieza","options":[
      {"value":"empieza","label":"Empieza aquí"},{"value":"mi-iglesia","label":"Mi iglesia"},{"value":"membresia","label":"Membresía"},
      {"value":"eventos","label":"Eventos"},{"value":"equipos","label":"Equipos"},{"value":"academia","label":"Academia"},
      {"value":"portal","label":"Portal"},{"value":"comunicaciones","label":"Comunicaciones"},{"value":"archivos","label":"Archivos y Compartir"},
      {"value":"ajustes","label":"Ajustes de la iglesia"},{"value":"soporte","label":"Atender consultas"},{"value":"puesta","label":"Puesta en marcha"}]},
    {"id":"idioma","type":"enum","label":"Idioma","default":"es","options":[{"value":"es","label":"Español"},{"value":"en","label":"English"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- Cierre del Tipo Wiki, kit de identidad de Kingdom v1 (KingdomApp docs/videos/identidad.md → «Cierre del Tipo Wiki (4,0 s)»). NO se
         edita por video. Con «siguiente» dura 4,0 s; sin él, 2,5 s (el host pone data-duration="2.5" y la marca se arma desde el inicio). -->
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="identidad/fuentes/fuentes.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #faf9fd;
          font-family: 'Inter', sans-serif;
          color: #1b1b1f;
        }
        .capa {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .tarjeta {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 24px;
          min-width: 900px;
          max-width: 1400px;
          padding: 56px 72px;
          border-radius: 32px;
          background: #ffffff;
          border: 2px solid #c4c6d0;
          box-shadow: 0 12px 40px rgba(27, 27, 31, 0.08);
        }
        .sigue {
          font-size: 36px;
          font-weight: 500;
          color: #44474f;
        }
        .siguiente {
          font-size: 60px;
          font-weight: 700;
          line-height: 1.15;
          letter-spacing: -0.5px;
        }
        .chip {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 12px 24px 12px 18px;
          border-radius: 999px;
          background: color-mix(in srgb, var(--sec-color) 12%, transparent);
          color: var(--sec-color);
          font-size: 30px;
          font-weight: 600;
        }
        .chip-icono {
          display: block;
          width: 38px;
          height: 38px;
          background: var(--sec-color);
          -webkit-mask: var(--sec-icono) center / contain no-repeat;
          mask: var(--sec-icono) center / contain no-repeat;
        }
        .marca {
          display: flex;
          align-items: center;
          gap: 40px;
        }
        .favicon {
          display: block;
          width: 176px;
          height: 176px;
        }
        .favicon svg {
          display: block;
          width: 176px;
          height: 176px;
          overflow: visible;
        }
        .textos {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .nombre {
          font-family: 'Fraunces', serif;
          font-size: 88px;
          font-weight: 600;
          line-height: 1.05;
          letter-spacing: -1.8px;
        }
        .frase {
          font-size: 38px;
          font-weight: 500;
          line-height: 1.25;
          color: #44474f;
          max-width: 1000px;
        }
      </style>

      <div id="root" data-composition-id="cierre-wiki" data-width="1920" data-height="1080" data-duration="4">
        <div class="capa" id="cierre-wiki-capa-siguiente">
          <div class="tarjeta" id="cierre-wiki-tarjeta">
            <div class="sigue" id="cierre-wiki-sigue">Sigue con:</div>
            <div class="siguiente" id="cierre-wiki-siguiente" data-var-text="siguiente"></div>
            <div class="chip"><span class="chip-icono"></span><span id="cierre-wiki-seccion">Empieza aquí</span></div>
          </div>
        </div>
        <div class="capa" id="cierre-wiki-capa-marca">
          <div class="marca">
            <div class="favicon">
              <!-- frontend-v2/public/favicon.svg (sha256 2d3dcdff…) en piezas, sin redibujar (ver intro-wiki.html). -->
              <svg viewBox="0 0 300 300" aria-label="Kingdom">
                <defs><clipPath id="cierre-wiki-recorte"><rect x="79" y="34" width="134.58" height="36.1558" /></clipPath></defs>
                <rect id="cierre-wiki-baldosa" width="300" height="300" rx="26" fill="#3576DA" />
                <g id="cierre-wiki-corona" clip-path="url(#cierre-wiki-recorte)" fill="#FFFFFF">
                  <rect x="79" y="34" width="19.2013" height="38" rx="2" />
                  <rect x="97.6006" y="51.1113" width="20.4014" height="20.8887" />
                  <rect x="117.402" y="34" width="19.201" height="38" rx="2" />
                  <rect x="136.003" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="155.39" y="34" width="19.615" height="38" rx="2" />
                  <rect x="174.405" y="51.1113" width="20.401" height="20.8887" />
                  <rect x="193.791" y="34" width="19.616" height="38" rx="2" />
                </g>
                <path id="cierre-wiki-k" fill="#FFFFFF" d="M102.046 171.722L149.25 166.042C164.799 182.891 178.683 197.942 190.9 211.194C203.117 224.446 213.021 235.047 220.61 242.998C220.61 250.192 218.296 255.872 213.669 260.037C209.041 264.012 203.673 266 197.564 266C190.9 266 185.439 264.296 181.182 260.889C176.924 257.481 172.852 253.505 168.964 248.962L102.046 171.722ZM150.361 186.772L96.493 189.328L183.681 89.3698C194.232 89.3698 201.914 91.5469 206.727 95.9011C211.54 100.066 213.946 104.988 213.946 110.668C213.946 115.022 212.836 119.187 210.614 123.162C208.578 126.949 205.154 131.114 200.341 135.657L150.361 186.772ZM79 142.756H121.205V262.876C119.539 263.444 116.855 264.012 113.153 264.58C109.451 265.148 105.656 265.432 101.769 265.432C93.4387 265.432 87.5151 263.918 83.998 260.889C80.666 257.67 79 252.369 79 244.986V142.756ZM121.205 197.279H79V90.5057C80.8511 90.127 83.6278 89.6538 87.33 89.0858C91.2174 88.5179 94.9196 88.2339 98.4367 88.2339C106.582 88.2339 112.413 89.6537 115.93 92.4935C119.447 95.3332 121.205 100.729 121.205 108.68V197.279Z" />
              </svg>
            </div>
            <div class="textos" id="cierre-wiki-textos">
              <div class="nombre">Kingdom</div>
              <div class="frase" id="cierre-wiki-frase">Encuentra esta guía y más en la Ayuda de la app</div>
            </div>
          </div>
        </div>
        <!-- El sonido de marca lo pone el proyecto (host) en el tiempo que declara identidad/kit.json. -->
      </div>

      <script>
        (function () {
          const SECCIONES = {
            empieza: { color: '#015BBE', icono: 'rocket_launch', es: 'Empieza aquí', en: 'Start here' },
            'mi-iglesia': { color: '#006B5F', icono: 'church', es: 'Mi iglesia', en: 'My church' },
            membresia: { color: '#015BBE', icono: 'groups', es: 'Membresía', en: 'Members' },
            eventos: { color: '#7D5800', icono: 'event', es: 'Eventos', en: 'Events' },
            equipos: { color: '#015BBE', icono: 'diversity_3', es: 'Equipos', en: 'Teams' },
            academia: { color: '#7D5800', icono: 'school', es: 'Academia', en: 'Academy' },
            portal: { color: '#006B5F', icono: 'campaign', es: 'Portal', en: 'Portal' },
            comunicaciones: { color: '#006B5F', icono: 'forum', es: 'Comunicaciones', en: 'Messaging' },
            archivos: { color: '#015BBE', icono: 'cloud', es: 'Archivos y Compartir', en: 'Files and Sharing' },
            ajustes: { color: '#015BBE', icono: 'tune', es: 'Ajustes de la iglesia', en: 'Church settings' },
            soporte: { color: '#015BBE', icono: 'support_agent', es: 'Atender consultas', en: 'Answering requests' },
            puesta: { color: '#015BBE', icono: 'construction', es: 'Puesta en marcha', en: 'Getting your church started' },
          };
          const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const idioma = v.idioma === 'en' ? 'en' : 'es';
          const sec = SECCIONES[v.seccion] || SECCIONES.empieza;
          const hay = !!(v.siguiente && String(v.siguiente).trim());
          const root = document.querySelector('[data-composition-id="cierre-wiki"]');
          root.style.setProperty('--sec-color', sec.color);
          root.style.setProperty('--sec-icono', `url(identidad/iconos/${sec.icono}.svg)`);
          document.getElementById('cierre-wiki-seccion').textContent = sec[idioma];
          document.getElementById('cierre-wiki-sigue').textContent = idioma === 'en' ? 'Up next:' : 'Sigue con:';
          document.getElementById('cierre-wiki-frase').textContent = idioma === 'en'
            ? "Find this guide and more in the app's Help" : 'Encuentra esta guía y más en la Ayuda de la app';

          const corona = (tl, t) => {
            tl.fromTo('#cierre-wiki-baldosa', { transformOrigin: '50% 50%', scale: 0.85, autoAlpha: 0 },
              { transformOrigin: '50% 50%', scale: 1, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t);
            tl.fromTo('#cierre-wiki-k', { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: 'power3.out' }, t + 0.2);
            tl.fromTo('#cierre-wiki-corona rect', { transformOrigin: '50% 100%', scaleY: 0 },
              { transformOrigin: '50% 100%', scaleY: 1, duration: 0.25, ease: 'back.out(2.2)', stagger: 0.05 }, t + 0.45);
          };

          // Sin «siguiente», la marca se arma desde el segundo 0 (el cierre dura 2,5 s).
          const m = hay ? 1.5 : 0;
          const tl = gsap.timeline({ paused: true });
          if (hay) {
            tl.fromTo('#cierre-wiki-tarjeta', { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: 'power3.out' }, 0);
            tl.to('#cierre-wiki-capa-siguiente', { autoAlpha: 0, duration: 0.2, ease: 'power1.in' }, 1.3);
          } else {
            tl.set('#cierre-wiki-capa-siguiente', { autoAlpha: 0 }, 0);
          }
          corona(tl, m);
          tl.fromTo('#cierre-wiki-textos', { x: -24, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: 'power2.out' }, m + 0.9);
          tl.to('#cierre-wiki-capa-marca', { autoAlpha: 0, duration: 0.6, ease: 'power1.in' }, m + 1.9);
          tl.set({}, {}, m + 2.5);
          window.__timelines['cierre-wiki'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
