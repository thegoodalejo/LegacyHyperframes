      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            // Un solo dedo para toques seguidos (a menos de 0,65 s uno de otro, en la misma capa): el dedo del primer toque se queda, se
            // desliza al siguiente y lo presiona; se va después del último (queda). Así nunca se ven dos dedos a la vez.
            const tocarSerie = (ancla, pasos, queda) => {
              const p0 = pasos[0], ult = pasos[pasos.length - 1];
              const d = A.tocar(tl, ancla, p0.en, p0.t, { queda: H.r3(ult.t - p0.t + (queda ?? 0.35)), dx: p0.dx, dy: p0.dy, presionar: p0.presionar });
              const onda = d.firstElementChild;
              for (let i = 1; i < pasos.length; i++) {
                const p = pasos[i], prev = pasos[i - 1];
                const c = A.caja(p.en, ancla);
                const mueve = H.r3(Math.max(0.1, Math.min(0.3, p.t - prev.t - 0.2)));
                tl.to(d, { x: H.r3(c.cx + (p.dx || 0)), y: H.r3(c.cy + (p.dy || 0)), duration: mueve, ease: 'power2.inOut' }, H.r3(p.t - mueve - 0.02));
                tl.to(d, { scale: 0.82, duration: 0.08, ease: 'power2.in' }, p.t);
                tl.fromTo(onda, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.45, duration: 0.45, ease: 'power2.out', immediateRender: false }, p.t);
                tl.to(d, { scale: 1, duration: 0.12, ease: 'power2.out' }, p.t + 0.12);
                if (p.presionar !== false) {
                  tl.to(p.en, { scale: 0.97, filter: 'brightness(0.9)', duration: 0.06, ease: 'power1.out' }, p.t);
                  tl.to(p.en, { scale: 1, filter: 'brightness(1)', duration: 0.14, ease: 'power1.out' }, p.t + 0.12);
                }
              }
              return d;
            };
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const W = (f, re, d) => H.r3(H.palabra(f, re).inicio + (d || 0)); // el instante exacto de la palabra (para listas rápidas)
            const $ = (id) => document.getElementById(id);
            const cam = $('ord-cam'), pCur = $('ord-p-cur'), pAj = $('ord-p-aj'), pGr = $('ord-p-gr'), velo = $('ord-velo');
            const AZUL = '#015bbe', CONT_PRIM = '#d7e2ff', SOBRE_CONT_PRIM = '#004492';
            const bs = H.bloques(T, $('ord-col'), 'ord', ['Tu academia en *categorías*', 'Un *programa*: cursos por niveles', 'Miembros → *Discípulos* → Líderes',
              'Cada nivel pide el *anterior*', 'Un curso, los *grupos* que necesites', 'Quiénes *pueden* tomarlo', 'Recupera en *otro grupo*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#ord-ceja-1', 0.1, { dy: 16 });
            const ceja = (de, a, t) => { tl.to(de, { opacity: 0, y: -12, duration: 0.25, ease: 'power2.in' }, t);
              tl.fromTo(a, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', immediateRender: false }, t + 0.25); };
            // Cambiar de pantalla dentro de la app (la nueva entra un poco desde la derecha, como la navegación).
            const pagina = (de, a, t) => { tl.to(de, { opacity: 0, duration: 0.16 }, t);
              tl.fromTo(a, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, t + 0.1); };
            // Diálogos: centrados en la ventana (760 px de alto), con su alto real.
            ['ord-dlg-cat', 'ord-dlg-in1', 'ord-dlg-in2'].forEach((id) => { const h = A.medida($(id)).h; $(id).style.top = `${Math.max(12, Math.round((760 - h) / 2))}px`; });
            const desdeArriba = (el, pag) => A.caja(el, pag).y; // la y de un elemento dentro de su página (sin el desplazamiento)

            // ── f0 · Cursos: el catálogo ordenado en categorías (chips con su ícono en su color); «las creas tú»: Ajustes → Categorías → Nueva.
            tl.fromTo('#ord-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#ord-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });
            const tCat = W(f0, /^categorias/, -0.15);
            A.camara(tl, cam, { z: 1.45, en: $('ord-chips'), t: tCat - 0.75, d: 0.8 });
            A.foco(tl, pCur, $('ord-chips'), tCat, W(f0, /^las/, -0.2), { pad: 6, radio: 24 });
            [['#ord-ch-vision', /^vision/], ['#ord-ch-biblia', /^biblia/], ['#ord-ch-servicio', /^servicio/]].forEach(([s, re]) => H.late(tl, s, W(f0, re, -0.05), { de: 1.14, d: 0.35 }));
            A.camara(tl, cam, { z: 1, t: W(f0, /^las/, -0.3), d: 0.45 });
            const tAj = W(f0, /^las/, -0.05);
            A.tocar(tl, pCur, $('ord-tab-aj'), tAj);
            pagina(pCur, pAj, tAj + 0.1);
            ceja('#ord-ceja-1', '#ord-ceja-2', tAj + 0.05);
            const tAncla = H.r3(tAj + 0.42);
            // (sin toque: la página baja sola hasta «Categorías»; un toque aquí cruzaba su dedo con los de Ajustes y «Nueva categoría»)
            const yCat = desdeArriba($('ord-aj-cat'), pAj) - 16;
            A.desliz(tl, pAj, -yCat, tAncla + 0.1, 0.42);
            const tNueva = H.r3(tAncla + 0.62);
            A.tocar(tl, pAj, $('ord-btn-cat'), tNueva);
            A.vaciar(tl, $('ord-cat-nombre'));
            A.hoja(tl, $('ord-dlg-cat'), tNueva + 0.15, { tipo: 'dialogo', velo, hasta: null });
            const tEsc = H.r3(tNueva + 0.32);
            A.escribir(tl, $('ord-cat-nombre'), 'Instituto', tEsc, { cps: 22, espera: 0.25 });
            tl.to('#ord-cat-guardar', { backgroundColor: AZUL, color: '#ffffff', duration: 0.12 }, tEsc);
            const tColor = Math.max(W(f0, /^color/, 0.05), H.r3(tEsc + 0.75));
            A.foco(tl, $('ord-dlg-cat'), $('ord-cat-ico'), H.r3(tEsc + 0.5), H.r3(tColor + 0.6), { pad: 6, radio: 14 });
            A.tocar(tl, $('ord-dlg-cat'), $('ord-cat-color'), tColor, { dx: 26, queda: 0.04 });
            tl.to('#ord-cat-swatch', { backgroundColor: '#1565c0', duration: 0.15 }, tColor + 0.08);
            tl.to(['#ord-cat-pref', '#ord-cat-sel'], { color: '#1565c0', duration: 0.15 }, tColor + 0.08);
            const tGuardar = H.r3(Math.max(tColor + 0.7, f0.fin + 0.25));
            A.tocar(tl, $('ord-dlg-cat'), $('ord-cat-guardar'), tGuardar);
            tl.to('#ord-dlg-cat', { opacity: 0, scale: 0.96, duration: 0.22, ease: 'power1.in' }, tGuardar + 0.18);
            tl.to(velo, { opacity: 0, duration: 0.25 }, tGuardar + 0.18);
            A.aparecer(tl, $('ord-k-nueva'), tGuardar + 0.4, { dy: 8 });
            A.foco(tl, pAj, $('ord-k-nueva'), tGuardar + 0.45, tGuardar + 1.35, { pad: 3, radio: 14 });

            // ── f1 · Programas: una serie de cursos por niveles (Clases de la visión: 1. Miembros → 2. Discípulos → 3. Líderes).
            const yProg = desdeArriba($('ord-aj-prog'), pAj) - 110;
            const tProg = Math.max(H.r3(tGuardar + 1.0), W(f1, /^categoria/, -0.2));
            A.desliz(tl, pAj, -yProg, tProg, 0.8);
            A.foco(tl, pAj, $('ord-prog-ayuda'), P(f1, /^programa/, -0.2), W(f1, /^niveles/, -0.45), { pad: 6, radio: 10 });
            const cPr = A.caja($('ord-pr-vision'), cam);
            A.camara(tl, cam, { z: 1.5, cx: cPr.cx - 80, cy: cPr.cy - yProg, t: W(f1, /^niveles/, -0.75), d: 0.8 });
            A.foco(tl, pAj, $('ord-pr-vision'), W(f1, /^niveles/, -0.3), W(f2, /^ejemplo/, 0.1), { pad: 4, radio: 14 });

            // ── f2 · En el catálogo, el programa por niveles: «Clases de la visión · nivel 1, 2 y 3» (la cámara recorre los niveles).
            const tVol = T.pulso(f2.inicio);
            A.camara(tl, cam, { z: 1, t: tVol - 0.35, d: 0.45 });
            A.desliz(tl, pAj, 0, tVol, 0.45);
            const tCursos = H.r3(tVol + 0.5);
            A.tocar(tl, pAj, pAj.querySelector('.ord-tab'), tCursos);
            const yVis = desdeArriba($('ord-sec-vision'), pCur) - 12;
            tl.set(pCur, { y: -yVis }, tCursos + 0.05);
            pagina(pAj, pCur, tCursos + 0.1);
            ceja('#ord-ceja-2', '#ord-ceja-3', tCursos + 0.05);
            const cam1 = (el, z, t, d, dx) => { const c = A.caja(el, cam); A.camara(tl, cam, { z, cx: c.cx + (dx || 0), cy: c.cy - yVis, t, d }); };
            cam1($('ord-cu-1-cab'), 1.5, Math.max(W(f2, /^clases/, -0.1), H.r3(tCursos + 0.3)), 0.7, 60);
            A.foco(tl, pCur, $('ord-niv-1'), W(f2, /^miembros/, -0.2), W(f2, /^discipulos/, -0.05), { pad: 4, radio: 10 });
            cam1($('ord-niv-2'), 1.5, W(f2, /^discipulos/, -0.25), 0.55, 60);
            A.foco(tl, pCur, $('ord-niv-2'), W(f2, /^discipulos/, 0.05), W(f2, /^lideres/, -0.1), { pad: 4, radio: 10 });
            cam1($('ord-niv-3'), 1.5, W(f2, /^lideres/, -0.4), 0.6, 60);
            A.foco(tl, pCur, $('ord-niv-3'), W(f2, /^lideres/, 0), f3.inicio + 0.1, { pad: 4, radio: 10 });

            // ── f3 · Cada nivel pide el anterior: el grupo de Líderes dice «Necesitas haber terminado «Discípulos»» y, al inscribir, Kingdom
            //    marca a quien «no cumple el requisito».
            const tLid = T.pulso(f3.inicio);
            A.camara(tl, cam, { z: 1, t: tLid - 0.3, d: 0.45 });
            A.tocar(tl, pCur, $('ord-g-lid'), tLid + 0.2);
            pagina(pCur, pGr, tLid + 0.35);
            const cPre = A.caja($('ord-g-pre'), cam);
            A.camara(tl, cam, { z: 1.55, cx: cPre.x + 400, cy: cPre.cy - 40, t: W(f3, /^anterior/, -0.6), d: 0.7 });
            A.foco(tl, pGr, $('ord-g-pre'), W(f3, /^anterior/, -0.1), W(f3, /^kingdom/, 0.05), { pad: 6, radio: 10 });
            const tIns = W(f3, /^kingdom/, 0.15);
            A.camara(tl, cam, { z: 1, t: tIns - 0.25, d: 0.4 });
            A.tocar(tl, pGr, $('ord-btn-ins'), tIns + 0.15);
            A.hoja(tl, $('ord-dlg-in1'), tIns + 0.3, { tipo: 'dialogo', velo, hasta: null });
            const tQ = H.r3(tIns + 0.5);
            tl.set('#ord-in1-ph', { opacity: 0 }, tQ - 0.05);
            const fQ = A.escribir(tl, $('ord-in1-q'), 'Camilo', tQ, { cps: 18, espera: 0.3, desenfocar: false });
            tl.to('#ord-in1-vacio', { opacity: 0, duration: 0.12 }, fQ + 0.05);
            A.aparecer(tl, $('ord-in1-res'), fQ + 0.1, { dy: 8 });
            A.foco(tl, $('ord-dlg-in1'), $('ord-in1-camilo'), W(f3, /^inscribir/, -0.1), H.r3(f4.inicio + 0.25), { pad: 4, radio: 14 });
            H.late(tl, '#ord-in1-no', W(f3, /^inscribir/, 0.15), { de: 1.12 });

            // ── f4 · El curso se define una vez y se abren los grupos que se necesiten: Miembros, el martes en la noche y el domingo en la tarde.
            const tCan = H.r3(f4.inicio + 0.2);
            A.tocar(tl, cam, $('ord-in1-cancelar'), tCan, { queda: 0.04 });
            tl.to('#ord-dlg-in1', { opacity: 0, scale: 0.96, duration: 0.22, ease: 'power1.in' }, tCan + 0.15);
            tl.to(velo, { opacity: 0, duration: 0.25 }, tCan + 0.15);
            const tVolver = H.r3(tCan + 0.66); // un dedo a la vez: 0,66 s después de «Cancelar»
            A.tocar(tl, pGr, $('ord-g-volver'), tVolver);
            pagina(pGr, pCur, tVolver + 0.12);
            cam1($('ord-cu-1'), 1.4, tVolver + 0.3, 0.75, 0);
            A.foco(tl, pCur, $('ord-cu-1-cab'), W(f4, /^una/, -0.1), W(f4, /^abres/, -0.15), { pad: 4, radio: 12 });
            A.foco(tl, pCur, $('ord-abrir-1'), W(f4, /^abres/, -0.05), W(f4, /^martes/, -0.25), { pad: 2, radio: 20 });
            A.foco(tl, pCur, $('ord-g-mar'), W(f4, /^martes/, -0.15), W(f4, /^domingo/, -0.2), { pad: 3, radio: 14 });
            A.foco(tl, pCur, $('ord-g-dom'), W(f4, /^domingo/, -0.1), T.pulso(f4.fin + 0.1), { pad: 3, radio: 14 });

            // ── f5 · Al inscribir, «Pueden tomarlo»: quienes ya aprobaron «Discípulos». Se marcan dos y queda «Inscribir (2)».
            const tL2 = T.pulso(f5.inicio - 0.3);
            A.camara(tl, cam, { z: 1, t: tL2 - 0.35, d: 0.45 });
            A.tocar(tl, pCur, $('ord-g-lid'), tL2 + 0.15, { queda: 0.04 });
            pagina(pCur, pGr, tL2 + 0.3);
            const tIns2 = H.r3(tL2 + 0.8);
            A.tocar(tl, pGr, $('ord-btn-ins'), tIns2, { queda: 0.04 });
            A.hoja(tl, $('ord-dlg-in2'), tIns2 + 0.15, { tipo: 'dialogo', velo, hasta: null });
            const tPu = W(f5, /^pueden/, -0.15);
            A.tocar(tl, $('ord-dlg-in2'), $('ord-in2-m-pueden'), tPu, { queda: 0.04 });
            tl.to('#ord-in2-m-buscar', { backgroundColor: 'rgba(0,0,0,0)', color: '#1b1b1f', borderColor: '#c4c6d0', duration: 0.12 }, tPu + 0.08);
            tl.to('#ord-in2-m-pueden', { backgroundColor: '#ffdea9', color: '#5e4100', borderColor: 'rgba(0,0,0,0)', duration: 0.12 }, tPu + 0.08);
            tl.to('#ord-in2-buscar', { opacity: 0, duration: 0.15 }, tPu + 0.1);
            tl.fromTo('#ord-in2-lista', { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, tPu + 0.2);
            tl.fromTo('#ord-in2-lista > .ord-fila', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out', stagger: 0.05, immediateRender: false }, tPu + 0.2);
            // El estado de cada casilla; el dedo (uno solo para Andrea, Mariana e «Inscribir (2)») lo pone tocarSerie() más abajo.
            const marcar = (id, t, n) => {
              tl.to(`#${id}`, { backgroundColor: CONT_PRIM, color: SOBRE_CONT_PRIM, duration: 0.12 }, t + 0.05);
              tl.set(`#${id} .i-check_box_outline_blank`, { opacity: 0 }, t + 0.05);
              tl.set(`#${id} .i-check_box`, { opacity: 1 }, t + 0.05);
              tl.set('#ord-in2-n', { textContent: String(n) }, t + 0.05);
            };
            const tM1 = H.r3(tPu + 0.75);
            marcar('ord-in2-andrea', tM1, 1);
            tl.to('#ord-in2-ok', { backgroundColor: AZUL, color: '#ffffff', duration: 0.12 }, tM1 + 0.05);
            marcar('ord-in2-mariana', H.r3(tM1 + 0.45), 2);
            A.foco(tl, $('ord-dlg-in2'), $('ord-in2-m-pueden'), tPu + 0.15, H.r3(tM1 - 0.1), { pad: 4, radio: 24 });

            // ── f6 · Si alguien falta, recupera la clase en otro grupo del mismo curso: con el código de ese grupo, cuenta en el suyo.
            const tOk = H.r3(Math.max(tM1 + 0.95, f6.inicio - 0.1));
            tocarSerie($('ord-dlg-in2'), [{ en: $('ord-in2-andrea'), t: tM1, presionar: false }, { en: $('ord-in2-mariana'), t: H.r3(tM1 + 0.45), presionar: false },
              { en: $('ord-in2-ok'), t: tOk }], 0.04);
            tl.to('#ord-dlg-in2', { opacity: 0, scale: 0.96, duration: 0.22, ease: 'power1.in' }, tOk + 0.15);
            tl.to(velo, { opacity: 0, duration: 0.25 }, tOk + 0.15);
            const tV2 = H.r3(tOk + 0.66); // un dedo a la vez: 0,66 s después de «Inscribir (2)»
            A.tocar(tl, pGr, $('ord-g-volver'), tV2);
            pagina(pGr, pCur, tV2 + 0.12);
            cam1($('ord-cu-1'), 1.35, tV2 + 0.3, 0.75, 120);
            const tCel = H.r3(tV2 + 0.45);
            tl.fromTo('#ord-cel', { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, tCel);
            const tCod = Math.max(W(f6, /^recuperar/, -0.1), H.r3(tCel + 0.65));
            const celCam = $('ord-cel-cam');
            for (let i = 0; i < 4; i++) {
              const t = H.r3(tCod + i * 0.16);
              tl.to(`#ord-cj-${i}`, { backgroundColor: CONT_PRIM, color: SOBRE_CONT_PRIM, borderColor: 'rgba(0,0,0,0)', duration: 0.08 }, t);
              tl.set(`#ord-cj-${i} > span`, { opacity: 1 }, t);
              if (i < 3) tl.to(`#ord-cj-${i + 1}`, { borderColor: AZUL, duration: 0.08 }, t);
            }
            tl.set('#ord-cj-0', { borderColor: AZUL }, tCod - 0.3);
            const tRec = H.r3(tCod + 0.9);
            tl.to('#ord-cu-cod', { opacity: 0, duration: 0.18 }, tRec - 0.1);
            A.aparecer(tl, $('ord-cu-rec'), tRec, { dy: 10 });
            A.foco(tl, pCur, $('ord-g-dom'), W(f6, /^otro/, -0.15), T.salida(0.8), { pad: 3, radio: 14 });
            H.late(tl, '#ord-cu-nota', W(f6, /^otro/, 0), { de: 1.06 });
            const tSi = W(f6, /^curso/, -0.1);
            A.tocar(tl, celCam, $('ord-cu-si'), tSi);
            tl.to('#ord-cu-rec', { opacity: 0, duration: 0.18 }, tSi + 0.2);
            tl.fromTo('#ord-cu-listo', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tSi + 0.3);
            tl.fromTo('#ord-cu-check', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out', immediateRender: false }, tSi + 0.3);

            H.sale(tl, ['#ord-ven', '#ord-cel', '#ord-ceja-3', '#ord-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['orden'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
