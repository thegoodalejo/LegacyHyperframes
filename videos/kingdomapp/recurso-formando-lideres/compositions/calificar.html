      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('cal-cam'), grupo = $('cal-grupo'), ent = $('cal-ent'), velo = $('cal-velo'), fila = $('cal-tabs-fila');
            const bs = H.bloques(T, $('cal-col'), 'cal', ['Notas en *fila*', 'Se califican *solas*', 'Su nota y la *correcta*', 'Trabajos, uno tras *otro*',
              'El *semáforo* de cada uno', 'En «*Faltaron*», un toque']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#cal-ceja', 0.1, { dy: 16 });
            const reloj = (el, textos, t0, paso) => textos.forEach((x, k) => tl.set(el, { textContent: x }, H.r3(t0 + k * (paso || 1))));
            // Las pestañas del grupo: se corren a la vista (scroll horizontal) y se marca la activa.
            const xTab = (sel, margen) => -Math.max(0, A.caja(document.querySelector(sel), fila).x - (margen ?? 26));
            let tabActiva = '#cal-t-notas';
            const pestana = (id, t) => {
              tl.set(tabActiva, { color: '#44474f', borderBottomColor: 'rgba(0,0,0,0)' }, t);
              tl.set(id, { color: '#015bbe', borderBottomColor: '#015bbe' }, t);
              tabActiva = id;
            };
            let secActiva = '#cal-s-notas';
            const seccion = (id, t) => {
              tl.to(secActiva, { opacity: 0, duration: 0.15 }, t);
              tl.fromTo(id, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, t + 0.1);
              secActiva = id;
            };
            const cTabs = A.caja($('cal-tabs'), grupo);
            const yTabs = -(cTabs.y - 8);

            // f0 · la sábana; el lápiz de «Participación» abre las notas en fila: escribes, Enter y pasas al siguiente.
            tl.set(fila, { x: xTab('#cal-t-material') }, 0);
            tl.set(grupo, { y: yTabs + 60 }, 0);
            tl.fromTo('#cal-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio) - 0.4);
            H.entra(tl, '#cal-datos', T.pulso(f0.inicio) + 0.2, { dy: 10 });
            const tLapiz = P(f0, /^notas/, -0.1);
            A.tocar(tl, grupo, $('cal-lapiz'), tLapiz);
            A.hoja(tl, $('cal-h-notas'), tLapiz + 0.15, { velo });
            const tEsc = H.r3(P(f0, /^escribes/, -0.3));
            const notas = ['4,5', '3,5', '3,7'];
            const tEnter = [];
            let t = tEsc;
            for (let k = 0; k < 3; k++) {
              const fin = A.escribir(tl, $(`cal-n-${k}`), notas[k], t, { cps: 12, espera: 0.15 });
              tEnter.push(H.r3(fin + 0.12));
              tl.fromTo(`#cal-ok-${k}`, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, fin + 0.18);
              t = H.r3(fin + 0.45);
            }
            // La tecla Enter (rótulo del kit) late en cada Enter.
            tl.fromTo('#cal-enter', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, tEnter[0] - 0.15);
            tEnter.forEach((x) => H.late(tl, '#cal-enter', x, { de: 1.15, d: 0.3 }));
            tl.to('#cal-enter', { opacity: 0, duration: 0.25 }, tEnter[2] + 0.5);
            // La sábana recibe las notas.
            notas.forEach((n, k) => tl.set(`#cal-c-${k}`, { textContent: n }, tEnter[k]));
            const tListo = H.r3(Math.max(tEnter[2] + 0.35, f0.fin - 0.1));
            A.tocar(tl, cam, $('cal-listo'), tListo, { queda: 0.04 });
            tl.to('#cal-h-notas', { yPercent: 104, duration: 0.3, ease: 'power2.in' }, tListo + 0.15);
            tl.to(velo, { opacity: 0, duration: 0.25 }, tListo + 0.15);

            // f1 · Evaluaciones: «Abrir ahora» → «¿Por cuánto tiempo?» → abierta → al cerrar se califica sola → «Calificar (3)» para las abiertas.
            const tEv = H.r3(f1.inicio + 0.1);
            tl.to(fila, { x: xTab('#cal-t-notas'), duration: 0.4, ease: 'power2.inOut' }, tEv - 0.45);
            A.tocar(tl, grupo, $('cal-t-evaluaciones'), tEv, { dx: xTab('#cal-t-notas') });
            pestana('#cal-t-evaluaciones', tEv + 0.08);
            seccion('#cal-s-ev', tEv + 0.08);
            const cEx = A.caja($('cal-ex'), grupo);
            const yEx = -(cEx.y - 150);
            A.desliz(tl, grupo, yEx, tEv + 0.35, 0.7);
            const tAbrir = P(f1, /^toque/, -0.2);
            A.tocar(tl, grupo, $('cal-abrir'), tAbrir);
            const t30 = P(f1, /^tiempo/);
            A.hoja(tl, $('cal-h-abrir'), tAbrir + 0.15, { velo, hasta: H.r3(t30 + 0.25) });
            A.tocar(tl, cam, $('cal-30'), t30);
            const tAb = t30 + 0.4;
            tl.to('#cal-ex-1', { opacity: 0, duration: 0.15 }, tAb);
            tl.to('#cal-ex-2', { opacity: 1, duration: 0.2 }, tAb + 0.05);
            const tLapso = P(f1, /^califican/, -0.5);
            reloj($('cal-ex-2-falta'), ['Cierra a las 7:30 p. m. · faltan 30:00', 'Cierra a las 7:30 p. m. · faltan 29:59'], tAb, 0.3);
            tl.fromTo('#cal-lapso', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, tLapso - 0.2);
            reloj($('cal-ex-2-falta'), ['Cierra a las 7:30 p. m. · faltan 0:03', 'Cierra a las 7:30 p. m. · faltan 0:02', 'Cierra a las 7:30 p. m. · faltan 0:01'], tLapso, 0.2);
            const oN = { n: 0 };
            tl.fromTo(oN, { n: 0 }, { n: 15, duration: 0.8, ease: 'power1.out', immediateRender: false, onUpdate: () => { $('cal-ex-2-n').textContent = String(Math.round(oN.n)); } }, tLapso - 0.3);
            const tCierra = H.r3(tLapso + 0.6);
            tl.set('#cal-ex-2-chip', { textContent: 'Cerrada', backgroundColor: '#ffdea9', color: '#5e4100' }, tCierra);
            tl.set('#cal-ex-2', { boxShadow: '0 0 0 0px rgba(0,0,0,0)' }, tCierra);
            tl.set('#cal-ex-2-cuando', { color: '#1b1b1f', fontWeight: 400 }, tCierra);
            tl.set('#cal-ex-2-cuando .k-app-icono', { '--k-icono': 'url(assets/iconos/lock_clock.svg)', color: '#44474f' }, tCierra);
            tl.set('#cal-ex-2-falta', { textContent: 'Cerró: calificando…' }, tCierra);
            // Cerrada (evaluaciones-grupo.component.ts:87-100): sin «Extender» ni «Cerrar ya», y el botón de la lista pasa a «Resultados».
            tl.set(['#cal-ex-2-ext', '#cal-ex-2-cer'], { display: 'none' }, tCierra);
            tl.set('#cal-ex-2-quien', { textContent: 'Resultados' }, tCierra);
            const tCalif = P(f1, /^cerrar/, -0.1);
            tl.to('#cal-ex-2', { opacity: 0, duration: 0.15 }, tCalif);
            tl.to('#cal-ex-3', { opacity: 1, duration: 0.2 }, tCalif + 0.05);
            H.late(tl, '#cal-ex-3 .gchip.calificada', tCalif + 0.1, { de: 1.2 });
            tl.to('#cal-lapso', { opacity: 0, duration: 0.25 }, tCalif + 0.4);
            const tAbiertas = P(f1, /^abiertas/, -0.5);
            A.foco(tl, grupo, $('cal-ex-3-abiertas'), tAbiertas, tAbiertas + 0.8, { pad: 3, radio: 14 });
            A.foco(tl, grupo, $('cal-calificar3'), tAbiertas + 0.8, H.r3(f1.fin + 0.1), { pad: 3, radio: 28 });
            A.tocar(tl, grupo, $('cal-calificar3'), H.r3(tAbiertas + 1.4));

            // f2 · la alumna recibe «Ya está tu nota» y ve cuál era la correcta.
            tl.fromTo('#cal-alu', { opacity: 0, y: 60, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out', immediateRender: false }, T.pulso(f2.inicio));
            const tNota = P(f2, /^recibe/, -0.2);
            tl.fromTo('#cal-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)', immediateRender: false }, tNota);
            const tToca = P(f2, /^nota/, 0);
            A.tocar(tl, $('cal-alu-cam'), $('cal-notif'), tToca, { queda: 0.04 });
            tl.to('#cal-notif', { opacity: 0, y: -30, duration: 0.25, ease: 'power1.in' }, tToca + 0.2);
            tl.to('#cal-mc', { opacity: 0, duration: 0.2 }, tToca + 0.2);
            tl.fromTo('#cal-res', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tToca + 0.25);
            const tInc = H.r3(tToca + 0.75);
            A.tocar(tl, $('cal-res'), $('cal-r-inc'), tInc);
            tl.set('#cal-r-todas', { backgroundColor: 'rgba(0,0,0,0)', color: '#1b1b1f', borderColor: '#c4c6d0' }, tInc + 0.08);
            tl.set('#cal-r-inc', { backgroundColor: '#ffdea9', color: '#5e4100', borderColor: 'rgba(0,0,0,0)' }, tInc + 0.08);
            tl.fromTo('#cal-item', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tInc + 0.12);
            const cBuena = A.caja($('cal-buena'), $('cal-alu-cam'));
            const tCorr = P(f2, /^correcta/, -0.5);
            A.camara(tl, $('cal-alu-cam'), { z: 1.3, borde: 'izquierda', cy: cBuena.cy - 40, t: tCorr - 0.6, d: 0.8 });
            A.foco(tl, $('cal-res'), $('cal-buena'), tCorr, T.pulso(f2.fin + 0.4), { pad: 4, radio: 14 });

            // f3 · Entregas: con una foto o un archivo; «Calificar en fila», la nota y un comentario, y la siguiente.
            const tF3 = T.pulso(f3.inicio) - 0.5;
            tl.to('#cal-alu', { opacity: 0, x: -40, filter: 'blur(6px)', duration: 0.45, ease: 'power2.in' }, tF3 - 0.2);
            A.desliz(tl, grupo, yTabs, tF3 - 0.2, 0.5);
            const tEnt = H.r3(tF3 + 0.35);
            A.tocar(tl, grupo, $('cal-t-entregas'), tEnt, { dx: xTab('#cal-t-notas') });
            pestana('#cal-t-entregas', tEnt + 0.08);
            seccion('#cal-s-ent', tEnt + 0.08);
            const tRecibe = P(f3, /^foto/, -0.3);
            A.foco(tl, grupo, $('cal-recibe'), tRecibe, tRecibe + 0.7, { pad: 4, radio: 10 });
            const cRec = A.caja($('cal-fila'), grupo);
            A.desliz(tl, grupo, Math.min(yTabs, -(cRec.y - 520)), tRecibe - 0.4, 0.6);
            const tFila = H.r3(tRecibe + 0.7);
            A.tocar(tl, grupo, $('cal-fila'), tFila);
            tl.to(grupo, { opacity: 0, duration: 0.2 }, tFila + 0.2);
            tl.fromTo(ent, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tFila + 0.25);
            const cPanel = A.caja($('cal-panel'), ent);
            const tPanel = H.r3(tFila + 0.65);
            A.desliz(tl, ent, -(cPanel.y - 64), tPanel, 0.6);
            const tR = Math.max(P(f3, /^calificas/, 0), T.pulso(tPanel + 0.6));
            A.tocar(tl, ent, $('cal-r45'), tR);
            tl.to('#cal-r45 .on', { opacity: 1, duration: 0.12 }, tR + 0.05);
            tl.set('#cal-nota-v', { textContent: '4,5' }, tR + 0.08);
            ['cal-nota-c', 'cal-com'].forEach((id) => A.vaciar(tl, $(id)));
            tl.fromTo('#cal-nota-c .k-app-campo-etiqueta', { x: 0, y: 28, scale: 4 / 3 }, { x: 0, y: 0, scale: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, tR + 0.08);
            const finCom = A.escribir(tl, $('cal-com'), '¡Muy completa, Mariana!', H.r3(tR + 0.45), { cps: 22, espera: 0.2 });
            const tSeguir = H.r3(Math.min(f4.inicio - 0.35, finCom + 0.3));
            A.tocar(tl, ent, $('cal-seguir'), tSeguir);
            A.aparecer(tl, $('cal-snack'), tSeguir + 0.15);
            A.quitar(tl, $('cal-snack'), tSeguir + 1.3);

            // f4 · la sábana con el semáforo de cada alumno: cumple, en riesgo o no cumple.
            const tF4 = H.r3(f4.inicio + 0.05);
            tl.to(ent, { opacity: 0, duration: 0.2 }, tF4);
            tl.set(grupo, { y: yTabs }, tF4);
            tl.to(grupo, { opacity: 1, duration: 0.25 }, tF4 + 0.05);
            pestana('#cal-t-notas', tF4);
            seccion('#cal-s-notas', tF4);
            tl.set('#cal-s-notas', { opacity: 1, y: 0 }, tF4 + 0.4);
            const sab = $('cal-sab'), tabla = $('cal-tabla');
            const dx = -(A.medida(tabla).w - A.medida(sab).w);
            const tSem = P(f4, /^semaforo/, -0.6);
            tl.to(tabla, { x: dx, duration: 0.9, ease: 'power2.inOut' }, tSem);
            tl.to('#cal-tabla .fija', { x: -dx, duration: 0.9, ease: 'power2.inOut' }, tSem);
            const cSab = A.caja(sab, cam);
            A.camara(tl, cam, { z: 1.35, borde: 'derecha', cy: cSab.cy + yTabs + 40, t: tSem - 0.2, d: 0.9 });
            A.camara(tl, cam, { z: 1, t: P(f4, /^cumple/, -0.9), d: 0.6 });
            A.foco(tl, grupo, $('cal-f-cumple'), P(f4, /^cumple/, -0.25), P(f4, /^riesgo/, -0.25), { pad: 3, radio: 20 });
            A.foco(tl, grupo, $('cal-f-riesgo'), P(f4, /^riesgo/, -0.25), P(f4, /^no$/, -0.2), { pad: 3, radio: 20 });
            A.foco(tl, grupo, $('cal-f-no'), P(f4, /^no$/, -0.2), H.r3(f5.inicio - 0.1), { pad: 3, radio: 20 });

            // f5 · «Faltaron»: quién lleva varias clases sin venir y «Escribir», que abre el WhatsApp del profesor con el mensaje listo.
            const tF5 = T.pulso(f5.inicio - 0.4);
            A.camara(tl, cam, { z: 1, t: tF5 - 0.5, d: 0.5 });
            tl.to(fila, { x: xTab('#cal-t-asistencia'), duration: 0.35, ease: 'power2.inOut' }, tF5 - 0.4);
            A.tocar(tl, grupo, $('cal-t-asistencia'), tF5, { dx: xTab('#cal-t-asistencia') });
            pestana('#cal-t-asistencia', tF5 + 0.08);
            A.hoja(tl, $('cal-h-falt'), tF5 + 0.25, { velo });
            const tSeg = P(f5, /^varias/, -0.3);
            A.foco(tl, cam, $('cal-seg'), tSeg, tSeg + 1.2, { pad: 3, radio: 10 });
            const tWa = P(f5, /^whatsapp/, -0.3);
            A.foco(tl, cam, $('cal-wa'), tWa - 0.6, tWa + 0.6, { pad: 3, radio: 22 });
            A.tocar(tl, cam, $('cal-wa'), tWa);
            tl.to('#cal-f-5', { opacity: 0, y: -24, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, tWa + 0.05);
            tl.fromTo('#cal-msg', { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out', immediateRender: false }, tWa + 0.25);

            H.sale(tl, ['#cal-tel', '#cal-ceja', '#cal-datos', '#cal-msg'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['calificar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
