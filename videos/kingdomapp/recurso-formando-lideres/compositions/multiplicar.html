      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          /** Las cuatro generaciones de 2 Timoteo 2:2 (la misma pieza de formar.html), con una quinta columna: cada uno de los otros forma a dos más. */
          const generaciones = (cont, svg, pref, o) => {
            o = o || {};
            const xs = o.xs || [64, 214, 384, 566], yc = o.y || 400, sep = o.sep || 210, sepO = o.sepO || 70;
            const g = { lineas: [], nodos: [], rots: [] };
            const capa = H.el('div', 'ancla', cont, `${pref}-gen`, { left: '0px', top: '0px' });
            g.capa = capa;
            g.pablo = H.nodo(capa, `${pref}-pablo`, xs[0], yc, 'person', false, 104);
            g.timoteo = H.nodo(capa, `${pref}-timoteo`, xs[1], yc, 'person', false, 92);
            g.lPT = H.linea(svg, `${pref}-l-pt`, xs[0] + 54, yc, xs[1] - 48, yc, false);
            g.fieles = [-1, 0, 1].map((k, i) => H.nodo(capa, `${pref}-fiel-${i}`, xs[2], yc + k * sep, 'person', false, 80));
            g.lTF = [-1, 0, 1].map((k, i) => H.linea(svg, `${pref}-l-tf-${i}`, xs[1] + 48, yc, xs[2] - 42, yc + k * sep, false));
            g.otros = [];
            g.lFO = [];
            g.yOtros = [];
            [-1, 0, 1].forEach((k, i) => [-1, 0, 1].forEach((m, j) => {
              const y = yc + k * sep + m * sepO;
              g.yOtros.push(y);
              g.otros.push(H.punto(capa, `${pref}-otro-${i}-${j}`, xs[3], y, '', 24));
              g.lFO.push(H.linea(svg, `${pref}-l-fo-${i}-${j}`, xs[2] + 42, yc + k * sep, xs[3] - 14, y, false));
            }));
            g.nombres = ['Pablo', 'Timoteo', 'Fieles', 'Otros'].map((tx, i) => H.ancla(capa, `${pref}-nom-${i}`, xs[i], o.yNombres || 770, tx, 'rot'));
            if (o.quinta) {
              g.mas = [];
              g.lMas = [];
              g.yOtros.forEach((y, n) => [-1, 1].forEach((s, j) => {
                const y2 = y + s * (sepO / 4);
                g.mas.push(H.punto(capa, `${pref}-mas-${n}-${j}`, o.quinta, y2, 'k-oro', 16));
                g.lMas.push(H.linea(svg, `${pref}-l-mas-${n}-${j}`, xs[3] + 14, y, o.quinta - 9, y2, true));
              }));
            }
            return g;
          };

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('mul-dia'), svg = $('mul-svg'), cam = $('mul-cam'), pag = $('mul-pag');
            // Cada palabra del rótulo entra cuando la voz dice esa misma palabra (si la dice); las demás, justo después de la anterior.
            const norm = (w) => w.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const alinear = (lista) => lista.forEach((b) => {
              if (!b) return;
              const f = T.frases[b.i];
              let k = 0, t = f.palabras.length ? f.palabras[0].inicio : f.inicio;
              b.spans.forEach((sp, j) => {
                const w = norm(sp.s.textContent);
                const q = w.length >= 3 ? f.palabras.findIndex((p, n) => n >= k && norm(p.texto) === w) : -1;
                if (q >= 0) { k = q + 1; t = f.palabras[q].inicio; } else if (j > 0) t = H.r3(t + 0.12);
                sp.inicio = t;
              });
            });
            const bsA = H.bloques(T, $('mul-arriba'), 'mula', ['En el *Tablero*, toda tu academia', null, null, null, null, null]);
            const bs = H.bloques(T, $('mul-col'), 'mul', [null, 'No un certificado: alguien que puede *enseñar*', 'De Líderes a *profesor* del próximo grupo',
              'Lo nombras y ve *solo* su grupo', 'Pablo, Timoteo: fieles que enseñan a *otros*', 'Una iglesia que se *multiplica*']);
            alinear(bsA);
            alinear(bs);
            H.animarBloques(tl, T, bsA, T.frases[1].inicio - 0.32);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#mul-ceja-1', 0.1, { dy: 16 });

            // f0 · el Tablero: toda la academia; foco en quién está en riesgo, quién falta seguido y quién se graduó (Datos de ejemplo).
            tl.fromTo('#mul-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#mul-datos', T.pulso(f0.inicio) + 0.5, { dy: 10 });
            A.camara(tl, cam, { z: 1.3, en: $('mul-cifras'), ancla: cam, dy: -70, t: P(f0, /^toda/, -0.3), d: 0.9 });
            A.foco(tl, pag, $('mul-t-riesgo'), P(f0, /^riesgo/, -0.4), P(f0, /^falta/, -0.3), { pad: 3, radio: 18 });
            A.foco(tl, pag, $('mul-t-seguidas'), P(f0, /^falta/, -0.3), P(f0, /^graduo/, -0.4), { pad: 3, radio: 18 });
            A.foco(tl, pag, $('mul-t-graduados'), P(f0, /^graduo/, -0.4), T.pulso(f1.inicio - 0.4), { pad: 3, radio: 18 });
            const tSa = T.pulso(f1.inicio - 0.4);
            H.sale(tl, ['#mul-ven', '#mul-datos', '#mul-ceja-1'], tSa, { d: 0.45 });
            tl.fromTo('#mul-ceja-2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tSa + 0.3);

            // f1 · el fruto no es un certificado: es una persona que ahora puede enseñar.
            const cert = H.nodo(dia, 'mul-cert', 324, 330, 'workspace_premium', false, 150);
            H.pop(tl, cert, P(f1, /^certificado/, -0.4));
            const tPe = P(f1, /^persona/, -0.3);
            tl.to(cert, { x: -170, scale: 0.7, opacity: 0.28, duration: 0.6, ease: 'power3.inOut' }, tPe - 0.2);
            const yo = H.punto(dia, 'mul-yo', 454, 330, 'k-oro', 46);
            const halo = H.el('div', 'halo', dia, 'mul-halo', { left: '454px', top: '330px', width: '170px', height: '170px', margin: '-85px 0 0 -85px' });
            H.pop(tl, yo, tPe + 0.1);
            H.halo(tl, halo, tPe + 0.3);
            const ense = H.chip(dia, 'mul-ense', 454, 450, `${H.icono('school', 34, true)}Puede enseñar`, 'oro');
            H.pop(tl, ense, P(f1, /^ensenar/, -0.3));

            // f2 · quien se graduó de Líderes puede ser el profesor del próximo grupo.
            const t2 = T.pulso(f2.inicio - 0.3);
            H.sale(tl, [cert, ense], t2, { d: 0.35 });
            tl.to(yo, { x: -130, y: -160, duration: 0.8, ease: 'power3.inOut' }, t2);
            tl.set(halo, { x: -130, y: -160 }, t2 + 0.8);
            const grad = H.chip(dia, 'mul-grad', 324, 262, `${H.icono('workspace_premium', 34)}Se graduó de Líderes`, '');
            H.entra(tl, grad, P(f2, /^lideres/, -0.4), { dy: 12 });
            const prof = H.chip(dia, 'mul-prof-c', 324, 262, `<span class="ico ico-oro" style="--k-icono: url(assets/iconos/co_present.svg); --k-icono-tam: 34px"></span>Profesor`, 'oro');
            const tPr = P(f2, /^profesor/, -0.3);
            H.sale(tl, grad, tPr - 0.1, { d: 0.25 });
            H.pop(tl, prof, tPr + 0.1);
            H.halo(tl, halo, tPr + 0.1);
            const red = H.el('div', 'ancla', dia, 'mul-red', { left: '0px', top: '0px' });
            const lG = H.linea(svg, 'mul-l-g', 324, 300, 324, 448, true);
            const grupo = H.nodo(red, 'mul-grupo', 324, 520, 'groups', true, 124);
            const tGr = P(f2, /^grupo/, -0.5);
            H.dibujar(tl, lG, tGr - 0.2, 0.4);
            H.pop(tl, grupo, tGr + 0.1);
            const alumnos = [];
            for (let k = 0; k < 7; k++) {
              const a = (k / 7) * Math.PI * 2 + Math.PI / 2;
              alumnos.push(H.punto(red, `mul-al-${k}`, 324 + Math.cos(a) * 118, 520 + Math.sin(a) * 118, '', 20));
            }
            H.pop(tl, alumnos, tGr + 0.35, { stagger: 0.04, d: 0.35 });

            // f3 · si ya sirve en tu iglesia, lo nombras en el grupo (la tarjeta «Profesores» de abrir un grupo)…
            const t3 = T.pulso(f3.inicio - 0.3);
            tl.to([yo, prof, red, lG], { opacity: 0, duration: 0.35, ease: 'power1.in' }, t3);
            tl.fromTo('#mul-prof', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t3 + 0.2);
            const campo = $('mul-buscar');
            A.vaciar(tl, campo);
            const tEs = P(f3, /^iglesia/, -0.1);
            const fin = A.escribir(tl, campo, 'Mariana', tEs, { cps: 14, desenfocar: false });
            tl.fromTo('#mul-res', { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out', immediateRender: false }, H.r3(fin + 0.1));
            const tNo = P(f3, /^nombras/);
            A.tocar(tl, $('mul-prof').firstElementChild, $('mul-res-1'), tNo, { dx: 120 });
            tl.to('#mul-res', { opacity: 0, duration: 0.2 }, tNo + 0.2);
            tl.to('#mul-sin', { opacity: 0, duration: 0.15 }, tNo + 0.2);
            tl.to('#mul-elegido', { opacity: 1, duration: 0.25 }, tNo + 0.3);
            tl.to('#mul-buscar-v', { opacity: 0, duration: 0.15 }, tNo + 0.3);
            tl.to(campo, { boxShadow: 'inset 0 0 0 1px #74777f', duration: 0.15 }, tNo + 0.3);
            tl.to('#mul-buscar .k-app-campo-etiqueta', { x: 36, y: 28, scale: 4 / 3, color: '#44474f', duration: 0.2, ease: 'power2.out' }, tNo + 0.3);
            A.foco(tl, $('mul-prof').firstElementChild, $('mul-elegido'), tNo + 0.45, P(f3, /^solo/, -0.3), { pad: 3, radio: 18 });

            // … y ve solo ese grupo: sus alumnos, su asistencia y sus notas (los otros grupos, con candado).
            const tSo = P(f3, /^solo/, -0.2);
            H.sale(tl, '#mul-prof', tSo - 0.2, { d: 0.35 });
            const alcance = H.el('div', 'ancla', dia, 'mul-alcance', { left: '0px', top: '0px' });
            const svg3 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg3.setAttribute('class', 'svg');
            svg3.setAttribute('viewBox', '0 0 648 800');
            Object.assign(svg3.style, { width: '648px', height: '800px' });
            alcance.appendChild(svg3);
            const suyo = H.nodo(alcance, 'mul-suyo', 324, 300, 'groups', true, 128);
            const profe = H.punto(alcance, 'mul-profe', 324, 150, 'k-oro', 40);
            const lP = H.linea(svg3, 'mul-l-p', 324, 172, 324, 234, true);
            const otrosG = [[100, 300], [548, 300]].map(([x, y], i) => {
              const n = H.nodo(alcance, `mul-otro-g-${i}`, x, y, 'groups', false, 96);
              const c = H.el('span', 'candado', n.firstChild, `mul-cand-${i}`);
              c.innerHTML = H.icono('lock', 26);
              return n;
            });
            H.pop(tl, suyo, tSo + 0.1);
            H.pop(tl, profe, tSo + 0.2);
            H.dibujar(tl, lP, tSo + 0.3, 0.3);
            tl.fromTo(otrosG, { opacity: 0, scale: 0.6 }, { opacity: 0.45, scale: 1, duration: 0.45, ease: 'back.out(1.8)', stagger: 0.08 }, tSo + 0.3);
            const pila = H.ancla(alcance, 'mul-pila', 324, 560, '', 'pila');
            [['groups', 'Sus alumnos', /^alumnos/], ['how_to_reg', 'Su asistencia', /^asistencia/], ['edit_note', 'Sus notas', /^notas/]].forEach(([ic, tx, re], i) => {
              const c = H.el('span', 'chip', pila.firstChild, `mul-ve-${i}`);
              c.innerHTML = `${H.icono(ic, 34)}${tx}`;
              H.entra(tl, c, P(f3, re, -0.35), { dy: 16 });
            });

            // f4 · así se cumple lo que Pablo le encargó a Timoteo: fieles que enseñan a otros (vuelve el gráfico de las generaciones).
            const t4 = T.pulso(f4.inicio - 0.4);
            H.sale(tl, alcance, t4, { d: 0.4 });
            const g = generaciones(dia, svg, 'mul', { xs: [44, 174, 324, 474], y: 380, sep: 200, sepO: 64, yNombres: 750, quinta: 604 });
            H.entra(tl, '#mul-cita', P(f4, /^pablo/, -0.6), { dy: 14 });
            const tPa = P(f4, /^pablo/, -0.3);
            H.pop(tl, g.pablo, tPa);
            H.entra(tl, g.nombres[0], tPa + 0.1, { dy: 10 });
            const tTi = P(f4, /^timoteo/, -0.4);
            H.dibujar(tl, g.lPT, tTi - 0.2, 0.35);
            H.pop(tl, g.timoteo, tTi);
            H.entra(tl, g.nombres[1], tTi + 0.1, { dy: 10 });
            const tFi = P(f4, /^fieles/, -0.4);
            g.lTF.forEach((l, i) => H.dibujar(tl, l, tFi - 0.2 + i * 0.05, 0.35));
            H.pop(tl, g.fieles, tFi, { stagger: 0.06 });
            H.entra(tl, g.nombres[2], tFi + 0.1, { dy: 10 });
            const tOt = P(f4, /^otros/, -0.5);
            g.lFO.forEach((l, i) => H.dibujar(tl, l, tOt - 0.3 + i * 0.03, 0.35));
            H.pop(tl, g.otros, tOt, { stagger: 0.03 });
            H.entra(tl, g.nombres[3], tOt + 0.1, { dy: 10 });

            // f5 · una iglesia que forma líderes es una iglesia que se multiplica: cada uno de los otros forma a dos más, y todo se enciende.
            const tFo = P(f5, /^forma/, -0.3);
            tl.to(g.otros, { backgroundColor: '#e8b95a', duration: 0.3, stagger: 0.02 }, tFo);
            [g.pablo, g.timoteo, ...g.fieles].forEach((n, i) => tl.to(`#${n.id}-n`, { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, tFo + i * 0.04));
            const tLi = P(f5, /^lideres/, -0.3);
            g.lMas.forEach((l, i) => H.dibujar(tl, l, tLi + i * 0.02, 0.35));
            H.pop(tl, g.mas, tLi + 0.15, { stagger: 0.02, d: 0.35 });
            const tMu = P(f5, /^multiplica/, -0.3);
            tl.to([g.lPT, ...g.lTF, ...g.lFO], { stroke: '#e8b95a', duration: 0.3 }, tMu);
            const haloG = H.el('div', 'halo', dia, 'mul-halo-g', { left: '324px', top: '380px', width: '520px', height: '520px', margin: '-260px 0 0 -260px' });
            H.halo(tl, haloG, tMu);
            H.late(tl, [g.pablo, g.timoteo, ...g.fieles], tMu + 0.1, { de: 1.15 });

            H.sale(tl, ['#mul-dia', '#mul-ceja-2', '#mul-cita'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['multiplicar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
