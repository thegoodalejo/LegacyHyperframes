      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          // Un QR ficticio (no codifica nada): los tres patrones de posición y módulos con semilla fija (como el del Recurso 1).
          const dibujarQR = () => {
            const N = 25, Q = 4, az = H.azar(117), on = [];
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) on.push(az() < 0.48);
            const finder = (fx, fy) => { for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
              const X = fx + x, Y = fy + y; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
              const borde = x === 0 || x === 6 || y === 0 || y === 6, centro = x >= 2 && x <= 4 && y >= 2 && y <= 4;
              on[Y * N + X] = x >= 0 && x <= 6 && y >= 0 && y <= 6 && (borde || centro); } };
            finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
            for (let i = 8; i < N - 8; i++) { on[6 * N + i] = i % 2 === 0; on[i * N + 6] = i % 2 === 0; }
            let d = '';
            on.forEach((v, i) => { if (v) d += `M${(i % N) + Q} ${Math.floor(i / N) + Q}h1v1h-1z`; });
            document.getElementById('gra-qr-path').setAttribute('d', d);
          };

          const construir = () => {
            dibujarQR();
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const tcam = $('gra-tcam'), cam = $('gra-cam'), hcam = $('gra-hcam');
            // El texto cinético: la primera frase junto al celular (columna) y las demás arriba, sobre el computador.
            const bc = H.bloques(T, $('gra-col'), 'grc', ['El profesor abre «*Graduar*»', null, null, null]);
            H.animarBloques(tl, T, bc, T.pulso(f1.inicio - 0.5));
            const ba = H.bloques(T, $('gra-arriba'), 'gra', [null, 'Quien coordina la *aprueba*', 'Logo, firma y un *QR* que se verifica', 'El *logro* y la ruta, solos']);
            H.animarBloques(tl, T, ba);
            H.entra(tl, '#gra-ceja', 0.1, { dy: 16 });

            // f0 · el profesor, en su celular, está en «Evaluaciones» (ya calificadas); en «Graduar» toca la pestaña «Graduar» y aparece la
            //      sección «Cerrar y graduar»: la lista ya trae marcado quién cumple los criterios.
            const tTab = P(f0, /^graduar/, -0.1);
            const tCri = P(f0, /^criterios/, -0.3);
            tl.fromTo('#gra-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, H.r3(tTab - 0.9));
            H.entra(tl, '#gra-datos1', H.r3(tTab - 0.9), { dy: 10 }); // las cifras de «Evaluaciones» entran con el celular
            A.tocar(tl, $('gra-tpag'), $('gra-t-graduar'), tTab);
            tl.to('#gra-t-ev', { color: '#44474f', borderBottomColor: 'rgba(0,0,0,0)', duration: 0.15 }, tTab + 0.1);
            tl.to('#gra-t-graduar', { color: '#015bbe', borderBottomColor: '#015bbe', duration: 0.15 }, tTab + 0.1);
            tl.to('#gra-sec-ev', { opacity: 0, duration: 0.15, ease: 'power1.in' }, tTab + 0.1);
            tl.fromTo('#gra-proponer', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, tTab + 0.2);
            tl.fromTo('#gra-tbarra', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, tTab + 0.35);
            A.foco(tl, $('gra-tpag'), $('gra-titulo'), tTab + 0.5, tCri - 0.1, { pad: 4, radio: 8 });
            H.sale(tl, '#gra-datos1', T.pulso(f1.inicio - 0.6), { d: 0.3 });
            H.entra(tl, '#gra-datos', T.pulso(f1.inicio - 0.2), { dy: 10 });
            tl.fromTo('#gra-tlista > .fila', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.12, immediateRender: false }, P(f0, /^arma/, -0.2));
            A.foco(tl, $('gra-tpag'), $('gra-criterios'), tCri, tCri + 1.0, { pad: 4, radio: 16 });
            const tEnv = Math.min(T.pulso(f0.fin - 0.1), H.r3(T.pulso(f1.inicio - 0.6) - 0.5)); // el toque se ve antes de que el celular salga
            A.tocar(tl, tcam, $('gra-enviar'), tEnv);
            tl.to('#gra-tel', { opacity: 0, x: 120, duration: 0.45, ease: 'power2.in' }, T.pulso(f1.inicio - 0.6));

            // f1 · quien coordina, en su computador: «Aprobar (9)», la confirmación y «¡Listo!»; a la graduada le llega el aviso.
            const tVen = T.pulso(f1.inicio - 0.4);
            tl.fromTo('#gra-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, tVen);

            A.foco(tl, $('gra-v1'), $('gra-aprobar'), tAp - 0.4, tAp + 0.1, { pad: 4, radio: 26 });

            tl.to('#gra-v1 .despues', { opacity: 1, duration: 0.2 }, tOk + 0.1);

            const tCel = P(f1, /^llega/, -0.5);
            tl.fromTo('#gra-cel', { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, tCel);
            tl.fromTo('#gra-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, P(f1, /^ya$/, -0.3));
            H.late(tl, '#gra-notif', P(f1, /^certificado/, -0.1), { de: 1.06 });
            tl.to('#gra-cel', { opacity: 0, x: 260, duration: 0.45, ease: 'power2.in' }, T.pulso(f2.inicio - 0.6));
            A.quitar(tl, $('gra-snack'), T.pulso(f2.inicio - 0.6));
            H.sale(tl, '#gra-datos', T.pulso(f2.inicio - 0.6), { d: 0.3 });

            // f2 · el certificado en PDF: el logo de la iglesia, la firma del pastor y el QR con su código para verificarlo.
            const tHoja = T.pulso(f2.inicio - 0.5);
            tl.to('#gra-ven', { opacity: 0.25, scale: 0.97, duration: 0.4, ease: 'power2.inOut' }, tHoja - 0.1);
            tl.fromTo('#gra-hoja', { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'power3.out' }, tHoja);
            A.camara(tl, hcam, { z: 1.8, en: $('gra-logo'), dy: 40, t: P(f2, /^logo/, -0.5), d: 0.8 });
            A.foco(tl, hcam, $('gra-logo'), P(f2, /^logo/, -0.1), P(f2, /^firma/, -0.6), { pad: 1, radio: 12 }); // pad 1: el nombre de la iglesia está 5 px debajo del logo
            A.camara(tl, hcam, { z: 1.8, en: $('gra-firma'), t: P(f2, /^firma/, -0.6), d: 0.9 });
            tl.fromTo('#gra-firma-p', { strokeDasharray: 900, strokeDashoffset: 900 }, { strokeDashoffset: 0, duration: 1.1, ease: 'power1.inOut', immediateRender: false }, P(f2, /^firma/, -0.3));
            A.foco(tl, hcam, $('gra-firma'), P(f2, /^firma/, -0.1), P(f2, /^subes/, 0.2), { pad: 4, radio: 14 });
            A.camara(tl, hcam, { z: 1.6, cx: 740, cy: 575, t: P(f2, /^codigo/, -0.6), d: 0.9 });
            A.foco(tl, hcam, $('gra-verificar'), P(f2, /^qr/, -0.3), T.pulso(f2.fin + 0.2), { pad: 6, radio: 10 }); // un solo foco: código, «Verifícalo en…» y QR
            const verif = H.ancla($('gra-sobre'), 'gra-verif', 960, 985, `<span class="rotulo-kit">${H.icono('verified', 30, true)}Cualquiera lo verifica con el QR o el código</span>`, '');
            H.entra(tl, verif, P(f2, /^cualquiera/, -0.3), { dy: 14 });
            H.sale(tl, verif, T.pulso(f3.inicio - 0.5), { d: 0.3 });
            tl.to(hcam, { x: 0, y: 0, scale: 1, duration: 0.5, ease: 'power2.inOut' }, T.pulso(f3.inicio - 0.6));
            tl.to('#gra-hoja', { opacity: 0, y: 40, scale: 0.96, duration: 0.45, ease: 'power2.in' }, T.pulso(f3.inicio - 0.5));

            // f3 · el paso 5 del curso: el logro que otorga (en un programa, su nivel) y la ruta de crecimiento que cumple ese paso sola.
            const tV3 = T.pulso(f3.inicio - 0.3);
            tl.set('#gra-v1', { opacity: 0 }, tV3);
            tl.to('#gra-ven .riel-i', { opacity: 1, duration: 0.2 }, tV3);
            tl.fromTo('#gra-v3', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, tV3);
            tl.to('#gra-ven', { opacity: 1, scale: 1, duration: 0.45, ease: 'power2.out' }, tV3);
            const tLo = P(f3, /^logro/, -0.4);
            A.camara(tl, cam, { z: 1.35, en: $('gra-programa'), dy: 60, t: tLo - 0.3, d: 0.8 });
            const tOtorga = P(f3, /^recibe/, -0.3);
            A.foco(tl, $('gra-v3'), $('gra-programa'), tLo, H.r3(tOtorga - 0.35), { pad: 4, radio: 18 }); // se apaga antes del siguiente
            A.foco(tl, $('gra-v3'), $('gra-otorga'), tOtorga, P(f3, /^recibe/, 0.5), { pad: 3, radio: 6 });
            const tRu = P(f3, /^ruta/, -0.4);
            A.foco(tl, $('gra-v3'), $('gra-ruta'), tRu, T.salida(0.7), { pad: 4, radio: 18 });
            const conf = H.ancla($('gra-sobre'), 'gra-conf', 960, 985, `<span class="rotulo-kit">${H.icono('route', 30, true)}Se configura en Membresía → Ajustes → Ruta</span>`, '');
            H.entra(tl, conf, P(f3, /^puede/, -0.3), { dy: 14 });

            H.sale(tl, ['#gra-ven', '#gra-ceja', '#gra-dia', '#gra-sobre'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['graduar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
