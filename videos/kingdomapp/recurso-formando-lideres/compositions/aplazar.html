      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('apl-cam'), pag = $('apl-pag');
            const bs = H.bloques(T, $('apl-col'), 'apl', ['A veces una clase *se corre*', 'Fechas → «*Aplazar o mover*»', 'Las siguientes, *ya marcadas*',
              'Antes de confirmar, *cómo quedan*', 'El calendario se corre *solo*', '«Tu clase *cambió de fecha*»']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#apl-ceja', 0.1, { dy: 16 });
            // Un rollo: el texto viejo sube y se va, el nuevo sube desde abajo (la fecha que cambia).
            const rollo = (el, t) => {
              const v = el.querySelector('.viejo'), n = el.querySelector('.nuevo');
              tl.to(v, { y: -18, opacity: 0, duration: 0.35, ease: 'power2.in' }, t);
              tl.fromTo(n, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', immediateRender: false }, t + 0.15);
            };

            // f0 · entra la ventana: el grupo «Discípulos · jueves 7 p. m.», en «Fechas». La página baja hasta las secciones.
            tl.fromTo('#apl-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#apl-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });
            const yTabs = A.caja($('apl-gtabs'), pag).y - 6;
            const tBaja = P(f0, /^veces/, -0.2);
            A.desliz(tl, pag, -yTabs, tBaja, 0.9);
            A.foco(tl, pag, $('apl-c0'), P(f0, /^dictar/, -0.1), P(f1, /^fechas/, -0.5), { pad: 4, radio: 16 });

            // f1 · «Fechas»: el menú de la clase (⋮) y «Aplazar o mover».
            A.foco(tl, pag, $('apl-tab-fechas'), P(f1, /^fechas/, -0.2), P(f1, /^abres/, 0.2), { pad: 2, radio: 8 });
            const tMenu = P(f1, /^menu/);
            const bMenu = $('apl-menu-b');
            const cB = A.caja(bMenu, pag);
            const menu = $('apl-menu');
            menu.style.left = `${cB.x}px`;
            menu.style.top = `${cB.y + cB.h - 4}px`;
            A.tocar(tl, pag, bMenu, tMenu);
            tl.fromTo(menu, { opacity: 0, scaleY: 0.8, transformOrigin: '50% 0%' }, { opacity: 1, scaleY: 1, duration: 0.2, ease: 'power2.out' }, tMenu + 0.15);
            const tAp = P(f1, /^aplazar/);
            A.foco(tl, pag, $('apl-op-aplazar'), tAp - 0.6, tAp + 0.2, { pad: 0, radio: 4 });
            A.tocar(tl, pag, $('apl-op-aplazar'), tAp);
            tl.set('#apl-op-aplazar', { backgroundColor: '#e3e2e6' }, tAp);
            tl.to(menu, { opacity: 0, duration: 0.15 }, tAp + 0.2);

            // f2 · el diálogo: la nueva fecha (una semana después) y la casilla de correr las siguientes, ya marcada. La vista previa se calcula.
            const tD = tAp + 0.3;
            const tOk = P(f4, /^aplazar/);
            A.hoja(tl, $('apl-dlg'), tD, { tipo: 'dialogo', velo: $('apl-velo'), hasta: tOk + 0.25 });
            tl.to('#apl-d-calc', { opacity: 0, duration: 0.15 }, tD + 0.45);
            tl.to(['#apl-d-corre', '#apl-d-cambios', '#apl-d-vista .avisa'], { opacity: 1, duration: 0.25 }, tD + 0.5);
            const tFe = P(f2, /^nueva/, -0.2);
            A.foco(tl, cam, $('apl-d-fecha'), tFe, P(f2, /^opcion/, -0.2), { pad: 3, radio: 6 });
            tl.to('#apl-d-fecha', { boxShadow: 'inset 0 0 0 2px #015bbe', duration: 0.12 }, tFe + 0.2);
            tl.to('#apl-d-fecha .k-app-campo-etiqueta', { color: '#015bbe', duration: 0.12 }, tFe + 0.2);
            tl.to('#apl-d-fecha', { boxShadow: 'inset 0 0 0 1px #74777f', duration: 0.15 }, P(f2, /^opcion/, -0.2));
            tl.to('#apl-d-fecha .k-app-campo-etiqueta', { color: '#44474f', duration: 0.15 }, P(f2, /^opcion/, -0.2));
            A.foco(tl, cam, $('apl-d-correr'), P(f2, /^siguientes/, -0.3), P(f2, /^marcada/, 0.6), { pad: 2, radio: 8 });
            H.late(tl, '#apl-d-correr .caja', P(f2, /^marcada/, -0.1), { de: 1.3 });

            // f3 · antes de confirmar, cómo quedan: la cámara se acerca a la vista previa; las 5 siguientes se corren 7 días (una a una).
            const vista = $('apl-d-vista');
            A.camara(tl, cam, { z: 1.32, en: vista, dy: -20, t: P(f3, /^quedan/, -0.6), d: 0.9 });
            A.foco(tl, cam, $('apl-d-corre'), P(f3, /^cinco/, -0.3), P(f3, /^dias/, 0.5), { pad: 4, radio: 6 });
            const desp = [...document.querySelectorAll('#apl-d-cambios .desp')];
            desp.forEach((d, i) => tl.fromTo(d, { color: '#44474f' }, { color: '#015bbe', duration: 0.25, immediateRender: false }, P(f3, /^siete/, -0.4) + i * 0.12));
            A.camara(tl, cam, { z: 1, t: T.pulso(f4.inicio - 0.6), d: 0.7 });

            // f4 · «Aplazar y avisar»: el diálogo se cierra, «Clase aplazada…» y las tarjetas se corren en cascada a sus fechas nuevas.
            A.foco(tl, cam, $('apl-d-ok'), tOk - 0.5, tOk + 0.2, { pad: 4, radio: 24 });
            A.tocar(tl, cam, $('apl-d-ok'), tOk);
            const hecho = $('apl-hecho');
            const altoHecho = A.medida(hecho).h + 10;
            const tH = tOk + 0.5;
            tl.to('#apl-mover', { y: altoHecho, duration: 0.35, ease: 'power3.out' }, tH);
            tl.fromTo(hecho, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tH + 0.1);
            // Cascada: cada tarjeta va a su lugar nuevo (medido en la lista «después») y su día cambia; los meses se reacomodan.
            const listas = $('apl-listas');
            const tC = P(f4, /^calendario/, -0.1);
            for (let i = 0; i < 6; i++) {
              const a = A.caja($(`apl-c${i}`), listas), b = A.caja($(`apl-e${i}`), listas);
              const t = tC + i * 0.14;
              tl.to(`#apl-c${i}`, { y: b.y - a.y, duration: 0.6, ease: 'power3.inOut' }, t);
              tl.to(`#apl-c${i} .nv`, { y: -24, opacity: 0, duration: 0.3, ease: 'power2.in' }, t + 0.1);
              tl.fromTo(`#apl-c${i} .nn`, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out', immediateRender: false }, t + 0.3);
            }
            tl.to('#apl-m-oct', { opacity: 0, duration: 0.25 }, tC);
            const mN = [A.caja($('apl-m-nov'), listas), A.caja($('apl-d-nov'), listas)];
            const mD = [A.caja($('apl-m-dic'), listas), A.caja($('apl-d-dic'), listas)];
            tl.to('#apl-m-nov', { y: mN[1].y - mN[0].y, duration: 0.6, ease: 'power3.inOut' }, tC + 0.05);
            tl.to('#apl-m-dic', { y: mD[1].y - mD[0].y, duration: 0.6, ease: 'power3.inOut' }, tC + 4 * 0.14);
            tl.fromTo('#apl-aplazada', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)', immediateRender: false }, tC + 0.5);
            rollo($('apl-prox'), tC + 0.2);

            // La fecha de cierre también: la página sube a la ficha del grupo y su rango de fechas cambia.
            const tCi = tC + 1.5;
            A.desliz(tl, pag, 0, tCi, 0.6);
            A.foco(tl, pag, $('apl-dato'), tCi + 0.5, P(f4, /^recordatorios/, 0.1), { pad: 4, radio: 8 });
            rollo($('apl-rango'), tCi + 0.7);
            // … y los recordatorios se reprograman (rótulo del kit, no es de la app).
            const rot = H.ancla($('apl-sobre'), 'apl-rot', 1250, 930, `<span class="rotulo-kit">${H.icono('notifications', 30, true)}Los recordatorios, al día</span>`, '');
            H.entra(tl, rot, P(f4, /^recordatorios/, -0.3), { dy: 14 });
            H.sale(tl, rot, T.pulso(f5.inicio - 0.3), { d: 0.3 });

            // f5 · el celular de una alumna: «Tu clase cambió de fecha» y su próxima clase al día.
            const tCel = T.pulso(f5.inicio - 0.4);
            tl.fromTo('#apl-cel', { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, tCel);
            const tAv = P(f5, /^aviso/, -0.3);
            tl.fromTo('#apl-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, tAv);
            rollo($('apl-mc-prox'), tAv + 0.6);
            H.late(tl, '#apl-notif', P(f5, /^fecha/, -0.3), { de: 1.05 });

            H.sale(tl, ['#apl-ven', '#apl-cel', '#apl-ceja', '#apl-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['aplazar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
