  <body>

      <div id="root" data-composition-id="gancho" data-width="1920" data-height="1080" data-duration="24">

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('gan-dia'), svg = $('gan-svg');
            const bs = H.bloques(T, $('gan-col'), 'gan', ['Llegó, la acompañaron y se *quedó*', 'Ahora tiene que *crecer*', 'Y un día, *formar* a otros',
              'Si diriges la *academia*', 'Cada alumno crece: más *líderes*']);
            // Cada palabra del rótulo entra cuando la voz dice esa misma palabra (si la dice); las demás, justo después de la anterior.
            const norm = (w) => w.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const alinear = (lista) => lista.forEach((b) => {
              if (!b) return;
              const f = T.frases[b.i];
              let k = 0, t = f.palabras.length ? f.palabras[0].inicio : f.inicio;
              b.spans.forEach((sp, j) => {
                const w = norm(sp.s.textContent);
                const q = w.length >= 3 ? f.palabras.findIndex((p, n) => n >= k && norm(p.texto) === w) : -1;
                if (q >= 0) { k = q + 1; t = f.palabras[q].inicio; } else if (j > 0) t = H.r3(t + 0.12);
                sp.inicio = t;
              });
            });
            alinear(bs);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#gan-ceja-1', 0.1, { dy: 16 });

            // ── El diagrama: abajo, la ruta de la afirmación (llegó → la llamaron → la acompañaron → se quedó); a la derecha sube: crece y forma.
            const Y0 = 650, XS = [84, 244, 404, 564];
            const XC = 564, YB = 390, YC = 140; // la columna que sube: crece (B) y forma a otros (C)
            const todo = H.el('div', 'ancla', dia, 'gan-todo', { left: '0px', top: '0px' });
            const base = H.linea(svg, 'gan-base', XS[0], Y0, XS[3], Y0, false);
            const ruta = [['church', /^llego/], ['call', /^llamaron/], ['handshake', /^acompanaron/], ['home', /^quedo/]];
            const nodos = ruta.map(([ic], i) => H.nodo(todo, `gan-n-${i}`, XS[i], Y0, ic, false, i === 3 ? 112 : 92));
            const yo = H.punto(todo, 'gan-yo', XS[0], Y0 - 86, 'k-oro', 34);
            const halo = H.el('div', 'halo', todo, 'gan-halo', { left: `${XS[3]}px`, top: `${Y0}px`, width: '170px', height: '170px', margin: '-85px 0 0 -85px' });

            // f0 · llegó, la llamaron, la acompañaron y se quedó: el punto dorado recorre la ruta y el último nodo (su casa) se enciende.
            H.dibujar(tl, base, T.pulso(f0.inicio), 1.0);
            ruta.forEach(([ic, re], i) => {
              const t = P(f0, re, -0.3);
              H.pop(tl, nodos[i], i === 0 ? T.pulso(f0.inicio) : t - 0.25, { d: 0.4 });
              if (i === 0) H.pop(tl, yo, t);
              else tl.to(yo, { x: XS[i] - XS[0], duration: 0.5, ease: 'power3.inOut' }, t - 0.2);
            });
            const tQ = P(f0, /^quedo/, -0.2); // el sonido «aparicion» del guion cae aquí (frase 0, palabra 12, desfase −0,2, al pulso)
            tl.to('#gan-n-3-n', { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, tQ);
            H.halo(tl, halo, tQ);
            const afir = H.chip(todo, 'gan-afir', 324, Y0 + 104, `${H.icono('check_circle', 34, true)}Afirmada`, 'oro');
            H.pop(tl, afir, tQ + 0.1);

            // f1 · afirmarla fue el comienzo; ahora tiene que crecer: la ruta se apaga y una línea sube hasta «Crece» (la Palabra).
            const tCo = P(f1, /^comienzo/, -0.2);
            tl.to([nodos[0], nodos[1], nodos[2], base], { opacity: 0.3, duration: 0.5 }, tCo);
            const sube1 = H.linea(svg, 'gan-sube-1', XC, Y0 - 60, XC, YB + 64, true);
            const nB = H.nodo(todo, 'gan-n-b', XC, YB, 'menu_book', true, 120);
            const tCr = P(f1, /^crecer/, -0.4);
            H.dibujar(tl, sube1, tCr - 0.3, 0.6);
            tl.to(yo, { x: XC - XS[0], y: YB - Y0, duration: 0.8, ease: 'power3.inOut' }, tCr - 0.2);
            H.pop(tl, nB, tCr + 0.2);
            H.sale(tl, afir, tCr, { d: 0.3 });
            const rB = H.ancla(todo, 'gan-r-b', XC, YB + 96, 'Crece', 'ruta-rot');
            H.entra(tl, rB, tCr + 0.4, { dy: 10 });

            // f2 · conocer la Palabra, ser edificada y, un día, formar a otros: dos rótulos junto a «Crece»; la línea sigue hasta «Forma a otros»
            // y de ella salen otros puntos.
            const pal = H.chip(todo, 'gan-pal', 270, YB - 46, `${H.icono('menu_book', 34)}La Palabra`, '');
            const edi = H.chip(todo, 'gan-edi', 270, YB + 46, `${H.icono('favorite', 34)}Edificada`, '');
            H.entra(tl, pal, P(f2, /^palabra/, -0.3), { dy: 14 });
            H.entra(tl, edi, P(f2, /^edificada/, -0.3), { dy: 14 });
            const sube2 = H.linea(svg, 'gan-sube-2', XC, YB - 64, XC, YC + 64, true);
            const nC = H.nodo(todo, 'gan-n-c', XC, YC, 'diversity_3', true, 120);
            const tFo = P(f2, /^formar/, -0.4);
            H.dibujar(tl, sube2, tFo - 0.2, 0.5);
            tl.to(yo, { y: YC - Y0, duration: 0.7, ease: 'power3.inOut' }, tFo);
            H.pop(tl, nC, tFo + 0.3);
            const rC = H.ancla(todo, 'gan-r-c', XC, YC + 96, 'Forma a otros', 'ruta-rot');
            const otros = [];
            [[400, 70], [310, 120], [270, 205], [320, 285], [420, 250]].forEach(([x, y], k) => {
              H.linea(svg, `gan-ol-${k}`, XC - 64, YC, x, y, false);
              otros.push(H.punto(todo, `gan-o-${k}`, x, y, 'k-oro', 24));
            });
            const tOt = P(f2, /^otros/, -0.2);
            [0, 1, 2, 3, 4].forEach((k) => H.dibujar(tl, $(`gan-ol-${k}`), tOt + k * 0.05, 0.4));
            H.pop(tl, otros, tOt + 0.2, { stagger: 0.07 });
            H.sale(tl, [pal, edi, rB], tFo - 0.2, { d: 0.3 });
            H.entra(tl, rC, tOt + 0.5, { dy: 10 });

            // f3 · si diriges la academia, las clases de la visión o la escuela bíblica: el camino queda atrás y entran los tres.
            const tAc = P(f3, /^academia/, -0.3);
            H.sale(tl, '#gan-ceja-1', tAc - 0.3, { d: 0.3 });
            tl.fromTo('#gan-ceja-2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tAc);
            tl.to([todo, svg], { opacity: 0, duration: 0.6, ease: 'power2.inOut' }, tAc - 0.4);
            const pila = H.ancla(dia, 'gan-pila', 324, 400, '', 'pila');
            const items = [['school', 'Academia', /^academia/, true], ['visibility', 'Clases de la visión', /^vision/, false], ['menu_book', 'Escuela bíblica', /^escuela/, false]];
            const chips = items.map(([ic, tx, re, oro], i) => {
              const c = H.el('span', `chip${oro ? ' oro' : ''}`, pila.firstChild, `gan-i-${i}`);
              c.innerHTML = `${H.icono(ic, 34, oro)}${tx}`;
              H.entra(tl, c, P(f3, re, -0.3), { dy: 18 });
              return c;
            });
            H.late(tl, chips[0], P(f3, /^ti\W/, -0.3), { de: 1.08 });

            // f4 · que cada alumno crezca y tu iglesia tenga más líderes: los alumnos suben y tres se vuelven líderes.
            const tVa = T.pulso(f4.inicio - 0.3);
            H.sale(tl, pila, tVa, { d: 0.4 });
            tl.to([todo, svg], { opacity: 0, duration: 0.4 }, tVa);
            const AX = (i) => 144 + (i % 4) * 120, AY = (i) => 500 + Math.floor(i / 4) * 100;
            const al = [];
            for (let i = 0; i < 12; i++) al.push(H.punto(dia, `gan-a-${i}`, AX(i), AY(i), '', 26));
            H.pop(tl, al, P(f4, /^kingdom/, -0.2), { stagger: 0.05 });
            const tCz = P(f4, /^crezca/, -0.3);
            const sube = (i) => -130 - (i % 3) * 16;
            al.forEach((p, i) => tl.to(p, { y: sube(i), duration: 0.9, ease: 'power3.inOut' }, tCz + (i % 4) * 0.05));
            const lideres = [1, 6, 8];
            const tLi = P(f4, /^lideres/, -0.3);
            lideres.forEach((i, k) => {
              tl.to(al[i], { backgroundColor: '#e8b95a', scale: 1.5, duration: 0.35, ease: 'back.out(2)' }, tLi + k * 0.1);
              const h = H.el('div', 'halo', dia, `gan-lh-${k}`, { left: `${AX(i)}px`, top: `${AY(i) + sube(i)}px`, width: '84px', height: '84px', margin: '-42px 0 0 -42px' });
              H.halo(tl, h, tLi + 0.1 + k * 0.1);
            });
            const rL = H.chip(dia, 'gan-mas', 324, 690, `${H.icono('trending_up', 34, true)}Más líderes`, 'oro');
            H.entra(tl, rL, tLi + 0.3, { dy: 14 });

            H.sale(tl, ['#gan-dia', '#gan-ceja-2'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['gancho'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
