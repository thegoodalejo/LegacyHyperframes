                      <div class="cab"><h3>Nuevo Testamento<span class="muted"> · 50 %</span></h3><span class="nm">4,59</span></div>

                      <div class="act"><div class="linea"><span class="k-app-icono" style="--k-icono: url(assets/iconos/quiz.svg)"></span><span class="nombre">Examen final</span><span class="muted peso">50 %</span><span class="valor">4,17</span></div></div>

              <nav class="k-app-inferior">
                <span class="k-app-nav"><span class="k-app-icono-caja"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/dashboard.svg)"></span></span>Inicio</span>
                <span class="k-app-nav"><span class="k-app-icono-caja"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/church.svg)"></span></span>Mi iglesia</span>
                <span class="k-app-nav"><span class="k-app-icono-caja"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/person.svg)"></span></span>Perfil</span>
              </nav>
              <!-- Mientras presenta, la barra de abajo de la evaluación tapa la del shell (evaluacion.page.ts → .barra-abajo). -->
              <nav class="barra-abajo" id="alu-abajo">
                <span class="k-app-boton contorno"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/arrow_back.svg)"></span>Anterior</span>
                <span class="k-app-boton contorno solo"><span class="k-app-icono" style="--k-icono: url(identidad/iconos/apps.svg)"></span></span>
                <span class="k-app-boton">Siguiente<span class="k-app-icono" style="--k-icono: url(identidad/iconos/arrow_forward.svg); margin: 0 -8px 0 0"></span></span>
              </nav>
              <div class="k-app-notificacion notif" id="alu-notif"><img src="identidad/favicon.svg" alt="" /><small>Kingdom · ahora</small><b>Tu profesor está tomando asistencia</b>
                <span>Fundamentos bíblicos · Apocalipsis y la esperanza: marca tu asistencia ahora con el código.</span></div>

        </div>
        <div class="k-datos-ejemplo k-recurso-datos" id="alu-datos" style="opacity: 0">Datos de ejemplo</div>
        <div class="dia" id="alu-sobre" style="left: 0; top: 0; width: 1920px; height: 1080px" data-layout-allow-overflow data-layout-allow-overlap></div>
      </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('alu-cam');
            const bs = H.bloques(T, $('alu-col'), 'alu', ['Todo en su *celular*', 'Sus clases, la próxima y lo *pendiente*', 'Marca su asistencia con el *código*',
              'Entrega con una *foto* o un PDF', 'Evaluaciones con el *tiempo* a la vista', '«Mis notas»: qué le falta para *aprobar*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#alu-ceja', 0.1, { dy: 16 });
            // Cambia de pantalla: la anterior se va y la nueva entra desde la derecha (como al navegar).
            const pantalla = (de, a, t) => {
              tl.to(de, { opacity: 0, duration: 0.2, ease: 'power1.in' }, t);
              tl.fromTo(a, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.32, ease: 'power2.out', immediateRender: false }, t + 0.12);
            };

            // f0 · el celular de la alumna con «Mis cursos»: el curso, su asistencia y la próxima clase.
            tl.fromTo('#alu-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio - 0.2));
            H.entra(tl, '#alu-datos', T.pulso(f0.inicio) + 0.5, { dy: 10 });
            H.late(tl, '#alu-tel', P(f0, /^celular/, -0.2), { de: 1.03 });
            const tMis = P(f0, /^cursos/, -0.4);
            A.foco(tl, $('alu-s0'), $('alu-curso'), tMis, T.pulso(f1.inicio), { pad: 4, radio: 20 });

            // f1 · entra al curso: cuántas clases ha venido, la próxima y, en «Pendientes», lo que tiene por hacer.
            const tCur = P(f1, /^ve$/, -0.1);
            A.tocar(tl, $('alu-s0'), $('alu-curso'), tCur);
            pantalla('#alu-s0', '#alu-s1', tCur + 0.15);
            const tCua = P(f1, /^cuantas/, 0);
            A.foco(tl, $('alu-s1'), $('alu-asis'), tCua, P(f1, /^cual/, -0.1), { pad: 4, radio: 8 });
            const tPro = P(f1, /^proxima/, -0.3);
            A.foco(tl, $('alu-s1'), $('alu-proxima'), tPro, tPro + 0.9, { pad: 4, radio: 18 });
            const tPen = P(f1, /^pendiente/, -0.3);
            A.tocar(tl, $('alu-s1'), $('alu-t-pend'), tPen);
            tl.to('#alu-t-clases', { color: '#44474f', borderBottomColor: 'rgba(0,0,0,0)', duration: 0.15 }, tPen + 0.1);
            tl.to('#alu-t-pend', { color: '#015bbe', borderBottomColor: '#015bbe', duration: 0.15 }, tPen + 0.1);
            tl.to('#alu-clases', { opacity: 0, duration: 0.18 }, tPen + 0.1);
            tl.fromTo('#alu-pend', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tPen + 0.22);
            A.foco(tl, $('alu-s1'), $('alu-ent-pend'), tPen + 0.5, T.pulso(f2.inicio + 0.2), { pad: 4, radio: 18 });

            // f2 · el profesor abre la asistencia: le llega el aviso; lo toca, escribe los cuatro números y queda marcada.
            const tAv = P(f2, /^asistencia/, -0.2);
            tl.fromTo('#alu-notif', { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, tAv);
            H.late(tl, '#alu-notif', P(f2, /^aviso/, -0.3), { de: 1.05 });
            const tToca = P(f2, /^escribe/, -0.5);
            A.tocar(tl, cam, $('alu-notif'), tToca, { dy: 10 });
            tl.to('#alu-notif', { opacity: 0, y: -30, duration: 0.25, ease: 'power1.in' }, tToca + 0.2);
            pantalla('#alu-s1', '#alu-s2', tToca + 0.15);
            tl.set('#alu-c0', { boxShadow: 'inset 0 0 0 2px #015bbe' }, tToca + 0.3);
            const cajas = [0, 1, 2, 3].map((k) => $(`alu-c${k}`));
            const tDig = H.r3(tToca + 0.6);
            cajas.forEach((c, k) => {
              const t = H.r3(tDig + k * 0.3);
              tl.set(c.firstElementChild, { opacity: 1 }, t);
              tl.set(c, { backgroundColor: '#d7e2ff', color: '#004492', boxShadow: 'inset 0 0 0 2px rgba(0,0,0,0)' }, t);
              if (cajas[k + 1]) tl.set(cajas[k + 1], { boxShadow: 'inset 0 0 0 2px #015bbe' }, t);
              H.late(tl, c, t, { de: 1.12, d: 0.25 });
            });
            const tListo = P(f2, /^marcada/, -0.15);
            tl.to('#alu-cuadro', { opacity: 0, duration: 0.15 }, tListo - 0.05);
            tl.fromTo('#alu-listo', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tListo);
            tl.fromTo('#alu-check', { scale: 0.4 }, { scale: 1, duration: 0.4, ease: 'back.out(2)', immediateRender: false }, tListo);
            
            // f3 · la entrega: «Tomar foto» o «Elegir archivo»; sube el PDF y queda «Entregada».
            const tS3 = T.pulso(f3.inicio - 0.3);
            pantalla('#alu-s2', '#alu-s3', tS3);
            const tFoto = P(f3, /^foto/, -0.3);
            A.foco(tl, $('alu-s3'), $('alu-foto'), tFoto, tFoto + 0.7, { pad: 4, radio: 24 });
            const tPdf = P(f3, /^subiendo/, -0.2);
            A.foco(tl, $('alu-s3'), $('alu-elegir'), tPdf - 0.15, tPdf + 0.5, { pad: 4, radio: 24 });
            A.tocar(tl, $('alu-s3'), $('alu-elegir'), tPdf + 0.2);
            tl.fromTo('#alu-tarea', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, tPdf + 0.45);
            tl.fromTo('#alu-tarea-b', { scaleX: 0.05 }, { scaleX: 1, duration: 0.8, ease: 'power1.inOut', immediateRender: false }, tPdf + 0.5);
            tl.set('#alu-t-sub', { opacity: 0 }, tPdf + 1.3);
            tl.set('#alu-t-ok', { opacity: 1 }, tPdf + 1.3);
            tl.to('#alu-ent-chip2', { opacity: 1, duration: 0.2 }, tPdf + 1.35);
            H.late(tl, '#alu-ent-chip', tPdf + 1.35, { de: 1.1 });

            // f4 · la evaluación: «Pregunta 2 de 10» y la cuenta regresiva a la vista; sin señal, la respuesta queda en el celular.
            const tS4 = T.pulso(f4.inicio - 0.1);
            pantalla('#alu-s3', '#alu-s4', tS4);
            tl.fromTo('#alu-abajo', { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, tS4 + 0.12);
            tl.set('#alu-prog', { scaleX: 0.1 }, 0);
            // La cuenta regresiva (18:42 → baja un segundo por segundo; buscable: un objeto con onUpdate).
            const reloj = { s: 0 };
            const total = 18 * 60 + 42;
            const largo = H.r3(T.salida(0.6) - tS4);
            const cuentaEl = $('alu-cuenta');
            tl.fromTo(reloj, { s: 0 }, { s: largo, duration: largo, ease: 'none', immediateRender: false,
              onUpdate: () => { const r = total - Math.floor(reloj.s); cuentaEl.textContent = `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; } }, tS4);
            const tTie = P(f4, /^tiempo/, -0.3);
            A.foco(tl, $('alu-s4'), $('alu-reloj'), tTie, tTie + 1.0, { pad: 4, radio: 16 });
            const tA = P(f4, /^vista/, -0.2);
            A.tocar(tl, $('alu-s4'), $('alu-op-a'), tA);
            tl.to('#alu-op-a-s', { opacity: 1, duration: 0.12 }, tA + 0.05);
            tl.to('#alu-prog', { scaleX: 0.2, duration: 0.3, ease: 'power2.out' }, tA + 0.1);
            tl.to('#alu-g-ok', { opacity: 1, duration: 0.2 }, tA + 0.35);
            const tSen = P(f4, /^senal/, -0.4);
            const sinSenal = H.ancla($('alu-dia'), 'alu-sin', -775, 690, `<span class="rotulo-kit">${H.icono('wifi_off', 30, true)}Sin señal</span>`, '');
            H.entra(tl, sinSenal, tSen, { dy: 16 });
            const tB = P(f4, /^respuestas/, -0.2);
            A.tocar(tl, $('alu-s4'), $('alu-op-b'), tB);
            tl.to('#alu-op-a-s', { opacity: 0, duration: 0.12 }, tB + 0.05);
            tl.to('#alu-op-b-s', { opacity: 1, duration: 0.12 }, tB + 0.05);
            tl.to('#alu-g-ok', { opacity: 0, duration: 0.15 }, tB + 0.2);
            tl.to('#alu-g-sin', { opacity: 1, duration: 0.2 }, tB + 0.3);
            A.foco(tl, $('alu-s4'), $('alu-guardado'), tB + 0.35, T.pulso(f5.inicio - 0.4), { pad: 6, radio: 10 });
            H.sale(tl, sinSenal, T.pulso(f5.inicio - 0.5), { d: 0.3 });

            // f5 · «Mis notas»: cómo va (la nota y el semáforo) y qué le falta para aprobar (el motivo).
            const tS5 = T.pulso(f5.inicio - 0.3);
            tl.to('#alu-abajo', { opacity: 0, duration: 0.2 }, tS5);
            pantalla('#alu-s4', '#alu-s5', tS5);
            const tVa = P(f5, /^como/, -0.3);
            A.foco(tl, $('alu-s5'), $('alu-final'), tVa, tVa + 0.9, { pad: 4, radio: 22 });
            const tFal = P(f5, /^falta/, -0.3);
