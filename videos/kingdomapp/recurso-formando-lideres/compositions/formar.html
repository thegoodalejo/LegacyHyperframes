            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          /** Las cuatro generaciones de 2 Timoteo 2:2 (Pablo → Timoteo → los fieles → los otros), 1 → 1 → 3 → 9, en cont (648 × 800) y sus líneas en
           *  svg. La misma pieza vuelve en multiplicar.html (allá con una quinta columna: cada uno de los otros forma a dos más). */
          const generaciones = (cont, svg, pref, o) => {
            o = o || {};
            const xs = o.xs || [64, 214, 384, 566], yc = o.y || 400, sep = o.sep || 210, sepO = o.sepO || 70;
            const g = { lineas: [], nodos: [], rots: [] };
            const capa = H.el('div', 'ancla', cont, `${pref}-gen`, { left: '0px', top: '0px' });
            g.capa = capa;
            g.pablo = H.nodo(capa, `${pref}-pablo`, xs[0], yc, 'person', false, 104);
            g.timoteo = H.nodo(capa, `${pref}-timoteo`, xs[1], yc, 'person', false, 92);
            g.lPT = H.linea(svg, `${pref}-l-pt`, xs[0] + 54, yc, xs[1] - 48, yc, false);
            g.fieles = [-1, 0, 1].map((k, i) => H.nodo(capa, `${pref}-fiel-${i}`, xs[2], yc + k * sep, 'person', false, 80));
            g.lTF = [-1, 0, 1].map((k, i) => H.linea(svg, `${pref}-l-tf-${i}`, xs[1] + 48, yc, xs[2] - 42, yc + k * sep, false));
            g.otros = [];
            g.lFO = [];
            [-1, 0, 1].forEach((k, i) => [-1, 0, 1].forEach((m, j) => {
              const y = yc + k * sep + m * sepO;
              g.otros.push(H.punto(capa, `${pref}-otro-${i}-${j}`, xs[3], y, '', 24));
              g.lFO.push(H.linea(svg, `${pref}-l-fo-${i}-${j}`, xs[2] + 42, yc + k * sep, xs[3] - 14, y, false));
            }));
            g.nombres = ['Pablo', 'Timoteo', 'Fieles', 'Otros'].map((tx, i) => H.ancla(capa, `${pref}-nom-${i}`, xs[i], o.yNombres || 770, tx, 'rot'));
            return g;
          };

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const dia = $('for-dia'), svg = $('for-svg');
            const bs = H.bloques(T, $('for-col'), 'for', ['De Pablo a Timoteo, a fieles, a *otros*', 'En una frase, cuatro *generaciones*',
              'El corazón: formar a quienes *formen*', 'Miembro, discípulo, *líder*', 'La iglesia crece con sus *líderes*', 'Un camino *claro*, medible y sin papeles']);
            // Cada palabra del rótulo entra cuando la voz dice esa misma palabra (si la dice); las demás, justo después de la anterior.
            const norm = (w) => w.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
            const alinear = (lista) => lista.forEach((b) => {
              if (!b) return;
              const f = T.frases[b.i];
              let k = 0, t = f.palabras.length ? f.palabras[0].inicio : f.inicio;
              b.spans.forEach((sp, j) => {
                const w = norm(sp.s.textContent);
                const q = w.length >= 3 ? f.palabras.findIndex((p, n) => n >= k && norm(p.texto) === w) : -1;
                if (q >= 0) { k = q + 1; t = f.palabras[q].inicio; } else if (j > 0) t = H.r3(t + 0.12);
                sp.inicio = t;
              });
            });
            alinear(bs);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#for-ceja', 0.1, { dy: 16 });

            // f0 · Pablo le encargó a Timoteo que enseñara… a personas fieles, capaces de enseñar a otros: la cadena se arma en sus palabras.
            const g = generaciones(dia, svg, 'for');
            H.entra(tl, '#for-cita', T.pulso(f0.inicio), { dy: 14 });
            H.pop(tl, g.pablo, P(f0, /^pablo/, -0.2));
            H.dibujar(tl, g.lPT, P(f0, /^timoteo/, -0.6), 0.5);
            H.pop(tl, g.timoteo, P(f0, /^timoteo/, -0.2));
            const viaje = H.punto(dia, 'for-viaje', 64, 400, 'k-oro', 22);
            const tEn = P(f0, /^ensenara/, -0.2);
            tl.fromTo(viaje, { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.15, immediateRender: false }, tEn);
            tl.to(viaje, { x: 150, duration: 0.6, ease: 'power2.inOut' }, tEn + 0.1);
            tl.to(viaje, { opacity: 0, duration: 0.2 }, tEn + 0.7);
            H.late(tl, g.timoteo, tEn + 0.65, { de: 1.15 });
            const tFi = P(f0, /^fieles/, -0.4);
            g.lTF.forEach((l, i) => H.dibujar(tl, l, tFi - 0.3 + i * 0.06, 0.45));
            H.pop(tl, g.fieles, tFi, { stagger: 0.08 });
            const tOt = P(f0, /^otros/, -0.4);
            g.lFO.forEach((l, i) => H.dibujar(tl, l, P(f0, /^capaces/, -0.2) + i * 0.04, 0.4));
            H.pop(tl, g.otros, tOt, { stagger: 0.04 });

            // f1 · en una sola frase hay cuatro generaciones: cada columna se nombra y se ilumina en su nombre.
            const col = [[g.pablo], [g.timoteo], g.fieles, g.otros];
            [/^pablo/, /^timoteo/, /^fieles/, /^otros/].forEach((re, i) => {
              const t = P(f1, re, -0.3);
              H.entra(tl, g.nombres[i], t, { dy: 10 });
              if (i < 3) col[i].forEach((n) => tl.to(`#${n.id}-n`, { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, t + 0.1));
              else tl.to(g.otros, { backgroundColor: '#e8b95a', duration: 0.3, stagger: 0.03 }, t + 0.1);
              H.late(tl, col[i], t + 0.1, { de: 1.18 });
            });
            const tGe = P(f1, /^generaciones/, -0.3);
            tl.to([...g.lineas, g.lPT, ...g.lTF, ...g.lFO], { stroke: 'rgba(232, 185, 90, 0.55)', duration: 0.4 }, tGe);

            // f2 · no llenar salones, sino formar personas que formen a otras: un salón lleno aparece y se va; la cadena vuelve y se enciende.
            const tSa = P(f2, /^llenar/, -0.5);
            H.sale(tl, '#for-cita', tSa - 0.3, { d: 0.3 });
            tl.to([g.capa, svg], { opacity: 0.1, duration: 0.4, ease: 'power2.inOut' }, tSa - 0.3);
            const salon = $('for-salon');
            const sillas = [];
            for (let i = 0; i < 20; i++) sillas.push(H.punto(salon, `for-s-${i}`, 70 + (i % 5) * 70, 70 + Math.floor(i / 5) * 54, 'k-tenue', 24));
            tl.fromTo(salon, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, tSa);
            H.pop(tl, sillas, tSa + 0.15, { stagger: 0.025, d: 0.3 });
            const tSi = P(f2, /^sino/, -0.3);
            tl.to(salon, { opacity: 0, scale: 0.94, duration: 0.35, ease: 'power2.in' }, tSi);
            tl.to([g.capa, svg], { opacity: 1, duration: 0.45, ease: 'power2.out' }, tSi + 0.2);
            const tFm = P(f2, /^formen/, -0.3);
            tl.to([g.lPT, ...g.lTF, ...g.lFO], { stroke: '#e8b95a', duration: 0.3 }, tFm);
            const halos = g.fieles.map((n, i) => H.el('div', 'halo', dia, `for-hf-${i}`, { left: '384px', top: `${400 + (i - 1) * 210}px` }));
            halos.forEach((h, i) => H.halo(tl, h, tFm + 0.1 + i * 0.08));

            // f3 · el miembro se vuelve discípulo y el discípulo se vuelve líder: la escalera de los niveles de la visión.
            const tEs = T.pulso(f3.inicio - 0.5);
            H.sale(tl, [g.capa, svg], tEs, { d: 0.4 });
            const niveles = [['person', 'Miembro', 30, 600, /^miembro/], ['menu_book', 'Discípulo', 206, 450, /^discipulo/], ['groups', 'Líder', 382, 300, /^lider/]];
            const esc = niveles.map(([ic, tx, x, y], i) => {
              const e = H.el('div', `escalon${i === 2 ? ' oro' : ''}`, dia, `for-esc-${i}`, { left: `${x}px`, top: `${y}px` });
              e.innerHTML = `${H.icono(ic, 40, i === 2)}${tx}`;
              return e;
            });
            const nivel = H.ancla(dia, 'for-nivel', 324, 190, `<span style="display: flex; align-items: center; gap: 12px">${H.icono('military_tech', 36, true)}Nivel de la visión</span>`, 'rot oro');
            H.entra(tl, nivel, tEs + 0.4, { dy: 12 });
            const sube = H.punto(dia, 'for-sube', 30 + 118, 600 - 26, 'k-oro', 34);
            niveles.forEach(([ic, tx, x, y, re], i) => {
              const t = P(f3, re, -0.35);
              H.entra(tl, esc[i], t, { dy: 30 });
              if (i === 0) H.pop(tl, sube, t + 0.3);
              else {
                tl.to(sube, { x: x - 30, duration: 0.55, ease: 'power2.inOut' }, t + 0.2);
                tl.to(sube, { y: y - 600 - 40, duration: 0.3, ease: 'power2.out' }, t + 0.2);
                tl.to(sube, { y: y - 600, duration: 0.25, ease: 'power2.in' }, t + 0.5);
              }
            });
            const hL = H.el('div', 'halo', dia, 'for-hl', { left: '500px', top: '342px', width: '260px', height: '260px', margin: '-130px 0 0 -130px' });
            H.halo(tl, hL, P(f3, /^lider/, 0.2));

            // f4 · una iglesia crece hasta donde crecen sus líderes; cada líder nuevo puede abrir un grupo nuevo.
            const tIg = T.pulso(f4.inicio - 0.3);
            H.sale(tl, [...esc, nivel, sube], tIg, { d: 0.4 });
            const red = H.el('div', 'ancla', dia, 'for-red', { left: '0px', top: '0px' });
            const svg2 = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg2.setAttribute('class', 'svg');
            svg2.setAttribute('viewBox', '0 0 648 800');
            svg2.id = 'for-svg2';
            red.appendChild(svg2);
            Object.assign(svg2.style, { width: '648px', height: '800px' });
            const iglesia = H.nodo(red, 'for-igl', 324, 110, 'church', false, 110);
            H.pop(tl, iglesia, P(f4, /^iglesia/, -0.2));
            const LX = [104, 324, 544];
            const lLi = LX.map((x, i) => H.linea(svg2, `for-ll-${i}`, 324, 166, x, 290, false));
            const lideres = LX.map((x, i) => H.punto(red, `for-li-${i}`, x, 310, 'k-oro', 40));
            const tCr = P(f4, /^crecen/, -0.3);
            lLi.forEach((l, i) => H.dibujar(tl, l, tCr + i * 0.06, 0.45));
            const tLi = P(f4, /^lideres/, -0.3);
            H.pop(tl, lideres, tLi, { stagger: 0.08 });
            const tAb = P(f4, /^abrir/, -0.4);
            const lGr = LX.map((x, i) => H.linea(svg2, `for-lg-${i}`, x, 336, x, 446, true));
            const grupos = LX.map((x, i) => H.nodo(red, `for-gr-${i}`, x, 500, 'groups', true, 96));
            lGr.forEach((l, i) => H.dibujar(tl, l, tAb + i * 0.08, 0.35));
            H.pop(tl, grupos, tAb + 0.3, { stagger: 0.1 });
            const tGr = P(f4, /^grupo/, -0.1);
            const nuevos = [];
            LX.forEach((x, i) => [0, 1, 2, 3].forEach((k) => {
              const a = (k / 4) * Math.PI * 2 + Math.PI / 4;
              nuevos.push(H.punto(red, `for-nv-${i}-${k}`, x + Math.cos(a) * 82, 500 + Math.sin(a) * 82, '', 18));
            }));
            H.pop(tl, nuevos, tGr, { stagger: 0.03, d: 0.35 });

            // f5 · Kingdom te ayuda a que ese camino sea claro, medible y sin papeles.
            const tK = T.pulso(f5.inicio - 0.2);
            tl.to(red, { y: -96, duration: 0.7, ease: 'power3.inOut' }, tK);
            const pila = H.ancla(dia, 'for-pila', 324, 640, '', 'pila');
            [['route', 'Claro', /^claro/, true], ['monitoring', 'Medible', /^medible/, false], ['smartphone', 'Sin papeles', /^papeles/, false]].forEach(([ic, tx, re, oro], i) => {
              const c = H.el('span', `chip${oro ? ' oro' : ''}`, pila.firstChild, `for-k-${i}`);
              c.innerHTML = `${H.icono(ic, 34, oro)}${tx}`;
              H.entra(tl, c, P(f5, re, -0.4), { dy: 16 });
            });

            H.sale(tl, ['#for-dia', '#for-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['formar'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
