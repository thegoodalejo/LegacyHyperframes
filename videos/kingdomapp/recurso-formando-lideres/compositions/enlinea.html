              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });

              c.innerHTML = html;

            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);

              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });

            };
            const punto = (padre, id, x, y, cls, tam) => {

              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);

            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');

              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;

            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('enl-cam'), pag = $('enl-pag'), sobre = $('enl-sobre');
            const bs = H.bloques(T, $('enl-col'), 'enl', ['En línea: *a su ritmo*', 'Cada video, una *lección*', 'O el enlace: *sin gastar espacio*',
              'Un *quiz*, en orden, el video completo', 'El alumno ve su *avance*', 'Siete días sin avanzar: *te esperamos*', 'Híbrido: la clase *en vivo*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#enl-ceja', 0.1, { dy: 16 });
            const rollo = (el, t) => {
              const v = el.querySelector('.viejo'), n = el.querySelector('.nuevo');
              tl.to(v, { y: -14, opacity: 0, duration: 0.3, ease: 'power2.in' }, t);
              tl.fromTo(n, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out', immediateRender: false }, t + 0.12);
            };
            const centrar = (dlg) => { dlg.style.top = `${Math.round((760 - A.medida(dlg).h) / 2)}px`; };
            centrar($('enl-dlg-v'));
            centrar($('enl-dlg-l'));

            // f0 · el constructor del curso en línea: «Lecciones y videos del curso en línea».
            tl.fromTo('#enl-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#enl-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });
            A.foco(tl, pag, $('enl-sub'), P(f0, /^linea/, -0.2), P(f0, /^calendario/, 0.5), { pad: 6, radio: 8 });

            // f1 · tres videos se arrastran desde el computador (píldoras del kit) y la capa «Suelta los videos…»; el diálogo «Subir 3 videos»
            //      muestra el título y la duración de cada uno; «Crear 3 lecciones y subir» y aparecen en el módulo.
            const yMod = A.caja($('enl-modulo'), pag).y - 16;
            A.desliz(tl, pag, -yMod, T.pulso(f1.inicio - 0.6), 0.8);
            const archivos = ['04 Alabanza.mp4', '05 Niños.mp4', '06 Medios.mp4'].map((n, i) =>
              H.chip(sobre, `enl-arch-${i}`, 1700 + i * 26, 560 + i * 78, `<span class="ico" style="--k-icono:url(assets/iconos/movie.svg);--k-icono-tam:32px"></span>${n}`, i === 0 ? 'oro' : ''));
            const tArr = P(f1, /^arrastras/, -0.3);
            archivos.forEach((a, i) => {
              tl.fromTo(a, { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, tArr - 0.35 + i * 0.06);
              tl.to(a, { x: -620 - i * 26, y: 40 - i * 78 + i * 18, duration: 0.8, ease: 'power2.inOut' }, tArr + 0.15 + i * 0.05);
            });
            const tCapa = tArr + 0.5;
            tl.fromTo('#enl-capa', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tCapa);
            const tSuelta = P(f1, /^videos/, 0.2);
            tl.to(archivos, { scale: 0.6, opacity: 0, duration: 0.3, ease: 'power2.in', stagger: 0.04 }, tSuelta);
            tl.to('#enl-capa', { opacity: 0, duration: 0.2 }, tSuelta + 0.15);
            const tCrear = T.pulso(f1.fin + 0.05);
            A.hoja(tl, $('enl-dlg-v'), tSuelta + 0.3, { tipo: 'dialogo', velo: $('enl-velo'), hasta: tCrear + 0.25 });
            A.foco(tl, cam, $('enl-v-lista'), P(f1, /^leccion/, -0.3), P(f1, /^nombre/, -0.4), { pad: 4, radio: 14 });
            A.foco(tl, cam, $('enl-v-1-tit'), P(f1, /^nombre/, -0.3), P(f1, /^duracion/, -0.35), { pad: 4, radio: 6 });
            A.foco(tl, cam, $('enl-v-1-meta'), P(f1, /^duracion/, -0.3), tCrear - 0.15, { pad: 4, radio: 6 });
            A.tocar(tl, cam, $('enl-v-crear'), tCrear);
            const nuevas = [...document.querySelectorAll('#enl-lecciones .leccion.nueva')];
            tl.fromTo(nuevas, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.1, immediateRender: false }, tCrear + 0.45);
            rollo($('enl-cuenta'), tCrear + 0.45);
            nuevas.forEach((l, i) => {
              const t = tCrear + 1.1 + i * 0.35;
              tl.to(l.querySelector('.cch.subiendo'), { opacity: 0, duration: 0.15 }, t);
              tl.fromTo(l.querySelector('.cch.listo'), { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t + 0.1);
            });
            rollo($('enl-res'), tCrear + 2.0);
            rollo($('enl-esp'), tCrear + 2.0);
            tl.to('#enl-uso', { scaleX: 0.203, duration: 0.6, ease: 'power2.out' }, tCrear + 2.0);

            // f2 · o el enlace de YouTube o Vimeo: «Editar la lección» de «Por qué servimos», se pega el enlace y no gasta espacio.
            const tEd = P(f2, /^enlace/, -0.2);
            A.tocar(tl, pag, $('enl-l1-c'), tEd);
            const tFinDlg = P(f3, /^leccion/, 0.1);
            A.hoja(tl, $('enl-dlg-l'), tEd + 0.25, { tipo: 'dialogo', velo: $('enl-velo'), hasta: tFinDlg });
            const campoE = $('enl-l-enlace');
            A.vaciar(tl, campoE);
            const fE = A.escribir(tl, campoE, 'https://youtu.be/kgd-servir', P(f2, /^youtube/, -0.1), { cps: 30, espera: 0.4 });
            tl.to('#enl-l-usar-off', { opacity: 0, duration: 0.2 }, fE + 0.1);
            A.foco(tl, cam, $('enl-l-ayuda'), P(f2, /^espacio/, -0.4), T.pulso(f2.fin + 0.3), { pad: 4, radio: 6 });

            // f3 · «Requisito para completarla»: un quiz; luego «Cómo avanzan»: en orden y exigir ver el video (se habilita al 90 %).
            const yReq = Math.min(A.caja($('enl-l-req'), $('enl-dl-in')).y - 8, A.medida($('enl-dl-in')).h - 494);
            A.desliz(tl, $('enl-dl-in'), -yReq, T.pulso(f3.inicio - 0.2), 0.7);
            const tQ = P(f3, /^quiz/, -0.1);
            const rq = $('enl-r-quiz'), cRq = A.caja(rq, $('enl-dl-in'));
            A.tocar(tl, $('enl-dl-in'), rq, tQ, { dx: 20 - cRq.w / 2 });
            tl.set('#enl-r-ninguno .k-app-radio-circulo', { boxShadow: 'inset 0 0 0 2px #44474f' }, tQ + 0.05);
            tl.set('#enl-r-ninguno .k-app-radio-circulo > span', { opacity: 0 }, tQ + 0.05);
            tl.set('#enl-r-quiz .k-app-radio-circulo', { boxShadow: 'inset 0 0 0 2px #015bbe' }, tQ + 0.05);
            tl.set('#enl-r-quiz .k-app-radio-circulo > span', { opacity: 1 }, tQ + 0.05);
            tl.fromTo('#enl-quiz-extra', { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, tQ + 0.15);
            const yOpc = A.caja($('enl-opciones'), pag).y - 16;
            A.desliz(tl, pag, -yOpc, tFinDlg + 0.1, 0.7);
            A.foco(tl, pag, $('enl-t-orden'), P(f3, /^orden/, -0.4), P(f3, /^verdad/, -0.3), { pad: 6, radio: 12 });
            const tEx = P(f3, /^vean/, -0.3);
            const sw = $('enl-sw-exigir');
            A.tocar(tl, pag, sw, tEx);
            tl.to(sw, { boxShadow: 'inset 0 0 0 0px #74777f', duration: 0.15 }, tEx + 0.05);
            tl.to('#enl-sw-exigir .on', { opacity: 1, duration: 0.15 }, tEx + 0.05);
            tl.to('#enl-sw-exigir .mano', { x: 20, backgroundColor: '#ffffff', duration: 0.18, ease: 'power2.out' }, tEx + 0.05);
            tl.to('#enl-sw-exigir .menos', { opacity: 0, duration: 0.1 }, tEx + 0.05);
            tl.to('#enl-sw-exigir .chulo', { opacity: 1, duration: 0.15 }, tEx + 0.12);
            A.foco(tl, pag, $('enl-exigir-ayuda'), tEx + 0.35, T.pulso(f4.inicio + 0.6), { pad: 4, radio: 6 });

            // f4 · el celular de la alumna: el anillo con su avance y «Continuar»; la lección retoma el video donde iba.
            const tCel = T.pulso(f4.inicio - 0.4);
            tl.fromTo('#enl-cel', { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, tCel);
            const celCam = $('enl-cel-cam');
            A.foco(tl, celCam, $('enl-tarjeta'), P(f4, /^avance/, -0.3), P(f4, /^volver/, -0.3), { pad: 4, radio: 22 });
            const tCo = P(f4, /^volver/, -0.1);
            A.tocar(tl, celCam, $('enl-continuar'), tCo);
            tl.to('#enl-mc', { opacity: 0, duration: 0.2 }, tCo + 0.2);
            tl.fromTo('#enl-le', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tCo + 0.25);
            const tSi = P(f4, /^sigue/, -0.2);
            tl.to('#enl-visto', { scaleX: 0.486, duration: 1.6, ease: 'none' }, tSi);
            rollo($('enl-tiempo'), tSi + 0.8);
            A.foco(tl, celCam, $('enl-controles'), tSi, T.pulso(f5.inicio - 0.2), { pad: 2, radio: 10 });

            // f5 · siete días sin avanzar: «Te esperamos en Inducción a los departamentos» (el aviso del catálogo).
            const tVu = T.pulso(f5.inicio);
            tl.to('#enl-le', { opacity: 0, duration: 0.25 }, tVu);
            tl.to('#enl-mc', { opacity: 1, duration: 0.3 }, tVu + 0.2);
            const dias = H.ancla(sobre, 'enl-dias', 1010, 900, `<span class="rotulo-kit">${H.icono('hourglass_top', 30, true)}7 días sin avanzar</span>`, '');
            H.entra(tl, dias, P(f5, /^siete/, -0.3), { dy: 14 });
            const tAv = P(f5, /^aviso/, -0.3);
            tl.fromTo('#enl-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, tAv);
            H.late(tl, '#enl-notif', P(f5, /^esperamos/, -0.2), { de: 1.05 });
            H.sale(tl, dias, T.pulso(f6.inicio - 0.6), { d: 0.3 });
            tl.to('#enl-cel', { opacity: 0, x: 260, duration: 0.5, ease: 'power2.in' }, T.pulso(f6.inicio - 0.6));

            // f6 · el curso híbrido: al abrir el grupo, «Enlace de la clase en vivo»; el alumno ve «Unirse en vivo» quince minutos antes.
            const tG = T.pulso(f6.inicio - 0.2);
            H.sale(tl, '#enl-ceja', tG - 0.3, { d: 0.3 });
            tl.fromTo('#enl-ceja-2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tG + 0.1);
            tl.to(pag, { opacity: 0, duration: 0.25 }, tG);
            tl.fromTo('#enl-pag-g', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power2.out', immediateRender: false }, tG + 0.2);
            const pagG = $('enl-pag-g'), campoV = $('enl-g-enlace');
            A.vaciar(tl, campoV);
            A.foco(tl, pagG, $('enl-g-enlace-caja'), P(f6, /^hibrido/, -0.3), P(f6, /^zoom/, -0.4), { pad: 6, radio: 8 });
            A.escribir(tl, campoV, 'https://zoom.us/j/8451203967', P(f6, /^enlace/, -0.1), { cps: 30, espera: 0.5 });
            A.foco(tl, pagG, $('enl-g-ayuda'), P(f6, /^zoom/, -0.3), P(f6, /^boton/, -0.2), { pad: 4, radio: 6 });
            const tC2 = P(f6, /^boton/, -0.6);
            tl.fromTo('#enl-cel2', { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, tC2);
            const tVi = P(f6, /^unirse/, -0.2);
            tl.fromTo('#enl-vivo', { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.8)', immediateRender: false }, tVi);
            A.foco(tl, $('enl-cel2-cam'), $('enl-vivo'), tVi + 0.2, T.salida(0.7), { pad: 4, radio: 26 });
            const quince = H.ancla(sobre, 'enl-quince', 1010, 900, `<span class="rotulo-kit">${H.icono('schedule', 30, true)}15 minutos antes de la clase</span>`, '');
            H.entra(tl, quince, P(f6, /^quince/, -0.3), { dy: 14 });

            H.sale(tl, ['#enl-ven', '#enl-cel2', '#enl-ceja-2', '#enl-datos', quince], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['enlinea'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
