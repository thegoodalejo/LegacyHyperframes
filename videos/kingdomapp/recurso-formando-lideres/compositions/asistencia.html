      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          // Un QR ficticio (no codifica nada): los tres patrones de posición y módulos con semilla fija.
          const qr = (id, semilla) => {
            const N = 25, az = H.azar(semilla), on = [];
            for (let i = 0; i < N * N; i++) on.push(az() < 0.48);
            const finder = (fx, fy) => { for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
              const X = fx + x, Y = fy + y; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
              const borde = x === 0 || x === 6 || y === 0 || y === 6, centro = x >= 2 && x <= 4 && y >= 2 && y <= 4;
              on[Y * N + X] = x >= 0 && x <= 6 && y >= 0 && y <= 6 && (borde || centro); } };
            finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
            for (let i = 8; i < N - 8; i++) { on[6 * N + i] = i % 2 === 0; on[i * N + 6] = i % 2 === 0; }
            let d = '';
            on.forEach((v, i) => { if (v) d += `M${i % N} ${Math.floor(i / N)}h1v1h-1z`; });
            document.getElementById(id).setAttribute('d', d);
          };

          const construir = () => {
            qr('asi-qr-a', 4729);
            qr('asi-qr-b', 8316);
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            // Un solo dedo para toques seguidos (a menos de 0,65 s uno de otro, en la misma capa): el dedo del primer toque se queda, se
            // desliza al siguiente y lo presiona; se va después del último (queda). Así nunca se ven dos dedos a la vez.
            const tocarSerie = (ancla, pasos, queda) => {
              const p0 = pasos[0], ult = pasos[pasos.length - 1];
              const d = A.tocar(tl, ancla, p0.en, p0.t, { queda: H.r3(ult.t - p0.t + (queda ?? 0.35)), dx: p0.dx, dy: p0.dy, presionar: p0.presionar });
              const onda = d.firstElementChild;
              for (let i = 1; i < pasos.length; i++) {
                const p = pasos[i], prev = pasos[i - 1];
                const c = A.caja(p.en, ancla);
                const mueve = H.r3(Math.max(0.1, Math.min(0.3, p.t - prev.t - 0.2)));
                tl.to(d, { x: H.r3(c.cx + (p.dx || 0)), y: H.r3(c.cy + (p.dy || 0)), duration: mueve, ease: 'power2.inOut' }, H.r3(p.t - mueve - 0.02));
                tl.to(d, { scale: 0.82, duration: 0.08, ease: 'power2.in' }, p.t);
                tl.fromTo(onda, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.45, duration: 0.45, ease: 'power2.out', immediateRender: false }, p.t);
                tl.to(d, { scale: 1, duration: 0.12, ease: 'power2.out' }, p.t + 0.12);
                if (p.presionar !== false) {
                  tl.to(p.en, { scale: 0.97, filter: 'brightness(0.9)', duration: 0.06, ease: 'power1.out' }, p.t);
                  tl.to(p.en, { scale: 1, filter: 'brightness(1)', duration: 0.14, ease: 'power1.out' }, p.t + 0.12);
                }
              }
              return d;
            };
            const [f0, f1, f2, f3, f4] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const $ = (id) => document.getElementById(id);
            const cam = $('asi-cam'), grupo = $('asi-grupo'), toma = $('asi-toma'), lista = $('asi-lista');
            const bs = H.bloques(T, $('asi-col'), 'asi', ['Todo empieza en «*Hoy*»', 'Un *código* que cambia cada minuto', 'Le llega un aviso, y *listo*',
              'Lo ves en *vivo*', '«Pasar *lista*», sin señal']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#asi-ceja', 0.1, { dy: 16 });
            // Un texto que cambia cada segundo (relojes de la app), con sets en el segundo exacto: buscable.
            const reloj = (el, textos, t0, paso) => textos.forEach((x, k) => tl.set(el, { textContent: x }, H.r3(t0 + k * (paso || 1))));

            // f0 · entra el celular en la página del grupo; «Hoy»: la clase del día, lo pendiente y lo que vence esta semana.
            tl.fromTo('#asi-tel', { opacity: 0, y: 70, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#asi-datos', T.pulso(f0.inicio) + 0.6, { dy: 10 });
            const tHoy = P(f0, /^hoy/, -0.2);
            A.tocar(tl, grupo, $('asi-t-hoy'), tHoy);
            tl.set('#asi-t-resumen', { color: '#44474f', borderBottomColor: 'rgba(0,0,0,0)' }, tHoy + 0.08);
            tl.set('#asi-t-hoy', { color: '#015bbe', borderBottomColor: '#015bbe' }, tHoy + 0.08);
            tl.to('#asi-s-resumen', { opacity: 0, duration: 0.15 }, tHoy + 0.08);
            tl.fromTo('#asi-s-hoy', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tHoy + 0.15);
            const cTabs = A.caja($('asi-tabs'), grupo);
            const yHoy = -(cTabs.y - 8);
            A.desliz(tl, grupo, yHoy, tHoy + 0.45, 0.8);
            const tClase = P(f0, /^clase/, -0.1);
            A.foco(tl, grupo, $('asi-clase'), tClase, P(f0, /^pendiente/, -0.3), { pad: 4, radio: 22 });
            const cVence = A.caja($('asi-vence'), grupo);
            const yPend = -(cVence.y + cVence.h - 682 + 24);
            A.desliz(tl, grupo, yPend, P(f0, /^pendiente/, -0.4), 0.7);
            A.foco(tl, grupo, $('asi-pend'), P(f0, /^pendiente/, 0.1), P(f0, /^vence/, -0.25), { pad: 4, radio: 16 });
            A.foco(tl, grupo, $('asi-vence'), P(f0, /^vence/, -0.2), H.r3(f0.fin + 0.1), { pad: 4, radio: 14 });

            // f1 · «Tomar asistencia» → las dos formas → «Mostrar el código»: cuatro números que cambian cada minuto.
            A.desliz(tl, grupo, yHoy, H.r3(f0.fin + 0.15), 0.55);
            const tTomar = P(f1, /^tomar/, -0.1);
            A.tocar(tl, grupo, $('asi-tomar'), tTomar);
            tl.set('#asi-s-hoy', { opacity: 0 }, tTomar + 0.15);
            tl.set('#asi-s-formas', { opacity: 1 }, tTomar + 0.15);
            tl.fromTo('#asi-formas', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, tTomar + 0.15);
            const tCod = P(f1, /^muestra/);
            A.foco(tl, grupo, $('asi-f-codigo'), tTomar + 0.4, tCod + 0.1, { pad: 3, radio: 18 });
            A.tocar(tl, grupo, $('asi-f-codigo'), tCod);
            tl.to(grupo, { opacity: 0, duration: 0.2 }, tCod + 0.2);
            tl.fromTo(toma, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tCod + 0.25);
            const tNum = P(f1, /^cuatro/, -0.4);
            const cCod = A.caja($('asi-codigo'), cam);
            A.camara(tl, cam, { z: 1.2, cx: 195, cy: cCod.cy + 40, t: tNum - 0.5, d: 0.9 });
            A.foco(tl, toma, $('asi-codigo'), tNum, T.pulso(f1.fin + 0.3), { pad: 6, radio: 14 });
            // La barra y «El código cambia en N s»: el código cambia en «cambian» (el segundo 60 del minuto).
            const tCambia = P(f1, /^cambian/);
            const tToma = tCod + 0.25;
            tl.fromTo('#asi-barrita', { scaleX: (tCambia - tToma + 0.5) / 60 }, { scaleX: 0, duration: tCambia - tToma, ease: 'none', immediateRender: false }, tToma);
            tl.set('#asi-barrita', { scaleX: 1 }, tCambia);
            tl.to('#asi-barrita', { scaleX: (60 - (T.duracion - tCambia)) / 60, duration: T.duracion - tCambia, ease: 'none' }, tCambia);
            reloj($('asi-seg'), ['2', '1'], tToma, (tCambia - tToma) / 2);
            reloj($('asi-seg'), Array.from({ length: Math.ceil(T.duracion - tCambia) }, (_, k) => String(60 - k)), tCambia);
            document.querySelectorAll('#asi-codigo .dig').forEach((d, k) => {
              tl.fromTo(d.querySelector('.a'), { yPercent: 0 }, { yPercent: -110, duration: 0.3, ease: 'power2.in', immediateRender: false }, tCambia + k * 0.06);
              tl.fromTo(d.querySelector('.b'), { yPercent: 110 }, { yPercent: 0, duration: 0.35, ease: 'power2.out' }, tCambia + 0.12 + k * 0.06);
            });
            tl.to('#asi-qr-bs', { opacity: 1, duration: 0.2 }, tCambia + 0.1);
            // «Se cierra sola en 14:58»: cuenta hacia atrás desde que se abre la toma.
            const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
            reloj($('asi-rest'), Array.from({ length: Math.ceil(T.duracion - tToma) }, (_, k) => mmss(898 - k)), tToma);

            // Quienes marcan: la lista «Faltan» (18) se va vaciando con su orden de la app (por nombre) y el contador sube.
            const filas = [...document.querySelectorAll('#asi-faltan .falta')];
            const ALTO = 58;
            filas.forEach((f, i) => tl.set(f, { y: i * ALTO }, 0));
            const quitados = [];
            const nEl = $('asi-n'), fEl = $('asi-faltan-n');
            const quitar = (nombre, t) => {
              const i = filas.findIndex((f) => f.querySelector('.nombre').textContent === nombre);
              quitados.push(i);
              tl.to(filas[i], { opacity: 0, x: 30, duration: 0.25, ease: 'power1.in' }, t);
              filas.forEach((f, j) => {
                if (quitados.includes(j) || j < i) return;
                const antes = quitados.filter((q) => q < j).length;
                tl.to(f, { y: (j - antes) * ALTO, duration: 0.3, ease: 'power2.inOut' }, t + 0.15);
              });
              tl.set(nEl, { textContent: String(quitados.length) }, t);
              tl.set(fEl, { textContent: String(18 - quitados.length) }, t);
            };
            // f2 · al alumno le llega el aviso y escribe el código: tres marcan mientras tanto (la última, Lucía, en «listo»).
            const tSale = T.pulso(f2.inicio - 0.5);
            A.camara(tl, cam, { z: 1, t: tSale, d: 0.7 });
            tl.fromTo('#asi-alu', { opacity: 0, y: 60, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out', immediateRender: false }, T.pulso(f2.inicio));
            const tAviso = P(f2, /^aviso/, -0.3);
            tl.fromTo('#asi-notif', { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)', immediateRender: false }, tAviso);
            const tToca = P(f2, /^escribe/, -0.1);
            A.tocar(tl, $('asi-alu-cam'), $('asi-notif'), tToca);
            tl.to('#asi-notif', { opacity: 0, y: -30, duration: 0.25, ease: 'power1.in' }, tToca + 0.2);
            tl.to('#asi-mc', { opacity: 0, duration: 0.2 }, tToca + 0.2);
            tl.fromTo('#asi-marcar', { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tToca + 0.25);
            const cajas = [...document.querySelectorAll('#asi-cajas .caja')];
            const tListo = P(f2, /^listo/, -0.15);
            const t0Esc = P(f2, /^codigo/, -0.2);
            const pasoEsc = Math.min(0.3, (tListo - 0.35 - t0Esc) / 4);
            tl.set(cajas[0].querySelector('.actual'), { opacity: 1 }, tToca + 0.3);
            cajas.forEach((c, k) => {
              const t = H.r3(t0Esc + k * pasoEsc);
              tl.set(c.querySelector('.actual'), { opacity: 0 }, t);
              tl.fromTo(c.querySelector('.llena'), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.15, ease: 'power2.out', immediateRender: false }, t);
              if (cajas[k + 1]) tl.set(cajas[k + 1].querySelector('.actual'), { opacity: 1 }, t);
            });
            tl.to('#asi-escribe', { opacity: 0, duration: 0.2 }, tListo - 0.15);
            tl.to('#asi-hecho', { opacity: 1, duration: 0.2 }, tListo);
            tl.fromTo('#asi-check', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out', immediateRender: false }, tListo);
            tl.fromTo('#asi-ir', { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, tListo + 0.2);
            quitar('Antonella Ríos Sánchez', P(f2, /^llega/, 0));
            quitar('Débora Bustamante Gil', P(f2, /^escribe/, 0.2));
            quitar('Lucía Ruiz Montoya', tListo);

            // f3 · el profesor ve en vivo cuántos marcaron (13 de 18) y a quien no tiene celular lo marca con un toque.
            const tF3 = T.pulso(f3.inicio);
            tl.to('#asi-alu', { opacity: 0, x: -40, filter: 'blur(6px)', duration: 0.45, ease: 'power2.in' }, tF3 - 0.3);
            const cCz = A.caja($('asi-cz'), toma);
            const yCz = -(cCz.y - 12);
            A.desliz(tl, toma, yCz, tF3, 0.8);
            const tVivo = P(f3, /^vivo/, -0.3);
            const resto = ['Andrea Perea López', 'Camilo Carmona Flórez', 'Juliana Rentería Naranjo', 'Felipe Gil Franco', 'Gladys Gutiérrez Cano', 'Josué Murillo Uribe',
              'Mariana Arias', 'Miguel Quintero Asprilla', 'Paula Agudelo', 'Salomé Restrepo Tobón'];
            const tMarcaron = P(f3, /^marcaron/, -0.1);
            resto.forEach((n, k) => quitar(n, H.r3(tVivo + 0.1 + (k * (tMarcaron - tVivo - 0.1)) / (resto.length - 1))));
            const cCont = A.caja($('asi-contador'), cam);
            A.camara(tl, cam, { z: 1.4, borde: 'izquierda', cy: cCont.cy + yCz + 100, t: tVivo - 0.5, d: 0.9 });
            A.camara(tl, cam, { z: 1, t: P(f3, /^quien/, -0.3), d: 0.7 });
            A.foco(tl, toma, $('asi-contador'), tMarcaron, P(f3, /^quien/, 0), { pad: 6, radio: 12 });
            H.late(tl, '#asi-n', tMarcaron + 0.1, { de: 1.25 });
            const tToque = P(f3, /^toque/, -0.2);
            A.foco(tl, toma, $('asi-carolina'), P(f3, /^celular/, -0.3), tToque + 0.3, { pad: 4, radio: 16 });
            A.tocar(tl, toma, $('asi-presente'), tToque);
            quitar('Carolina Gil Mesa', tToque + 0.15);
            H.late(tl, '#asi-n', tToque + 0.2, { de: 1.2 });

            // f4 · «Pasar lista» sin señal (la clase de hoy, la otra forma de tomarla): se marcan con un solo dedo que se desliza (0,5 s entre
            //      toques), «Guardar la lista», queda en el celular y se envía sola al volver la señal.
            const tF4 = T.pulso(f4.inicio - 0.3);
            tl.to(toma, { opacity: 0, duration: 0.2 }, tF4);
            tl.fromTo(lista, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tF4 + 0.05);
            tl.fromTo('#asi-pie', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tF4 + 0.05);
            const pers = [...document.querySelectorAll('#asi-personas .fila-p')];
            const liN = $('asi-li-n');
            const tL0 = H.r3(tF4 + 0.7);
            tocarSerie(lista, [0, 1, 2, 4].map((k, j) => ({ en: pers[k], t: H.r3(tL0 + j * 0.5) })), 0.04);
            [0, 1, 2, 4].forEach((k, j) => {
              const t = H.r3(tL0 + j * 0.5);
              tl.to(pers[k].querySelector('.on'), { opacity: 1, duration: 0.12 }, t + 0.05);
              tl.set(pers[k].querySelector('.no'), { opacity: 0 }, t + 0.05);
              tl.set(pers[k].querySelector('.si'), { opacity: 1 }, t + 0.05);
              tl.set(pers[k].querySelector('.nombre'), { color: '#004492' }, t + 0.05);
              tl.set(liN, { textContent: String(j + 1) }, t + 0.05);
            });
            A.foco(tl, lista, $('asi-b-sin'), H.r3(tL0 + 1.8), H.r3(P(f4, /^envia/, -0.3) - 0.2), { pad: 4, radio: 14 }); // después del último toque
            const tGuardar = P(f4, /^envia/, -0.3);
            A.tocar(tl, cam, $('asi-guardar'), tGuardar);
            const hCola = A.medida($('asi-b-cola')).h, hHecho = A.medida($('asi-b-hecho')).h, hEnv = A.medida($('asi-b-enviada')).h;
            tl.set('#asi-b-hecho', { y: hCola + 14 }, 0);
            tl.to('#asi-li-resto', { y: hCola + hHecho + 28, duration: 0.4, ease: 'power3.out' }, tGuardar + 0.15);
            tl.to(['#asi-b-cola', '#asi-b-hecho'], { opacity: 1, duration: 0.3 }, tGuardar + 0.25);
            tl.set('#asi-guardar-t', { textContent: 'Sin cambios' }, tGuardar + 0.15);
            tl.set('#asi-guardar', { backgroundColor: 'rgba(27, 27, 31, 0.12)', color: 'rgba(27, 27, 31, 0.38)' }, tGuardar + 0.15);
            A.foco(tl, lista, $('asi-b-cola'), tGuardar + 0.5, P(f4, /^vuelve/, -0.2), { pad: 4, radio: 14 });
            const tVuelve = P(f4, /^vuelve/, -0.1);
            tl.to(['#asi-b-cola', '#asi-b-hecho'], { opacity: 0, duration: 0.2 }, tVuelve);
            tl.fromTo('#asi-b-enviada', { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tVuelve + 0.15);
            tl.to('#asi-li-resto', { y: hEnv + 14, duration: 0.4, ease: 'power3.out' }, tVuelve + 0.1);
            H.late(tl, '#asi-b-enviada', tVuelve + 0.45, { de: 1.05 });

            H.sale(tl, ['#asi-tel', '#asi-ceja', '#asi-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['asistencia'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
