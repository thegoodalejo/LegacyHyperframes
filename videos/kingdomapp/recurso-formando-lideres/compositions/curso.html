      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (las del Recurso 3: texto cinético con la voz, anclas, nodos, puntos, líneas,
          //    entradas; y la app recreada se mueve con KRecurso.app, del kit v1.3) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Contador: el texto de el sube de a hasta b (enteros) en d segundos desde t, con onUpdate (buscable).
            const contar = (tl, elc, a, b, t, d) => {
              const o = { n: a };
              tl.fromTo(o, { n: a }, { n: b, duration: d || 0.8, ease: 'power2.out', immediateRender: false, onUpdate: () => { elc.textContent = String(Math.round(o.n)); } }, t);
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, contar, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const A = KRecurso.app;
            // Un solo dedo para toques seguidos (a menos de 0,65 s uno de otro, en la misma capa): el dedo del primer toque se queda, se
            // desliza al siguiente y lo presiona; se va después del último (queda). Así nunca se ven dos dedos a la vez.
            const tocarSerie = (ancla, pasos, queda) => {
              const p0 = pasos[0], ult = pasos[pasos.length - 1];
              const d = A.tocar(tl, ancla, p0.en, p0.t, { queda: H.r3(ult.t - p0.t + (queda ?? 0.35)), dx: p0.dx, dy: p0.dy, presionar: p0.presionar });
              const onda = d.firstElementChild;
              for (let i = 1; i < pasos.length; i++) {
                const p = pasos[i], prev = pasos[i - 1];
                const c = A.caja(p.en, ancla);
                const mueve = H.r3(Math.max(0.1, Math.min(0.3, p.t - prev.t - 0.2)));
                tl.to(d, { x: H.r3(c.cx + (p.dx || 0)), y: H.r3(c.cy + (p.dy || 0)), duration: mueve, ease: 'power2.inOut' }, H.r3(p.t - mueve - 0.02));
                tl.to(d, { scale: 0.82, duration: 0.08, ease: 'power2.in' }, p.t);
                tl.fromTo(onda, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.45, duration: 0.45, ease: 'power2.out', immediateRender: false }, p.t);
                tl.to(d, { scale: 1, duration: 0.12, ease: 'power2.out' }, p.t + 0.12);
                if (p.presionar !== false) {
                  tl.to(p.en, { scale: 0.97, filter: 'brightness(0.9)', duration: 0.06, ease: 'power1.out' }, p.t);
                  tl.to(p.en, { scale: 1, filter: 'brightness(1)', duration: 0.14, ease: 'power1.out' }, p.t + 0.12);
                }
              }
              return d;
            };
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const P = (f, re, d) => T.pulso(H.palabra(f, re).inicio + (d || 0));
            const W = (f, re) => H.palabra(f, re).inicio;
            const $ = (id) => document.getElementById(id);
            const cam = $('cur-cam'), asis = $('cur-asis'), banco = $('cur-banco'), mat = $('cur-mat'), velo = $('cur-velo');
            const VX = 240, VY = 262; // la ventana en el cuadro (para la hoja de cálculo, que va fuera de la app)

            // ── La hoja de cálculo: la plantilla con sus ejemplos (pen_ej_1…6) y lo que llena la iglesia (filas 2 a 8). ──
            const tabla = $('cur-tabla');
            const celdas = (n, vals, pref) => {
              const out = [];
              const r = H.el('span', 'cl', tabla); r.textContent = String(n);
              vals.forEach((v, k) => {
                const c = H.el('span', `cu-celda${k === 5 ? ' nr' : ''}`, tabla, `${pref}-${n}-${k}`);
                const e = H.el('i', '', c, `${pref}-${n}-${k}-e`); e.textContent = v.ej || '';
                const s = H.el('i', '', c, `${pref}-${n}-${k}-s`); s.textContent = v.su || ''; s.style.opacity = '0';
                if (k === 5) { e.style.left = 'auto'; e.style.right = '8px'; s.style.left = 'auto'; s.style.right = '8px'; }
                out.push({ c, e, s });
              });
              return out;
            };
            const EJ = [['Fundamentos', 'Bienvenida a la familia', '', '', '', ''], ['Fundamentos', 'La salvación', '', 'Nota', 'Taller de la salvación', '40'],
              ['Fundamentos', 'El bautismo', '', 'Evaluación', 'Quiz del bautismo', '60'], ['Vida en la iglesia', 'La oración', '', '', '', ''],
              ['Vida en la iglesia', 'La casa de paz', '', 'Entrega', 'Testimonio escrito', '100'], ['Vida en la iglesia', 'La visión de la iglesia', '', '', '', ''],
              ['', '', '', '', '', '']];
            const SU = [['Antiguo Testamento', 'La creación y los patriarcas', '', '', '', ''], ['', 'El éxodo y la ley', '', '', '', ''],
              ['', 'Reyes y profetas', '', 'Entrega', 'Línea de tiempo del Antiguo Testamento', '60'], ['', '', '', 'Nota', 'Participación', '40'],
              ['Nuevo Testamento', 'Los evangelios', '', 'Evaluación', 'Quiz de los evangelios', '50'], ['', 'Hechos y las cartas', '', 'Lectura', '', ''],
              ['', 'Apocalipsis y la esperanza', '', 'Evaluación', 'Examen final', '50']];
            const filasHoja = SU.map((fila, i) => celdas(i + 2, fila.map((su, k) => ({ su, ej: EJ[i][k] })), 'cur-h'));
            const marco = H.el('span', 'cu-marco', filasHoja[5][3].c, 'cur-h-marco');

            const bs = H.bloques(T, $('cur-col'), 'cur', ['Un asistente de *cinco pasos*', 'Presencial, híbrido, en línea o *exprés*', '¿El pensum en *Excel*?',
              'Revisa cada fila y arma el *curso*', 'Preguntas desde Excel o *texto pegado*', 'Un *asterisco* marca la correcta', 'Material: *varios archivos* a la vez']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#cur-ceja-1', 0.1, { dy: 16 });
            const ceja = (de, a, t) => { H.sale(tl, de, t, { d: 0.3 }); tl.fromTo(a, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out', immediateRender: false }, t + 0.3); };
            const pagina = (de, a, t) => { tl.to(de, { opacity: 0, duration: 0.25, ease: 'power1.in' }, t); tl.fromTo(a, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, t + 0.2); };

            // ── f0 · el asistente de cinco pasos: entra la ventana, se escribe el nombre y el avance recorre los pasos en sus palabras. ──
            tl.fromTo('#cur-ven', { opacity: 0, y: 50, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.7, ease: 'power3.out' }, T.pulso(f0.inicio));
            H.entra(tl, '#cur-datos', 1.0, { dy: 10 });
            A.vaciar(tl, $('cur-nombre'));
            A.escribir(tl, $('cur-nombre'), 'Fundamentos bíblicos', 1.0, { cps: 17, espera: 0.3 });

            const segs = [...document.querySelectorAll('#cur-segs > span')];

            const TIT = ['Datos, modalidad y visibilidad', 'Materias y clases', 'Actividades y pesos', 'Criterios de aprobación', 'Logro y prerrequisito'];
            const cuerpos = ['datos', 'estructura', 'pesos', 'criterios', 'logro'].map((p) => $(`cur-paso-${p}`));
            let actual = 0;
            const irPaso = (n, t) => {
              if (n === actual) return;

              tl.fromTo(cuerpos[n], { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, t + 0.1);

              segs.forEach((s, i) => tl.to(s, { backgroundColor: i < n ? '#015bbe' : i === n ? '#6798d0' : '#e3e2e6', duration: 0.25 }, t + 0.05));
              actual = n;
            };
            irPaso(1, W(f0, /^materias/) - 0.15);
            irPaso(2, W(f0, /^actividades/) - 0.15);
            irPaso(3, W(f0, /^criterios/) - 0.15);
            irPaso(4, W(f0, /^logro/) - 0.15);

            // ── f1 · la modalidad: vuelve al paso 1, baja a «Modalidad» y elige cada una en su palabra; «de un solo día», en Exprés. ──

            const modos = { pre: $('cur-mo-pre'), hib: $('cur-mo-hib'), lin: $('cur-mo-lin'), exp: $('cur-mo-exp') };
            const cMod = A.caja($('cur-modos'), asis);
            const bajar1 = -(cMod.y - 150);
            A.desliz(tl, asis, bajar1, T.pulso(f1.inicio - 0.2), 0.8);
            A.camara(tl, cam, { z: 1.35, cx: 113 + cMod.cx, cy: 56 + cMod.cy + bajar1 + 20, t: T.pulso(f1.inicio) + 0.2, d: 0.9 });
            let sel = 'pre';
            const marcar = (k, si, t) => {
              tl.to(modos[k].querySelector('.cu-op-sel'), { opacity: si ? 1 : 0, duration: 0.12 }, t);
              tl.to(modos[k].querySelector('.cu-op-txt'), { color: si ? '#5e4100' : '#1b1b1f', duration: 0.12 }, t);
              tl.to(modos[k].querySelector('.cu-op-txt span'), { color: si ? '#5e4100' : '#44474f', duration: 0.12 }, t);
            };
            // El estado de cada modalidad; con conDedo === false el dedo lo pone tocarSerie() (las cuatro van seguidas, a 0,5 s).
            const elegir = (k, t, conDedo) => {
              if (conDedo !== false) A.tocar(tl, asis, modos[k], t);
              if (k === sel) return;
              marcar(sel, false, t + 0.06);
              marcar(k, true, t + 0.06);
              sel = k;
            };
            const tMo = [P(f1, /^presencial/, -0.2), P(f1, /^hibrido/, -0.2), P(f1, /^en$/, -0.2), P(f1, /^expres/, -0.2)];
            ['pre', 'hib', 'lin', 'exp'].forEach((k, i) => elegir(k, tMo[i], false));
            tocarSerie(asis, ['pre', 'hib', 'lin', 'exp'].map((k, i) => ({ en: modos[k], t: tMo[i] })));
            A.foco(tl, asis, $('cur-mo-exp-d'), P(f1, /^de$/, -0.1), 11.45, { pad: 6, radio: 8 });
            elegir('pre', 11.5);

            // ── f2 · «¿Ya tienes el pensum en Excel?»: paso 2, «Importar desde Excel», «Descargar plantilla», la hoja se llena y se sube. ──
            A.camara(tl, cam, { z: 1, t: 11.75, d: 0.45 });
            A.desliz(tl, asis, 0, 11.8, 0.4);
            irPaso(1, T.pulso(f2.inicio - 0.4));
            const btnImp = $('cur-btn-importar');
            A.camara(tl, cam, { z: 1.45, en: $('cur-excel'), dx: 40, t: T.pulso(f2.inicio), d: 0.8 });
            A.foco(tl, asis, $('cur-excel'), P(f2, /^pensum/, -0.2), P(f2, /^excel/, -0.1), { pad: 4, radio: 18 });
            const tImp = P(f2, /^excel/, -0.2);
            A.tocar(tl, asis, btnImp, tImp, { queda: 0.04 });
            A.camara(tl, cam, { z: 1, t: tImp + 0.1, d: 0.45 });
            const dpen1 = $('cur-dpen1'), dpen2 = $('cur-dpen2');
            A.hoja(tl, dpen1, tImp + 0.2, { tipo: 'dialogo', velo });
            const tDesc = Math.max(P(f2, /^descarga/, -0.1), H.r3(tImp + 0.66)); // un dedo a la vez: 0,66 s después de «Importar desde Excel»
            A.tocar(tl, dpen1, $('cur-pen-desc'), tDesc);
            // La hoja de cálculo sale del botón y se pone al frente (en el cuadro, fuera de la cámara).
            const hoja = $('cur-hoja');
            const mHoja = A.medida(hoja);
            const hc = { x: 196 + mHoja.w / 2, y: 336 + mHoja.h / 2 };
            const enCuadro = (el) => { const c = A.caja(el, cam); return { x: VX + c.cx, y: VY + c.cy }; };
            const bDesc = enCuadro($('cur-pen-desc'));
            tl.fromTo(hoja, { opacity: 0, scale: 0.08, x: bDesc.x - hc.x, y: bDesc.y - hc.y }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.6, ease: 'power3.out', immediateRender: false }, tDesc + 0.15);
            // «llénala»: los ejemplos se van y entran las filas de la iglesia, una tras otra.
            const tLlena = P(f2, /^llenala/, -0.2);
            filasHoja.forEach((fila, i) => {
              const t = tLlena + i * 0.1;
              fila.forEach(({ e, s }) => { tl.to(e, { opacity: 0, duration: 0.12 }, t); tl.to(s, { opacity: 1, duration: 0.15 }, t + 0.08); });
            });
            // «súbela»: la hoja vuela a «Elegir el archivo» y se toca.
            const tSube = P(f2, /^subela/, -0.1);
            const bElegir = enCuadro($('cur-pen-elegir'));
            tl.to(hoja, { x: bElegir.x - hc.x, y: bElegir.y - hc.y, scale: 0.06, duration: 0.5, ease: 'power3.in' }, tSube - 0.15);
            tl.to(hoja, { opacity: 0, duration: 0.12 }, tSube + 0.3);
            A.tocar(tl, dpen1, $('cur-pen-elegir'), tSube + 0.3);

            // ── f3 · la revisión: cada fila, la que tiene un error; se corrige el archivo, se vuelve a subir y «Usar este pensum». ──
            const tRev = tSube + 0.55;
            tl.to(dpen1, { opacity: 0, duration: 0.15 }, tRev - 0.05);
            tl.fromTo(dpen2, { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false }, tRev);
            const filasMal = [...document.querySelectorAll('#cur-filas-mal > li')];
            tl.fromTo(filasMal, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: 'power2.out', stagger: 0.14, immediateRender: false }, P(f3, /^revisa/, -0.4));
            const tErr = T.pulsoAntes(W(f3, /^marca/));
            A.foco(tl, dpen2, $('cur-fila-err'), tErr, tErr + 0.6, { pad: 4, radio: 12 });
            // La corrección: la hoja vuelve (más pequeña), «Lectura» se borra de la celda D7 y el archivo se vuelve a subir (el sonido «subida»).
            const tFix = tErr + 0.5;
            const xFix = 560 - hc.x, yFix = 600 - hc.y;
            tl.fromTo(hoja, { opacity: 0, scale: 0.5, x: xFix, y: yFix }, { opacity: 1, scale: 0.78, x: xFix, y: yFix, duration: 0.25, ease: 'power2.out', immediateRender: false }, tFix);
            tl.fromTo(marco, { opacity: 0 }, { opacity: 1, duration: 0.1, immediateRender: false }, tFix + 0.1);
            tl.to(filasHoja[5][3].s, { opacity: 0, duration: 0.12 }, tFix + 0.35);
            tl.to(marco, { boxShadow: 'inset 0 0 0 2px #006e25', duration: 0.1 }, tFix + 0.35);
            const bOtro = enCuadro($('cur-pen-otro'));
            const tOtro = tErr + 1.3;
            tl.to(hoja, { x: bOtro.x - hc.x, y: bOtro.y - hc.y, scale: 0.05, duration: 0.34, ease: 'power3.in' }, tOtro - 0.36);
            tl.to(hoja, { opacity: 0, duration: 0.08 }, tOtro - 0.06);
            // Un solo dedo a la vez: el de «Elegir otro archivo» se va (queda 0,18 s) antes de que llegue el de «Usar este pensum».
            A.tocar(tl, dpen2, $('cur-pen-otro'), tOtro, { queda: 0.18 });
            tl.to('#cur-rev-mal', { opacity: 0, duration: 0.15 }, tOtro + 0.1);
            tl.fromTo('#cur-rev-bien', { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, tOtro + 0.15);
            tl.set('#cur-pen-usar', { backgroundColor: '#015bbe', color: '#ffffff' }, tOtro + 0.2);
            const tUsar = T.pulsoAntes(W(f3, /^materias/));
            const tToqueUsar = H.r3(Math.max(tUsar + 0.1, tOtro + 0.18 + 0.25 + 0.36)); // el dedo nuevo aparece 0,36 s antes del toque
            A.tocar(tl, dpen2, $('cur-pen-usar'), tToqueUsar);
            tl.to(dpen2, { opacity: 0, scale: 0.96, duration: 0.2, ease: 'power1.in' }, tToqueUsar + 0.15);
            tl.to(velo, { opacity: 0, duration: 0.25 }, tToqueUsar + 0.15);
            // Las materias y las clases aparecen en el paso 2.
            const tArma = tToqueUsar + 0.3;
            tl.to('#cur-estr-vacia', { opacity: 0, duration: 0.15 }, tArma - 0.1);
            tl.set('#cur-estr-llena', { opacity: 1 }, tArma);
            const llenas = ['#cur-mat-at', '#cur-mat-nt', '#cur-estr-llena > .cu-nueva', '#cur-estr-llena > p'];
            tl.fromTo(llenas, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.12, immediateRender: false }, tArma);
            tl.fromTo('#cur-estr-llena .cu-clases li', { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.25, ease: 'power2.out', stagger: 0.05, immediateRender: false }, Math.max(tArma + 0.3, P(f3, /^clases/, -0.3)));
            A.desliz(tl, asis, -230, tArma, 0.9);
            // «las actividades con sus pesos»: paso 3, foco en las actividades del Antiguo Testamento con sus pesos.
            const tP3 = T.pulso(W(f3, /^actividades/));
            irPaso(2, tP3);
            A.desliz(tl, asis, -120, tP3, 0.5);
            A.foco(tl, asis, $('cur-acts-at'), P(f3, /^pesos/, -0.3), T.pulso(f4.inicio - 0.5), { pad: 6, radio: 14 });

            // ── f4 · el banco: «Cargar desde Excel o texto», el modo «Desde Excel» y «Pegar texto»; se pega lo que ya tienen en Word o WhatsApp. ──
            const tBanco = T.pulsoAntes(f4.inicio - 0.3);
            pagina(asis, banco, tBanco);
            ceja('#cur-ceja-1', '#cur-ceja-2', tBanco);
            A.foco(tl, banco, $('cur-tab-preg'), P(f4, /^preguntas/, -0.1), P(f4, /^tambien/, -0.6), { pad: 2, radio: 8 });
            const tCarga = P(f4, /^cargan/, -0.2);
            A.foco(tl, banco, $('cur-btn-cargar'), tCarga - 0.5, tCarga + 0.2, { pad: 4, radio: 26 });
            A.tocar(tl, banco, $('cur-btn-cargar'), tCarga);
            const dimp = $('cur-dimp');
            A.hoja(tl, dimp, tCarga + 0.2, { tipo: 'dialogo', velo });
            A.camara(tl, cam, { z: 1.2, en: dimp, t: tCarga + 0.55, d: 0.7 });
            A.foco(tl, dimp, $('cur-imp-pasos'), P(f4, /^excel/, -0.5), P(f4, /^pegando/, -0.3), { pad: 6, radio: 10 });
            const tPegar = P(f4, /^pegando/, -0.1);
            A.tocar(tl, dimp, $('cur-modo-texto'), tPegar, { queda: 0.04 });
            tl.to('#cur-modo-excel-sel', { opacity: 0, duration: 0.12 }, tPegar + 0.06);
            tl.to('#cur-modo-texto-sel', { opacity: 1, duration: 0.12 }, tPegar + 0.06);
            tl.to('#cur-imp-excel', { opacity: 0, duration: 0.12 }, tPegar + 0.06);
            tl.to('#cur-imp-texto', { opacity: 1, duration: 0.2 }, tPegar + 0.12);
            const pegar = $('cur-pegar'), imp = $('cur-imp-scroll');
            const cPeg = A.caja(pegar, imp);
            const baja2 = -(cPeg.y - 40);
            A.desliz(tl, imp, baja2, tPegar + 0.3, 0.6);
            const tPega = P(f4, /^texto/, 0.4);
            A.vaciar(tl, pegar);
            A.tocar(tl, imp, pegar, tPega - 0.25, { dy: -60 });
            tl.to(pegar, { boxShadow: 'inset 0 0 0 2px #015bbe', duration: 0.12 }, tPega - 0.2);
            tl.to('#cur-pegar .k-app-campo-etiqueta', { color: '#015bbe', duration: 0.12 }, tPega - 0.2);
            tl.to('#cur-pegar .k-app-campo-etiqueta', { x: 0, y: 0, scale: 1, duration: 0.2, ease: 'power2.out' }, tPega - 0.2);
            tl.fromTo('#cur-pegado', { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, tPega);
            tl.set('#cur-imp-guardar-t', { textContent: 'Guardar 0 preguntas' }, tPega);

            // ── f5 · el asterisco marca la correcta; «Revisar», la vista previa y «Guardar 3 preguntas» (todas juntas). ──
            const tAst = P(f5, /^asterisco/, -0.2);
            const tRevisar = T.pulso(W(f5, /^marca/));
            // Los focos de lo que está dentro de la zona con desplazamiento (overflow: hidden) se anclan al diálogo, con el desplazamiento de
            // ese momento sumado: así el oscurecido cubre todo menos lo resaltado, como en las demás escenas.
            const focoEnDialogo = (en, desde, hasta, scroll, o) => {
              const f = A.foco(tl, dimp, en, desde, hasta, o);
              f.style.top = `${H.r3(parseFloat(f.style.top) + scroll)}px`;
              return f;
            };
            focoEnDialogo($('cur-ast-1'), tAst, tRevisar - 0.1, baja2, { pad: 4, radio: 6 });
            A.tocar(tl, imp, $('cur-btn-revisar'), tRevisar);
            tl.to(pegar, { boxShadow: 'inset 0 0 0 1px #74777f', duration: 0.12 }, tRevisar - 0.2);
            tl.to('#cur-pegar .k-app-campo-etiqueta', { color: '#44474f', duration: 0.12 }, tRevisar - 0.2);
            tl.fromTo('#cur-imp-vista', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, tRevisar + 0.15);
            tl.set('#cur-imp-guardar', { backgroundColor: '#015bbe', color: '#ffffff' }, tRevisar + 0.15);
            tl.set('#cur-imp-guardar-t', { textContent: 'Guardar 3 preguntas' }, tRevisar + 0.15);
            const cVista = A.caja($('cur-vp-1'), imp);
            A.desliz(tl, imp, -(cVista.y - 40), tRevisar + 0.25, 0.6);
            focoEnDialogo($('cur-vp-1b'), P(f5, /^correcta/, -0.1), T.pulsoAntes(W(f5, /^revisas/)), -(cVista.y - 40), { pad: 4, radio: 14 });
            A.desliz(tl, imp, -(cVista.y - 40) - 330, T.pulsoAntes(W(f5, /^revisas/)), 0.7);
            const tGuardar = P(f5, /^guardas/, -0.1);
            A.foco(tl, dimp, $('cur-imp-guardar'), tGuardar - 0.4, tGuardar + 0.15, { pad: 4, radio: 24 });
            A.tocar(tl, dimp, $('cur-imp-guardar'), tGuardar);
            tl.to(dimp, { opacity: 0, scale: 0.96, duration: 0.2, ease: 'power1.in' }, tGuardar + 0.2);
            A.camara(tl, cam, { z: 1, t: tGuardar + 0.2, d: 0.5 });
            tl.to(velo, { opacity: 0, duration: 0.25 }, tGuardar + 0.2);
            tl.set('#cur-tab-preg-t', { textContent: 'Preguntas (9)' }, tGuardar + 0.3);
            tl.set('#cur-cuantas', { textContent: '9 preguntas' }, tGuardar + 0.3);
            tl.to('#cur-chip-sin', { opacity: 1, duration: 0.2 }, tGuardar + 0.3);
            A.aparecer(tl, $('cur-snack-1'), tGuardar + 0.45);
            A.quitar(tl, $('cur-snack-1'), T.pulso(f6.inicio - 0.6));

            // ── f6 · el material: «Agregar» → «Subir archivos», varios a la vez, y «Dónde va»: General, una materia o una clase. ──
            const tMat = T.pulso(f6.inicio - 0.5);
            pagina(banco, mat, tMat);
            ceja('#cur-ceja-2', '#cur-ceja-3', tMat);
            const tAg = P(f6, /^material/);
            A.foco(tl, mat, $('cur-mat-cab'), tMat + 0.45, tAg - 0.05, { pad: 6, radio: 12 });
            tl.fromTo('#cur-menu-ag', { opacity: 0, scaleY: 0.85, transformOrigin: '50% 0%' }, { opacity: 1, scaleY: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, tAg + 0.15);
            const tSubir = P(f6, /^presentaciones/, 0.1);
            tocarSerie(mat, [{ en: $('cur-btn-agregar'), t: tAg }, { en: $('cur-mi-subir'), t: tSubir }], 0.04); // un solo dedo: «Agregar» y «Subir archivos»
            tl.to('#cur-menu-ag', { opacity: 0, duration: 0.15 }, tSubir + 0.15);
            const dsub = $('cur-dsub');
            A.hoja(tl, dsub, tSubir + 0.2, { tipo: 'dialogo', velo });
            A.camara(tl, cam, { z: 1.35, en: dsub, dy: 20, t: tSubir + 0.4, d: 0.7 });
            const tElegir = Math.max(P(f6, /^lecturas/, -0.2), H.r3(tSubir + 0.66)); // un dedo a la vez: 0,66 s después de «Subir archivos»
            A.tocar(tl, dsub, $('cur-btn-elegir'), tElegir);
            tl.set('#cur-sub-lista', { opacity: 1 }, tElegir + 0.15);
            tl.fromTo('#cur-arch > li', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', stagger: 0.12, immediateRender: false }, tElegir + 0.15);
            tl.fromTo('#cur-resa', { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, tElegir + 0.5);
            tl.to('#cur-nuevo', { opacity: 1, duration: 0.2 }, tElegir + 0.5);
            tl.set('#cur-elegir-t', { textContent: 'Agregar más archivos' }, tElegir + 0.15);
            tl.set('#cur-btn-subir', { backgroundColor: '#015bbe', color: '#ffffff' }, tElegir + 0.15);
            tl.set('#cur-subir-t', { textContent: 'Subir 3' }, tElegir + 0.15);
            A.foco(tl, dsub, $('cur-sub-lista'), P(f6, /^varios/, -0.3), P(f6, /^vez/, -0.25), { pad: 6, radio: 12 });
            const tDonde = T.pulsoAntes(W(f6, /^por$/));
            A.tocar(tl, dsub, $('cur-donde'), tDonde);
            tl.to('#cur-donde', { boxShadow: 'inset 0 0 0 2px #015bbe', duration: 0.12 }, tDonde + 0.05);
            tl.to('#cur-donde .k-app-campo-etiqueta', { color: '#015bbe', duration: 0.12 }, tDonde + 0.05);
            tl.fromTo('#cur-panel', { opacity: 0, scaleY: 0.9, transformOrigin: '50% 100%' }, { opacity: 1, scaleY: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, tDonde + 0.15);
            A.foco(tl, dsub, $('cur-op-at'), P(f6, /^materia$/, -0.2), P(f6, /^clase/, -0.4), { pad: 0, radio: 4 });
            const tClase = P(f6, /^clase/, -0.2);
            A.foco(tl, dsub, $('cur-op-exodo'), tClase - 0.3, tClase + 0.2, { pad: 0, radio: 4 });
            A.tocar(tl, dsub, $('cur-op-exodo'), tClase, { queda: 0.04 });
            tl.set('#cur-op-exodo', { backgroundColor: '#e3e2e6' }, tClase);
            tl.to('#cur-panel', { opacity: 0, duration: 0.15 }, tClase + 0.2);
            tl.set('#cur-donde-v1', { opacity: 0 }, tClase + 0.25);
            tl.set('#cur-donde-v2', { opacity: 1 }, tClase + 0.25);
            tl.to('#cur-donde', { boxShadow: 'inset 0 0 0 1px #74777f', duration: 0.12 }, tClase + 0.5);
            tl.to('#cur-donde .k-app-campo-etiqueta', { color: '#44474f', duration: 0.12 }, tClase + 0.5);
            const tSubirOk = tClase + 0.65;
            A.tocar(tl, dsub, $('cur-btn-subir'), tSubirOk);
            tl.to(dsub, { opacity: 0, scale: 0.96, duration: 0.2, ease: 'power1.in' }, tSubirOk + 0.15);
            A.camara(tl, cam, { z: 1, t: tSubirOk + 0.15, d: 0.5 });
            tl.to(velo, { opacity: 0, duration: 0.25 }, tSubirOk + 0.15);
            tl.fromTo('#cur-sec-at', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, tSubirOk + 0.3);
            tl.set('#cur-uso-t', { textContent: 'La iglesia usa 23 MB de 1 GB · le quedan 1 GB' }, tSubirOk + 0.3);
            tl.to('#cur-uso-b', { width: '2.3%', duration: 0.3 }, tSubirOk + 0.3);
            A.desliz(tl, mat, -150, tSubirOk + 0.35, 0.6);
            A.aparecer(tl, $('cur-snack-2'), tSubirOk + 0.4);

            H.sale(tl, ['#cur-ven', '#cur-ceja-3', '#cur-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['curso'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
