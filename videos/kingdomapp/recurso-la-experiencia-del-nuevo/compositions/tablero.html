  <head>

  <body>
    <template>
      <style>

      <div id="root" data-composition-id="tablero" data-width="1920" data-height="1080" data-duration="19.5">
        <div class="k-recurso-ceja ceja-e" id="tab-ceja">Portal y Membresía · Tableros</div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const dia = document.getElementById('tab-dia');
            const svg = document.getElementById('tab-svg');
            const NS = 'http://www.w3.org/2000/svg';
            const bs = H.bloques(T, document.getElementById('tab-col'), 'tab', ['El *tablero* del Portal', 'Quiénes *terminan* la bienvenida',
              'Cómo *avanzan* los objetivos', 'A cuántas llegan tus *comunicados*', 'El semáforo, *red por red*', 'Lo que pasa, y lo puedes *ver*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#tab-ceja', 0.1, { dy: 16 });
            const contar = (el, de, a, t, d, suf) => { const o = { n: de }; tl.fromTo(o, { n: de }, { n: a, duration: d || 1, ease: 'power2.out', onUpdate: () => { el.textContent = `${Math.round(o.n)}${suf || ''}`; } }, t); };
            
            // f0 · el tablero: cuatro marcos que se arman en una rejilla.
            const marcos = [[170, 210], [478, 210], [170, 520], [478, 520]].map(([x, y], i) => H.ancla(dia, `tab-m-${i}`, x, y, H.icono(['waving_hand', 'task_alt', 'campaign', 'monitoring'][i], 72, i === 0)));
            const t0 = T.pulso(f0.inicio);
            H.pop(tl, marcos, t0, { stagger: 0.15 });
            H.late(tl, marcos, T.pulso(H.clave(f0).inicio), { de: 1.2 });
            
            // A · f1: la bienvenida: empezaron y terminaron (dos barras y el número que sube).
            const t1 = T.pulso(f1.inicio - 0.3);
            H.sale(tl, marcos, t1, { stagger: 0.04 });
            H.entra(tl, '#tab-datos', t1 + 0.3, { dy: 12 });
            const b1 = H.el('span', 'tab-barra', dia, 'tab-b1', { left: '40px', top: '420px', width: '560px', background: 'rgba(169, 182, 214, 0.35)' });
            const b2 = H.el('span', 'tab-barra', dia, 'tab-b2', { left: '40px', top: '540px', width: '420px', background: '#e8b95a' });
            const r1 = H.ancla(dia, 'tab-r1', 40, 390, 'Empezaron su bienvenida · 48', 'rot izq');
            const r2 = H.ancla(dia, 'tab-r2', 40, 510, 'La terminaron', 'rot oro izq');
            const n1 = H.ancla(dia, 'tab-n1', 324, 230, '<span class="tab-num oro" id="tab-n1v">0</span>');
            const tTer = T.pulso(H.palabra(f1, /^terminan/).inicio - 0.3);
            H.entra(tl, r1, t1 + 0.4, { dy: 12 });
            tl.fromTo(b1, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'power2.out' }, t1 + 0.5);
            H.entra(tl, r2, tTer, { dy: 12 });
            tl.fromTo(b2, { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.out' }, tTer + 0.2);
            H.pop(tl, n1, tTer);
            contar(document.getElementById('tab-n1v'), 0, 36, tTer + 0.1, 1.2);
            
            // B · f2: los objetivos: tres anillos que avanzan con su porcentaje.
            const t2 = T.pulso(f2.inicio - 0.3);
            H.sale(tl, [b1, b2, r1, r2, n1], t2, { stagger: 0.03 });
            const objs = [[120, 0.62, 'Plan de lectura'], [324, 0.4, 'Devocional'], [528, 0.85, 'Una canción']].map(([x, p, tx], i) => {
              const base = document.createElementNS(NS, 'circle');
              const av = document.createElementNS(NS, 'circle');
              [base, av].forEach((c, k) => { Object.entries({ cx: x, cy: 380, r: 80, class: `k-recurso-linea${k ? ' k-oro' : ''}`, transform: `rotate(-90 ${x} 380)`, id: `tab-o${k}-${i}` }).forEach(([a, v]) => c.setAttribute(a, v)); c.style.strokeWidth = k ? '10' : '6'; svg.appendChild(c); });
              const L = 2 * Math.PI * 80;
              av.style.strokeDasharray = `${L} ${L + 40}`; av.style.strokeDashoffset = `${L + 14}`;
              const pct = H.ancla(dia, `tab-p-${i}`, x, 380, `<span class="tab-pct" id="tab-pv-${i}">0%</span>`);
              const r = H.ancla(dia, `tab-or-${i}`, x, 500, tx, 'rot');
              return { base, av, L, p, pct, r, i };
            });
            const tAv = T.pulso(H.clave(f2).inicio - 0.3);
            objs.forEach((o) => {
              tl.fromTo(o.base, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t2 + 0.3 + o.i * 0.1);
              H.entra(tl, [o.pct, o.r], t2 + 0.4 + o.i * 0.1, { dy: 10 });
              tl.to(o.av, { strokeDashoffset: o.L * (1 - o.p), duration: 1, ease: 'power2.out' }, tAv + o.i * 0.15);
              contar(document.getElementById(`tab-pv-${o.i}`), 0, Math.round(o.p * 100), tAv + o.i * 0.15, 1, '%');
            });
            
            // C · f3: los comunicados: a cuántas personas llegaron.
            const t3 = T.pulso(f3.inicio - 0.3);
            H.sale(tl, objs.flatMap((o) => [o.pct, o.r]), t3, { stagger: 0.02 });
            tl.to(objs.flatMap((o) => [o.base, o.av]), { opacity: 0, duration: 0.3 }, t3);
            const n3 = H.ancla(dia, 'tab-n3', 324, 340, '<span class="tab-num" id="tab-n3v">0</span>');
            const r3 = H.ancla(dia, 'tab-r3', 324, 450, 'personas recibieron el comunicado', 'rot');
            const com = H.nodo(dia, 'tab-com', 324, 160, 'campaign', true, 120);
            H.pop(tl, com, t3 + 0.3);
            const tCom = T.pulso(H.clave(f3).inicio - 0.3);

            const ondas = [0, 1, 2].map((k) => { const c = document.createElementNS(NS, 'circle'); Object.entries({ cx: 324, cy: 160, r: 70, class: 'k-recurso-linea k-oro', id: `tab-w-${k}` }).forEach(([a, v]) => c.setAttribute(a, v)); svg.appendChild(c); c.style.opacity = '0'; return c; });
            ondas.forEach((c, k) => tl.fromTo(c, { attr: { r: 70 }, opacity: 0.8 }, { attr: { r: 260 }, opacity: 0, duration: 1.4, ease: 'power2.out', immediateRender: false }, tCom + k * 0.5));
            
            // D · f4: el semáforo de actividad de toda la iglesia, red por red (barras apiladas con los cuatro colores).
            const t4 = T.pulso(f4.inicio - 0.3);
            H.sale(tl, [n3, r3, com], t4, { stagger: 0.04 });
            const redes = [['Red norte', [0.55, 0.22, 0.13, 0.1]], ['Red centro', [0.48, 0.27, 0.15, 0.1]], ['Red sur', [0.62, 0.18, 0.12, 0.08]]];
            const COL = ['#26a69a', '#e8b95a', '#e57373', 'rgba(169, 182, 214, 0.35)'];
            const filasR = redes.map(([nom, ps], i) => {
              const y = 250 + i * 150;
              const r = H.ancla(dia, `tab-red-${i}`, 40, y - 48, nom, 'rot izq');
              let x = 40;
              const segs = ps.map((p, k) => { const w = p * 568; const s = H.el('span', 'tab-seg', dia, `tab-s-${i}-${k}`, { left: `${x}px`, top: `${y - 20}px`, width: `${w - 4}px`, background: COL[k], borderRadius: k === 0 ? '10px 0 0 10px' : k === 3 ? '0 10px 10px 0' : '0' }); x += w; return s; });
              return { r, segs, i };
            });
            const tRed = T.pulso(H.clave(f4).inicio - 0.6);
            const tSem = T.pulso(H.palabra(f4, /^semaforo/).inicio - 0.3);
            filasR.forEach((f) => {
              H.entra(tl, f.r, (f.i === 0 ? tSem : tRed) + f.i * 0.3, { dy: 10 });
              f.segs.forEach((s, k) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, (f.i === 0 ? tSem : tRed) + f.i * 0.3 + 0.1 + k * 0.12));
            });
            
            // f5 · lo puedes ver: todo late una vez, en el compás.
            const t5 = T.pulso(H.clave(f5).inicio - 0.3);
            const ojo = H.chip(dia, 'tab-ojo', 324, 720, `${H.icono('visibility', 34, true)}Lo que pasa, a la vista`, 'oro');
            H.pop(tl, ojo, T.pulso(f5.inicio));
            filasR.forEach((f) => H.late(tl, f.segs, t5 + f.i * 0.15, { de: 1.08 }));
            
            H.sale(tl, ['#tab-dia', '#tab-ceja', '#tab-datos'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['tablero'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
