    <template>
      <style>

      <div id="root" data-composition-id="semaforo" data-width="1920" data-height="1080" data-duration="23.5">
        <div class="k-recurso-ceja ceja-e" id="sem-ceja">Membresía · Semáforo de actividad</div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4] = T.frases;
            const dia = document.getElementById('sem-dia');
            const bs = H.bloques(T, document.getElementById('sem-col'), 'sem', ['El *semáforo de actividad*', 'Los días desde lo *último* que hizo',
              'Cada actividad la vuelve a *verde*', 'Lo ves *a tiempo*', 'Una herramienta para *quien cuida*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#sem-ceja', 0.1, { dy: 16 });
            
            const COL = ['#26a69a', '#e8b95a', '#e57373', 'transparent'];
            const XS = [111, 253, 395, 537];
            // f0 · cuatro luces, de arriba abajo: verde, amarillo, rojo y «Sin actividad» (un anillo gris).
            const luces = COL.map((c, i) => H.el('span', `sem-luz${i === 3 ? ' sem-gris' : ''}`, dia, `sem-luz-${i}`, { left: '324px', top: `${130 + i * 112}px`, background: i === 3 ? 'transparent' : c }));
            const t0 = T.pulso(f0.inicio);
            H.pop(tl, luces, T.pulso(H.clave(f0).inicio - 0.4), { stagger: 0.18 });
            
            // f1 · las luces bajan al eje de los días: 0–10, 11–30, 31–50 y más de 50 (los días de fábrica).
            const segs = COL.map((c, i) => H.el('span', `sem-seg${i === 3 ? ' sem-gris' : ''}`, dia, `sem-seg-${i}`, { left: `${XS[i] - 67}px`, background: i === 3 ? 'transparent' : c }));
            const nombres = ['Verde', 'Amarillo', 'Rojo', 'Sin actividad'];
            const dias = ['0 a 10 días', '11 a 30', '31 a 50', 'Más de 50'];
            const rotN = nombres.map((n, i) => H.ancla(dia, `sem-n-${i}`, XS[i], 388, n, 'rot'));
            const rotD = dias.map((n, i) => H.ancla(dia, `sem-d-${i}`, XS[i], 428, n, 'sem-dias'));
            const t1 = T.pulsoAntes(f0.fin + 0.1);
            luces.forEach((l, i) => tl.to(l, { x: XS[i] - 324, y: 331 - (130 + i * 112), scale: 0.25, opacity: 0, duration: 0.7, ease: 'power3.inOut' }, t1 + i * 0.1));
            segs.forEach((s, i) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power2.out' }, t1 + 0.5 + i * 0.12));
            [/^verde/, /^amarillo/, /^rojo/, /^sin/].forEach((re, i) => {
              const t = T.pulso(H.palabra(f1, re).inicio - 0.3);
              H.entra(tl, rotN[i], t, { dy: 12 });
              H.entra(tl, rotD[i], t + 0.15, { dy: 12 });
            });
            // Ella sobre el eje: los días pasan y se corre a la derecha.
            const yo = H.punto(dia, 'sem-yo', 60, 270, 'k-oro', 34);
            const halo = H.el('div', 'halo', dia, 'sem-halo', { left: '60px', top: '270px' });
            H.pop(tl, yo, T.pulso(H.palabra(f1, /^dias/).inicio - 0.3));
            tl.to(yo, { x: 150, duration: Math.max(1, f1.fin - H.palabra(f1, /^dias/).inicio), ease: 'none' }, T.pulso(H.palabra(f1, /^dias/).inicio));
            tl.to(yo, { backgroundColor: '#e8b95a', duration: 0.2 }, T.pulso(H.palabra(f1, /^dias/).inicio) + 0.6);
            
            // f2 · cuenta lo que hace: una reunión, una clase, un paso, usar la app; cada una la regresa a verde.
            const acts = [['event', 'Una reunión', /^reunion/], ['school', 'Una clase', /^clase/], ['task_alt', 'Un paso', /^paso/], ['how_to_reg', 'Usar la app', /^app/]]
              .map(([ic, tx, re], i) => ({ n: H.nodo(dia, `sem-a-${i}`, XS[i], 590, ic, false, 100), r: H.ancla(dia, `sem-a-${i}-r`, XS[i], 674, tx, 'rot'), re }));
            let x = 150;
            acts.forEach((a, i) => {
              const t = T.pulso(H.palabra(f2, a.re).inicio - 0.3);
              H.pop(tl, a.n, t);
              H.entra(tl, a.r, t + 0.1, { dy: 10 });
              tl.to(yo, { x: 0, backgroundColor: '#26a69a', duration: 0.4, ease: 'power3.out' }, t + 0.2);
              tl.set(halo, { x: 0 }, t + 0.2);
              H.halo(tl, halo, t + 0.25);
              if (i < 3) tl.to(yo, { x: 70, duration: 0.6, ease: 'none' }, t + 0.7);
            });
            
            // f3 · pasa a amarillo: lo ves a tiempo y alguien la llama; vuelve a verde.
            const t3 = T.pulso(f3.inicio - 0.3);
            H.sale(tl, [...acts.map((a) => a.n), ...acts.map((a) => a.r)], t3, { stagger: 0.02 });
            tl.to(yo, { x: 190, duration: 1, ease: 'power1.inOut' }, t3);
            const tAma = T.pulso(H.palabra(f3, /^amarillo/).inicio - 0.3);
            tl.to(yo, { backgroundColor: '#e8b95a', duration: 0.2 }, tAma);
            tl.set(halo, { x: 190 }, tAma);
            H.halo(tl, halo, tAma + 0.2);
            H.halo(tl, halo, tAma + 0.7);
            const visto = H.chip(dia, 'sem-visto', 324, 560, `${H.icono('visibility', 34, true)}Lo ves a tiempo`, 'oro');
            const llama = H.chip(dia, 'sem-llama', 324, 660, `${H.icono('support_agent', 34)}Alguien la llama`);
            H.pop(tl, visto, T.pulso(H.clave(f3).inicio - 0.3));
            const tLl = T.pulso(H.palabra(f3, /^llama/).inicio - 0.8);
            H.pop(tl, llama, tLl);
            const azul = H.punto(dia, 'sem-azul', 324, 660, 'k-azul', 28);
            tl.fromTo(azul, { opacity: 0 }, { opacity: 1, duration: 0.2 }, tLl + 0.4);
            tl.to(azul, { x: 60 + 190 + 44 - 324, y: 270 - 660, duration: 0.8, ease: 'power3.inOut' }, tLl + 0.4);
            tl.to(yo, { x: 0, backgroundColor: '#26a69a', duration: 0.6, ease: 'power3.inOut' }, tLl + 1.2);
            tl.to(azul, { x: 60 + 44 - 324, duration: 0.6, ease: 'power3.inOut' }, tLl + 1.2);
            
            // f4 · ella no lo ve: es para quien cuida.
            const t4 = T.pulso(f4.inicio - 0.3);
            H.sale(tl, [visto, llama], t4 + 0.6, { stagger: 0.05 });
            const no = H.chip(dia, 'sem-no', 324, 560, `${H.icono('person', 34)}La persona no lo ve`);
            const cuida = H.chip(dia, 'sem-cuida', 324, 660, `${H.icono('favorite', 34, true)}Para quien cuida`, 'oro');
            H.entra(tl, no, t4 + 1.0, { dy: 18 });
            H.pop(tl, cuida, T.pulso(H.clave(f4).inicio - 0.3));
            H.late(tl, azul, T.pulso(H.clave(f4).inicio) + 0.5, { de: 1.5 });
            
            H.sale(tl, ['#sem-dia', '#sem-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['semaforo'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
