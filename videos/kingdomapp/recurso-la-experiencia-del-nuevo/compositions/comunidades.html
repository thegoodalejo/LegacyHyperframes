  <body>
    <template>
      <style>

      </style>

      <div id="root" data-composition-id="comunidades" data-width="1920" data-height="1080" data-duration="26.5">
        <div class="k-recurso-ceja ceja-e" id="com-ceja">Mi iglesia · Comunidades</div>
        <div class="col" id="com-col"></div>
        <div class="dia" id="com-dia" data-layout-allow-overflow data-layout-allow-overlap>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const dia = document.getElementById('com-dia');
            const svg = document.getElementById('com-svg');
            const bs = H.bloques(T, document.getElementById('com-col'), 'com', ['Sus *comunidades*', 'Primero, las que son *para ella*',
              'Se une con *un toque*', 'Lo que comparten sus *líderes*', undefined, 'Un líder la *toma*', 'Ya no es una visitante. Tiene a *alguien*.']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#com-ceja', 0.1, { dy: 16 });
            
            const C = { x: 324, y: 430 };
            const yo = H.punto(dia, 'com-yo', C.x, C.y, 'k-oro', 32);
            const halo = H.el('div', 'halo', dia, 'com-halo', { left: `${C.x}px`, top: `${C.y}px` });
            const defs = [['jov', 140, 200, 'groups', 'Jóvenes', /^jovenes/], ['mat', 508, 200, 'favorite', 'Matrimonios', /^matrimonios/],
              ['muj', 140, 660, 'diversity_3', 'Mujeres', /^mujeres/], ['dep', 508, 660, 'groups_3', 'Deportes', /^deportes/]];
            const coms = defs.map(([k, x, y, ic, tx, re]) => ({ k, x, y, re, n: H.nodo(dia, `com-${k}`, x, y, ic), r: H.ancla(dia, `com-${k}-r`, x, y + (y < C.y ? -98 : 98), tx, 'rot') }));
            const rayos = coms.map((c) => H.linea(svg, `com-l-${c.k}`, C.x, C.y, c.x, c.y));
            
            // f0 · las comunidades aparecen con su nombre, una en cada palabra.
            H.pop(tl, yo, T.pulso(f0.inicio));
            coms.forEach((c) => {
              const t = T.pulso(H.palabra(f0, c.re).inicio - 0.25);
              H.pop(tl, c.n, t);
              H.entra(tl, c.r, t + 0.15, { dy: 14 });
              H.dibujar(tl, `#com-l-${c.k}`, t, 0.4);
            });
            
            // f1 · «Para ti»: la de jóvenes se acerca y se marca en dorado.
            const jov = coms[0];
            const tSug = T.pulso(H.palabra(f1, /^sugiere/).inicio - 0.2);
            const paraTi = H.chip(dia, 'com-parati', 140, 330, `${H.icono('star', 34, true)}Para ti`, 'oro');
            H.pop(tl, paraTi, tSug);
            tl.to('#com-jov-n', { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.35 }, tSug);
            H.late(tl, jov.n, tSug, { de: 1.2 });
            tl.to(rayos.slice(1), { opacity: 0.25, duration: 0.4 }, tSug + 0.5);
            
            // f2 · «Unirme» con un toque (ella entra), o «Solicitar» si la comunidad aprueba a quien entra.
            const tUne = T.pulso(H.palabra(f2, /^une/).inicio - 0.2);
            const unirme = H.chip(dia, 'com-unirme', 324, 300, `${H.icono('group_add', 34)}Unirme`, 'oro');
            H.pop(tl, unirme, tUne);
            H.late(tl, unirme, tUne + 0.5, { de: 0.9, d: 0.35 });
            tl.to(rayos[0], { stroke: '#e8b95a', duration: 0.3 }, tUne + 0.5);
            tl.to(yo, { x: jov.x + 56 - C.x, y: jov.y + 40 - C.y, duration: 0.8, ease: 'power3.inOut' }, tUne + 0.7);
            const tSol = T.pulso(H.palabra(f2, /^solicita/).inicio - 0.2);
            const sol = H.chip(dia, 'com-sol', 508, 330, `${H.icono('schedule', 34)}Solicitar`);
            H.sale(tl, unirme, tSol - 0.3);
            H.pop(tl, sol, tSol);
            
            // f3 · adentro: la comunidad crece al centro con sus líderes, sus publicaciones y sus cursos.
            const t3 = T.pulso(f3.inicio - 0.3);
            H.sale(tl, [paraTi, sol, ...coms.slice(1).map((c) => c.n), ...coms.slice(1).map((c) => c.r), coms[0].r], t3, { stagger: 0.03 });
            tl.to(rayos, { opacity: 0, duration: 0.3 }, t3);
            tl.to(jov.n, { x: C.x - jov.x, y: 380 - jov.y, scale: 1.5, duration: 0.8, ease: 'power3.inOut' }, t3 + 0.2);
            tl.to(yo, { x: 0, y: 590 - C.y, duration: 0.8, ease: 'power3.inOut' }, t3 + 0.2);
            const lideres = [[214, 170], [434, 170]].map(([x, y], i) => H.nodo(dia, `com-lid-${i}`, x, y, 'person', false, 96));
            const lidR = H.ancla(dia, 'com-lid-r', 324, 90, 'Sus líderes', 'rot');
            const pub = H.chip(dia, 'com-pub', 150, 520, `${H.icono('campaign', 34)}Publicaciones`);
            const cur = H.chip(dia, 'com-cur', 508, 520, `${H.icono('school', 34)}Cursos`);
            const tLid = T.pulso(H.palabra(f3, /^lideres/).inicio - 0.3);
            H.pop(tl, lideres, tLid, { stagger: 0.12 });
            H.entra(tl, lidR, tLid + 0.2, { dy: 14 });
            H.pop(tl, pub, T.pulso(H.palabra(f3, /^comparten/).inicio - 0.3));
            H.pop(tl, cur, T.pulso(H.palabra(f3, /^cursos/).inicio - 0.3));
            
            // f4 · «Conectar con un líder», lo más importante.
            const t4 = T.pulso(f4.inicio - 0.2);
            const con = H.chip(dia, 'com-con', 324, 700, `${H.icono('handshake', 34)}Conectar con un líder`, 'oro');
            H.sale(tl, [pub, cur], t4, { stagger: 0.04 });
            H.entra(tl, con, t4 + 0.2, { dy: 24 });
            H.late(tl, con, T.pulso(H.clave(f4).inicio) + 0.5, { de: 1.1 });
            
            // f5 · un mensaje corto sube a los líderes; uno lo toma y llega «Ana te acompañará».
            const t5 = T.pulso(f5.inicio - 0.2);
            const msg = H.chip(dia, 'com-msg', 324, 590, `${H.icono('chat_bubble', 34)}Un mensaje corto`);
            H.sale(tl, con, t5);
            H.pop(tl, msg, t5 + 0.3);
            tl.to(msg, { x: 434 - 324, y: 170 - 590, scale: 0.4, opacity: 0, duration: 0.8, ease: 'power2.in' }, T.pulso(H.palabra(f5, /^lider/).inicio - 0.3));
            const tToma = T.pulso(H.palabra(f5, /^toma/).inicio - 0.2);
            tl.to('#com-lid-1-n', { boxShadow: 'inset 0 0 0 3px #3576da', color: '#eaf0ff', backgroundColor: '#3576da', duration: 0.3 }, tToma);
            H.late(tl, lideres[1], tToma, { de: 1.25 });
            const cita = H.ancla(dia, 'com-cita', 324, 770, '<span class="com-cita">«Ana <em>te acompañará</em>»</span>');
            H.entra(tl, cita, T.pulso(H.palabra(f5, /^acompan/).inicio - 0.5), { dy: 20 });
            
            // f6 · tiene a alguien: la líder baja a su lado y las une un lazo dorado.
            const t6 = T.pulso(f6.inicio - 0.2);
            H.sale(tl, [lideres[0], lidR, cita], t6, { stagger: 0.05 });
            tl.to(jov.n, { opacity: 0.25, duration: 0.5 }, t6);
            tl.to(yo, { x: -40, y: 470 - C.y, scale: 1.2, duration: 0.9, ease: 'power3.inOut' }, t6);
            tl.to(lideres[1], { x: 324 + 40 - 434, y: 470 - 170, scale: 0.42, duration: 0.9, ease: 'power3.inOut' }, t6);
            const lazo = H.linea(svg, 'com-lazo', 284, 470, 364, 470, true);
            const tAlg = T.pulso(H.clave(f6).inicio - 0.2);
            H.dibujar(tl, lazo, tAlg, 0.4);
            tl.set(halo, { x: -40, y: 470 - C.y }, tAlg);
            H.halo(tl, halo, tAlg + 0.2);
            H.halo(tl, halo, tAlg + 1.2);
            
            H.sale(tl, ['#com-dia', '#com-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['comunidades'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
