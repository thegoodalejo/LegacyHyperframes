      <div id="root" data-composition-id="objetivos" data-width="1920" data-height="1080" data-duration="32">

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const dia = document.getElementById('obj-dia');
            const svg = document.getElementById('obj-svg');
            const NS = 'http://www.w3.org/2000/svg';
            const bs = H.bloques(T, document.getElementById('obj-col'), 'obj', ['*Planes* que la animan a seguir', 'Un libro, un devocional, una canción',
              'Su *anillo* de avance y su recordatorio', '«Lo hice» o «*Aplazar*», sin perder un paso', 'Sus pasos para *conectarse*',
              'Los grupos *más cercanos*', '«*Quiero asistir*»']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#obj-ceja', 0.1, { dy: 16 });
            
            const circulo = (id, cx, cy, r, cls, w) => {
              const c = document.createElementNS(NS, 'circle');
              Object.entries({ cx, cy, r, id, class: cls, transform: `rotate(-90 ${cx} ${cy})` }).forEach(([k, v]) => c.setAttribute(k, v));
              c.style.strokeWidth = `${w || 6}`;
              svg.appendChild(c);
              const L = 2 * Math.PI * r;
              c.style.strokeDasharray = `${L} ${L + 40}`;
              c.style.strokeDashoffset = `${L + 14}`;
              return { c, L };
            };
            
            // A · f0–f2: tres planes, cada uno con su anillo; el recordatorio llega al celular.
            const planes = [['libro', 110, 'menu_book', '4 páginas', /^libro/, 0.4], ['devo', 324, 'lightbulb', 'Cada mañana', /^devocional/, 0.7], ['cancion', 538, 'play_circle', 'Cada semana', /^cancion/, 0.25]]
              .map(([k, x, ic, tx, re, pct]) => {
                const base = circulo(`obj-b-${k}`, x, 260, 84, 'k-recurso-linea', 6);
                base.c.style.strokeDashoffset = '0';
                const av = circulo(`obj-a-${k}`, x, 260, 84, 'k-recurso-linea k-oro', 8);
                const ico = H.ancla(dia, `obj-i-${k}`, x, 260, H.icono(ic, 64));
                const r = H.ancla(dia, `obj-r-${k}`, x, 386, tx, 'rot');
                return { k, x, re, pct, base, av, ico, r };
              });
            const t0 = T.pulso(f0.inicio);
            H.pop(tl, planes.map((p) => p.ico), t0, { stagger: 0.25 });
            tl.fromTo(planes.map((p) => p.base.c), { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.25 }, t0);
            planes.forEach((p) => {
              const t = T.pulso(H.palabra(f1, p.re).inicio - 0.2);
              H.entra(tl, p.r, t, { dy: 16 });
              H.late(tl, p.ico, t, { de: 1.3 });
            });
            const tAn = T.pulso(H.clave(f2).inicio - 0.2);
            planes.forEach((p, i) => tl.to(p.av.c, { strokeDashoffset: p.av.L * (1 - p.pct), duration: 0.9, ease: 'power2.out' }, tAn + i * 0.15));
            const rec = H.chip(dia, 'obj-rec', 324, 540, `${H.icono('notifications', 34, true)}Recordatorio en su celular`);
            H.entra(tl, rec, T.pulso(H.palabra(f2, /^recordat/).inicio - 0.2), { dy: 22 });
            
            // B · f3: un solo plan; «Lo hice» avanza el anillo y el paso; «Aplazar» corre todo el plan a la próxima fecha.
            const t3 = T.pulso(f3.inicio - 0.3);
            H.sale(tl, [rec, ...planes.slice(1).map((p) => p.ico), ...planes.map((p) => p.r)], t3, { stagger: 0.03 });
            tl.to(planes.slice(1).flatMap((p) => [p.base.c, p.av.c]), { opacity: 0, duration: 0.3 }, t3);
            const uno = circulo('obj-uno-b', 324, 280, 140, 'k-recurso-linea', 6);
            uno.c.style.strokeDashoffset = '0';
            const unoA = circulo('obj-uno-a', 324, 280, 140, 'k-recurso-linea k-oro', 10);
            tl.to([planes[0].base.c, planes[0].av.c], { opacity: 0, duration: 0.3 }, t3);
            tl.to(planes[0].ico, { x: 214, y: 20, scale: 1.5, duration: 0.7, ease: 'power3.inOut' }, t3);
            tl.fromTo(uno.c, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t3 + 0.3);
            tl.fromTo(unoA.c, { strokeDashoffset: unoA.L + 14 }, { strokeDashoffset: unoA.L * 0.625, duration: 0.6, ease: 'power2.out' }, t3 + 0.3);
            const pasos = Array.from({ length: 8 }, (_, i) => H.el('span', `obj-paso${i < 3 ? ' hecho' : ''}`, dia, `obj-p-${i}`, { left: `${100 + i * 64}px`, top: '520px' }));
            H.pop(tl, pasos, t3 + 0.4, { stagger: 0.05 });
            const loHice = H.chip(dia, 'obj-hice', 210, 640, `${H.icono('check_circle', 34, true)}Lo hice`, 'oro');
            const aplazar = H.chip(dia, 'obj-aplazar', 450, 640, `${H.icono('schedule', 34)}Aplazar`);
            const tHice = T.pulso(H.palabra(f3, /^hice/).inicio - 0.3);
            H.pop(tl, loHice, tHice - 0.3);
            H.late(tl, loHice, tHice + 0.2, { de: 0.88, d: 0.35 });
            tl.to(pasos[3], { backgroundColor: '#e8b95a', duration: 0.3 }, tHice + 0.3);
            H.late(tl, pasos[3], tHice + 0.3, { de: 1.6 });
            tl.to(unoA.c, { strokeDashoffset: unoA.L * 0.5, duration: 0.6, ease: 'power2.out' }, tHice + 0.3);
            const tApl = T.pulso(H.clave(f3).inicio - 0.3);
            H.pop(tl, aplazar, tApl - 0.3);
            H.late(tl, aplazar, tApl + 0.2, { de: 0.88, d: 0.35 });
            tl.to(pasos.slice(4), { x: 64, duration: 0.7, ease: 'power3.inOut', stagger: 0.04 }, tApl + 0.4);
            tl.to(pasos[7], { opacity: 0.35, duration: 0.4 }, tApl + 0.8);
            
            // C · f4–f6: sus pasos para conectarse: pone su dirección, ve los tres grupos más cercanos por franjas, sin direcciones.
            const t4 = T.pulso(f4.inicio - 0.3);
            H.sale(tl, [loHice, aplazar, ...pasos, planes[0].ico], t4, { stagger: 0.02 });
            tl.to([uno.c, unoA.c], { opacity: 0, duration: 0.3 }, t4);
            const C = { x: 324, y: 420 };
            const casa = H.nodo(dia, 'obj-casa', C.x, C.y, 'home', true, 140);
            const casaR = H.ancla(dia, 'obj-casa-r', C.x, C.y + 110, 'Ir a una casa de paz', 'rot oro');
            H.pop(tl, casa, t4 + 0.3);
            H.entra(tl, casaR, t4 + 0.5, { dy: 14 });
            const t5 = T.pulso(f5.inicio - 0.3);
            const conectar = H.chip(dia, 'obj-con', C.x, 90, `${H.icono('person_pin_circle', 34, true)}Conectarme`, 'oro');
            tl.to(casa, { scale: 0.32, duration: 0.6, ease: 'power3.inOut' }, t5);
            tl.to(casaR, { opacity: 0, duration: 0.3 }, t5);
            H.pop(tl, conectar, t5 + 0.2);
            const pin = H.ancla(dia, 'obj-pin', C.x, C.y - 30, H.icono('location_on', 64, true));
            const franjas = [110, 200, 290].map((r, i) => { const c = circulo(`obj-f-${i}`, C.x, C.y, r, 'k-recurso-linea', 2); return c; });
            const tDir = T.pulso(H.palabra(f5, /^direccion/).inicio - 0.3);
            H.pop(tl, pin, tDir);
            franjas.forEach((f, i) => tl.to(f.c, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, tDir + 0.3 + i * 0.2));
            const grupos = [[C.x + 110, C.y - 120, 'A menos de 2 km'], [C.x - 168, C.y + 92, 'De 2 a 5 km'], [C.x + 196, C.y + 190, 'De 5 a 10 km']]
              .map(([x, y, tx], i) => ({ n: H.nodo(dia, `obj-g-${i}`, x, y, 'groups', false, 84), r: H.ancla(dia, `obj-g-${i}-r`, x, y + (i === 0 ? -68 : 68), tx, 'rot'), x, y }));
            const tCer = T.pulso(H.clave(f5).inicio - 0.3);
            grupos.forEach((g, i) => { H.pop(tl, g.n, tCer + i * 0.5); H.entra(tl, g.r, tCer + i * 0.5 + 0.15, { dy: 12 }); });
            const sinDir = H.chip(dia, 'obj-sindir', C.x, 760, `${H.icono('visibility', 34)}Sin la dirección de nadie`);
            H.entra(tl, sinDir, tCer + 1.5, { dy: 18 });
            
            // f6 · «Quiero asistir» en el más cercano; quienes lo lideran le escriben.
            const t6 = T.pulso(f6.inicio - 0.3);
            H.sale(tl, [grupos[1].n, grupos[1].r, grupos[2].n, grupos[2].r, casa], t6, { stagger: 0.03 });
            tl.to(franjas.map((f) => f.c), { opacity: 0.3, duration: 0.4 }, t6);
            const asistir = H.chip(dia, 'obj-asistir', grupos[0].x, grupos[0].y - 90, `${H.icono('how_to_reg', 34, true)}Quiero asistir`, 'oro');
            H.pop(tl, asistir, t6 + 0.3);
            const tEsc = T.pulso(H.clave(f6).inicio - 0.3);
            const lid = [[grupos[0].x + 70, grupos[0].y + 10], [grupos[0].x + 40, grupos[0].y + 64]].map(([x, y], i) => H.punto(dia, `obj-lid-${i}`, x, y, 'k-azul', 24));
            H.pop(tl, lid, tEsc - 0.5, { stagger: 0.1 });
            const charla = H.ancla(dia, 'obj-charla', grupos[0].x, grupos[0].y, H.icono('chat', 48, true));
            tl.fromTo(charla, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3 }, tEsc);
            tl.to(charla, { x: C.x - grupos[0].x, y: C.y - 30 - grupos[0].y - 60, duration: 0.8, ease: 'power2.inOut' }, tEsc + 0.2);
            H.late(tl, pin, tEsc + 1, { de: 1.3 });
            
            H.sale(tl, ['#obj-dia', '#obj-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['objetivos'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
