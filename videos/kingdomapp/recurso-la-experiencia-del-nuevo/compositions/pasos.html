      <div id="root" data-composition-id="pasos" data-width="1920" data-height="1080" data-duration="32.5">

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const dia = document.getElementById('pasos-dia');
            const svg = document.getElementById('pasos-svg');
            const bs = H.bloques(T, document.getElementById('pasos-col'), 'pasos', ['Su *bienvenida*: los primeros pasos', 'Pantallas cortas, *a su ritmo*',
              'Aprender a *orar*, un libro, una playlist', 'Una *comunidad*, sus datos, los avisos', '¿Te acompañamos con un *plan*?', 'Con un sí, empieza su *plan*',
              'Y al terminar, *celebra*']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#pasos-ceja', 0.1, { dy: 16 });
            
            // El camino de los primeros pasos: dos filas de tres, en serpentina.
            const Y1 = 160, Y2 = 470;
            const camino = H.camino(svg, 'pasos-camino', `M110 ${Y1} L538 ${Y1} C 660 ${Y1} 660 ${Y2} 538 ${Y2} L110 ${Y2}`);
            const defs = [[110, Y1, 'school', 'Cómo orar'], [324, Y1, 'menu_book', 'Un libro'], [538, Y1, 'play_circle', 'Una playlist'],
              [538, Y2, 'groups', 'Comunidad'], [324, Y2, 'edit_note', 'Cuéntanos de ti'], [110, Y2, 'notifications', 'Avisos']];
            const nodos = defs.map(([x, y, ic, tx], i) => ({ x, y, n: H.nodo(dia, `pasos-n-${i}`, x, y, ic, false, 112), r: H.ancla(dia, `pasos-r-${i}`, x, y + 94, tx, 'rot') }));
            // u (0–1) de cada nodo sobre el camino, para que el punto lo recorra por la curva.
            const muestras = Array.from({ length: 401 }, (_, k) => camino.punto(k / 400));
            const uDe = (x, y) => { let b = 0, bd = 1e9; muestras.forEach((p, k) => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; b = k; } }); return b / 400; };
            nodos.forEach((n) => (n.u = uDe(n.x, n.y)));
            const yo = H.punto(dia, 'pasos-yo', 110, Y1, 'k-oro', 30);
            const pos = { u: 0 };
            const ubicar = () => { const p = camino.punto(pos.u); gsap.set(yo, { x: p.x - 110, y: p.y - Y1 }); };
            const ir = (u, t, d) => tl.to(pos, { u, duration: d || 0.8, ease: 'power2.inOut', onUpdate: ubicar }, t);
            const visitar = (i, t) => {
              ir(nodos[i].u, t - 0.5, 0.6);
              tl.to(`#pasos-n-${i}-n`, { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, t);
              H.late(tl, nodos[i].n, t, { de: 1.18 });
              tl.to(nodos[i].r.firstChild, { color: '#e8b95a', duration: 0.3 }, t);
            };
            
            // f0 · el camino se dibuja y los pasos aparecen uno a uno; ella llega al inicio.
            const t0 = T.pulso(f0.inicio);
            H.dibujar(tl, camino.p, t0, 2.2);
            const ent = T.reparto(6, t0 + 0.2, t0 + 2.4);
            nodos.forEach((n, i) => { H.pop(tl, n.n, ent[i]); H.entra(tl, n.r, ent[i] + 0.15, { dy: 14 }); });
            H.pop(tl, yo, t0 + 0.5);
            
            // f1 · «pantallas cortas, a su ritmo»: «Siguiente» se toca tres veces, en pulsos.
            const sig = H.chip(dia, 'pasos-sig', 324, 690, `Siguiente${H.icono('arrow_forward', 34)}`, 'oro');
            const t1 = T.pulso(f1.inicio);
            H.entra(tl, sig, t1, { dy: 20 });
            [1, 2, 3].forEach((k) => H.late(tl, sig, t1 + k, { de: 0.9, d: 0.35 }));
            H.sale(tl, sig, T.pulso(f2.inicio) - 0.4);
            
            // f2–f3 · recorre los pasos: orar, un libro, una playlist; su comunidad, sus datos, los avisos.
            visitar(0, T.pulso(H.palabra(f2, /^orar/).inicio - 0.1));
            visitar(1, T.pulso(H.palabra(f2, /^libro/).inicio - 0.1));
            visitar(2, T.pulso(H.palabra(f2, /^playlist/).inicio - 0.1));
            visitar(3, T.pulso(H.palabra(f3, /^comunidad/).inicio - 0.1));
            visitar(4, T.pulso(H.palabra(f3, /^contar/).inicio - 0.1));
            visitar(5, T.pulso(H.palabra(f3, /^notificac/).inicio - 0.1));
            
            // f4–f5 · la pregunta; «Sí, quiero» y el plan empieza con su recordatorio.
            const t4 = T.pulso(f4.inicio - 0.3);
            tl.to([camino.p, ...nodos.map((n) => n.n), ...nodos.map((n) => n.r), yo], { opacity: 0.18, duration: 0.5 }, t4);
            const preg = H.ancla(dia, 'pasos-preg', 324, 330,
              `<div class="k-recurso-tarjeta pasos-preg"><div class="k-recurso-frase">¿Quieres que te acompañemos con un <em>plan de lectura</em>?</div>` +
              `<div class="fila"><span class="chip oro" id="pasos-si">Sí, quiero</span><span class="chip" id="pasos-no">Ahora no</span></div></div>`);
            H.entra(tl, preg, t4 + 0.3, { dy: 36, d: 0.6 });
            const tSi = T.pulso(H.palabra(f5, /^si/).inicio - 0.2);
            H.late(tl, '#pasos-si', tSi, { de: 0.88, d: 0.4 });
            tl.to(preg, { scale: 0.2, opacity: 0, duration: 0.5, ease: 'power2.in' }, tSi + 0.5);
            const plan = H.nodo(dia, 'pasos-plan', 324, 330, 'menu_book', true, 150);
            const planR = H.chip(dia, 'pasos-plan-r', 324, 480, `${H.icono('schedule', 34)}Con recordatorios`);
            H.pop(tl, plan, tSi + 0.9);
            H.entra(tl, planR, T.pulso(H.palabra(f5, /^recordat/).inicio - 0.2), { dy: 18 });
            
            // f6 · al terminar, lo celebra: el camino se vuelve dorado, los pasos laten en fila y aparece la celebración.
            const t7 = T.pulso(f6.inicio - 0.3);
            H.sale(tl, [plan, planR], t7, { stagger: 0.05 });
            tl.to([camino.p, ...nodos.map((n) => n.n), ...nodos.map((n) => n.r), yo], { opacity: 1, duration: 0.5 }, t7 + 0.2);
            tl.to(camino.p, { stroke: '#e8b95a', duration: 0.6 }, t7 + 0.4);
            ir(1, t7 + 0.3, 1.0);
            const tCel = T.pulso(H.clave(f6).inicio - 0.2);
            nodos.forEach((n, i) => H.late(tl, n.n, tCel + i * 0.1, { de: 1.2 }));
            const cel = H.nodo(dia, 'pasos-cel', 324, 315, 'celebration', true, 150);
            H.pop(tl, cel, tCel);
            
            H.sale(tl, ['#pasos-dia', '#pasos-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['pasos'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
