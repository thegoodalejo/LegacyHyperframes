      <script>
        (function () {

          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';

            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);

            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;

            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));

            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5, f6] = T.frases;
            const dia = document.getElementById('qr-dia');

            H.animarBloques(tl, T, bs);
            H.entra(tl, '#qr-ceja', 0.1, { dy: 16 });
            
            // A · El QR de bienvenida: una rejilla de 13 × 13 con tres esquinas de posición (semilla fija).
            const cod = document.getElementById('qr-codigo');
            const az = H.azar(73);
            const esquina = (i, j, a, b) => { const di = i - a, dj = j - b; if (di < 0 || dj < 0 || di > 4 || dj > 4) return null; const m = Math.max(Math.abs(di - 2), Math.abs(dj - 2)); return m === 2 || m === 0; };
            const celdas = [];
            for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
              let on = esquina(i, j, 0, 0) ?? esquina(i, j, 0, 8) ?? esquina(i, j, 8, 0);
              const borde = (i === 5 && j < 6) || (j === 5 && i < 6) || (i === 5 && j > 6) || (j === 7 && i < 6) || (j === 5 && i > 6) || (i === 7 && j < 6);
              if (on === null) on = borde ? false : az() > 0.48;
              if (!on) continue;
              const fin = esquina(i, j, 0, 0) !== null || esquina(i, j, 0, 8) !== null || esquina(i, j, 8, 0) !== null;
              const c = H.el('span', `qr-celda${fin ? ' oro' : ''}`, cod, `qr-c-${i}-${j}`, { left: `${155 + j * 26}px`, top: `${171 + i * 26}px` });
              celdas.push({ c, d: Math.hypot(i - 6, j - 6) });
            }
            celdas.sort((a, b) => a.d - b.d);
            const tQr = T.pulso(H.clave(f0).inicio - 0.2);
            H.entra(tl, '#qr-marco', tQr - 0.3, { dy: 0 });
            celdas.forEach(({ c, d }) => tl.fromTo(c, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, tQr + d * 0.12));
            H.late(tl, '#qr-codigo', T.pulso(f0.fin), { de: 1.04 });
            
            // f1 · impreso o en el altar.
            const cImp = H.chip(dia, 'qr-imp', 190, 620, `${H.icono('assignment', 34)}Impreso`);
            const cAlt = H.chip(dia, 'qr-alt', 458, 620, `${H.icono('volunteer_activism', 34)}En el altar`);
            H.pop(tl, cImp, T.pulso(H.palabra(f1, /^imprim/).inicio - 0.1));
            H.pop(tl, cAlt, T.pulso(H.palabra(f1, /^proyect/).inicio - 0.1));
            
            // f2 · la escanea: el barrido pasa dos veces; el QR se recoge y aparece el logo de su iglesia.
            const tEsc = T.pulso(H.palabra(f2, /^escanea/).inicio - 0.2);
            tl.fromTo('#qr-barrido', { y: 0, opacity: 0 }, { y: 0, opacity: 1, duration: 0.15 }, tEsc);
            tl.fromTo('#qr-barrido', { y: 0 }, { y: 368, duration: 0.9, ease: 'power1.inOut', immediateRender: false }, tEsc);
            tl.to('#qr-barrido', { y: 0, duration: 0.9, ease: 'power1.inOut' }, tEsc + 0.9);
            tl.to('#qr-barrido', { opacity: 0, duration: 0.2 }, tEsc + 1.8);
            const tLogo = T.pulso(H.palabra(f2, /^logo/).inicio - 0.4);
            H.sale(tl, [cImp, cAlt], tLogo - 0.4, { stagger: 0.05 });
            tl.to(['#qr-codigo', '#qr-marco'], { scale: 0.3, opacity: 0, duration: 0.5, ease: 'power2.in' }, tLogo);
            const iglesia = H.nodo(dia, 'qr-iglesia', 324, 340, 'church', true, 180);
            const iglesiaR = H.ancla(dia, 'qr-iglesia-r', 324, 482, 'Su iglesia', 'rot oro');
            H.pop(tl, iglesia, tLogo + 0.3);
            H.entra(tl, iglesiaR, tLogo + 0.5);
            
            // B · f3–f4: la iglesia sube; entra con Google y sus tres datos; «Unirme».
            const t3 = T.pulso(f3.inicio - 0.3);
            tl.to(iglesia, { y: -230, scale: 0.6, duration: 0.7, ease: 'power3.inOut' }, t3);
            tl.to(iglesiaR, { y: -312, opacity: 0, duration: 0.5, ease: 'power3.inOut' }, t3);
            const pasos = [
              ['google', 'person', 'Continuar con Google', H.clave(f3).inicio],
              ['nombre', 'badge', 'Nombre', H.palabra(f4, /^nombre/).inicio],
              ['tel', 'chat', 'Teléfono', H.palabra(f4, /^telefono/).inicio],
              ['genero', 'diversity_1', 'Género', H.palabra(f4, /^genero/).inicio],
            ].map(([k, ic, tx, t], i) => ({ a: H.chip(dia, `qr-${k}`, 324, 270 + i * 96, `${H.icono(ic, 34)}${tx}`), t: T.pulso(t - 0.25) }));
            pasos.forEach(({ a, t }) => H.entra(tl, a, t, { dy: 24 }));
            const unirme = H.chip(dia, 'qr-unirme', 324, 670, `${H.icono('how_to_reg', 34)}Unirme`, 'oro');
            const tUnir = T.pulso(H.clave(f4).inicio - 0.2);
            H.pop(tl, unirme, tUnir);
            H.late(tl, unirme, tUnir + 0.5, { de: 0.9, d: 0.35 });
            
            // C · f5: todo se recoge en ella (el punto dorado); el anillo del minuto se cierra y queda «Miembro», sin esperar aprobación.
            const t5 = T.pulso(f5.inicio - 0.3);
            const yo = H.punto(dia, 'qr-yo', 324, 380, 'k-oro', 34);
            H.sale(tl, [...pasos.map((p) => p.a), unirme], t5, { stagger: 0.04, dy: 0 });
            tl.to(iglesia, { opacity: 0, scale: 0.4, duration: 0.4, ease: 'power2.in' }, t5);
            H.pop(tl, yo, t5 + 0.4);
            const R = 150, CIRC = 2 * Math.PI * R;
            const anillo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            Object.entries({ cx: 324, cy: 380, r: R, class: 'k-recurso-linea k-oro', id: 'qr-anillo', transform: 'rotate(-90 324 380)' }).forEach(([k, v]) => anillo.setAttribute(k, v));
            anillo.style.strokeDasharray = `${CIRC} ${CIRC + 40}`;
            anillo.style.strokeDashoffset = `${CIRC + 14}`;
            anillo.style.strokeWidth = '6';
            svg.appendChild(anillo);
            const base = anillo.cloneNode();
            base.setAttribute('id', 'qr-anillo-base');
            base.setAttribute('class', 'k-recurso-linea');
            base.style.strokeDashoffset = '0';
            svg.insertBefore(base, anillo);
            tl.fromTo(base, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t5 + 0.3);
            const tMin = T.pulso(H.palabra(f5, /^minuto/).inicio - 0.3);
            tl.to(anillo, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, tMin);
            const minuto = H.ancla(dia, 'qr-minuto', 324, 380, '1<small>min</small>', 'qr-min');
            tl.to(yo, { scale: 0, opacity: 0, duration: 0.3, ease: 'power2.in' }, tMin + 0.2);
            H.pop(tl, minuto, tMin + 0.4);
            const miembro = H.chip(dia, 'qr-miembro', 324, 600, `${H.icono('how_to_reg', 34)}Miembro`, 'oro');
            const sinEsp = H.chip(dia, 'qr-sinesp', 324, 690, `${H.icono('check_circle', 34)}Sin esperar aprobación`);
            const tMiembro = T.pulso(H.clave(f5).inicio - 0.2);
            H.pop(tl, miembro, tMiembro);
            H.entra(tl, sinEsp, T.pulso(H.palabra(f5, /^esperar/).inicio - 0.2), { dy: 20 });
            
            // D · f6: si ya tenía su ficha con ese correo, Kingdom la reconoce: el correo y la ficha se unen con un check.
            const t6 = T.pulso(f6.inicio - 0.3);
            H.sale(tl, [minuto, miembro, sinEsp], t6, { stagger: 0.04 });
            tl.to(['#qr-anillo', '#qr-anillo-base'], { opacity: 0, duration: 0.35, ease: 'power2.in' }, t6);
            const correo = H.chip(dia, 'qr-correo', 324, 250, `${H.icono('mail', 34)}El mismo correo`);
            const ficha = H.ancla(dia, 'qr-ficha', 324, 520,
              `<div class="k-recurso-tarjeta qr-ficha"><div class="fila">${H.icono('badge', 56, true)}<span class="k-recurso-etiqueta">Su ficha en la iglesia</span></div>` +
              `<div class="fila">${H.icono('verified', 44, true)}<span class="rot oro">Reconocida</span></div></div>`);
            const lazo = H.linea(svg, 'qr-lazo', 324, 290, 324, 430, true);
            H.entra(tl, correo, t6 + 0.4);
            H.entra(tl, ficha, T.pulso(H.palabra(f6, /^ficha/).inicio - 0.2));
            H.dibujar(tl, lazo, T.pulso(H.clave(f6).inicio - 0.3), 0.4);
            H.late(tl, ficha, T.pulso(H.clave(f6).inicio) + 0.5, { de: 1.06 });
            
            H.sale(tl, ['#qr-dia', '#qr-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['qr'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
