  <body>
    <template>
      <style>

      <div id="root" data-composition-id="historia" data-width="1920" data-height="1080" data-duration="28">
        <div class="k-recurso-ceja ceja-e" id="his-ceja">Mi iglesia · Su historia</div>
        <div class="col" id="his-col"></div>
        <div class="dia" id="his-dia" data-layout-allow-overflow data-layout-allow-overlap>
          <svg class="svg" id="his-svg" viewBox="0 0 648 800"></svg>
        </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window); // al empezar el script: «window» es el de esta escena
          // ── H: piezas comunes de las escenas de este recurso (texto cinético con la voz, anclas, nodos, puntos, líneas, entradas) ──
          const H = (() => {
            const NS = 'http://www.w3.org/2000/svg';
            const r3 = (n) => Math.round(n * 1000) / 1000;
            // «texto con *énfasis*» → [{ texto, clave }]
            const partir = (s) => {
              const out = [];
              let on = false;
              for (const w of String(s).split(/\s+/)) {
                if (!w) continue;
                let t = '', c = false;
                for (const ch of w) {
                  if (ch === '*') { on = !on; continue; }
                  t += ch;
                  if (on) c = true;
                }
                out.push({ texto: t, clave: c });
              }
              return out;
            };
            const el = (tag, cls, padre, id, css) => {
              const d = document.createElement(tag);
              if (cls) d.className = cls;
              if (id) d.id = id;
              if (css) Object.assign(d.style, css);
              padre.appendChild(d);
              return d;
            };
            const icono = (n, tam, oro) =>
              `<span class="ico${oro ? ' ico-oro' : ''}" style="--k-icono:url(identidad/iconos/${n}.svg);--k-icono-tam:${tam || 56}px"></span>`;
            // Un ancla es un punto (0×0) en x, y: se anima el ancla (escala desde su centro) y su contenido queda centrado encima.
            const ancla = (padre, id, x, y, html, cls) => {
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const c = el('div', `centro ${cls || ''}`, a);
              c.innerHTML = html;
              return a;
            };
            const chip = (padre, id, x, y, html, cls) => ancla(padre, id, x, y, html, `chip ${cls || ''}`);
            const nodo = (padre, id, x, y, ic, oro, tam) => {
              const t = tam || 120;
              const a = el('div', 'ancla', padre, id, { left: `${x}px`, top: `${y}px` });
              const n = el('div', `k-recurso-nodo${oro ? ' k-oro' : ''}`, a, `${id}-n`, { left: '0px', top: '0px', width: `${t}px`, height: `${t}px`, margin: `-${t / 2}px 0 0 -${t / 2}px` });
              n.innerHTML = icono(ic, Math.round(t * 0.46));
              return a;
            };
            const punto = (padre, id, x, y, cls, tam) => {
              const d = el('span', `k-recurso-punto ${cls || ''}`, padre, id, { left: `${x}px`, top: `${y}px` });
              if (tam) Object.assign(d.style, { width: `${tam}px`, height: `${tam}px`, margin: `-${tam / 2}px 0 0 -${tam / 2}px` });
              return d;
            };
            const linea = (svg, id, x1, y1, x2, y2, oro) => {
              const l = document.createElementNS(NS, 'line');
              l.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''}`);
              l.setAttribute('id', id);
              [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2]].forEach(([k, v]) => l.setAttribute(k, v));
              const L = Math.hypot(x2 - x1, y2 - y1) + 2;
              l.style.strokeDasharray = `${L} ${L + 40}`;
              l.style.strokeDashoffset = `${L + 14}`;
              svg.appendChild(l);
              return l;
            };
            const camino = (svg, id, d, oro, cls) => {
              const p = document.createElementNS(NS, 'path');
              p.setAttribute('class', `k-recurso-linea${oro ? ' k-oro' : ''} ${cls || ''}`);
              p.setAttribute('id', id);
              p.setAttribute('d', d);
              svg.appendChild(p);
              const L = p.getTotalLength() + 2;
              p.style.strokeDasharray = `${L} ${L + 40}`;
              p.style.strokeDashoffset = `${L + 14}`;
              return { p, L, punto: (u) => p.getPointAtLength(Math.max(0, Math.min(1, u)) * (L - 2)) };
            };
            const dibujar = (tl, l, t, d) => tl.to(l, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power2.inOut' }, t);
            // Entradas y salidas del frame: subir con desenfoque (power3.out) · escalas pequeñas con back.out · salir subiendo (power2.in).
            const entra = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, y: (o && o.dy) ?? 30, filter: 'blur(6px)' },
              { opacity: 1, y: 0, filter: 'blur(0px)', duration: (o && o.d) || 0.5, ease: 'power3.out', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const pop = (tl, s, t, o) => tl.fromTo(s, { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: (o && o.d) || 0.45, ease: 'back.out(2)', stagger: (o && o.stagger) || 0, immediateRender: !(o && o.otra) }, t);
            const sale = (tl, s, t, o) => tl.to(s, { opacity: 0, y: (o && o.dy) ?? -24, filter: 'blur(6px)', duration: (o && o.d) || 0.35, ease: 'power2.in', stagger: (o && o.stagger) || 0 }, t);
            const late = (tl, s, t, o) => tl.fromTo(s, { scale: (o && o.de) || 1.12 }, { scale: 1, duration: (o && o.d) || 0.45, ease: 'power2.out', immediateRender: false }, t);
            const halo = (tl, s, t) => tl.fromTo(s, { scale: 0.5, opacity: 0.9 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: 'power2.out', immediateRender: false }, t);
            // La palabra clave n de una frase (o la palabra que empieza con re).
            const clave = (f, n) => (f.palabras.filter((p) => p.clave)[n || 0] || f.palabras[0] || { inicio: f.inicio, fin: f.fin });
            const palabra = (f, re) => f.palabras.find((p) => re.test(p.texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^[^a-z0-9]+/, ''))) || { inicio: f.inicio, fin: f.fin };
            // Texto cinético: un bloque por frase en «cont». textos[i]: undefined = la frase tal cual (sus palabras con sus tiempos);
            // una cadena = un rótulo corto cuyas palabras entran repartidas sobre las de la frase; null = sin texto (sigue el anterior).
            const bloques = (T, cont, pref, textos, clase) => {
              textos = textos || [];
              return T.frases.map((f, i) => {
                const tx = textos[i];
                if (tx === null) return null;
                const b = el('div', 'bloque', cont, `${pref}-b-${i}`);
                const fr = el('div', clase || 'k-recurso-frase', b, `${pref}-f-${i}`);
                let ps;
                if (tx === undefined) {
                  ps = f.palabras.length ? f.palabras.map((p) => ({ texto: p.texto, clave: !!p.clave, inicio: p.inicio }))
                    : partir(f.texto).map((p, j, a) => ({ ...p, inicio: f.inicio + (j * (f.fin - f.inicio)) / a.length }));
                } else {
                  const ws = partir(tx);
                  const np = f.palabras.length;
                  ps = ws.map((w, j) => ({ ...w, inicio: np ? f.palabras[Math.min(np - 1, Math.floor((j * np) / ws.length))].inicio : f.inicio + (j * (f.fin - f.inicio)) / ws.length }));
                }
                const spans = ps.map((p, j) => {
                  const s = el('span', `k-recurso-palabra${p.clave ? ' k-recurso-clave' : ''}`, fr, `${pref}-p-${i}-${j}`);
                  s.textContent = p.texto;
                  return { s, inicio: p.inicio };
                });
                return { i, b, fr, spans };
              });
            };
            const animarBloques = (tl, T, bs, finUltimo) => {
              const vis = bs.filter(Boolean);
              vis.forEach((x, k) => {
                x.spans.forEach(({ s, inicio }) => tl.fromTo(s, { y: 28, opacity: 0, filter: 'blur(6px)' },
                  { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.4, ease: 'power3.out' }, Math.max(0, inicio - 0.08)));
                const sig = vis[k + 1];
                const t = sig ? T.frases[sig.i].inicio - 0.32 : (finUltimo ?? T.salida(0.6));
                tl.to(x.fr, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, t);
              });
            };
            // Semilla fija para posiciones «al azar» (siempre las mismas).
            const azar = (s) => () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
            return { r3, partir, el, icono, ancla, chip, nodo, punto, linea, camino, dibujar, entra, pop, sale, late, halo, clave, palabra, bloques, animarBloques, azar };
          })();

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3, f4, f5] = T.frases;
            const dia = document.getElementById('his-dia');
            const svg = document.getElementById('his-svg');
            const bs = H.bloques(T, document.getElementById('his-col'), 'his', [undefined, '«Contar mi *testimonio*»', 'Su iglesia lo *revisa*',
              '«Mis documentos»: firma con el *dedo*', '«Mi ficha»: sus *datos*, al día', 'Para *acompañarla* mejor']);
            H.animarBloques(tl, T, bs);
            H.entra(tl, '#his-ceja', 0.1, { dy: 16 });
            
            // A · f0–f2: su testimonio en tres etapas (antes, durante, después), con sus fotos, video o audio, y «Por revisar».
            const tit = H.chip(dia, 'his-tit', 324, 110, `${H.icono('edit_note', 34, true)}Contar mi testimonio`, 'oro');
            H.entra(tl, tit, T.pulso(f0.inicio + 0.3), { dy: 20 });
            const Y = 320;
            const linea = H.linea(svg, 'his-linea', 110, Y, 538, Y, true);
            const etapas = [['Antes', 110, /^antes/], ['Durante', 324, /^durante/], ['Después', 538, /^despues/]]
              .map(([tx, x, re], i) => ({ n: H.nodo(dia, `his-et-${i}`, x, Y, ['schedule', 'favorite', 'celebration'][i], i === 2, 116), r: H.ancla(dia, `his-et-${i}-r`, x, Y + 92, tx, 'rot'), re }));
            etapas.forEach((e, i) => {
              const t = T.pulso(H.palabra(f1, e.re).inicio - 0.3);
              H.pop(tl, e.n, t);
              H.entra(tl, e.r, t + 0.15, { dy: 12 });
              if (i) tl.to(linea, { strokeDashoffset: 430 * (1 - i / 2), duration: 0.5, ease: 'power2.inOut' }, t - 0.3);
            });
            const evid = [['Fotos', 'cloud', 150, /^fotos/], ['Video', 'play_circle', 324, /^video/], ['Audio', 'campaign', 498, /^audio/]]
              .map(([tx, ic, x, re], i) => ({ a: H.chip(dia, `his-ev-${i}`, x, 540, `${H.icono(ic, 34)}${tx}`), re }));
            const tVid = T.pulso(H.palabra(f2, /^video/).inicio - 0.3);
            evid.forEach((e, i) => H.pop(tl, e.a, i < 2 ? T.pulso(H.palabra(f2, e.re).inicio - 0.3) : tVid + 0.5));
            const rev = H.chip(dia, 'his-rev', 324, 660, `${H.icono('visibility', 34, true)}Por revisar`, 'oro');
            H.pop(tl, rev, T.pulso(H.clave(f2).inicio - 0.3));
            
            // B · f3: Mis documentos: el documento, la firma que se dibuja con el dedo y «Firma guardada».
            const t3 = T.pulso(f3.inicio - 0.3);
            H.sale(tl, [tit, ...etapas.map((e) => e.n), ...etapas.map((e) => e.r), ...evid.map((e) => e.a), rev], t3, { stagger: 0.02 });
            tl.to(linea, { opacity: 0, duration: 0.3 }, t3);
            const doc = H.ancla(dia, 'his-doc', 324, 360,
              `<div class="k-recurso-tarjeta his-doc"><div class="fila">${H.icono('assignment', 56, true)}<span class="k-recurso-etiqueta">Autorización de datos</span></div>` +
              `<div class="renglon" style="width:100%"></div><div class="renglon" style="width:92%"></div><div class="renglon" style="width:96%"></div><div class="renglon" style="width:70%"></div></div>`);
            H.entra(tl, doc, t3 + 0.3, { dy: 40, d: 0.6 });
            const firma = H.camino(svg, 'his-f', 'M150 470 C 175 400, 205 400, 200 470 S 240 520, 262 450 C 280 400, 300 480, 322 455 C 345 430, 360 470, 392 448 S 450 430, 488 462', true);
            H.dibujar(tl, firma.p, T.pulso(H.clave(f3).inicio - 0.5), 1.3);
            const guardada = H.chip(dia, 'his-guard', 324, 680, `${H.icono('check_circle', 34, true)}Firma guardada`, 'oro');
            H.pop(tl, guardada, T.pulso(H.palabra(f3, /^autorizacion/).inicio - 0.3));
            
            // C · f4: Mi ficha: ella misma corrige su celular, su dirección o su fecha de nacimiento; «¡Guardado!».
            const t4 = T.pulso(f4.inicio - 0.3);
            H.sale(tl, [doc, guardada], t4, { stagger: 0.05 });
            tl.to(firma.p, { opacity: 0, duration: 0.3 }, t4);
            const campos = [['chat', 'Su celular', /^celular/], ['location_on', 'Su dirección', /^direccion/], ['calendar_today', 'Su fecha de nacimiento', /^nacimiento/]];
            const ficha = H.ancla(dia, 'his-ficha', 324, 360,
              `<div class="k-recurso-tarjeta his-ficha"><div class="campo" style="background:none;padding:0">${H.icono('badge', 56, true)}<span class="rot oro">Mi ficha</span></div>` +
              campos.map(([ic, tx], i) => `<div class="campo" id="his-c-${i}">${H.icono(ic, 40)}<span class="k-recurso-etiqueta">${tx}</span></div>`).join('') + '</div>');
            H.entra(tl, ficha, t4 + 0.3, { dy: 40, d: 0.6 });
            campos.forEach(([, , re], i) => {
              const t = T.pulso(H.palabra(f4, re).inicio - 0.3);
              tl.to(`#his-c-${i}`, { backgroundColor: 'rgba(232, 185, 90, 0.16)', boxShadow: 'inset 0 0 0 2px #e8b95a', duration: 0.3 }, t);
              H.late(tl, `#his-c-${i}`, t, { de: 1.05 });
            });
            const ok = H.chip(dia, 'his-ok', 324, 680, `${H.icono('check_circle', 34, true)}¡Guardado!`, 'oro');
            H.pop(tl, ok, T.pulso(f4.fin - 0.2));
            
            // D · f5: su iglesia la conoce mejor: la ficha se une a quien la acompaña.
            const t5 = T.pulso(f5.inicio - 0.3);
            H.sale(tl, ok, t5);
            tl.to(ficha, { scale: 0.62, x: -96, y: -40, duration: 0.7, ease: 'power3.inOut' }, t5);
            const quien = H.nodo(dia, 'his-quien', 540, 320, 'person', false, 110);
            tl.set('#his-quien-n', { backgroundColor: '#3576da', color: '#eaf0ff' }, 0);
            const lazo = H.linea(svg, 'his-lazo', 400, 320, 484, 320, true);
            const quienR = H.ancla(dia, 'his-quien-r', 540, 410, 'Quien la acompaña', 'rot');
            H.pop(tl, quien, t5 + 0.5);
            H.entra(tl, quienR, t5 + 0.7, { dy: 12 });
            H.dibujar(tl, lazo, T.pulso(H.palabra(f5, /^acompan/).inicio - 0.4), 0.4);
            H.late(tl, quien, T.pulso(H.palabra(f5, /^acompan/).inicio), { de: 1.2 });
            
            H.sale(tl, ['#his-dia', '#his-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['historia'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
