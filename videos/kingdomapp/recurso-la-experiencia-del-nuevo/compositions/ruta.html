            const igl = H.nodo(dia, 'rut-igl', 470, 400, 'church', true, 170);
            const lazo0 = H.linea(svg, 'rut-l0', 172, 400, 380, 400, true);
            const t0 = T.pulso(f0.inicio);
            tl.fromTo(yo, { x: -220, opacity: 0 }, { x: 0, opacity: 1, duration: 1, ease: 'power3.out' }, t0);
            H.pop(tl, igl, T.pulso(H.palabra(f0, /^iglesia/).inicio - 0.3), { d: 0.55 });
            const tSabe = T.pulso(H.palabra(f0, /^sabe/).inicio - 0.3);
            H.dibujar(tl, lazo0, tSabe, 0.5);
            tl.set(halo, { x: 470, y: 400 }, tSabe);
            H.halo(tl, halo, tSabe + 0.5);
            
            // B · f1: su ficha se crea con la forma en que llegó.
            const t1 = T.pulso(f1.inicio - 0.3);
            H.sale(tl, [igl], t1);
            tl.to(lazo0, { opacity: 0, duration: 0.3 }, t1);
            tl.to(yo, { x: 324 - 150, y: 170 - 400, duration: 0.7, ease: 'power3.inOut' }, t1);
            const ficha = H.ancla(dia, 'rut-ficha', 324, 420,
              `<div class="k-recurso-tarjeta rut-ficha"><div class="fila">${H.icono('badge', 56, true)}<span class="k-recurso-etiqueta">Su ficha</span></div>` +
              `<div class="fila"><span class="rot">Forma de llegar</span></div><div class="chip oro" style="align-self:flex-start">${H.icono('volunteer_activism', 34, true)}Recibió a Jesús en el altar</div></div>`);
            H.entra(tl, ficha, t1 + 0.3, { dy: 40, d: 0.6 });
            H.late(tl, ficha, T.pulso(H.palabra(f1, /^recibio/).inicio), { de: 1.05 });
            
            // C · f2–f3: entra a la ruta y el reparto parejo: seis nuevos bajan, dos a cada quien acompaña (ella, al del centro).
            const t2 = T.pulso(f2.inicio - 0.3);
            H.sale(tl, ficha, t2);
            const nuevos = [90, 180, 270, 378, 468, 558].map((x, i) => (i === 2 ? null : H.punto(dia, `rut-n-${i}`, x, 170, '', 22)));
            const acom = [120, 324, 528].map((x, i) => ({ n: H.nodo(dia, `rut-a-${i}`, x, 560, 'person', false, 110), x, c: H.el('span', 'rut-cupo', dia, `rut-c-${i}`, { left: `${x}px`, top: '640px' }) }));
            acom.forEach((a, i) => { tl.set(`#rut-a-${i}-n`, { backgroundColor: '#3576da', color: '#eaf0ff' }, 0); a.barra = H.el('span', '', a.c, `rut-cb-${i}`); });
            tl.to(yo, { x: 270 - 150, y: 170 - 400, duration: 0.6, ease: 'power3.inOut' }, t2);
            const tRuta = T.pulso(H.clave(f2).inicio - 0.3);
            H.pop(tl, nuevos.filter(Boolean), tRuta, { stagger: 0.08 });
            const tAc = T.pulso(H.palabra(f2, /^acompana/).inicio - 0.3);
            acom.forEach((a, i) => { H.pop(tl, a.n, tAc + i * 0.15); tl.fromTo(a.c, { opacity: 0 }, { opacity: 1, duration: 0.3 }, tAc + i * 0.15); });
            // El reparto: a cada uno le tocan dos; su cupo se llena parejo.
            const destino = [[0, -26], [0, 26], [1, -26], [1, 26], [2, -26], [2, 26]];
            const tRep = T.pulso(H.palabra(f3, /^reparte/).inicio - 0.2);
            const quien = [0, 1, 2, 3, 4, 5].map((k) => (k === 2 ? yo : nuevos[k]));
            const xs = [90, 180, 270, 378, 468, 558];
            quien.forEach((d, k) => {
              const [a, dx] = destino[k];
              const base = d === yo ? { x: 150, y: 400 } : { x: xs[k], y: 170 };
              tl.to(d, { x: acom[a].x + dx - base.x, y: 470 - base.y, duration: 0.8, ease: 'power3.inOut' }, tRep + k * 0.2);
            });
            acom.forEach((a, i) => tl.fromTo(a.barra, { scaleX: 0 }, { scaleX: 0.66, duration: 0.6, ease: 'power2.out' }, tRep + 0.6 + i * 0.4));
            const parejo = H.chip(dia, 'rut-parejo', 324, 720, `${H.icono('diversity_3', 34, true)}Repartir de forma pareja`, 'oro');
            H.pop(tl, parejo, T.pulso(H.clave(f3).inicio - 0.3));
            
            // D · f4: «Mi seguimiento»: quien la acompaña la ve con su paso y su semáforo.
            const t4 = T.pulso(f4.inicio - 0.3);
            const otros = [...nuevos.filter(Boolean), acom[0].n, acom[2].n, ...acom.map((a) => a.c), parejo];
            H.sale(tl, otros, t4, { stagger: 0.02 });
            tl.to(acom[1].n, { x: -324 + 90, y: 110 - 560, scale: 0.7, duration: 0.7, ease: 'power3.inOut' }, t4);
            tl.to(yo, { opacity: 0, duration: 0.3 }, t4);
            const segR = H.ancla(dia, 'rut-seg-r', 160, 110, 'Mi seguimiento', 'rot oro izq');
            H.entra(tl, segR, t4 + 0.4, { dy: 12 });
            const filas = [['Llamada de bienvenida', '#26a69a', 'A tiempo', true], ['Llega a la iglesia', '#e8b95a', 'Por vencer', false], ['Una casa de paz', '#e57373', 'Vencido', false]]
              .map(([paso, color, estado, ella], i) => H.ancla(dia, `rut-f-${i}`, 324, 250 + i * 128,
                `<div class="k-recurso-tarjeta rut-fila"><span class="k-recurso-punto ${ella ? 'k-oro' : 'k-tenue'}" style="position:relative;margin:0;left:0;top:0${ella ? ';width:28px;height:28px' : ''}"></span>` +
                `<span class="k-recurso-etiqueta">${paso}</span><span class="rut-sem" style="background:${color}"></span><span class="rot">${estado}</span></div>`));
            H.entra(tl, filas, T.pulso(H.clave(f4).inicio), { stagger: 0.2, dy: 30 });
            H.late(tl, filas[0], T.pulso(H.palabra(f4, /^vence/).inicio - 0.2), { de: 1.05 });
            
            // E · f5: la llama; «Marcar cumplido»; Kingdom propone el siguiente paso.
            const t5 = T.pulso(f5.inicio - 0.3);
            H.sale(tl, [filas[1], filas[2]], t5, { stagger: 0.05 });
            const llama = H.chip(dia, 'rut-llama', 324, 420, `${H.icono('support_agent', 34)}La llama`);
            const cumplido = H.chip(dia, 'rut-cumplido', 324, 520, `${H.icono('check_circle', 34, true)}Marcar cumplido`, 'oro');
            H.pop(tl, llama, t5 + 0.3);
            const tCum = T.pulso(H.palabra(f5, /^cumplida/).inicio - 0.2);
            H.pop(tl, cumplido, tCum);
            H.late(tl, cumplido, tCum + 0.5, { de: 0.88, d: 0.35 });
            const ahora = H.chip(dia, 'rut-ahora', 324, 640, `${H.icono('arrow_forward', 34, true)}Ahora va en: Llega a la iglesia`);
            H.entra(tl, ahora, T.pulso(H.palabra(f5, /^propone/).inicio - 0.4), { dy: 18 });
            
            // F · f6: su ruta, paso a paso (de arriba abajo); un paso cumplido le da un logro: su bautizo.
            const t6 = T.pulso(f6.inicio - 0.5);
            H.sale(tl, [filas[0], llama, cumplido, ahora, segR, acom[1].n], t6, { stagger: 0.03 });
            const RX = 130;
            const pasos = [['Llamada de bienvenida', 'support_agent', 150], ['Llega a la iglesia', 'church', 300, /^llegar/], ['Una casa de paz', 'home', 450, /^casa/], ['Un curso', 'school', 600, /^curso/]];
            const camino = H.camino(svg, 'rut-camino', `M${RX} 150 L${RX} 600`);
            const nodosR = pasos.map(([tx, ic, y], i) => ({ n: H.nodo(dia, `rut-p-${i}`, RX, y, ic, i === 0, 100), r: H.ancla(dia, `rut-p-${i}-r`, RX + 80, y, tx, 'rot izq'), y }));
            H.dibujar(tl, camino.p, t6 + 0.2, 1.2);
            H.pop(tl, nodosR[0].n, t6 + 0.2);
            H.entra(tl, nodosR[0].r, t6 + 0.3, { dy: 10 });
            const yo2 = H.punto(dia, 'rut-yo2', RX, 150, 'k-oro', 28);
            H.pop(tl, yo2, t6 + 0.3);
            pasos.slice(1).forEach(([, , y, re], k) => {
              const t = T.pulso(H.palabra(f6, re).inicio - 0.3);
              const i = k + 1;
              H.pop(tl, nodosR[i].n, t);
              H.entra(tl, nodosR[i].r, t + 0.1, { dy: 10 });
              tl.to(yo2, { y: y - 150, duration: 0.6, ease: 'power3.inOut' }, t + 0.2);
              tl.to(`#rut-p-${i - 1}-n`, { boxShadow: 'inset 0 0 0 3px #e8b95a', color: '#e8b95a', duration: 0.3 }, t + 0.2);
            });
            const logro = H.nodo(dia, 'rut-logro', 520, 300, 'workspace_premium', true, 150);
            const logroR = H.ancla(dia, 'rut-logro-r', 520, 410, 'Logro: su bautizo', 'rot oro');
            const tLog = T.pulso(H.clave(f6).inicio - 0.3);
            H.pop(tl, logro, tLog, { d: 0.55 });
            H.entra(tl, logroR, T.pulso(H.palabra(f6, /^bautizo/).inicio - 0.3), { dy: 12 });
            tl.set(halo, { x: 520, y: 300 }, tLog);
            H.halo(tl, halo, tLog + 0.4);
            
            H.sale(tl, ['#rut-dia', '#rut-ceja'], T.salida(0.6), { d: 0.5 });
            tl.set({}, {}, T.duracion);
            window.__timelines['ruta'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
