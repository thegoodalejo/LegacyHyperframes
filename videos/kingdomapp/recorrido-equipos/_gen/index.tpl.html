    <script>
      // ── Un solo lugar para el formato (SPEC §1.4) ──────────────────────────────────────────────────────────────────────
      window.KD = {
        fps: 30,
        cel: { w: 720, h: 900, hVis: 900 }, // --f-k = 720/1170; --f-grab-alto = 1558.15px
        esc: { w: 1440, h: 760, hVis: 760 }, // K = 1440/1920 = 0,75; alto de la grabación ajustada = 810
        grabCel: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // celular 390×844 a 3×
        grabEsc: { w: 1920, h: 1080, cssW: 1280 }, // escritorio 1280×720 a 1,5×
        latigoV: 1000, // --f-latigo
        latigoH: 1920, // la tira horizontal entre escenarios
        cambio: { escala: 0.92, x: 24, origen: '100% 50%' }, // la ventana del celular se hace a un lado (2524–2538)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos

        // Una ventana: W (ancho), HV (alto visible), K (px del video → px de la ventana), PPC (px de la ventana por px CSS de la app) y VH (alto
        // de la grabación ajustada). enc(s, cx, cy): la caja con centro (cx, cy) en px CSS de la app, centrada en lo visible con la escala s, sin
        // salirse de la grabación.
        function ventana(v, g) {
          const W = v.w, HV = v.hVis, K = W / g.w, PPC = W / g.cssW, VH = g.h * K;
          const enc = (s, cx, cy) => {
            let x = W / 2 - s * cx * PPC, y = HV / 2 - s * cy * PPC;
            x = Math.min(0, Math.max(W - s * W, x));
            y = Math.min(0, Math.max(HV - s * VH, y));
            return { scale: s, x, y };
          };
          const enVentana = (e, vx, vy) => ({ x: e.x + e.scale * vx * K, y: e.y + e.scale * vy * K });
          return { W, HV, K, PPC, VH, enc, enVentana };
        }
        const CEL = ventana(KD.cel, KD.grabCel);
        const ESC = ventana(KD.esc, KD.grabEsc);
        const enc = CEL.enc, encE = ESC.enc;

        // Los encuadres, medidos sobre los cuadros reales (px CSS: 390×844 el celular, 1280×720 el escritorio). Niveles de SPEC §1.5; REVIEW §4.
        const E = {
          // ── Parte 1: los del clip con s' = max(s, 1,085) (SPEC §2.1) ──
          semana: enc(1.4, 155.5, 490),
          porCubrir: enc(1.8, 125, 450),
          turnoCabeza: enc(1.15, 176, 245),
          parqueadero1: enc(1.085, 195, 440),
          sugerencias: enc(1.15, 195, 270),
          pie: enc(1.085, 195, 565),
          avisar: enc(1.25, 172, 604),
          avisados: enc(1.085, 195, 422),
          parqueadero2: enc(1.4, 155.5, 440),
          cierre: enc(1.2, 176, 350), // cy 362 → 350 (SPEC §2.1.6): en 16:9 el borde de arriba cortaba «Servicio General»
          tarjeta: enc(1.085, 195, 275),
          servicioCabeza: enc(1.4, 160, 261.5),
          llegada: enc(1.8, 130, 225),
          servicio: enc(1.085, 195, 275),
          paleta: enc(1.085, 195, 468),
          botones: enc(1.085, 195, 372),
          // ── Parte 2, celular (#cam3, #cam3b, #cam4) ──
          chatTop: enc(1.085, 190, 224), // G, CSS 10–370 × 0–449: «Alabanza · Integrante», el anuncio anclado, Emilia y el comienzo de la encuesta
          encuesta: enc(1.25, 162, 485), // ×1,25 (en M = 1,4 no caben las cuentas de las opciones), CSS 6–318 × 290–680 (los botones del ensayo, 591–635, quedan encima de «Datos de ejemplo»): la encuesta entera; después del 1500, el ensayo con «Asistiré · No asistiré»
          asistire: enc(1.8, 116.5, 590), // C, CSS 8–225 × 455–725 (de «Ensayo de Alabanza» al borde de la caja): «Asistiré» y «Van 10 · no van 1» a 46 px
          caja: enc(1.085, 201.5, 585), // G, CSS 22–381 × 360–810 (el hilo va de x 16 a 388: no cabe entero a ×1,085; se corta a la izquierda, nunca el mensaje): el final del ensayo, la caja de escribir y, después del 1743, su mensaje (llega a x 373)
          barra: enc(1.085, 201.5, 620), // G, CSS 22–381 × 395–844: el mensaje, la caja y la barra de abajo con «Servir» (el ícono de la derecha)
          servirCard: enc(1.16, 195, 221), // ×1,16, CSS 27–363 × 11–431: la tarjeta «Cerrar el turno» con su fila «Seguridad · Servicio General»; el borde de abajo (431) deja fuera la fecha del turno (437–452), y encima queda «Por cubrir»
          cerrarCabeza: enc(1.085, 194, 381), // G, CSS 14–373 × 156–606 (el título y las filas empiezan en x 15): desde «Cerrar el turno» (la fecha, 140–154, queda fuera), «5 sirvieron», Gilberto y Gabriela «Sirvió»
          gabrielaFila: enc(1.15, 195, 542), // G⁺, CSS 25–365 × 330–754: Gabriela «Sirvió», Julián (Entrada) y la barra «Cerrar el turno»
          barraCerrar: enc(1.085, 195, 620), // G, CSS 15–374 × 395–844: Gabriela, Julián en rojo, la barra y su botón
          avisoAbierto: enc(1.085, 194, 425), // G, CSS 14–373 × 200–649: el aviso entero en su primer cuadro (corte con causa: la pantalla cambia)
          aviso: enc(1.18, 193, 425), // ×1,18, CSS 28–358 × 218–632: el aviso «El turno quedó cerrado · 1 persona cumplió su objetivo de servir en la ruta. · Entendido»
          gabrielaTop: enc(1.085, 195, 224), // G, CSS 15–374 × 0–449: «Buenas noches, Gabriela», «Iglesia Kingdom Demo 1», Mis servicios, Mis Equipos
          gabrielaBarra: enc(1.085, 195, 620), // G, CSS 15–374 × 395–844: el calendario y la barra de abajo con «Objetivos»; después del 2346, «Para conectarte» con «Servir»
          servirOk: enc(1.6, 152, 700), // ×1,6, CSS 30–274 × 519–844: «Servir» con el check y «Cumplido el vie, 30 de oct» a 41 px
        };
        const EE = {
          // ── Parte 2, escritorio (#camE1). Las pestañas («Por reunión · Por semana · Por red») terminan en el CSS 224: ningún encuadre llega ──
          arriba: encE(1.8, 535, 417), // D, CSS 180–891 × 229–605: «Reunión · Dom, 1 de nov · Servicio General · 9:00 a. m.», «Solo lo que falta», «13 de 19 confirmados (68 %)» y Alabanza
          seguridad: encE(1.8, 535, 388), // D, CSS 180–891 × 200–576 (la app ya bajó): «Seguridad», la barra verde llena, Parqueadero con Rut y Gabriela «Confirmado», Entrada, Rondas; «Redes sociales» (CSS 588–599) fuera
          gabrielaE: encE(2.0, 495, 369), // D⁺, CSS 175–815 × 200–538: Gabriela Hinestroza Perea «Confirmado» a 30 px
          cifraSeg: encE(1.8, 870, 400), // D, CSS 515–1226 × 212–588: «5/5 · 100 %» de Seguridad y «1/1 · 100 %» de Medios con sus barras verdes llenas (la función de Medios, a la izquierda, fuera); después del 1080 (la app arriba), «Solo lo que falta», PDF · Excel y «2/7 · 29 %» en rojo («Por red», CSS 463–511, queda fuera)
          faltaAlab: encE(1.8, 535, 532), // D, CSS 180–891 × 345–720: Alabanza con lo que falta: «Por confirmar» en ámbar y «Vacante» en rojo
        };

        const CAM = { ease: 'power2.inOut', d: F(14) };
        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, n, d) => tl.to(sel, { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        // ── Cámaras de la parte 1 (las del clip): a lo sumo un movimiento por compás, ninguno mientras la app se desplaza ──
        tl.set('#cam1', E.semana, 0);
        mover('#cam1', E.porCubrir, 46);
        tl.set('#cam1', E.turnoCabeza, F(78)); // el match cut cambia de encuadre (corte con causa)
        mover('#cam1', E.parqueadero1, 90);
        tl.set('#cam1b', E.sugerencias, 0);
        mover('#cam1b', E.pie, 165);
        mover('#cam1b', E.avisar, 210);
        mover('#cam1b', E.avisados, 240);
        mover('#cam1b', E.parqueadero2, 300);
        mover('#cam1b', E.cierre, 690, F(9)); // el retroceso: aparece «5 de 5»
        tl.set('#cam2', E.tarjeta, 0);
        tl.set('#cam2b', E.servicioCabeza, 0);
        mover('#cam2b', E.llegada, 390);
        mover('#cam2b', E.servicio, 420);
        mover('#cam2b', E.paleta, 480);
        mover('#cam2b', E.botones, 570);

        // ── Cámaras de la parte 2 ──
        // El escritorio (e1): llega en «arriba»; en el 900 la app salta a Seguridad y el encuadre cambia con ella (mismo cuadro, sin movimiento).
        tl.set('#camE1', EE.arriba, 0);
        tl.set('#camE1', EE.seguridad, F(900));
        mover('#camE1', EE.gabrielaE, 960); // la costura de la música: la cámara se acerca a Gabriela
        mover('#camE1', EE.cifraSeg, 1020); // «5/5 · 100 %» (1034–1079); quieta cuando la app vuelve arriba (1080): «2/7 · 29 %»
        mover('#camE1', EE.arriba, 1095); // el interruptor, el total y Alabanza; quieta en el toque (1140)
        mover('#camE1', EE.faltaAlab, 1200); // lo que falta: «Por confirmar» en ámbar y «Vacante» en rojo
        // El celular de Jorge, parte 2 (#cam3 hasta el iris del 1920, #cam3b después)
        tl.set('#cam3', E.chatTop, 0);
        mover('#cam3', E.encuesta, 1380); // quieta en el voto (1440) y cuando la app baja al ensayo (1500)
        mover('#cam3', E.asistire, 1560, F(9)); // punch con «Asistiré»
        mover('#cam3', E.caja, 1620);
        mover('#cam3', E.barra, 1770); // quieta mientras escribe (1681–1739)
        tl.set('#cam3', E.servirCard, F(1803)); // el corte sobre el toque en «Servir»
        tl.set('#cam3b', E.cerrarCabeza, 0);
        mover('#cam3b', E.gabrielaFila, 1980);
        mover('#cam3b', E.barraCerrar, 2100);
        tl.set('#cam3b', E.avisoAbierto, F(2175)); // el aviso aparece entero (con la barra abajo, el título quedaba cortado arriba)
        mover('#cam3b', E.aviso, 2175, F(9)); // y el punch lo acerca
        // El celular de Gabriela, parte 2 (#cam4)
        tl.set('#cam4', E.gabrielaTop, 0);
        mover('#cam4', E.gabrielaBarra, 2310);
        mover('#cam4', E.servirOk, 2400);

        // ── Aterrizajes ──
        const centroCel = `${CEL.W / 2}px ${CEL.HV / 2}px`;
        const centroEsc = `${ESC.W / 2}px ${ESC.HV / 2}px`;
        const aterriza = (sel, desde, origen, n) =>
          tl.fromTo(sel, { scale: desde, transformOrigin: origen }, { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(n));
        // Desde el punto tocado (en px de la ventana, con el encuadre que había al tocar)
        const desdeToque = (e, vx, vy) => {
          const p = CEL.enVentana(e, vx, vy);
          return `${p.x.toFixed(1)}px ${p.y.toFixed(1)}px`;
        };
        aterriza('#m1in', 1.03, centroCel, 78); // el match cut del clip
        aterriza('#m2in', 1.04, centroCel, 360); // el látigo de ida del clip
        aterriza('#m1in', 1.04, centroCel, 660); // el látigo de vuelta del clip
        aterriza('#e1in', 1.04, centroEsc, 840); // el látigo horizontal al escritorio
        aterriza('#m1in', 1.04, centroCel, 1320); // el látigo horizontal de vuelta
        aterriza('#m1in', 1.03, desdeToque(E.barra, 1046, 2448), 1803); // corte sobre el toque en «Servir»
        aterriza('#m2in', 1.04, centroCel, 2280); // el látigo vertical a Gabriela
        aterriza('#m2in', 1.03, desdeToque(E.gabrielaBarra, 1017, 2418), 2346); // corte sobre el toque en «Objetivos»

        // ── Iris: el círculo nace en la ventana donde está el botón tocado en el encuadre viejo; dentro, la cámara nueva ──
        const iris = (sel, e, vx, vy, n) => {
          const p = CEL.enVentana(e, vx, vy);
          const c = (r) => `circle(${r}px at ${p.x.toFixed(1)}px ${p.y.toFixed(1)}px)`;
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(1900), duration: F(5), ease: 'power2.out', immediateRender: false }, F(n));
          tl.set(sel, { clipPath: 'none' }, F(n + 6));
        };
        iris('#iris1', E.parqueadero1, 972, 1095, 120); // «Asignar»
        iris('#iris2', E.tarjeta, 585, 768, 375); // la tarjeta «Tu próximo servicio»
        iris('#iris3', E.servirCard, 585, 1242, 1920); // la fila «Seguridad · Servicio General»

        // ── Látigos ──
        // Vertical (la tira del celular, 1000 px, 10 cuadros): sube 356–366, baja 656–666, sube 2270–2280.
        tl.fromTo('#tira', { y: 0 }, { y: -KD.latigoV, duration: F(10), ease: 'power3.inOut', immediateRender: false }, F(356));
        tl.to('#tira', { y: 0, duration: F(10), ease: 'power3.inOut' }, F(656));
        tl.to('#tira', { y: -KD.latigoV, duration: F(10), ease: 'power3.inOut' }, F(2270));
        // Horizontal (#escena, 1920 px, 10 cuadros): a la izquierda = al escritorio (830–840), a la derecha = de vuelta (1310–1320).
        tl.fromTo('#escena', { x: 0 }, { x: -KD.latigoH, duration: F(10), ease: 'power3.inOut', immediateRender: false }, F(830));
        tl.to('#escena', { x: 0, duration: F(10), ease: 'power3.inOut' }, F(1310));

        // ── Marcas de toque: aparecen 4 cuadros antes (la del 120 en el 105 y espera quieta), se hunden en el cuadro y se van 6 después; la onda
        // nace en el cuadro (450 ms). Cuando la pantalla cambia antes de que la marca se vaya, la marca se va con el corte (toque → cuadro del corte).
        const CORTE = { 75: 78, 120: 121, 180: 181, 240: 242, 300: 301, 375: 376, 600: 602, 1800: 1803, 1920: 1921, 2340: 2346 };
        @@TOQUES@@.forEach((n) => {
          const t = F(n);
          const antes = n === 120 ? 15 : 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });

        // ── El final: la ventana del celular se hace a un lado (2524–2538), el dip (2757–2759) y el corte al cierre (2760) ──
        tl.to('#ventana-cel', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(2524));
        tl.set('#dip', { opacity: 0.4 }, F(2757));
        tl.set('#escena', { autoAlpha: 0 }, F(2760));
        tl.set({}, {}, 97);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
