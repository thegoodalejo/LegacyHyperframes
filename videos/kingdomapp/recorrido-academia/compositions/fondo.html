<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El fondo del cuerpo (0–2759): la noche del sitio con el halo y la retícula de puntos del kit (identidad/kit.css, enlazado por el host).
         El halo se asienta 1,08 → 1,00 en 90 cuadros (sine.out) al entrar cada mundo: 0, 120, 240, 360, 840, 1320, 1680, 2040 y 2280
         (SPEC §1.1); los puntos no se mueven. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }
      </style>
      <div data-hf-id="hf-af01" id="root" data-composition-id="fondo" data-width="1920" data-height="1080" data-duration="92">
        <div data-hf-id="hf-af02" class="k-noche">
          <div data-hf-id="hf-af03" class="k-halo" id="fondo-halo" data-layout-allow-overflow></div>
          <div data-hf-id="hf-af04" class="k-puntos"></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          [0, 4, 8, 12, 28, 44, 56, 68, 76].forEach((t) => {
            tl.fromTo('#fondo-halo', { scale: 1.08 }, { scale: 1, duration: 3, ease: 'sine.out', immediateRender: t === 0 }, t);
          });
          tl.set({}, {}, 92);
          window.__timelines['fondo'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
