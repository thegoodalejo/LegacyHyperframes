<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"tiempos","type":"string","label":"Tiempos de la escena (los escribe recurso.mjs)","default":"{\"duracion\":28,\"frases\":[{\"texto\":\"a\",\"inicio\":0.5,\"fin\":3,\"palabras\":[]},{\"texto\":\"b\",\"inicio\":3.5,\"fin\":9.5,\"palabras\":[]},{\"texto\":\"c\",\"inicio\":10.2,\"fin\":17,\"palabras\":[]},{\"texto\":\"d\",\"inicio\":17.6,\"fin\":21,\"palabras\":[]}]}"}]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- El ingreso: una fila de personas pasa por la puerta (la línea del escáner); cada una se ilumina en verde al entrar, una en ámbar («ya
         entró hoy»); el contador de «Entraron hoy» sube (Datos de ejemplo). Sin señal, los ingresos se apilan «por enviar» y suben a la nube
         al volver. Al final, alguien sin boleta se inscribe en la puerta. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--k-noche-tinta); font-family: var(--k-fuente); }
        .ing-arriba { position: absolute; left: 192px; top: 120px; width: 1536px; height: 120px; display: grid; justify-items: center; }
        .ing-arriba .k-recurso-titular { grid-area: 1 / 1; width: 1536px; text-align: center; font-size: 84px; }
        .k-recurso-palabra.em { font-style: italic; font-weight: 500; }
        .ing-escena { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .ing-puerta { position: absolute; left: 958px; top: 420px; width: 4px; height: 340px; border-radius: 2px; background: var(--k-noche-dorado); transform-origin: 50% 50%; opacity: 0; }
        .ing-cabeza { position: absolute; left: 960px; top: 340px; width: 120px; height: 120px; opacity: 0; }
        .ing-cabeza .k-recurso-icono { position: absolute; left: 30px; top: 30px; --k-icono-tam: 60px; }
        .ing-suelo { position: absolute; left: 240px; top: 590px; width: 1440px; height: 2px; background: rgba(234, 240, 255, 0.14); }
        .ing-onda { position: absolute; left: 960px; top: 590px; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; opacity: 0; }
        .ing-onda.verde { box-shadow: 0 0 0 4px #26a69a; }
        .ing-onda.ambar { box-shadow: 0 0 0 4px #e8b95a; }
        .ing-aviso { position: absolute; top: 650px; width: 420px; margin-left: -210px; text-align: center; opacity: 0; }
        .ing-aviso.verde { color: #26a69a; left: 1190px; }
        .ing-aviso.ambar { color: #e8b95a; left: 1190px; }
        .ing-conteo { position: absolute; left: 300px; top: 790px; display: flex; align-items: baseline; gap: 18px; opacity: 0; }
        .ing-conteo .k-recurso-contador { font-size: 96px; color: var(--k-noche-tinta); }
        .ing-pend { position: absolute; left: 1220px; top: 790px; display: flex; align-items: baseline; gap: 18px; opacity: 0; }
        .ing-pend .k-recurso-contador { font-size: 96px; color: var(--k-noche-tinta-2); }
        .ing-nube { position: absolute; left: 1560px; top: 400px; width: 130px; height: 130px; opacity: 0; }
        .ing-nube .k-recurso-icono { position: absolute; left: 30px; top: 30px; --k-icono-tam: 70px; }
        .ing-alta { position: absolute; left: 800px; top: 470px; width: 96px; height: 96px; opacity: 0; color: var(--k-noche-dorado); }
        .ing-alta .k-recurso-icono { --k-icono-tam: 72px; }
        /* El kit declara la máscara en identidad/kit.css y en el render la url(identidad/iconos/…) se resuelve contra esa hoja (identidad/identidad/…):
           se declara aquí, en la escena, como hace capitulo-recurso. */
        .k-recurso-icono { -webkit-mask: var(--k-icono) center / contain no-repeat; mask: var(--k-icono) center / contain no-repeat; }
      </style>

      <div id="root" data-composition-id="ingreso" data-width="1920" data-height="1080" data-duration="28">
        <div class="ing-arriba" id="ing-arriba" data-layout-allow-overlap>
          <div class="k-recurso-titular" id="ing-t0">Se escanea <em>cada boleta</em></div>
          <div class="k-recurso-titular" id="ing-t1">Cada ingreso, <em>su asistencia</em></div>
          <div class="k-recurso-titular" id="ing-t2">Sin señal, <em>sigue escaneando</em></div>
          <div class="k-recurso-titular" id="ing-t3">Sin boleta, <em>en la puerta</em></div>
        </div>
        <div class="ing-escena" id="ing-escena" data-layout-allow-overlap>
          <div class="ing-suelo" id="ing-suelo"></div>
          <div class="ing-puerta" id="ing-puerta"></div>
          <div class="k-recurso-nodo k-oro ing-cabeza" id="ing-qr"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/qr_code_2.svg)"></span></div>
          <div class="k-recurso-nodo ing-cabeza" id="ing-sin"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/wifi_off.svg)"></span></div>
          <div class="k-recurso-nodo ing-nube" id="ing-nube"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/cloud.svg)"></span></div>
          <div class="ing-alta" id="ing-alta"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/person_add.svg)"></span></div>
          <div class="ing-onda verde" id="ing-ov"></div>
          <div class="ing-onda ambar" id="ing-oa"></div>
          <div class="k-recurso-etiqueta ing-aviso verde" id="ing-av">¡Bienvenido!</div>
          <div class="k-recurso-etiqueta ing-aviso ambar" id="ing-aa">Ya entró hoy</div>
          <div class="ing-conteo" id="ing-conteo"><span class="k-recurso-contador" id="ing-n">1.240</span><span class="k-recurso-etiqueta">entraron hoy</span></div>
          <div class="ing-pend" id="ing-pend"><span class="k-recurso-contador" id="ing-p">0</span><span class="k-recurso-etiqueta">por enviar</span></div>
        </div>
        <span class="k-datos-ejemplo k-recurso-datos" id="ing-datos" style="opacity: 0">Datos de ejemplo</span>
      </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window);
          const $ = (id) => document.getElementById(id);
          const norm = (w) => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
          const cuando = (f, raiz, def) => { const p = f.palabras.find((x) => norm(x.texto).startsWith(raiz)); return p ? p.inicio : def; };
          const partir = (el, pref) => {
            const out = [];
            const nodos = [...el.childNodes];
            el.textContent = '';
            nodos.forEach((n) => {
              const clave = n.nodeType === 1 && n.tagName === 'EM';
              (n.textContent || '').split(/\s+/).filter(Boolean).forEach((w) => {
                if (/^[,.;:?!)]+$/.test(w) && out.length) { out[out.length - 1].textContent += w; return; }
                const c = document.createElement('span');
                c.className = 'k-recurso-palabra' + (clave ? ' k-recurso-clave em' : '');
                c.id = `${pref}-${out.length}`;
                c.textContent = w;
                el.appendChild(c);
                out.push(c);
              });
            });
            return out;
          };
          const escena = $('ing-escena');
          const persona = (id, clase) => {
            const d = document.createElement('span');
            d.className = `k-recurso-punto ${clase}`;
            d.id = id;
            d.style.left = '300px';
            d.style.top = '590px';
            d.style.width = d.style.height = '28px';
            d.style.margin = '-14px 0 0 -14px';
            escena.appendChild(d);
            return d;
          };
          const N = 22;
          const fila = [];
          for (let i = 0; i < N; i++) fila.push(persona(`ing-g-${i}`, ''));
          const cola = [0, 1, 2, 3, 4, 5, 6].map((k) => { const d = persona(`ing-cola-${k}`, 'k-tenue'); d.style.left = `${300 + k * 62}px`; return d; });
          const sinBoleta = persona('ing-nueva', 'k-tenue');
          sinBoleta.style.boxShadow = 'inset 0 0 0 2px rgba(234,240,255,0.6)';
          const textos = [0, 1, 2, 3].map((i) => partir($(`ing-t${i}`), `ing-t${i}p`));

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const F = T.frases;
            textos.forEach((ps, i) => {
              const f = F[i];
              ps.forEach((c, j) => tl.fromTo(c, { y: 28, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.42, ease: 'power3.out' }, Math.max(0, f.inicio - 0.08 + j * 0.14)));
              const sale = F[i + 1] ? F[i + 1].inicio - 0.3 : T.salida(0.6);
              tl.to(`#ing-t${i}`, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, sale);
            });
            // La puerta y su escáner.
            tl.fromTo('#ing-puerta', { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, T.pulso(F[0].inicio));
            tl.fromTo('#ing-qr', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }, T.pulso(F[0].inicio + 0.5));
            // La cola que espera (tenue), mientras pasa la fila.
            tl.fromTo(cola, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)', stagger: 0.08 }, T.pulso(F[0].inicio + 0.5));
            for (let k = 0; k < 8; k++) tl.fromTo(cola, { x: 0 }, { x: 18, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false, stagger: 0.03 }, T.pulso(F[0].inicio + 2) + k * 2);
            // Pasos de la fila: cada persona cruza la puerta en un pulso, de la frase 0 a la 2.
            const tOff = T.pulso(cuando(F[2], 'senal', F[2].inicio + 1));
            const tSync = T.pulso(cuando(F[2], 'vuelve', F[2].fin - 0.8) - 0.2);
            const cruces = T.reparto(N, F[0].inicio + 1, tSync - 1);
            const iAmbar = 4;
            let pendientes = 0;
            cruces.forEach((t, i) => {
              const d = fila[i];
              tl.fromTo(d, { x: 0, opacity: 0 }, { x: 560, opacity: 1, duration: 1.2, ease: 'power2.out' }, t - 1.2);
              tl.to(d, { x: 660, duration: 0.25, ease: 'power2.in' }, t);
              if (t >= tOff) {
                // Sin señal: queda «por enviar», se apila a la izquierda del contador pendiente.
                pendientes++;
                const k = pendientes;
                tl.to(d, { backgroundColor: 'rgba(169,182,214,0.6)', duration: 0.2 }, t + 0.2);
                tl.to(d, { x: 900 + k * 40, y: 120, duration: 0.6, ease: 'power3.out' }, t + 0.3);
                tl.to(d, { x: 1260, y: -190, scale: 0.5, opacity: 0, duration: 0.7, ease: 'power3.in' }, tSync + k * 0.08);
              } else {
                const ambar = i === iAmbar;
                tl.to(d, { backgroundColor: ambar ? '#e8b95a' : '#26a69a', duration: 0.15 }, t + 0.05);
                const onda = ambar ? '#ing-oa' : '#ing-ov';
                tl.fromTo(onda, { scale: 0.5, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, t + 0.05);
                tl.to(d, { x: 1300, opacity: 0, duration: 1, ease: 'power1.in' }, t + 0.3);
              }
            });
            // Los avisos de color (frase 1): verde en un cruce, ámbar en el de la persona que ya entró.
            const cv = cruces.find((t) => t >= F[1].inicio) || cruces[2];
            tl.fromTo('#ing-av', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, Math.min(cv, cruces[iAmbar] - 1.2));
            tl.to('#ing-av', { opacity: 0, duration: 0.25 }, cruces[iAmbar] - 0.3);
            tl.fromTo('#ing-aa', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, cruces[iAmbar]);
            tl.to('#ing-aa', { opacity: 0, duration: 0.25 }, cruces[iAmbar] + 1.6);
            // El contador de entradas (frase 1), con «Datos de ejemplo».
            const tc = T.pulso(cuando(F[1], 'ingreso', F[1].inicio + 2) - 0.2);
            tl.fromTo(['#ing-conteo', '#ing-datos'], { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, tc);
            const cuenta = { n: 1240 };
            tl.fromTo(cuenta, { n: 1240 }, { n: 1240 + N - pendientes, duration: Math.max(0.5, tOff - tc), ease: 'none', onUpdate: () => { $('ing-n').textContent = Math.round(cuenta.n).toLocaleString('es-CO'); } }, tc);
            // Sin señal: el ícono cambia y aparece «por enviar».
            tl.to('#ing-qr', { opacity: 0, duration: 0.3 }, tOff - 0.3);
            tl.fromTo('#ing-sin', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, tOff - 0.2);
            tl.to('#ing-puerta', { backgroundColor: 'rgba(169,182,214,0.7)', duration: 0.3 }, tOff - 0.2);
            tl.fromTo('#ing-pend', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, tOff);
            const pend = { n: 0 };
            tl.fromTo(pend, { n: 0 }, { n: pendientes, duration: Math.max(0.5, tSync - tOff - 0.5), ease: 'none', onUpdate: () => { $('ing-p').textContent = String(Math.round(pend.n)); } }, tOff + 0.3);
            // Vuelve la señal: la nube recibe los pendientes y el contador los suma.
            tl.fromTo('#ing-nube', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: 'back.out(2)' }, tSync - 0.5);
            tl.to('#ing-sin', { opacity: 0, duration: 0.3 }, tSync);
            tl.to('#ing-qr', { opacity: 1, duration: 0.3 }, tSync);
            tl.to('#ing-puerta', { backgroundColor: '#e8b95a', duration: 0.3 }, tSync);
            const pend2 = { n: pendientes };
            tl.fromTo(pend2, { n: pendientes }, { n: 0, duration: 0.8, ease: 'none', immediateRender: false, onUpdate: () => { $('ing-p').textContent = String(Math.round(pend2.n)); } }, tSync + 0.4);
            const cuenta2 = { n: 1240 + N - pendientes };
            tl.fromTo(cuenta2, { n: 1240 + N - pendientes }, { n: 1240 + N, duration: 0.8, ease: 'none', immediateRender: false, onUpdate: () => { $('ing-n').textContent = Math.round(cuenta2.n).toLocaleString('es-CO'); } }, tSync + 0.4);
            tl.to('#ing-pend', { opacity: 0, y: 16, duration: 0.4 }, tSync + 1.4);
            for (let k = 0; k < 2; k++) tl.fromTo('#ing-nube', { scale: 1.1 }, { scale: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, tSync + 0.5 + k * 0.5);
            // Frase 3: llega alguien sin boleta, se detiene, se inscribe y entra.
            const t3 = T.pulso(F[3].inicio - 0.5);
            tl.to('#ing-nube', { opacity: 0, duration: 0.3 }, t3);
            tl.to(cola, { opacity: 0, duration: 0.4 }, t3);
            tl.fromTo(sinBoleta, { x: 0, opacity: 0 }, { x: 540, opacity: 1, duration: 1.2, ease: 'power2.out' }, t3);
            const tp = T.pulso(cuando(F[3], 'puerta', F[3].fin - 0.8) - 0.3);
            tl.fromTo('#ing-alta', { scale: 0.4, opacity: 0, y: 10 }, { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: 'back.out(2.4)' }, Math.min(tp, t3 + 1.3));
            tl.to(sinBoleta, { backgroundColor: '#26a69a', boxShadow: 'inset 0 0 0 0 rgba(0,0,0,0)', duration: 0.3 }, Math.min(tp, t3 + 1.3) + 0.5);
            tl.to(sinBoleta, { x: 900, duration: 0.8, ease: 'power2.inOut' }, Math.min(tp, t3 + 1.3) + 0.9);
            tl.fromTo('#ing-ov', { scale: 0.5, opacity: 1 }, { scale: 1.7, opacity: 0, duration: 0.6, ease: 'power2.out', immediateRender: false }, Math.min(tp, t3 + 1.3) + 1.2);
            tl.to('#ing-alta', { opacity: 0, duration: 0.3 }, Math.min(tp, t3 + 1.3) + 1.4);
            tl.to(['#ing-escena', '#ing-datos'], { opacity: 0, y: -20, filter: 'blur(6px)', duration: 0.45, ease: 'power2.in' }, T.salida(0.6));
            tl.set({}, {}, T.duracion);
            window.__timelines['ingreso'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
