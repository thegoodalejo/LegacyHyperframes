<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"tiempos","type":"string","label":"Tiempos de la escena (los escribe recurso.mjs)","default":"{\"duracion\":17,\"frases\":[{\"texto\":\"a\",\"inicio\":0.5,\"fin\":2.5,\"palabras\":[]},{\"texto\":\"b\",\"inicio\":3.5,\"fin\":6.5,\"palabras\":[]},{\"texto\":\"c\",\"inicio\":7.2,\"fin\":10.5,\"palabras\":[]},{\"texto\":\"d\",\"inicio\":11,\"fin\":14.8,\"palabras\":[]}]}"}]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- El resultado: el recorrido completo en ocho íconos (de la boleta a la conversación) con el punto dorado; en el golpe, «Un evento de
         ciudad» en grande sobre la multitud y el pequeño equipo dorado; cada asistente se marca como medido (de izquierda a derecha) y cada
         nuevo queda unido a alguien del equipo. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--k-noche-tinta); font-family: var(--k-fuente); }
        .res-arriba { position: absolute; left: 192px; top: 120px; width: 1536px; height: 220px; display: grid; justify-items: center; align-items: start; }
        .res-arriba .k-recurso-titular { grid-area: 1 / 1; width: 1536px; text-align: center; font-size: 84px; }
        .res-arriba .k-recurso-gigante { grid-area: 1 / 1; width: 1536px; text-align: center; font-size: 150px; }
        .k-recurso-palabra.em { font-style: italic; font-weight: 500; }
        .res-recap { position: absolute; left: 192px; top: 440px; width: 1536px; height: 200px; }
        .res-ic { position: absolute; top: 100px; width: 120px; height: 120px; margin: -60px 0 0 -60px; opacity: 0; }
        .res-ic .k-recurso-icono { --k-icono-tam: 56px; }
        .res-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .res-campo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        .res-pocas { position: absolute; left: 192px; top: 960px; width: 1536px; text-align: center; color: var(--k-noche-dorado); opacity: 0; }
        /* El kit declara la máscara en identidad/kit.css y en el render la url(identidad/iconos/…) se resuelve contra esa hoja (identidad/identidad/…):
           se declara aquí, en la escena, como hace capitulo-recurso. */
        .k-recurso-icono { -webkit-mask: var(--k-icono) center / contain no-repeat; mask: var(--k-icono) center / contain no-repeat; }
      </style>

      <div id="root" data-composition-id="resultado" data-width="1920" data-height="1080" data-duration="17">
        <svg class="res-svg" id="res-svg" viewBox="0 0 1920 1080">
          <line class="k-recurso-linea k-oro" id="res-linea" x1="288" y1="540" x2="1632" y2="540" style="stroke-dasharray: 1344; stroke-dashoffset: 1344" />
        </svg>
        <div class="res-campo" id="res-campo" data-layout-allow-overlap></div>
        <div class="res-recap" id="res-recap"></div>
        <div class="res-arriba" id="res-arriba" data-layout-allow-overlap>
          <div class="k-recurso-titular" id="res-t0">Esto es <em>lo que tienes</em></div>
          <div class="k-recurso-gigante" id="res-t1">Un evento de <em>ciudad</em></div>
          <div class="k-recurso-titular" id="res-t2">Cada asistente, <em>medido</em></div>
          <div class="k-recurso-titular" id="res-t3">Cada nuevo, <em>con quien lo siga</em></div>
        </div>
        <div class="k-recurso-etiqueta res-pocas" id="res-pocas">Con pocas personas</div>
      </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window);
          const $ = (id) => document.getElementById(id);
          const NS = 'http://www.w3.org/2000/svg';
          const norm = (w) => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
          const cuando = (f, raiz, def) => { const p = f.palabras.find((x) => norm(x.texto).startsWith(raiz)); return p ? p.inicio : def; };
          const partir = (el, pref) => {
            const out = [];
            const nodos = [...el.childNodes];
            el.textContent = '';
            nodos.forEach((n) => {
              const clave = n.nodeType === 1 && n.tagName === 'EM';
              (n.textContent || '').split(/\s+/).filter(Boolean).forEach((w) => {
                if (/^[,.;:?!)]+$/.test(w) && out.length) { out[out.length - 1].textContent += w; return; }
                const c = document.createElement('span');
                c.className = 'k-recurso-palabra' + (clave ? ' k-recurso-clave em' : '');
                c.id = `${pref}-${out.length}`;
                c.textContent = w;
                el.appendChild(c);
                out.push(c);
              });
            });
            return out;
          };
          // 1. El recorrido: ocho íconos sobre la línea.
          const iconos = ['how_to_reg', 'confirmation_number', 'qr_code_2', 'done_all', 'favorite', 'support_agent', 'bar_chart', 'forum'];
          const recap = $('res-recap');
          iconos.forEach((ic, i) => {
            const n = document.createElement('div');
            n.className = 'k-recurso-nodo res-ic' + (i === 7 ? ' k-oro' : '');
            n.id = `res-ic-${i}`;
            n.style.left = `${96 + i * 192}px`;
            n.innerHTML = `<span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/${ic}.svg)"></span>`;
            recap.appendChild(n);
          });
          // 2. La multitud (220 puntos en una franja ancha) y el equipo (6 puntos dorados en el centro).
          let s = 9901;
          const azar = () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296);
          const campo = $('res-campo');
          const punto = (x, y, clase, id) => {
            const d = document.createElement('span');
            d.className = `k-recurso-punto ${clase}`;
            d.id = id;
            d.style.left = `${x}px`;
            d.style.top = `${y}px`;
            campo.appendChild(d);
            return d;
          };
          const multitud = [];
          for (let i = 0; i < 220; i++) {
            let x, y;
            do { x = 230 + azar() * 1460; y = 470 + azar() * 440; } while (Math.hypot((x - 960) / 1.6, y - 690) < 120);
            multitud.push({ el: punto(x, y, 'k-tenue', `res-m-${i}`), x, y });
          }
          multitud.sort((a, b) => a.x - b.x);
          const equipo = [];
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            const x = 960 + Math.cos(a) * 60;
            const y = 690 + Math.sin(a) * 45;
            const d = punto(x, y, 'k-oro', `res-e-${i}`);
            d.style.width = d.style.height = '24px';
            d.style.margin = '-12px 0 0 -12px';
            equipo.push({ el: d, x, y });
          }
          // 3. Los nuevos: 18 de la multitud, cada uno con una línea a alguien del equipo.
          const svg = $('res-svg');
          const nuevos = [];
          for (let k = 0; k < 18; k++) {
            const m = multitud[Math.floor((k + 0.5) * (multitud.length / 18))];
            const e = equipo[k % 6];
            const l = document.createElementNS(NS, 'line');
            const d = Math.hypot(m.x - e.x, m.y - e.y);
            l.setAttribute('class', 'k-recurso-linea k-oro');
            l.setAttribute('id', `res-l-${k}`);
            l.setAttribute('x1', e.x); l.setAttribute('y1', e.y);
            l.setAttribute('x2', m.x); l.setAttribute('y2', m.y);
            l.style.strokeDasharray = `${d}`;
            l.style.strokeDashoffset = `${d}`;
            l.style.strokeWidth = '2';
            l.style.opacity = '0.7';
            svg.appendChild(l);
            nuevos.push({ m, l });
          }
          const textos = [0, 1, 2, 3].map((i) => partir($(`res-t${i}`), `res-t${i}p`));

          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const F = T.frases;
            const tGolpe = T.pulso(T.palabra(1, 3).inicio);
            textos.forEach((ps, i) => {
              const f = F[i];
              const base = i === 1 ? Math.min(f.inicio, tGolpe - 0.5) : f.inicio;
              ps.forEach((c, j) => {
                let t = base - 0.08 + j * 0.14;
                if (i === 1 && j === ps.length - 1) t = tGolpe - 0.05; // «ciudad» cae en el golpe
                tl.fromTo(c, { y: i === 1 ? 40 : 28, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: i === 1 && j === ps.length - 1 ? 0.3 : 0.42, ease: 'power3.out' }, Math.max(0, t));
              });
              const sale = F[i + 1] ? F[i + 1].inicio - 0.3 : T.salida(0.6);
              tl.to(`#res-t${i}`, { y: -24, opacity: 0, filter: 'blur(6px)', duration: 0.3, ease: 'power2.in' }, sale);
            });
            // Frase 0: el recorrido en pulsos y el punto que lo recorre.
            const ti = T.reparto(8, F[0].inicio, Math.max(F[0].fin, F[0].inicio + 2.5));
            tl.to('#res-linea', { strokeDashoffset: 0, duration: ti[7] - ti[0] + 0.3, ease: 'none' }, ti[0]);
            ti.forEach((t, i) => tl.fromTo(`#res-ic-${i}`, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, t));
            // Frase 1: en el golpe, el recorrido se recoge y aparece la multitud con el pequeño equipo.
            tl.to(['#res-recap', '#res-linea'], { opacity: 0, scale: 0.9, duration: 0.4, ease: 'power2.in' }, tGolpe - 0.45);
            multitud.forEach((m, i) => tl.fromTo(m.el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out' }, tGolpe + (i % 30) * 0.03));
            const tPocas = T.pulso(cuando(F[1], 'pocas', tGolpe + 1) - 0.2);
            equipo.forEach((e, i) => tl.fromTo(e.el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.4)' }, tPocas + i * 0.08));
            tl.fromTo('#res-pocas', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, Math.min(tPocas, tGolpe + 0.5));
            for (let k = 0; k < 3; k++) tl.fromTo(equipo.map((e) => e.el), { scale: 1.4 }, { scale: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, tPocas + 1 + k * 0.5);
            // Frase 2: cada asistente, medido: un barrido de izquierda a derecha que los vuelve azules.
            const t2 = T.pulso(cuando(F[2], 'medido', F[2].inicio + 1.5) - 1);
            tl.to('#res-pocas', { opacity: 0, duration: 0.3 }, F[2].inicio + 1);
            multitud.forEach((m, i) => tl.to(m.el, { backgroundColor: '#3576da', duration: 0.25 }, t2 + (m.x - 230) / 1460 * 1.6));
            // Frase 3: cada nuevo queda unido a alguien del equipo.
            const t3 = T.pulso(F[3].inicio);
            const tn = T.reparto(nuevos.length, t3, F[3].fin);
            nuevos.forEach((n, k) => {
              tl.to(n.m.el, { backgroundColor: '#26a69a', scale: 1.4, duration: 0.3 }, tn[k]);
              tl.to(n.l, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, tn[k] + 0.1);
            });
            tl.to(['#res-campo', '#res-svg'], { opacity: 0, filter: 'blur(6px)', duration: 0.5, ease: 'power2.in' }, T.salida(0.6));
            tl.set({}, {}, T.duracion);
            window.__timelines['resultado'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
