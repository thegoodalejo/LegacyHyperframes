<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"tiempos","type":"string","label":"Tiempos de la escena (los escribe recurso.mjs)","default":"{\"duracion\":24,\"frases\":[{\"texto\":\"¿Quién se inscribió, quién llegó, quién pasó al altar, y quién lo va a llamar después?\",\"inicio\":0.5,\"fin\":5,\"palabras\":[]},{\"texto\":\"b\",\"inicio\":5.7,\"fin\":10,\"palabras\":[]},{\"texto\":\"c\",\"inicio\":10.5,\"fin\":15,\"palabras\":[]},{\"texto\":\"Lo vamos a ver en cuatro momentos: antes, el día del evento, después, y la conversación que no se corta.\",\"inicio\":15.6,\"fin\":22,\"palabras\":[]}]}"}]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- La promesa: las cuatro preguntas en tarjetas (cada una en su «quién»), que se recogen en el nodo de Eventos masivos; Comunicaciones se
         une con una línea; y la ruta de los cuatro momentos, con el punto dorado que la recorre. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; color: var(--k-noche-tinta); font-family: var(--k-fuente); }
        .pro-preguntas { position: absolute; left: 240px; top: 300px; width: 1440px; height: 540px; display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
        .pro-q { display: flex; align-items: center; gap: 28px; opacity: 0; }
        .pro-q .k-recurso-icono { --k-icono-tam: 60px; }
        .pro-q .k-recurso-titular { font-size: 54px; }
        .pro-mod { position: absolute; top: 330px; width: 560px; display: flex; flex-direction: column; align-items: center; gap: 26px; opacity: 0; }
        .pro-mod .k-recurso-nodo { position: relative; margin: 0; width: 200px; height: 200px; }
        .pro-mod .k-recurso-nodo .k-recurso-icono { --k-icono-tam: 96px; }
        .pro-mod .k-recurso-titular { font-size: 72px; text-align: center; }
        .pro-mod .k-recurso-etiqueta { text-align: center; }
        #pro-m1 { left: 300px; }
        #pro-m2 { left: 1060px; }
        .pro-lineas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .pro-ruta { position: absolute; left: 192px; top: 700px; width: 1536px; height: 220px; }
        .pro-est { position: absolute; top: 40px; width: 300px; margin-left: -150px; display: flex; flex-direction: column; align-items: center; gap: 22px; opacity: 0; }
        .pro-est .k-recurso-nodo { position: relative; margin: 0; width: 88px; height: 88px; font-family: var(--k-fuente-marca); font-size: 40px; font-weight: 600; }
        .pro-est .k-recurso-etiqueta { text-align: center; color: var(--k-noche-tinta); }
        .pro-yo { top: 84px; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
        /* El kit declara la máscara en identidad/kit.css y en el render la url(identidad/iconos/…) se resuelve contra esa hoja (identidad/identidad/…):
           se declara aquí, en la escena, como hace capitulo-recurso. */
        .k-recurso-icono { -webkit-mask: var(--k-icono) center / contain no-repeat; mask: var(--k-icono) center / contain no-repeat; }
      </style>

      <div id="root" data-composition-id="promesa" data-width="1920" data-height="1080" data-duration="24">
        <svg class="pro-lineas" id="pro-lineas" viewBox="0 0 1920 1080">
          <line class="k-recurso-linea k-oro" id="pro-union" x1="690" y1="430" x2="1230" y2="430" style="stroke-dasharray: 540; stroke-dashoffset: 540" />
          <line class="k-recurso-linea" id="pro-camino" x1="384" y1="784" x2="1536" y2="784" style="stroke-dasharray: 1152; stroke-dashoffset: 1152" />
        </svg>
        <div class="pro-preguntas" id="pro-preguntas">
          <div class="pro-q" id="pro-q0"><span class="k-recurso-icono k-recurso-icono-oro" style="--k-icono: url(identidad/iconos/how_to_reg.svg)"></span><span class="k-recurso-titular">¿Quién se inscribió?</span></div>
          <div class="pro-q" id="pro-q1"><span class="k-recurso-icono k-recurso-icono-oro" style="--k-icono: url(identidad/iconos/door_open.svg)"></span><span class="k-recurso-titular">¿Quién llegó?</span></div>
          <div class="pro-q" id="pro-q2"><span class="k-recurso-icono k-recurso-icono-oro" style="--k-icono: url(identidad/iconos/favorite.svg)"></span><span class="k-recurso-titular">¿Quién pasó al altar?</span></div>
          <div class="pro-q" id="pro-q3"><span class="k-recurso-icono k-recurso-icono-oro" style="--k-icono: url(identidad/iconos/support_agent.svg)"></span><span class="k-recurso-titular">¿Quién lo llama?</span></div>
        </div>
        <div class="pro-mod" id="pro-m1">
          <div class="k-recurso-nodo k-oro" id="pro-n1"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/stadium.svg)"></span></div>
          <div class="k-recurso-titular" id="pro-t1">Eventos <em>masivos</em></div>
          <div class="k-recurso-etiqueta" id="pro-e1">Complemento de Eventos</div>
        </div>
        <div class="pro-mod" id="pro-m2">
          <div class="k-recurso-nodo" id="pro-n2"><span class="k-recurso-icono" style="--k-icono: url(identidad/iconos/forum.svg)"></span></div>
          <div class="k-recurso-titular" id="pro-t2">Comunicaciones</div>
          <div class="k-recurso-etiqueta" id="pro-e2">El WhatsApp de tu iglesia</div>
        </div>
        <div class="pro-ruta" id="pro-ruta">
          <div class="pro-est" id="pro-s0" style="left: 192px"><div class="k-recurso-nodo">1</div><div class="k-recurso-etiqueta">Antes</div></div>
          <div class="pro-est" id="pro-s1" style="left: 576px"><div class="k-recurso-nodo">2</div><div class="k-recurso-etiqueta">El día</div></div>
          <div class="pro-est" id="pro-s2" style="left: 960px"><div class="k-recurso-nodo">3</div><div class="k-recurso-etiqueta">Después</div></div>
          <div class="pro-est" id="pro-s3" style="left: 1344px"><div class="k-recurso-nodo k-oro">4</div><div class="k-recurso-etiqueta">La conversación</div></div>
          <span class="k-recurso-punto k-oro pro-yo" id="pro-yo" style="left: 192px"></span>
        </div>
      </div>

      <script>
        (function () {
          const T = KRecurso.tiempos(window);
          const norm = (w) => w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
          // Instantes de las palabras de una frase que empiezan con «raiz» (o repartidos en la frase si no hay palabras).
          const cuando = (f, raiz) => {
            const ts = f.palabras.filter((p) => norm(p.texto).startsWith(raiz)).map((p) => p.inicio);
            return ts;
          };
          const construir = () => {
            const tl = gsap.timeline({ paused: true });
            const [f0, f1, f2, f3] = T.frases;
            // Frase 0: una tarjeta por cada «quién».
            let tq = cuando(f0, 'quien');
            if (tq.length < 4) tq = T.reparto(4, f0.inicio, f0.fin - 0.6);
            [0, 1, 2, 3].forEach((i) => tl.fromTo(`#pro-q${i}`, { y: 34, opacity: 0, filter: 'blur(6px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, Math.max(0, tq[i] - 0.1)));
            for (let k = 0; k < 3; k++) tl.fromTo('#pro-preguntas', { scale: 1.015 }, { scale: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, T.pulso(f0.fin) + k * 0.5);
            // Frase 1: las tarjetas se recogen en el nodo de Eventos masivos.
            const tM = T.pulso(T.palabra(1, 3).inicio - 0.2);
            const t1 = tM - 0.5;
            [0, 1, 2, 3].forEach((i) => tl.to(`#pro-q${i}`, { x: i % 2 ? -560 : -40, y: i < 2 ? 120 : -60, scale: 0.3, opacity: 0, duration: 0.6, ease: 'power3.in' }, t1 + i * 0.05));
            tl.fromTo('#pro-m1', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, t1 + 0.5);
            tl.fromTo('#pro-n1', { scale: 0.4 }, { scale: 1, duration: 0.6, ease: 'back.out(1.8)' }, t1 + 0.5);
            tl.fromTo('#pro-e1', { opacity: 0 }, { opacity: 1, duration: 0.4 }, T.pulso(f1.inicio + (f1.fin - f1.inicio) * 0.45));
            // Frase 2: Comunicaciones y la línea que las une.
            const t2 = T.pulso(f2.inicio - 0.1);
            tl.fromTo('#pro-m2', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, t2);
            tl.fromTo('#pro-n2', { scale: 0.4 }, { scale: 1, duration: 0.6, ease: 'back.out(1.8)' }, t2);
            tl.to('#pro-union', { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, T.pulso(f2.inicio + (f2.fin - f2.inicio) * 0.6));
            for (let k = 0; k < 2; k++) tl.fromTo(['#pro-n1', '#pro-n2'], { scale: 1.06 }, { scale: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, T.pulso(f2.fin) + k * 0.5);
            // Frase 3: los dos módulos suben y aparece la ruta de los cuatro momentos.
            const t3 = T.pulso(f3.inicio - 0.3);
            tl.to(['#pro-m1', '#pro-m2'], { y: -190, scale: 0.72, duration: 0.7, ease: 'power3.inOut' }, t3);
            tl.to('#pro-union', { y: -190, opacity: 0.5, duration: 0.7, ease: 'power3.inOut' }, t3);
            tl.to(['#pro-e1', '#pro-e2'], { opacity: 0, duration: 0.3 }, t3);
            let ts = [];
            ['antes', 'dia', 'despues', 'conversacion'].forEach((r) => { const x = cuando(f3, r); ts.push(x.length ? x[0] : null); });
            if (ts.some((x) => x === null)) ts = T.reparto(4, f3.inicio + 1.2, f3.fin - 0.8);
            tl.to('#pro-camino', { strokeDashoffset: 0, duration: Math.max(0.6, ts[3] - ts[0]), ease: 'none' }, ts[0] - 0.1);
            ts.forEach((t, i) => tl.fromTo(`#pro-s${i}`, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'back.out(1.8)' }, t - 0.1));
            tl.fromTo('#pro-yo', { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.3 }, ts[0]);
            for (let i = 1; i < 4; i++) tl.to('#pro-yo', { x: 384 * i, duration: Math.max(0.3, ts[i] - ts[i - 1]) * 0.9, ease: 'power2.inOut' }, ts[i - 1] + 0.1);
            for (let k = 0; k < 3; k++) tl.fromTo('#pro-s3', { scale: 1.08 }, { scale: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, T.pulso(f3.fin) + k * 0.5);
            // Salida.
            tl.to(['#pro-m1', '#pro-m2', '#pro-ruta', '#pro-lineas'], { opacity: 0, y: '-=24', filter: 'blur(6px)', duration: 0.45, ease: 'power2.in' }, T.salida(0.5));
            tl.set({}, {}, T.duracion);
            window.__timelines['promesa'] = tl;
          };
          document.fonts.ready.then(construir);
        })();
      </script>
    </template>
  </body>
</html>
