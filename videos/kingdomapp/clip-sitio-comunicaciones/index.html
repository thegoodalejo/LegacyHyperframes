                                          invitación) va con un cambio de encuadre en el mismo cuadro, para que el aviso «Fuera del horario de
                                          envío…» nunca quede en cuadro; el del 675 (los nombres) se ve tal cual

                                          el toque de volver (375) queda fuera del encuadre: se oye y no se dibuja

    <script>
      // ── Un solo lugar para el formato (la versión 9:16 cambia esto y las variables --f-* del <style>) ──────────────────────
      window.KD = {
        fps: 30,
        ventana: { w: 880, h: 1050, hVis: 990 }, // lo mismo que --f-ventana-*
        grabacion: { w: 1170, h: 2532, cssW: 390, cssH: 844 }, // el celular grabado a 3×
        cambio: { escala: 0.92, x: 48, origen: '50% 100%' }, // la ventana se hace a un lado (SPEC §1.4, 724–738)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos
        const W = KD.ventana.w, HV = KD.ventana.hVis;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular (G = 2,256 en 4:5)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)

        // Encuadre: la caja (centro en px CSS del celular) centrada en lo visible de la ventana con la escala s, sin salirse de la grabación.
        function enc(s, cx, cy) {
          const rx = cx * PPC, ry = cy * PPC;
          let x = W / 2 - s * rx, y = HV / 2 - s * ry;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(0, Math.max(HV - s * VH, y));
          return { scale: s, x, y };
        }

        // Los objetivos, medidos sobre los cuadros reales de la grabación (px CSS del celular, 390×844). Esta app usa todo el ancho (las
        // burbujas, las tarjetas, las filas con su ficha a la derecha), así que los encuadres van de ×1,00 a ×1,08: el texto de 14 px queda
        // entre 31,6 y 34 px. Ver REVIEW §4.
        const E = {
          // G, CSS 173–612: «Cola 4 · Mis chats 2 · Todas 8», la búsqueda, Juan, Carolina y Mariana entera, por encima de la píldora. Es también
          // el encuadre del match cut (la válvula de P1): después del corte, «Hoy» (201) y la burbuja de Mariana (231–320) caen dentro.
          cola: enc(1, 195, 392.4), // arriba de 173: el borde de «Tomar» (171) no asoma después del corte
          hilo: enc(1.03, 197, 262), // ×1,03, CSS 49–475 × 8–386: «Mariana Ospina», «En la cola» (hasta x 382), «Tomar» y la burbuja (desde x 12)
          compositor: enc(1.05, 196.5, 600), // ×1,05, CSS 391–809: el hueco de las respuestas (468–674), el compositor y enviar
          respuesta: enc(1.04, 196, 380), // ×1,04, CSS 169–591: la pregunta, la nota y la respuesta; al volver, «Cola 3» y las tres filas
          arriba: enc(1, 195, 219.5), // G, CSS 0–439: «Bandeja», las pestañas con el ícono de Campañas; después, «Campañas» y los filtros
          campanas: enc(1.08, 195, 321), // ×1,08, CSS 118–524: los filtros, «Bienvenida…» y «Noche de oración…» (su aviso, 526–554, queda fuera)
          invitacion: enc(1, 195, 560), // G, CSS 341–780, después del salto: «Boletas del Congreso…» y la invitación entera (585–741)
          tarjeta: enc(1.08, 195, 580), // ×1,08, CSS 377–783: la invitación con «Completada», la barra y sus números, sobre la píldora
          kpis: enc(1, 195, 520), // G, CSS 300–739: «Completada», la línea, la barra y los números 139 · 137 · 137 · 115 · 23 · 39
          nombres: enc(1.06, 195, 393), // ×1,06, CSS 186–600: «Destinatarios (23)» y cinco filas con «Leído» y «Allí estaré»
          // ×1,08, CSS 262–668: seis filas, de Emmanuel a Diego, con 4 px CSS de margen a cada lado; con la ventana a 0,92 la línea de 12,4 px
          // (medida en la grabación) queda en 27,8 px y los nombres (16 px) en 36 px
          cierre: enc(1.08, 195, 465),
        };
        const CAM = { ease: 'power2.inOut', d: F(14) };
        const mover = (e, n, d) => tl.to('#cam', { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        const tl = gsap.timeline({ paused: true });

        // Cámara: un movimiento por compás (SPEC §2.1), ninguno mientras la app cambia, escribe o se desplaza.
        tl.set('#cam', E.cola, 0);
        // compás 1: sin movimiento (válvula de P1): la fila de Mariana y, después del corte, su burbuja ya caben en `cola`
        mover(E.hilo, 90); // compás 2: a la cabecera, «En la cola», «Tomar» y la burbuja
        mover(E.compositor, 150); // compás 3: al compositor
        mover(E.respuesta, 315); // compás 6: la pregunta y la respuesta
        mover(E.arriba, 390); // compás 7: arriba, a las pestañas
        mover(E.campanas, 450); // compás 8: a las tarjetas
        tl.set('#cam', E.invitacion, F(480)); // la lista salta hasta la invitación (grab. 1041) y el encuadre cambia en el mismo cuadro
        mover(E.tarjeta, 540); // compás 10: a la tarjeta de la invitación
        tl.set('#cam', E.kpis, F(602)); // compás 11: el reporte entra en el corte, ya encuadrado (la pantalla cambia entera)
        mover(E.nombres, 690); // compás 12: a «Destinatarios (23)» y los nombres
        mover(E.cierre, 720); // compás 13

        // El match cut del 78: la pantalla nueva (la conversación) entra 1,03 → 1,00 desde el centro de lo visible de la ventana.
        const o = { x: (W / 2 - E.cola.x) / E.cola.scale, y: (HV / 2 - E.cola.y) / E.cola.scale };
        tl.fromTo('#m1in', { scale: 1.03, transformOrigin: `${o.x.toFixed(1)}px ${o.y.toFixed(1)}px` },
          { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(78));

        // Marcas de toque: aparecen 4 cuadros antes (la del 120 en el 105 y espera quieta), se hunden en el cuadro y se van 6 después;
        // la onda nace en el cuadro (450 ms). Cuando la pantalla cambia antes de que la marca se vaya, la marca se va con el corte.
        const CORTE = { 75: 78, 120: 122, 240: 242, 420: 422, 600: 602 };
        [75, 120, 180, 240, 300, 420, 600, 660].forEach((n) => {
          const t = F(n);
          const antes = n === 120 ? 15 : 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });

        // La ventana se hace a un lado (724–738), 4 cuadros después de la frase 4.
        tl.to('#ventana', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(724));
        // Dip de tres cuadros (837–839) y corte a la firma en el 840.
        tl.set('#dip', { opacity: 0.4 }, F(837));
        tl.set('#ventana', { autoAlpha: 0 }, F(840));
        tl.set({}, {}, 30.5);
        window.__timelines['main'] = tl;
      })();
    </script>
