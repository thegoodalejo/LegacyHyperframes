      Recorrido del módulo Eventos de Kingdom, 1920×1080 (16:9), 97,0 s a 30 fps, sin voz. Contrato: SPEC.md; desvíos y sincronía en REVIEW.md.
      GENERADO por _gen/gen.py desde _gen/index.tpl.html (los tramos, las marcas y los sonidos salen de sus tablas). Se puede editar a mano
      o en el editor de HyperFrames, pero lo siguiente que corra gen.py lo pisa.
      Estructura:
        · compositions/fondo.html          la noche del sitio (el halo se asienta en 0, 180, 1080, 1560 y 2580)
        · compositions/frase-1..9.html     las nueve frases; compositions/ceja.html («EVENTOS», 195–1077 en el celular y 1095–2583 en el computador)
        · #tira (aquí, en la raíz)         los dos mundos lado a lado (3840×1080). El látigo del 1080 la mueve −1920 px en 9 cuadros:
            - #ventana-cel  .k-ventana-16x9 (720×900 en 1104·90): el celular de Jorge Gallego Gil (cuenta 103)
                · #cam-cel es la cámara (scale + x/y; el <video> nunca se transforma ni se busca)
                · 0–779: el montaje del clip, tal cual (grabacion.mp4, sus 30 tramos, los stills y el iris del 180)
                · 780–1089: sin-senal.mp4 (la misma carga de Kingdom Demo, sin señal desde su grab. 1012)
            - #ventana-esc  .k-ventana-escritorio (1440×760 en 2160·260): el computador del pastor (cuenta 101), tablero.mp4
                · #cam-esc: el tablero, el mapa y la lista (1080–2105); #iris-esc abre la ficha desde el toque del 2100 y #cam-esc2 la recorre
        · identidad/cierre-comercial.html  el cierre del Comercial (2760–2909); el sonido de marca en 92,38
      Las marcas de toque (.toque/.onda) van en las coordenadas reales del toque (toques[] de cada pasos.json); ninguna grabación trae círculo.
    -->

    <script>
      // ── El formato en un solo lugar ─────────────────────────────────────────────────────────────────────────────────────
      window.KD = {
        fps: 30,
        cel: { ventana: { w: 720, h: 900 }, grab: { w: 1170, h: 2532, cssW: 390 } }, // el celular grabado a 3×
        esc: { ventana: { w: 1440, h: 760 }, grab: { w: 1920, h: 1080, cssW: 1280 } }, // el computador grabado a 1,5×
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos

        // Encuadre: la caja (centro en px CSS de la app) centrada en la ventana con la escala s sobre el plano (la grabación ajustada al
        // ancho de la ventana), sin salirse de la grabación. comp(): la app saltó d px CSS (positivo = el contenido baja) y la cámara lo
        // deshace en el mismo cuadro: en pantalla nada se mueve.
        function camara(m) {
          const W = m.ventana.w, HV = m.ventana.h;
          const K = W / m.grab.w, PPC = W / m.grab.cssW, VH = m.grab.h * K;
          const enc = (s, cx, cy) => {
            let x = W / 2 - s * cx * PPC, y = HV / 2 - s * cy * PPC;
            x = Math.min(0, Math.max(W - s * W, x));
            y = Math.min(0, Math.max(HV - s * VH, y));
            return { scale: s, x, y };
          };
          const comp = (e, d) => ({ scale: e.scale, x: e.x, y: e.y - e.scale * PPC * d });
          return { W, HV, K, PPC, enc, comp };
        }
        const C1 = camara(KD.cel), C2 = camara(KD.esc);
        const enc = C1.enc, encD = C2.enc;

        // ── Objetivos del celular (px CSS, 390×844). Los del clip, tal cual (clip-sitio-eventos/REVIEW.md §4.6); los nuevos, medidos sobre
        //    sin-senal.mp4 (REVIEW.md §4). G16 = ×1 (1,846 px por px CSS, 487 px CSS de alto a la vista).
        const E = {
          servir: enc(1, 195, 219.5),
          fila: enc(1.15, 197, 345),
          lista: enc(1, 195, 600),
          hojaAlta: enc(1.4, 155, 545),
          telefono: enc(1.8, 185, 650),
          hoja: enc(1, 195, 614.5),
          nuevaFila: enc(1.4, 150, 609),
          total: enc(1.8, 115, 640),
          botones: enc(1.3, 160, 607),
          formulario: enc(1, 195, 374.5),
          enviar: enc(1, 195, 530.5),
          listo: enc(1, 195, 438),
          tarjeta: enc(1.13, 195, 568),
          // ×1,13 (no 1,4): la frase del «¡Listo!» mide 330 px CSS y a más se corta por los lados; CSS 305–736: el ícono, «¡Listo!», la frase y los dos botones
          listoBotones: enc(1.13, 195, 520),
          listaSinRed: enc(1, 195, 315), // CSS 71–559: «Reportar», el chip «Sin señal», «Por reportar» y las filas con la casa
          // CSS 106–594: el título, «Vencida», los atajos, la nota «Sin señal: …», los pasos y «0 marcadas · Igual…» por encima de «Datos de ejemplo»
          reporteSinRed: enc(1, 195, 350),
          // CSS 296–784: la nota, «8 marcadas» y las filas en ámbar; después del salto del 870, las filas, «Total: 8 personas» y «Guardar asistencia»
          listaMarcada: enc(1, 195, 565),
          enCola: enc(1, 195, 315), // CSS 71–559: los chips, «Espera señal», «Guardado en este dispositivo…», los pasos y «El reporte necesita señal…»
          chips: enc(1.08, 195, 290), // G16⁺, CSS 65–516: los dos chips con «Reportar» entero (a 1,4 se cortaba «Reportar» o «1 sin enviar»)
        };
        // ── Objetivos del computador (px CSS, 1280×720). E-A = ×1,28 (1,44 px por px CSS), E-G = ×1,6 (1,80), E-M = ×2,0 (2,25).
        const D = {
          kpisIzq: encD(1.6, 508, 540), // E-G, CSS 108–908 × 298–720: «Resumen · Mapa · Eventos», «Eventos activos … Reuniones reportadas»
          // E-M, después del salto de 32 px, CSS 640–1280 × 366–704: «Reuniones reportadas · Al día 27 / 69 (22 retrasados…) · Tendencia ↗20 ↘14».
          // En E-G la mitad de arriba a la derecha quedaba vacía (las pestañas y los filtros de esa fila están a la izquierda).
          kpisDer: encD(2.0, 1000, 535),
          vistas: encD(1.6, 508, 440), // E-G: las pestañas con «Mapa» y las cifras de la izquierda
          mapa: encD(1.28, 640, 355), // E-A, CSS 140–1140 × 91–619: las capas y el mapa (la imagen del plano)
          centro: encD(1.6, 690, 420), // E-G: el centro de Medellín con los círculos y las zonas donde vive la gente
          zona: encD(2.0, 620, 450), // E-M: la zona sin evento junto a San Cristóbal, con los círculos 3, 1, 15 y 6 alrededor
          tabla: encD(1.6, 520, 520), // E-G, CSS 120–920 × 298–720: las pestañas, el encabezado y las filas con su semáforo
          tablaDer: encD(1.6, 856, 520), // E-G, CSS 456–1256: «Reportes … Tendencia · Nivel y meta · Asistencia · Reuniones · Última reunión»
          buscar: encD(2.0, 450, 230), // E-M: «Buscar evento o responsable» con «Jorge Gallego» escrito
          filasJorge: encD(1.6, 540, 470), // E-G: sus cuatro reuniones con su semáforo y su tendencia
          fichaCabeza: encD(1.28, 640, 420), // E-A: la portada, «Casa de Paz Laureles 1», sus chips y «Reportar»
          asistencia: encD(1.6, 1000, 263), // E-G, CSS 480–1280 × 52–474 (debajo de la barra fija de la app): la tarjeta y la columna de responsables
          // ×1,75 (1,97 px por px CSS), CSS 549–1280: a E-M la columna del medio quedaba cortada a media palabra («…portar»)
          ultima: encD(1.75, 1075, 245), // CSS 52–438: «Última reunión 28 de oct de 2026 · 10 personas (8 por nombre y 2 visitantes)», el promedio
          tendenciaMeta: encD(1.75, 1075, 330), // CSS 137–523: la tendencia, la meta con su barra al 46 % y el nivel
          quienes: encD(1.8, 1075, 520), // ×1,8 (2,03 px por px CSS): «Quiénes vinieron el 28 de oct de 2026» y los ocho nombres
          ximena: encD(2.0, 1100, 600), // E-M (2,25, el límite): «Ximena Hoyos Vélez» con sus vecinos
          cierre: encD(1.712, 1075, 290), // E-G ×1,07: de «Última reunión» a los primeros nombres de «Quiénes vinieron»
        };

        const CAM = { ease: 'power2.inOut', d: F(14) };
        const tl = gsap.timeline({ paused: true });
        const mover = (sel, e, n, d) => tl.to(sel, { ...e, duration: d || CAM.d, ease: CAM.ease }, F(n));

        // ── Cámara del celular: un movimiento por compás (SPEC §2.1), ninguno mientras la app escribe o se desplaza ──
        const cc = '#cam-cel';
        tl.set(cc, E.servir, 0);
        mover(cc, E.fila, 46);
        mover(cc, E.lista, 90);
        mover(cc, E.hojaAlta, 180);
        mover(cc, E.telefono, 300);
        mover(cc, E.hoja, 345);
        mover(cc, E.nuevaFila, 390);
        mover(cc, E.total, 510);
        tl.set(cc, C1.comp(E.total, -62), F(525)); // la app sube 62 px (grab. 919 del clip): compensado
        mover(cc, E.botones, 540);
        mover(cc, E.formulario, 600, F(9));
        tl.set(cc, C1.comp(E.formulario, 66), F(615)); // la app baja 66 px (grab. 1090): compensado
        tl.set(cc, E.formulario, F(645)); // la app vuelve a subir 66 px (grab. 1257): compensado
        mover(cc, E.enviar, 646, F(13));
        mover(cc, E.listo, 660);
        mover(cc, E.tarjeta, 690, F(9));
        mover(cc, E.listoBotones, 720); // compás 13: a los botones del «¡Listo!»
        tl.set(cc, E.listaSinRed, F(781)); // match cut: la lista sin señal
        tl.set(cc, E.reporteSinRed, F(813)); // match cut: el reporte de la vencida
        mover(cc, E.listaMarcada, 846); // compás 15, después del golpe: baja a las filas marcadas (y deja «Guardar asistencia» a la vista tras el salto del 870)
        mover(cc, E.enCola, 900); // compás 16: los chips y «Espera señal»
        mover(cc, E.chips, 930);
        mover(cc, E.enCola, 990); // compás 17½: el mismo encuadre, ya sin chips

        // Aterrizajes (match cut sobre el toque): la pantalla nueva entra 1,03 → 1,00 desde el centro de lo visible de la ventana.
        const aterriza = (sel, C, e, n) => {
          const o = { x: (C.W / 2 - e.x) / e.scale, y: (C.HV / 2 - e.y) / e.scale };
          tl.fromTo(sel, { scale: 1.03, transformOrigin: `${o.x.toFixed(1)}px ${o.y.toFixed(1)}px` },
            { scale: 1, duration: F(10), ease: 'power3.out', immediateRender: false }, F(n));
        };
        aterriza('#m1in', C1, E.fila, 78);
        aterriza('#m1in', C1, E.listaSinRed, 781);
        aterriza('#m1in', C1, E.reporteSinRed, 813);

        // Iris desde el toque en «Persona nueva» (180–185): el círculo nace en el centro del botón, en px de la grabación ajustada.
        const ix = (301 * C1.K).toFixed(1), iy = (1410 * C1.K).toFixed(1);
        const circ = (r) => `circle(${r}px at ${ix}px ${iy}px)`;
        tl.fromTo('#iris1', { clipPath: circ(0) }, { clipPath: circ(1700), duration: F(5), ease: 'power2.out', immediateRender: false }, F(180));
        tl.set('#iris1', { clipPath: 'none' }, F(186));

        // ── El látigo (1080–1088): la tira se mueve −1920 px; el desenfoque es el del render (obturador 180). Una sola vez.
        tl.set('#tira', { x: 0 }, 0);
        tl.fromTo('#tira', { x: 0 }, { x: -1920, duration: F(9), ease: 'power3.inOut', immediateRender: false }, F(1080));

        // ── Cámara del computador ──
        const ce = '#cam-esc', ce2 = '#cam-esc2';
        tl.set(ce, D.kpisIzq, 0);
        // 1200: la grabación pasa a la que ya subió 32 px (grab. 962); la cámara arranca compensada y va a la derecha de las cifras
        tl.fromTo(ce, C2.comp(D.kpisIzq, -32), { ...D.kpisDer, duration: CAM.d, ease: CAM.ease, immediateRender: false }, F(1200));
        mover(ce, D.vistas, 1260);
        tl.set(ce, D.mapa, F(1321)); // match cut: el mapa
        mover(ce, D.centro, 1440);
        mover(ce, D.mapa, 1500);
        mover(ce, D.zona, 1620);
        mover(ce, D.mapa, 1680);
        mover(ce, D.tabla, 1755); // tras el salto del 1740 (cámara quieta mientras la app sube)
        mover(ce, D.tablaDer, 1860);
        mover(ce, D.buscar, 1965);
        mover(ce, D.filasJorge, 2055);
        aterriza('#m2in', C2, D.mapa, 1321);
        aterriza('#m2in', C2, D.tabla, 1801);
        // La ficha, con su cámara propia dentro del iris
        tl.set(ce2, D.fichaCabeza, 0);
        mover(ce2, D.asistencia, 2175); // tras el salto del 2160
        mover(ce2, D.ultima, 2220);
        mover(ce2, D.tendenciaMeta, 2280);
        mover(ce2, D.quienes, 2340);
        mover(ce2, D.ximena, 2400, F(9)); // el punch
        mover(ce2, D.asistencia, 2460);
        mover(ce2, D.cierre, 2520);

        // Iris desde el toque en «Casa de Paz Laureles 1» (2100–2105), en px de la ventana (donde la cámara de la lista deja el enlace).
        const jx = (D.filasJorge.x + D.filasJorge.scale * 335 * C2.K).toFixed(1);
        const jy = (D.filasJorge.y + D.filasJorge.scale * 659 * C2.K).toFixed(1);
        const circ2 = (r) => `circle(${r}px at ${jx}px ${jy}px)`;
        tl.set('#iris-esc', { clipPath: circ2(0) }, 0);
        tl.fromTo('#iris-esc', { clipPath: circ2(0) }, { clipPath: circ2(1700), duration: F(5), ease: 'power2.out', immediateRender: false }, F(2100));
        tl.set('#iris-esc', { clipPath: 'none' }, F(2106));

        // ── Marcas de toque: aparecen 4 cuadros antes (las del 120 y el 1320 esperan 15), se hunden en el cuadro y se van 6 después; la onda
        //    nace en el cuadro (0,45 s). Si la pantalla cambia antes, la marca se va con el corte (toque → cuadro del corte).
        const ESPERA = { 120: 15, 1320: 15 };
        const CORTE = { 75: 78, 180: 181, 375: 377, 600: 602, 660: 662, 780: 781, 810: 813, 900: 903, 1320: 1321, 2100: 2101 };
        [75, 120, 180, 240, 270, 300, 345, 375, 450, 480, 600, 615, 630, 660, 780, 810, 840, 900, 1320, 1380, 1560, 1800, 1920, 1980, 2100].forEach((n) => {
          const t = F(n);
          const antes = ESPERA[n] || 4;
          const c = CORTE[n];
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out', immediateRender: false }, t - F(antes));
          if (c) {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(Math.min(2, c - n)), ease: 'power2.in' }, t);
            const p = (c - n) / 13.5; // la parte de la onda (0,45 s) que alcanza a verse antes del corte
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0.9 * (1 - p), scale: 1 + 0.62 * p, duration: F(c - n), ease: 'none', immediateRender: false }, t);
            tl.set([`#tq-${n}`, `#on-${n}`], { opacity: 0 }, F(c));
          } else {
            tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
            tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
            tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
          }
        });
        // La marca de «Muy bien» aparece en 611–614, antes del salto compensado del 615: hasta entonces va 66 px CSS más arriba.
        tl.set('#tq-615', { y: -66 * 3 * C1.K }, 0);
        tl.set('#tq-615', { y: 0 }, F(615));

        // ── El final: la ventana del computador a 0,96 (2640–2654, origen centro inferior), dip de tres cuadros (2757–2759) y corte al cierre.
        tl.to('#ventana-esc', { scale: 0.96, transformOrigin: '50% 100%', duration: F(15), ease: 'power2.inOut' }, F(2640));
        tl.set('#dip', { opacity: 0.4 }, F(2757));
        tl.set('#tira', { opacity: 0 }, F(2760));
        tl.set({}, {}, 97);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
</html>
