      Clip del sitio de Kingdom, módulo Membresía, 1080×1350 (4:5), v2: 38,5 s a 30 fps. Contrato: SPEC.md (v2); desvíos en REVIEW.md.
      Estructura:
        · compositions/fondo.html      la noche del sitio (halo que se asienta en cada mundo: 0, 180, 780 y 960; los puntos no se mueven)
        · compositions/frase-1..5.html las cinco frases (una a la vez) y compositions/ceja.html («MEMBRESÍA», 195–963)
        · #ventana (aquí, en la raíz)  la app REAL grabada en celular dentro de .k-ventana: grabacion.mp4 (G1, cuadros 0–785) y
                                        grabacion-2.mp4 (G2, la ficha de Valeria, desde el 780), las dos 1170×2532:
                                        - #cam es la cámara (scale + x/y sobre un envoltorio; el <video> nunca se transforma ni se busca)
                                        - #tira es el látigo vertical del 176–186: el mundo 1 (quien registra) sale y el mundo 2 (quien acompaña) llega
                                        - el mundo 3 (#m3in, la ficha) llega por el iris del 780 debajo del mismo lente; dentro, la ficha sin
                                          desplazar (#m3pre) va encima de la misma ficha ya desplazada 484 px CSS (#m3post), alineadas: así el
                                          desplazamiento real de la grabación (3133 → 3135) lo hace la cámara (REVIEW §4)
                                        - cada tramo de video es un <video> con su data-media-start y su data-playback-rate (0,35×–3,5×);
                                          los cortes caen en pausas de la grabación (huecos_de_pantalla de pasos*.json) y cada toque real
                                          cae en su pulso (tabla en REVIEW.md)
                                        - los iris del 120, 375 y 780: lo de antes debajo y el video recortado por un círculo encima
                                        - las marcas de toque (.toque/.onda) van en las coordenadas reales del toque (pasos*.json → toques[])
        · identidad/cierre-clip.html   la firma (kit v1.1), 36,0–38,5; el sonido de marca en 36,38
      Para llevarlo a 9:16: cambiar KD (abajo) y las variables --f-* de este <style>; los tramos de video, los sonidos y las escenas no cambian
      (las escenas solo necesitan su data-width/data-height; el tamaño y la posición de los textos los toman de --f-*).
    -->

      :root {

        --f-ancho: 1080px;
        --f-alto: 1350px;
        --f-margen-x: 96px;
        --f-ceja-y: 72px;
        --f-ceja-px: 30px;
        --f-frase-y: 124px;
        --f-frase-ancho: 888px;
        --f-frase-px: 80px;
        --f-ventana-x: 100px;
        --f-ventana-y: 360px;
        --f-ventana-w: 880px;
        --f-ventana-h: 1050px; /* sangra 60 px por abajo del cuadro: las esquinas de abajo nunca se ven */
        --f-ventana-hvis: 990px; /* lo que se ve de la ventana dentro del cuadro */
        /* Grabación 1170×2532 ajustada al ancho de la ventana: factor y alto resultante (880/1170 y 2532·880/1170). */
        --f-k: 0.752137;
        --f-grab-alto: 1904.41px;
        --f-latigo: 1100px; /* el mundo 2 espera a esta distancia, debajo del mundo 1 */

        margin: 0;
        width: var(--f-ancho);
        height: var(--f-alto);
        overflow: hidden;
        background: #060d1f;

      #root {
        position: relative;
        width: var(--f-ancho);
        height: var(--f-alto);
        overflow: hidden;
        background: #060d1f;
      }

        position: absolute;
        inset: 0;
        z-index: 1;
      }

        z-index: 0;
      }
      #cierre-clip {
        z-index: 6;
      }
      /* La ventana a la app: .k-ventana del kit (radio 28, anillo, sombra); el tamaño viene del formato. */
      #ventana {
        left: var(--f-ventana-x);
        top: var(--f-ventana-y);
        width: var(--f-ventana-w);
        height: var(--f-ventana-h);
        z-index: 3;
      }
      #tira {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .mundo {
        position: absolute;
        left: 0;
        width: 100%;
      }
      #m1 {
        top: 0;
        height: var(--f-grab-alto);
      }
      /* El mundo 2 espera debajo, recortado a su propia ranura hasta que el látigo termina (186); después deja de recortar. */
      #m2 {
        top: var(--f-latigo);
        height: var(--f-ventana-h);
        overflow: hidden;
        z-index: 2;
      }
      /* Encuadre base del mundo 2: el borde de abajo de la grabación en el borde visible de la ventana (más abajo no hay app). */
      #m2in {
        position: absolute;
        left: 0;
        top: calc(var(--f-ventana-hvis) - var(--f-grab-alto));
        width: 100%;
        height: var(--f-grab-alto);
      }
      /* Mundo 3 (desde el 780): la ficha de Valeria (G2) en el tope de arriba del lente (top 0 dentro de #m2), encima de #m2in.
         Mide la ficha sin desplazar (844 px CSS) más el desplazamiento real de la grabación (484 px CSS = 1452 px del video). */
      #m3in {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: calc(3984px * var(--f-k));
      }
      #iris3 {
        height: 100%;
      }
      #m3pre,
      #m3post,
      #m3abierta {
        position: absolute;
        left: 0;
        width: 100%;
        height: var(--f-grab-alto);
      }
      #m3pre,
      #m3abierta {
        top: 0;
      }
      /* La ficha ya desplazada (grab2. 3135 →), 1452 px del video más abajo: el contenido coincide al píxel con la de arriba. */
      #m3post {
        top: calc(1452px * var(--f-k));
      }
      /* La ficha abierta sin desplazar se recorta 7 filas antes de su barra inferior (la raya de la barra está en la fila 2307 del video y el escalado la corre una fila hacia arriba): debajo se ve la desplazada,
         que muestra lo mismo que la barra tapaba («Después: …», «Marcar cumplido», los objetivos). */
      #m3abierta {
        clip-path: inset(0 0 calc(var(--f-grab-alto) - 2300px * var(--f-k)) 0);
      }
      .mundo video,
      .mundo img,
      .iris {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;
      }
      .iris {
        height: var(--f-grab-alto);
      }
      .marcas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--f-grab-alto);
        pointer-events: none;
      }
      /* Marca del toque (la grabación no trae círculo): 20 px CSS del celular y su onda de 36 → 58 px, como define SPEC §3. */
      .toque {
        position: absolute;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border-radius: 50%;
        background: rgba(27, 27, 31, 0.28);
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7);
        opacity: 0;
      }
      .onda {
        position: absolute;
        width: 81px;
        height: 81px;
        margin: -40.5px 0 0 -40.5px;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(1, 91, 190, 0.9);
        opacity: 0;
      }
      #datos {
        position: absolute;
        /* Abajo a la izquierda de la ventana (pedido del dueño, 2026-10-30): ahí solo queda la barra inferior de la app. La ventana sangra
           60 px por abajo del cuadro, así que se sube esa diferencia para que la etiqueta se vea entera. */
        left: 24px;
        bottom: calc(var(--f-ventana-h) - var(--f-ventana-hvis) + 24px);
        z-index: 4;
        /* 31 px en vez de los 28 del kit: con la ventana a 0,92 (964–1079) sigue en ≥ 28 px, el piso de lectura en un celular. */
        height: 56px;
        font-size: 31px;
      }
      #dip {
        position: absolute;
        inset: 0;
        background: #060d1f;
        opacity: 0;
        z-index: 5;
        pointer-events: none;
      }

    <script>
      // ── Un solo lugar para el formato (la versión 9:16 cambia esto y las variables --f-* del <style>) ──────────────────────
      window.KD = {
        fps: 30,
        ventana: { w: 880, h: 1050, hVis: 990 }, // lo mismo que --f-ventana-*
        grabacion: { w: 1170, h: 2532, cssW: 390 }, // el celular grabado a 3×
        latigo: 1100, // --f-latigo
        cambio: { escala: 0.92, x: 48, origen: '50% 100%' }, // la ventana se hace a un lado (SPEC §1.4, 964–978)
      };

      (function () {
        const KD = window.KD;
        const F = (n) => n / KD.fps; // cuadro → segundos
        const W = KD.ventana.w, HV = KD.ventana.hVis;
        const K = W / KD.grabacion.w; // px del video → px de la ventana (= --f-k)
        const PPC = W / KD.grabacion.cssW; // px de la ventana por px CSS del celular (G = 2,256 en 4:5)
        const VH = KD.grabacion.h * K; // alto de la grabación ajustada (= --f-grab-alto)
        const OFF2 = HV - VH; // desplazamiento del mundo 2 (#m2in top)

        // Encuadre: la caja (centro en px CSS del celular) centrada en lo visible de la ventana con la escala s, sin salirse de la grabación.
        function enc(s, cx, cy, off) {
          const rx = cx * PPC, ry = cy * PPC + off;
          let x = W / 2 - s * rx, y = HV / 2 - s * ry;
          x = Math.min(0, Math.max(W - s * W, x));
          y = Math.min(-s * off, Math.max(HV - s * (VH + off), y));
          return { scale: s, x, y };
        }
        // Los objetivos: cajas de pasos.json (y medidas sobre los cuadros reales), en px CSS del celular. Niveles de SPEC §1.5.
        const E1 = {
          arriba: enc(1, 195, 219, 0), // G, el tope: título «Nueva persona», Nombres, Apellidos, Teléfono
          apellidos: enc(1, 195, 419.4, 0), // G, CSS 200–639: Apellidos, Cómo llegó y el selector que se abre debajo
          registrar: enc(1, 195, 530.6, 0), // G, CSS 311–750: el diálogo «Guardada» (310–537) y «Registrar» (708–748)
        };
        const E2 = {
          tarjeta: enc(1, 195, 844, OFF2), // G, el tope de abajo: la tarjeta de Valeria (466–748) y la barra inferior
          tarjetaM: enc(1.4, 195, 530, OFF2), // M, la mitad alta de la tarjeta: nombre, «A tiempo», «Llamada de bienvenida», «Desde hoy…»
          despues: enc(1.8, 126, 592, OFF2), // C, la línea «Después: Mensaje de bienvenida» (texto CSS 33–219 × 586–598)
          pregunta: enc(1.4, 175, 320, OFF2), // M, «¿Cómo fue?» y sus tres opciones
          observaciones: enc(1.4, 185, 558, OFF2), // M, el campo «Observaciones» (la frase escrita cabe entera)
          botones: enc(1.3, 205, 673, OFF2), // M (1,3: a 1,4 «Cancelar» o «Marcar cumplido» quedan cortados), los botones del diálogo
          resultado: enc(1.35, 211, 480, OFF2), // M, el bloque del resultado: ícono, «cumplido», «Ahora va en», «Listo»
          ahora: enc(1.5, 195, 372, OFF2), // C, la línea «Ahora va en: Mensaje de bienvenida» (247 px CSS: a 1,5 cabe; «Listo» queda fuera)
        };
        // Mundo 3, la ficha (#m3in, off 0): la ficha sin desplazar (0–844 px CSS) y, desde el 842, la misma ficha desplazada 484 px CSS
        // debajo (hasta 1328). Las cajas son de pasos-2.json y de las líneas medidas en el grab2. 3135 (px CSS de la pantalla desplazada + D3).
        // La tarjeta tiene 32 px CSS de margen y sus textos van de x 32 a 357 (el chevrón y «Marcar cumplido»): por eso «M» aquí es ×1,15 (36 px)
        // y no ×1,4 (279 px CSS de ancho), que los cortaría.
        const D3 = 484;
        const VH3 = (D3 + KD.grabacion.h / 3) * PPC;
        function enc3(s, cx, cy) {
          const e = enc(s, cx, cy, 0);
          e.y = Math.min(0, Math.max(HV - s * VH3, HV / 2 - s * cy * PPC));
          return e;
        }
        const E3 = {
          fila: enc(1.15, 195, 642.75, 0), // ×1,15 (36 px) sobre la fila «Avance · Mensaje de bienvenida · ● A tiempo» (CSS 643–691): de los botones Llamar/WhatsApp (452) a la barra inferior (833)
          paso: enc3(1.15, 195, D3 + 350.75), // ×1,15 (36 px): de «Avance» a «Historial de pasos» (CSS desplazado 160–541): flujo, paso, «Después», «Marcar cumplido», objetivos
          objetivos: enc3(1.08, 195, D3 + 414), // G⁺ (34 px) centrado en «Objetivos de conexión» y sus chips (CSS desplazado 211–617; el historial debajo)
          avance: enc3(1.08, 195, D3 + 341.85), // G⁺ con la ventana a 0,92 (31 px): la tarjeta de «Avance» a la primera entrada del historial (139–545)
        };
        const CAM = { ease: 'power2.inOut', d: F(14) };
        const toqueXY = (vx, vy) => ({ x: vx * K, y: vy * K }); // toques[] de pasos.json → px de la ventana

        const tl = gsap.timeline({ paused: true });

        // Cámara: quieta hasta el 45; un movimiento por compás después (SPEC §2.1), ninguno mientras se escribe.
        tl.set('#cam', E1.arriba, 0);
        tl.to('#cam', { ...E1.apellidos, duration: CAM.d, ease: CAM.ease }, F(46)); // 46–59: el dedo va a «Apellidos»
        tl.to('#cam', { ...E1.registrar, duration: F(12), ease: CAM.ease }, F(108)); // 108–119: baja a «Registrar»; la app salta en el 114
        tl.to('#cam', { ...E1.arriba, duration: CAM.d, ease: CAM.ease }, F(150)); // 150–163: a la cabecera; «1 sin enviar» aparece en el 165
        tl.to('#cam', { ...E2.tarjetaM, duration: CAM.d, ease: CAM.ease }, F(240)); // compás 5
        tl.to('#cam', { ...E2.despues, duration: CAM.d, ease: CAM.ease }, F(300)); // compás 6
        tl.to('#cam', { ...E2.tarjeta, duration: CAM.d, ease: CAM.ease }, F(345)); // vuelta a G: «Marcar cumplido» a la vista
        tl.to('#cam', { ...E2.pregunta, duration: CAM.d, ease: CAM.ease }, F(390)); // compás 7
        tl.to('#cam', { ...E2.observaciones, duration: CAM.d, ease: CAM.ease }, F(480)); // compás 9
        tl.to('#cam', { ...E2.botones, duration: CAM.d, ease: CAM.ease }, F(570)); // compás 10
        tl.to('#cam', { ...E2.resultado, duration: CAM.d, ease: CAM.ease }, F(600)); // compás 11
        tl.to('#cam', { ...E2.ahora, duration: F(9), ease: CAM.ease }, F(660)); // el punch del golpe
        tl.to('#cam', { ...E2.tarjeta, duration: CAM.d, ease: CAM.ease }, F(720)); // compás 13: vuelve a G sobre la tarjeta (0, 0)
        // 780: quieta; el mundo 3 llega debajo del mismo lente (su cabecera, CSS 0–439).
        tl.to('#cam', { ...E3.fila, duration: CAM.d, ease: CAM.ease }, F(810)); // compás 14
        tl.to('#cam', { ...E3.paso, duration: CAM.d, ease: CAM.ease }, F(840)); // compás 15: la tarjeta se abre en el 842 y la cámara baja con ella
        tl.to('#cam', { ...E3.objetivos, duration: CAM.d, ease: CAM.ease }, F(900)); // compás 16
        tl.to('#cam', { ...E3.avance, duration: CAM.d, ease: CAM.ease }, F(960)); // compás 17; después, muerta de quieta

        // Iris desde el toque (SPEC §1.6): el círculo nace en el centro del botón tocado, en px de la grabación ajustada.
        const irisDesde = (sel, vx, vy, cuadro) => {
          const p = toqueXY(vx, vy);
          const c = (r) => `circle(${r}px at ${p.x.toFixed(1)}px ${p.y.toFixed(1)}px)`;
          tl.fromTo(sel, { clipPath: c(0) }, { clipPath: c(1900), duration: F(5), ease: 'power2.out' }, F(cuadro));
          tl.set(sel, { clipPath: 'none' }, F(cuadro + 6));
        };
        irisDesde('#iris1', 931, 2184, 120); // «Registrar»
        irisDesde('#iris2', 671, 2136, 375); // «Marcar cumplido»
        irisDesde('#iris3', 510, 1476 + OFF2 / K, 780); // el nombre de Valeria (pantalla del mundo 2, 914 px más arriba que el mundo 3)

        // Látigo vertical 176–186: la tira sube 1100 px (el mundo 1 sale, el mundo 2 llega); el mundo 2 aterriza 1,04 → 1,00 (180–190).
        tl.fromTo('#tira', { y: 0 }, { y: -KD.latigo, duration: F(10), ease: 'power3.inOut' }, F(176));
        tl.fromTo('#m2in', { scale: 1.04, transformOrigin: `${W / 2}px ${HV / 2 - OFF2}px` },
          { scale: 1, duration: F(10), ease: 'power3.out' }, F(180));
        tl.set('#m2', { overflow: 'visible' }, F(186)); // ya no hay mundo 1 que tapar: la cámara puede ir hacia arriba

        // Marcas de toque: 4 cuadros antes aparece, en el cuadro se hunde, 6 después se va; la onda nace en el cuadro (450 ms).
        [60, 90, 105, 120, 150, 375, 450, 495, 600, 780, 840].forEach((n) => {
          const t = F(n);
          tl.fromTo(`#tq-${n}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: F(4), ease: 'power2.out' }, t - F(4));
          tl.to(`#tq-${n}`, { scale: 0.86, duration: F(2), ease: 'power2.in' }, t);
          tl.to(`#tq-${n}`, { opacity: 0, scale: 1, duration: F(6), ease: 'power2.out' }, t + F(2));
          tl.fromTo(`#on-${n}`, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.62, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
        });

        // La ventana se hace a un lado (964–978), 4 cuadros después de la frase 5.
        tl.to('#ventana', { scale: KD.cambio.escala, x: KD.cambio.x, transformOrigin: KD.cambio.origen, duration: F(15), ease: 'power2.inOut' }, F(964));
        // Dip de tres cuadros (1077–1079) y corte a la firma en el 1080.
        tl.set('#dip', { opacity: 0.4 }, F(1077));
        tl.set('#ventana', { autoAlpha: 0 }, F(1080));
        tl.set({}, {}, 38.5);
        window.__timelines['main'] = tl;
      })();
    </script>
  </body>
